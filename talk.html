story about the past with irregular verbs"],"goals_es":["comparar la tecnología del pasado y la de ahora","preguntarle a una persona mayor sobre su vida con Did you…?","contar una historia corta sobre el pasado con verbos irregulares"],"warm":["What did you do on your phone yesterday?","When did you get your first phone?","Could you live without the internet for a week?","What old technology is there at your grandparents' house?"],"warm_es":["¿Qué hiciste en tu celular ayer?","¿Cuándo tuviste tu primer celular?","¿Podrías vivir sin internet durante una semana?","¿Qué tecnología antigua hay en la casa de tus abuelos?"],"model":{"kind":"dialogue","title":"The Interview","intro":"Jose is interviewing her grandma for a school project about technology.","intro_es":"Jose entrevista a su abuela para un proyecto del colegio sobre tecnología.","lines":[{"sp":"Jose","t":"OK, Grandma, I'm recording. [[Did you have]] a [[computer]] at school?","es":"Ok, abuela, estoy grabando. ¿Tenías computador en el colegio?"},{"sp":"Grandma Inés","t":"No, I didn't. We wrote everything [[by hand]].","es":"No, no tenía. Escribíamos todo a mano."},{"sp":"Jose","t":"Wow. [[What about]] phones?","es":"Wow. ¿Y los teléfonos?"},{"sp":"Grandma Inés","t":"We had one [[telephone]] at home. It was on the kitchen wall.","es":"Teníamos un teléfono en la casa. Estaba en la pared de la cocina."},{"sp":"Jose","t":"So how did you [[make plans]] with your friends?","es":"Entonces, ¿cómo hacías planes con tus amigos?"},{"sp":"Grandma Inés","t":"We met in the square every Saturday afternoon. Easy!","es":"Nos encontrábamos en la plaza todos los sábados en la tarde. ¡Fácil!"},{"sp":"Jose","t":"Did you take photos?","es":"¿Sacabas fotos?"},{"sp":"Grandma Inés","t":"Yes, I did. I bought my first [[camera]] in 1978.","es":"Sí. Compré mi primera cámara en 1978."},{"sp":"Jose","t":"Have you still got the photos?","es":"¿Todavía tienes las fotos?"},{"sp":"Grandma Inés","t":"[[Of course]]! They're in a box. I found it last week.","es":"¡Por supuesto! Están en una caja. La encontré la semana pasada."},{"sp":"Jose","t":"Cool! I can scan them for my project.","es":"¡Genial! Puedo escanearlas para mi proyecto."},{"sp":"Grandma Inés","t":"You and your technology!","es":"¡Tú y tu tecnología!"}],"questions":[{"q":"How did Grandma do her schoolwork?","opts":["On a computer","By hand","On a laptop"],"a":1},{"q":"Where was the telephone?","opts":["On the kitchen wall","In the bedroom","In the square"],"a":0},{"q":"When did Grandma buy her first camera?","opts":["In 1987","In 1998","In 1978"],"a":2}]},"lang":[{"e":"computer","t":"VOC","d":"a machine for writing, games and the internet","x":"We use the computers in our IT class.","s":"comPUter","es":"computador"},{"e":"telephone","t":"VOC","d":"a phone that stays in one place in a house","x":"The telephone was on the kitchen wall.","s":"TELephone","es":"teléfono"},{"e":"camera","t":"VOC","d":"a machine for taking photos","x":"My grandma bought her first camera in 1978.","s":"CAMera","es":"cámara"},{"e":"Did you have…?","t":"PHR","d":"a question about things a person had in the past","x":"Did you have a laptop at school, Grandad?","s":"DID you HAVE","es":"¿Tenías…?"},{"e":"What about…?","t":"PHR","d":"a question to move to a new, similar topic","x":"I loved the film. What about you?","s":"what aBOUT","es":"¿Y…? / ¿Qué tal…?"},{"e":"Of course!","t":"PHR","d":"a friendly way to say yes, sure","x":"Can I see your photos? — Of course!","s":"of COURSE","es":"¡Claro! / ¡Por supuesto!"},{"e":"by hand","t":"PREP","d":"with a pen or pencil, not with a machine","x":"My grandad wrote all his homework by hand.","s":"by HAND","es":"a mano"},{"e":"make plans","t":"COL","d":"decide with friends when and where to meet","x":"We made plans for Saturday in the group chat.","s":"MAKE PLANS","es":"hacer planes"}],"pron":{"focus":"Tricky irregular past verbs","explain":"Some past verbs sound very different from their spelling. Bought has no g or h sound: it rhymes with sport. Saw rhymes with door. Wrote rhymes with boat.","explain_es":"Algunos verbos en pasado suenan muy distinto a como se escriben. En bought no se pronuncian la g ni la h: rima con sport. Saw rima con door. Wrote rima con boat.","tip":"Make a rhyme list: bought, caught, taught. Say the words fast three times!","tip_es":"Haz una lista de rimas: bought, caught, taught. ¡Di las palabras rápido tres veces!","lines":[{"t":"I bought my first camera in 1978.","m":"I BOUGHT my FIRST CAMera‿in 1978↘."},{"t":"We saw them in the square.","m":"we SAW them‿in the SQUARE↘."},{"t":"I wrote everything by hand.","m":"I WROTE EVerything by HAND↘."}]},"acts":[{"type":"findsomeone","items":[{"p":"took a selfie yesterday","q":"Did you take a selfie yesterday?"},{"p":"wrote a letter or a card this year","q":"Did you write a letter or a card this year?"},{"p":"bought something online last month","q":"Did you buy something online last month?"},{"p":"saw a film at the cinema last month","q":"Did you see a film at the cinema last month?"},{"p":"had a phone at the age of ten","q":"Did you have a phone at the age of ten?"},{"p":"made a video for social media last week","q":"Did you make a video for social media last week?"},{"p":"found something old at home this year","q":"Did you find something old at home this year?"},{"p":"went to bed without their phone last night","q":"Did you go to bed without your phone last night?"}],"follow":["What was it?","Who was with you?","Why?"]},{"type":"ranking","task":"Rank these inventions from the most important (1) to the least important (7) for teenagers today. Then explain to a partner: I think the mobile phone is more important than the TV.","items":["mobile phone","laptop","television","camera","radio","light bulb","headphones"]},{"type":"roleplay","cards":[{"sit":"A school project: interview an older person about technology.","a":"You are the student. Ask: Did you have a TV, a computer or a phone when you were my age? How did you make plans with friends? What did you do at the weekend?","b":"You are a grandparent. Answer in the past: We had a radio. I didn't have a phone. I wrote letters. I saw my friends in the square."},{"sit":"A weekend with no phone: your phone broke on Friday.","a":"You didn't have your phone all weekend. Tell B what you did: I read a book, I went to the park, I saw my cousins…","b":"Ask A questions: What did you do on Saturday? Did you see your friends? Was it boring? React: That sounds fun! or Poor you!"},{"sit":"A visit to a technology museum.","a":"You are the museum guide. Talk about the old things: This telephone was on a kitchen wall. People took photos with this camera…","b":"You are a visitor. Ask: When did people use this? Did they have…? How did it work?"}]}],"rec":{"prompt":"Record yourself: imagine you went back to 1980 for one day. What did you see? What did you do? What did you miss?","prompt_es":"Grábate: imagina que volviste al año 1980 por un día. ¿Qué viste? ¿Qué hiciste? ¿Qué extrañaste?","model":"Yesterday I went back to 1980 for one day. I saw a big television and a telephone on the wall. There weren't any mobile phones! I wrote a letter to my friend by hand, and I took photos with an old camera. It was fun, but I missed my laptop and my music.","use":["by hand","camera","telephone"]},"tips":[{"who":"teacher","t":"Before the interview role-play, revise irregular verbs with a quick chain: one student says go, the next says went and a new verb. Write the verbs on the board as they come up.","es":"Antes del roleplay de la entrevista, repasa los verbos irregulares con una cadena rápida: un estudiante dice go, el siguiente dice went y un verbo nuevo. Escribe los verbos en la pizarra a medida que aparecen."},{"who":"student","t":"At home, interview a grandparent or an older neighbour with three Did you…? questions. Bring their answers to the next class!","es":"En casa, entrevista a un abuelo o a un vecino mayor con tres preguntas con Did you…? ¡Trae sus respuestas a la próxima clase!"}]},{"id":"rocket-8-kid","lv":"rocket","n":8,"age":"kid","title":"Camping Rules!","goals":["name places in nature, like mountains, rivers and deserts","say what you must, mustn't and have to do on a trip","ask someone to repeat something politely"],"goals_es":["nombrar lugares de la naturaleza, como montañas, ríos y desiertos","decir lo que debes, lo que no debes y lo que tienes que hacer en un viaje","pedirle a alguien con cortesía que repita algo"],"warm":["Do you like the beach or the mountains?","Is there a river near your house?","Have you got a tent at home?","What do you take on a trip?"],"warm_es":["¿Te gusta la playa o la montaña?","¿Hay un río cerca de tu casa?","¿Tienes una carpa en tu casa?","¿Qué llevas cuando vas de viaje?"],"model":{"kind":"dialogue","title":"Packing for the Desert","intro":"Leo and Sofi are getting ready for a camping trip in the Atacama Desert with Grandma Ana.","intro_es":"Leo y Sofi están preparando sus cosas para ir de campamento al desierto de Atacama con la abuela Ana.","lines":[{"sp":"Grandma Ana","t":"Our camping trip to the [[desert]] is tomorrow! Is the [[tent]] in the car?","es":"¡Mañana es nuestro campamento en el desierto! ¿Está la carpa en el auto?"},{"sp":"Leo","t":"Yes, it is. Do we [[have to]] take a map?","es":"Sí. ¿Tenemos que llevar un mapa?"},{"sp":"Grandma Ana","t":"Yes, we do. And a [[compass]] too.","es":"Sí. Y una brújula también."},{"sp":"Sofi","t":"Can I take my swimming costume? I want to swim in the [[river]].","es":"¿Puedo llevar mi traje de baño? Quiero bañarme en el río."},{"sp":"Grandma Ana","t":"No, you [[mustn't]] swim in the river. The water is very cold and fast.","es":"No, no puedes bañarte en el río. El agua es muy fría y corre muy rápido."},{"sp":"Pipo","t":"Woof! Woof!","es":"¡Guau! ¡Guau!"},{"sp":"Sofi","t":"[[Sorry, can you repeat that, please?]] Pipo is very noisy!","es":"Perdón, ¿puedes repetir eso, por favor? ¡Pipo hace mucho ruido!"},{"sp":"Grandma Ana","t":"You mustn't swim in the river, Sofi!","es":"¡No puedes bañarte en el río, Sofi!"},{"sp":"Leo","t":"OK. And it's very hot in the desert.","es":"Está bien. Y en el desierto hace mucho calor."},{"sp":"Grandma Ana","t":"That's right. You [[must]] wear a hat, and you have to drink a lot of water.","es":"Así es. Debes usar sombrero y tienes que tomar mucha agua."},{"sp":"Sofi","t":"And Pipo has to drink water too!","es":"¡Y Pipo también tiene que tomar agua!"}],"questions":[{"q":"What do they have to take?","opts":["A map and a compass","A ball and a kite","A swimming costume"],"a":0},{"q":"Why can't Sofi swim in the river?","opts":["The water is too hot","The water is very cold and fast","Pipo is in the river"],"a":1},{"q":"Why does Sofi ask Grandma to repeat?","opts":["She is sleepy","Grandma speaks very fast","Pipo is very noisy"],"a":2}]},"lang":[{"e":"desert","t":"VOC","d":"a very dry place with lots of sand and very little rain","x":"The Atacama is a very dry desert.","s":"DEsert","es":"desierto"},{"e":"tent","t":"VOC","d":"a small house made of cloth that you sleep in when you go camping","x":"We sleep in a tent in the mountains.","s":"TENT","es":"carpa"},{"e":"compass","t":"VOC","d":"a small thing with a needle that shows you where north is","x":"Look at the compass. That way is north!","s":"COMpass","es":"brújula"},{"e":"river","t":"VOC","d":"water that moves across the land to the sea","x":"There are lots of fish in the river.","s":"RIVer","es":"río"},{"e":"have to","t":"PHR","d":"it is necessary; you need to do it","x":"We have to carry a lot of water.","s":"HAVE to","es":"tener que"},{"e":"You must…","t":"PHR","d":"it is a rule: do it!","x":"You must wear a hat in the sun.","s":"you MUST","es":"Debes… / Tienes que…"},{"e":"You mustn't…","t":"PHR","d":"it is a rule: don't do it!","x":"You mustn't swim here. It's dangerous!","s":"you MUSTn't","es":"No debes… / No puedes…"},{"e":"Sorry, can you repeat that, please?","t":"PHR","d":"you say this when you can't hear or don't understand","x":"Sorry, can you repeat that, please? I can't hear you.","s":"SORry, can you rePEAT that, PLEASE","es":"Perdón, ¿puedes repetir eso, por favor?"}],"pron":{"focus":"must and mustn't","explain":"In mustn't, we don't say the first t: it sounds like MUSS-nt. Must and mustn't are strong words in a rule, so we stress them. Have to sounds like HAF-ta.","explain_es":"En mustn't no se pronuncia la primera t: suena como MUSS-nt. Must y mustn't son palabras fuertes en una regla, por eso las decimos con más fuerza. Have to suena como HAF-ta.","tip":"Say the rules like a strict teacher: point your finger when you say MUST and MUSTN'T!","tip_es":"Di las reglas como un profesor estricto: ¡apunta con el dedo cuando digas MUST y MUSTN'T!","lines":[{"t":"You mustn't swim in the river.","m":"you MUSTn't SWIM in the RIVer↘."},{"t":"You must wear a hat.","m":"you MUST WEAR‿a HAT↘."},{"t":"We have to drink a lot of water.","m":"we HAVE to DRINK‿a LOT‿of WAter↘."}]},"acts":[{"type":"guess","cat":"Nature and camping","items":["mountain","river","desert","ocean","island","volcano","beach","forest","tent","compass","map","snow"],"frames":["Is it a place?","Is there water in it?","Is it hot or cold?","Can you climb it?","Do you take it on a trip?"]},{"type":"roleplay","cards":[{"sit":"At the beach: Student A is the lifeguard. Student B is on holiday.","a":"You are the lifeguard. Say: Hello! There are some rules. You must… You mustn't… You have to…","b":"You are on holiday. Ask: Can I swim here? Do I have to wear a hat? If you don't understand, say: Sorry, can you repeat that, please?"},{"sit":"In the forest: Student A is the camping guide. Student B is a new camper.","a":"Say three rules: You must stay with the group. You mustn't… You have to…","b":"Ask: Do we have to take a map? Can I sleep outside the tent? Then say: OK, thank you!"},{"sit":"On a mountain: Student A is the teacher on a school trip. Student B is a student.","a":"Say the rules for the snow: You must wear… You mustn't… Then answer the student's questions.","b":"Ask: Do we have to wear gloves? Can we make a snowman? If you don't hear, say: Sorry, can you repeat that, please?"}]},{"type":"picture","prompts":["Look at the map. Can you find Chile? Is it near an ocean?","Can you see a flag? What colours is it? Which country is it?","Point to an island on the map or the globe. Is it big or small?","Find a hot country on the map. What do you have to take there?","Which country on the map do you want to visit? Why?"]}],"rec":{"prompt":"Record yourself: you are going on a trip to the beach, the mountains or the desert. Say two things you must do and one thing you mustn't do.","prompt_es":"Grábate: vas de viaje a la playa, a la montaña o al desierto. Di dos cosas que debes hacer y una cosa que no debes hacer.","model":"I'm going to the mountains with my family. There's a lot of snow! There are some rules. You must wear warm clothes and gloves. You have to carry a map and a compass. You mustn't walk in the forest alone. And you have to drink a lot of water!","use":["You must…","You mustn't…","have to"]},"tips":[{"who":"teacher","t":"Before the guessing game, draw a quick map on the board with a mountain, a river, a desert and a beach. Point and say the words with the class.","es":"Antes del juego de adivinanzas, dibuja un mapa rápido en la pizarra con una montaña, un río, un desierto y una playa. Apunta y di las palabras con el curso."},{"who":"student","t":"Didn't hear? Don't stop talking! Say Sorry, can you repeat that, please? It's a very useful phrase.","es":"¿No escuchaste? ¡No te quedes callado! Di Sorry, can you repeat that, please? Es una frase muy útil."}]},{"id":"rocket-8-teen","lv":"rocket","n":8,"age":"teen","title":"Adventure Rules","goals":["talk about amazing places in Chile and around the world","explain the rules for an outdoor trip with must, mustn't and have to","ask someone to repeat important information"],"goals_es":["hablar de lugares increíbles de Chile y del mundo","explicar las reglas de un paseo al aire libre con must, mustn't y have to","pedirle a alguien que repita información importante"],"warm":["What's the most beautiful place in Chile for you?","Do you prefer the beach, the mountains or the desert?","Do you like camping? Why or why not?","What do you have to do at home every week?"],"warm_es":["¿Cuál es para ti el lugar más bonito de Chile?","¿Qué prefieres: la playa, la montaña o el desierto?","¿Te gusta acampar? ¿Por qué sí o por qué no?","¿Qué tienes que hacer en tu casa todas las semanas?"],"model":{"kind":"dialogue","title":"The Volcano Walk","intro":"Vale and Sam are at a summer camp in Pucón. A guide talks to the group before a walk near the volcano.","intro_es":"Vale y Sam están en un campamento de verano en Pucón. Un guía habla con el grupo antes de una caminata cerca del volcán.","lines":[{"sp":"Guide","t":"Good morning, everyone! Today we're walking near the [[volcano]]. There are some rules.","es":"¡Buenos días a todos! Hoy vamos a caminar cerca del volcán. Hay algunas reglas."},{"sp":"Sam","t":"Can we climb to the top?","es":"¿Podemos subir hasta la cima?"},{"sp":"Guide","t":"No, you [[mustn't]]. It's too dangerous today, and there's a lot of [[snow]].","es":"No, no pueden. Hoy es demasiado peligroso y hay mucha nieve."},{"sp":"Vale","t":"Do we [[have to]] wear special boots?","es":"¿Tenemos que usar botas especiales?"},{"sp":"Guide","t":"Yes, you do. And you [[must]] wear a helmet.","es":"Sí. Y deben usar casco."},{"sp":"Sam","t":"Can I take photos with my phone?","es":"¿Puedo sacar fotos con mi celular?"},{"sp":"Guide","t":"Sure, but you have to stay on the path. Don't walk into the [[forest]] alone.","es":"Claro, pero tienes que quedarte en el sendero. No entres solo al bosque."},{"sp":"Vale","t":"[[Sorry, can you repeat that, please?]] The wind is really loud!","es":"Perdón, ¿puede repetir eso, por favor? ¡El viento está muy fuerte!"},{"sp":"Guide","t":"Stay on the path! And you have to carry a lot of water.","es":"¡Quédense en el sendero! Y tienen que llevar mucha agua."},{"sp":"Sam","t":"Do we have to bring food?","es":"¿Tenemos que traer comida?"},{"sp":"Guide","t":"No, you [[don't have to]]. We've got sandwiches for everyone!","es":"No, no es necesario. ¡Tenemos sándwiches para todos!"},{"sp":"Vale","t":"Great! Let's go!","es":"¡Genial! ¡Vamos!"}],"questions":[{"q":"Why can't they climb to the top?","opts":["It's too hot","It's dangerous and there's a lot of snow","They haven't got boots"],"a":1},{"q":"What must they wear?","opts":["A helmet","A hat","A school uniform"],"a":0},{"q":"Why doesn't Vale hear the guide?","opts":["Sam is talking","Her phone is ringing","The wind is really loud"],"a":2}]},"lang":[{"e":"volcano","t":"VOC","d":"a mountain that can send out fire and very hot rock","x":"Villarrica is a famous volcano in the south of Chile.","s":"volCAno","es":"volcán"},{"e":"snow","t":"VOC","d":"soft white ice that falls from the sky when it's very cold","x":"There's a lot of snow in the Andes in July.","s":"SNOW","es":"nieve"},{"e":"forest","t":"VOC","d":"a big place with lots and lots of trees","x":"We went for a long walk in the forest.","s":"FORest","es":"bosque"},{"e":"You must…","t":"PHR","d":"it's a rule or it's very important: do it!","x":"You must wear a helmet on your bike.","s":"you MUST","es":"Debes… / Tienes que…"},{"e":"You mustn't…","t":"PHR","d":"it's against the rules: don't do it!","x":"You mustn't use your phone in the exam.","s":"you MUSTn't","es":"No debes… / No puedes…"},{"e":"Do we have to…?","t":"PHR","d":"a question to ask if something is necessary","x":"Do we have to bring our own food?","s":"do we HAVE to","es":"¿Tenemos que…?"},{"e":"You don't have to…","t":"PHR","d":"it's not necessary, but you can if you want","x":"You don't have to come, but it's going to be fun!","s":"you DON'T HAVE to","es":"No es necesario que… / No tienes que…"},{"e":"Sorry, can you repeat that, please?","t":"PHR","d":"a polite way to ask someone to say something again","x":"Sorry, can you repeat that, please? The music is very loud.","s":"SORry, can you rePEAT that, PLEASE","es":"Perdón, ¿puedes repetir eso, por favor?"}],"pron":{"focus":"mustn't and don't have to","explain":"Mustn't has a silent first t: MUSS-nt. Don't have to sounds like DOHNT HAF-ta. Listen carefully, because they mean very different things! Mustn't = it's not OK. Don't have to = it's not necessary.","explain_es":"En mustn't la primera t no se pronuncia: MUSS-nt. Don't have to suena como DOHNT HAF-ta. ¡Escucha con atención, porque significan cosas muy distintas! Mustn't = no está permitido. Don't have to = no es necesario.","tip":"Use your body: cross your arms ✗ when you say mustn't, and shrug your shoulders when you say don't have to.","tip_es":"Usa el cuerpo: cruza los brazos ✗ cuando digas mustn't y encoge los hombros cuando digas don't have to.","lines":[{"t":"Do we have to wear special boots?","m":"do we HAVE to wear SPEcial BOOTS↗?"},{"t":"You mustn't climb to the top.","m":"you MUSTn't CLIMB to the TOP↘."},{"t":"You don't have to bring food.","m":"you DON'T HAVE to bring FOOD↘."}]},"acts":[{"type":"findsomeone","items":[{"p":"has to get up early on Saturdays","q":"Do you have to get up early on Saturdays?"},{"p":"has to wear a uniform at school","q":"Do you have to wear a uniform at school?"},{"p":"has to help at home every day","q":"Do you have to help at home every day?"},{"p":"doesn't have to do homework today","q":"Do you have to do homework today?"},{"p":"lives near a river or the sea","q":"Do you live near a river or the sea?"},{"p":"loves the snow","q":"Do you love the snow?"},{"p":"has got a map app on their phone","q":"Have you got a map app on your phone?"},{"p":"wants to see a volcano","q":"Do you want to see a volcano?"}],"follow":["Why?","When?","Really? Tell me more!"]},{"type":"ranking","task":"You and your friends are going on a three-day hike in Torres del Paine. Choose the five most important things and put them in order. Say why: We must take… because… We don't have to take…","items":["a map","a compass","a tent","a lot of water","your phone","warm clothes","a guitar"]},{"type":"picture","prompts":["Look at the flags on the map. Which countries can you name?","Find a country with big mountains or a desert. What do you have to take there?","Point to an island on the globe. Do you want to go there? Why?","Which country on the map do you want to visit with your friends?","What must you do before a trip to another country?"]}],"rec":{"prompt":"Record yourself: you are a tour guide in your favourite place in Chile. Welcome the group and give three rules with must, mustn't and have to.","prompt_es":"Grábate: eres guía turístico en tu lugar favorito de Chile. Dale la bienvenida al grupo y da tres reglas con must, mustn't y have to.","model":"Welcome to Valparaíso! I'm your guide today. Here are the rules for our walking tour. You must wear comfortable shoes, because there are lots of hills. You have to stay with the group. You mustn't swim at this beach, because the water is very cold. And you don't have to pay for the photos!","use":["You must…","You mustn't…","You don't have to…"]},"tips":[{"who":"teacher","t":"Write must ✓, mustn't ✗ and don't have to 🤷 on the board. In pairs, students write three true rules for their school, then read them to the class.","es":"Escribe must ✓, mustn't ✗ y don't have to 🤷 en la pizarra. En parejas, los estudiantes escriben tres reglas reales de su colegio y luego se las leen al curso."},{"who":"student","t":"Be careful: mustn't and don't have to are very different. You mustn't use your phone = it's not OK. You don't have to use your phone = it's not necessary.","es":"Ojo: mustn't y don't have to son muy distintos. You mustn't use your phone = no está permitido. You don't have to use your phone = no es necesario."}]},{"id":"rocket-9-kid","lv":"rocket","n":9,"age":"kid","title":"Travel Time!","goals":["talk about different ways to travel","say what you are going to do on holiday","ask for and give simple directions"],"goals_es":["hablar de distintas formas de viajar","decir lo que vas a hacer en las vacaciones","pedir y dar indicaciones simples para llegar a un lugar"],"warm":["How do you go to school?","Do you like planes or trains?","Where are you going to go this summer?"],"warm_es":["¿Cómo vas al colegio?","¿Te gustan más los aviones o los trenes?","¿Adónde vas a ir este verano?"],"model":{"kind":"dialogue","title":"Where Is the Ferry?","intro":"Leo and Kai are on holiday in Sydney. They want to take the ferry to the beach.","intro_es":"Leo y Kai están de vacaciones en Sídney. Quieren tomar el ferry para ir a la playa.","lines":[{"sp":"Leo","t":"What are we [[going to]] do today, Kai?","es":"¿Qué vamos a hacer hoy, Kai?"},{"sp":"Kai","t":"We're going to take a [[ship]] to the beach. It's called a ferry!","es":"Vamos a tomar un barco para ir a la playa. ¡Se llama ferry!"},{"sp":"Leo","t":"Cool! Have we got [[tickets]]?","es":"¡Genial! ¿Tenemos boletos?"},{"sp":"Kai","t":"Yes, they're in my bag. But where is the ferry?","es":"Sí, están en mi bolso. Pero ¿dónde está el ferry?"},{"sp":"Leo","t":"[[Excuse me, where is]] the ferry, please?","es":"Disculpe, ¿dónde está el ferry, por favor?"},{"sp":"Man","t":"[[Go straight on]], then [[turn left]] at the [[traffic lights]].","es":"Sigan derecho y después doblen a la izquierda en el semáforo."},{"sp":"Kai","t":"Turn left at the traffic lights. OK!","es":"Doblamos a la izquierda en el semáforo. ¡Ok!"},{"sp":"Man","t":"The ferry is [[next to]] a big café. You can't miss it!","es":"El ferry está al lado de un café grande. ¡Es imposible no verlo!"},{"sp":"Leo","t":"Thank you very much!","es":"¡Muchas gracias!"},{"sp":"Kai","t":"Look, Leo! There's the ferry, and there's the Opera House!","es":"¡Mira, Leo! Ahí está el ferry, ¡y ahí está la Ópera de Sídney!"},{"sp":"Leo","t":"Run, Kai! The ferry is going to leave!","es":"¡Corre, Kai! ¡El ferry va a salir!"}],"questions":[{"q":"How are they going to go to the beach?","opts":["By train","By ferry","By taxi"],"a":1},{"q":"Where do they have to turn left?","opts":["At the traffic lights","At the bank","At the station"],"a":0},{"q":"Where is the ferry?","opts":["Opposite the station","Between two shops","Next to a big café"],"a":2}]},"lang":[{"e":"ship","t":"VOC","d":"a very big boat that carries people or things on the sea","x":"We went to the island on a ship.","s":"SHIP","es":"barco"},{"e":"ticket","t":"VOC","d":"a small paper or card you need to travel on a bus, train or ship","x":"Can I have two tickets, please?","s":"TICKet","es":"boleto / pasaje"},{"e":"traffic lights","t":"VOC","d":"red, yellow and green lights that tell cars when to stop and go","x":"Stop! The traffic lights are red.","s":"TRAFfic lights","es":"semáforo"},{"e":"We're going to…","t":"PHR","d":"you use this to talk about your plans","x":"We're going to visit Grandma on Sunday.","s":"we're GOing to","es":"Vamos a…"},{"e":"Excuse me, where is…?","t":"PHR","d":"a polite question when you want to find a place","x":"Excuse me, where is the train station?","s":"exCUSE me, WHERE is","es":"Disculpe, ¿dónde está…?"},{"e":"Go straight on.","t":"PHR","d":"walk in front of you and don't turn","x":"Go straight on and the park is on the right.","s":"go STRAIGHT ON","es":"Sigue derecho."},{"e":"Turn left.","t":"PHR","d":"go to the left side at the corner","x":"Turn left at the bank.","s":"turn LEFT","es":"Dobla a la izquierda."},{"e":"next to","t":"PREP","d":"very near, at the side of something","x":"The café is next to the bank.","s":"NEXT to","es":"al lado de"}],"pron":{"focus":"Directions: stress the important words","explain":"When you give directions, say the important words strong and clear: LEFT, RIGHT, STRAIGHT ON, TRAFFIC lights. The small words (at, the, to) are short and quick.","explain_es":"Cuando das indicaciones, di las palabras importantes fuerte y claro: LEFT, RIGHT, STRAIGHT ON, TRAFFIC lights. Las palabras pequeñas (at, the, to) son cortas y rápidas.","tip":"Point with your arm when you say left, right and straight on. Your body helps your voice!","tip_es":"Apunta con el brazo cuando digas left, right y straight on. ¡Tu cuerpo ayuda a tu voz!","lines":[{"t":"Turn left at the traffic lights.","m":"turn LEFT‿at the TRAFfic lights↘."},{"t":"Go straight on.","m":"go STRAIGHT ON↘."},{"t":"Excuse me, where is the ferry?","m":"exCUSE me, | WHERE‿is the FERry↘?"}]},"acts":[{"type":"findsomeone","items":[{"p":"goes to school by car","q":"Do you go to school by car?"},{"p":"likes trains","q":"Do you like trains?"},{"p":"is going to visit a grandparent this weekend","q":"Are you going to visit your grandma or grandpa this weekend?"},{"p":"has got a suitcase with wheels","q":"Have you got a suitcase with wheels?"},{"p":"is going to play football this weekend","q":"Are you going to play football this weekend?"},{"p":"lives next to a park","q":"Do you live next to a park?"},{"p":"wants to fly in a helicopter","q":"Do you want to fly in a helicopter?"},{"p":"is going to go to the beach this summer","q":"Are you going to go to the beach this summer?"}],"follow":["When?","Who with?"]},{"type":"roleplay","cards":[{"sit":"In town: Student A is a tourist. Student B lives here. Draw a small map together first.","a":"You are a tourist. Ask: Excuse me, where is the park, please? Listen and say: Thank you very much!","b":"You live here. Give directions: Go straight on. Turn left / Turn right at the traffic lights. It's next to the…"},{"sit":"At the station: Student A works at the ticket office. Student B wants to travel.","a":"Say: Hello! Where are you going to go? Then give the tickets and say: Here you are!","b":"Say: Can I have two tickets, please? Say why: I'm going to visit my… Then say: Thank you!"},{"sit":"At home: Student A is packing a suitcase. Student B is Mum or Dad.","a":"Say what you are going to take: I'm going to take my… and my… Then ask: Can I take the dog?","b":"Answer: Yes, you can. / No, sorry! Then ask: Are you going to take a hat? Have you got your ticket?"}]},{"type":"picture","prompts":["What can you see in the photo? A ship, a plane or a train?","Where is the ferry going, do you think? Is it going to the beach?","What's the weather like? Is it sunny or rainy?","Look at the big white building. Do you like it? What is it?","Do you want to go on a ferry? Where are you going to go?"]}],"rec":{"prompt":"Record yourself: talk about a trip you are going to take. Say where you are going to go, how you are going to travel and what you are going to take.","prompt_es":"Grábate: habla de un viaje que vas a hacer. Di adónde vas a ir, cómo vas a viajar y qué vas a llevar.","model":"This summer we're going to visit my grandma in La Serena. We're going to take the bus from Santiago, and my ticket is in my bag! I'm going to take my big suitcase and my football. We're going to eat ice cream and swim at the beach. I'm very happy!","use":["We're going to…","ticket"]},"tips":[{"who":"teacher","t":"Make a street in the classroom with chairs and paper signs: the bank, the park, the station. One student walks slowly and a partner gives directions: Go straight on! Turn left!","es":"Arma una calle en la sala con sillas y letreros de papel: el banco, el parque, la estación. Un estudiante camina despacio y su compañero le da indicaciones: Go straight on! Turn left!"},{"who":"student","t":"Point with your hand when you give directions. It helps you remember left and right!","es":"Apunta con la mano cuando des indicaciones. ¡Te ayuda a recordar left y right!"}]},{"id":"rocket-9-teen","lv":"rocket","n":9,"age":"teen","title":"Find Your Way!","goals":["talk about your plans and arrangements for a day trip","compare different ways to travel","ask for and give directions in a city"],"goals_es":["hablar de tus planes y compromisos para un paseo de un día","comparar distintas formas de viajar","pedir y dar indicaciones en una ciudad"],"warm":["How do you get to school every day?","What are you doing this weekend?","Do you use a map app on your phone?","What's your favourite way to travel? Why?"],"warm_es":["¿Cómo llegas al colegio todos los días?","¿Qué vas a hacer este fin de semana?","¿Usas una aplicación de mapas en tu celular?","¿Cuál es tu forma favorita de viajar? ¿Por qué?"],"model":{"kind":"dialogue","title":"Lost in Valparaíso","intro":"Vale and Sam are at the bus station in Valparaíso. They call Jose because they can't find the café.","intro_es":"Vale y Sam están en el terminal de buses de Valparaíso. Llaman a Jose porque no encuentran el café.","lines":[{"sp":"Jose","t":"Hi, Vale! Where are you?","es":"¡Hola, Vale! ¿Dónde estás?"},{"sp":"Vale","t":"We're at the bus station. How do we get to the café?","es":"Estamos en el terminal de buses. ¿Cómo llegamos al café?"},{"sp":"Jose","t":"Easy! [[Go straight on]] and [[turn right]] at the [[traffic lights]].","es":"¡Fácil! Sigan derecho y doblen a la derecha en el semáforo."},{"sp":"Sam","t":"Turn right? My map app says turn left!","es":"¿A la derecha? ¡Mi aplicación de mapas dice que hay que doblar a la izquierda!"},{"sp":"Jose","t":"No, turn right! The café is [[opposite]] the bank, [[on the corner]].","es":"¡No, a la derecha! El café está frente al banco, en la esquina."},{"sp":"Vale","t":"Opposite the bank. Got it! So what are we [[going to]] do after lunch?","es":"Frente al banco. ¡Entendido! ¿Y qué vamos a hacer después de almorzar?"},{"sp":"Jose","t":"We're going to walk up the hills and take photos. Then we're going to play volleyball on the beach.","es":"Vamos a subir los cerros y sacar fotos. Después vamos a jugar vóleibol en la playa."},{"sp":"Sam","t":"Great! Is Tomás coming too?","es":"¡Genial! ¿Tomás también viene?"},{"sp":"Jose","t":"Yes, he's coming by [[train]]. He's arriving at one o'clock.","es":"Sí, viene en tren. Llega a la una."},{"sp":"Sam","t":"Cool. Vale, have we got our [[tickets]] for the bus home?","es":"¡Qué bien! Vale, ¿tenemos los pasajes para el bus de vuelta?"},{"sp":"Vale","t":"Yes, they're on my phone. See you in ten minutes, Jose!","es":"Sí, están en mi celular. ¡Nos vemos en diez minutos, Jose!"},{"sp":"Jose","t":"OK! And Sam, don't listen to your app!","es":"¡Ok! Y Sam, ¡no le hagas caso a tu aplicación!"}],"questions":[{"q":"Where are Vale and Sam?","opts":["At the train station","At the bus station","At the café"],"a":1},{"q":"Where is the café?","opts":["Opposite the bank, on the corner","Next to the bus station","Between two shops"],"a":0},{"q":"What time is Tomás arriving?","opts":["At ten o'clock","At seven o'clock","At one o'clock"],"a":2}]},"lang":[{"e":"traffic lights","t":"VOC","d":"red, yellow and green lights that control the cars at a corner","x":"Turn left at the traffic lights.","s":"TRAFfic lights","es":"semáforo"},{"e":"train","t":"VOC","d":"a long vehicle that travels on rails and stops at stations","x":"I'm taking the train to Chillán on Friday.","s":"TRAIN","es":"tren"},{"e":"ticket","t":"VOC","d":"a paper or a code on your phone that lets you travel","x":"My bus ticket is on my phone.","s":"TICKet","es":"pasaje / boleto"},{"e":"Go straight on.","t":"PHR","d":"continue in the same direction and don't turn","x":"Go straight on for two minutes.","s":"go STRAIGHT ON","es":"Sigue derecho."},{"e":"Turn right.","t":"PHR","d":"go to the right side at the corner or the lights","x":"Turn right after the supermarket.","s":"turn RIGHT","es":"Dobla a la derecha."},{"e":"We're going to…","t":"PHR","d":"you use this to talk about a plan or an intention","x":"We're going to watch a film tonight.","s":"we're GOing to","es":"Vamos a…"},{"e":"opposite","t":"PREP","d":"on the other side of the street, facing something","x":"The cinema is opposite the park.","s":"OPposite","es":"frente a"},{"e":"on the corner","t":"PREP","d":"at the place where two streets meet","x":"There's a bakery on the corner.","s":"on the CORner","es":"en la esquina"}],"pron":{"focus":"going to in fast speech","explain":"In fast, friendly English, going to often sounds like gonna: We're gonna walk up the hills. Write going to, but listen for gonna in films and songs. Stress the main verb: We're going to WALK.","explain_es":"En inglés rápido e informal, going to muchas veces suena como gonna: We're gonna walk up the hills. Escribe going to, pero fíjate en cómo suena gonna en películas y canciones. Di con más fuerza el verbo principal: We're going to WALK.","tip":"Record a voice message to a friend about your weekend plans. Then listen: does going to sound fast and natural?","tip_es":"Grábale un mensaje de voz a un amigo con tus planes para el fin de semana. Después escúchalo: ¿going to suena rápido y natural?","lines":[{"t":"What are we going to do after lunch?","m":"WHAT are we going to DO‿after LUNCH↘?"},{"t":"Turn right at the traffic lights.","m":"turn RIGHT‿at the TRAFfic lights↘."},{"t":"The café is opposite the bank.","m":"the CAfé is OPposite the BANK↘."}]},"acts":[{"type":"guess","cat":"Transport and travel","items":["plane","train","underground","taxi","ship","helicopter","bus","bike","skateboard","ticket","suitcase","traffic lights"],"frames":["Is it fast?","Can it fly?","Does it go on water?","Do you use it in the city?","Can you carry it?"]},{"type":"roleplay","cards":[{"sit":"At the bus station in Valparaíso: Student A is a tourist. Student B lives in the city.","a":"You want to go to the beach. Ask: Excuse me, where is the beach? Is it far? Repeat the directions and say thank you.","b":"Give directions: Go straight on… Turn left / right at the… It's opposite / next to / on the corner. Then say one fun thing to do there."},{"sit":"On the phone: two friends are meeting at the cinema.","a":"You are at the station and you're lost. Ask: How do I get to the cinema? What film are we going to watch?","b":"Give directions from the station to the cinema. Then say what you are going to do after the film."},{"sit":"Planning a day trip: two friends choose how to travel.","a":"You want to go to the mountains by bus. Ask: What are you doing on Saturday? Are you going to come with me?","b":"You want to go to the beach by train. Say: I'm going to… Let's take the train because… Then agree on one plan."}]},{"type":"wyr","items":[["travel by plane","travel by train"],["take a taxi","walk and listen to music"],["go on a ferry in Sydney","fly in a helicopter over the Andes"],["take a big suitcase","take only a backpack"],["use a map app","ask people for directions"],["go on a trip with your family","go on a trip with your friends"],["visit a big city","visit a small island"]]}],"rec":{"prompt":"Record yourself: describe your plan for a day trip. Say where you are going to go, how you are travelling and what you are going to do there.","prompt_es":"Grábate: describe tu plan para un paseo de un día. Di adónde vas a ir, cómo vas a viajar y qué vas a hacer allá.","model":"On Saturday I'm going to visit my friends in Viña del Mar. I'm taking the bus at nine o'clock, and my ticket is already on my phone. When I arrive, I'm going to turn left at the traffic lights and walk to the beach. We're going to play volleyball, take lots of photos and eat empanadas.","use":["We're going to…","ticket","traffic lights"]},"tips":[{"who":"teacher","t":"Project a map of Valparaíso or your town. A student chooses a secret place and gives directions from the station. The class follows on the map and guesses the place.","es":"Proyecta un mapa de Valparaíso o de tu ciudad. Un estudiante elige un lugar secreto y da indicaciones desde la estación. El curso las sigue en el mapa y adivina el lugar."},{"who":"student","t":"Change the language of your map app to English for a day. You can hear real directions: turn left, go straight on…","es":"Cambia el idioma de tu aplicación de mapas a inglés por un día. Así escuchas indicaciones reales: turn left, go straight on…"}]},{"id":"planet-0-kid","lv":"planet","n":0,"age":"kid","title":"Meet My Friends!","goals":["introduce yourself and a friend to new people","talk about your hobbies and what you are good at","ask questions to get to know a new classmate"],"warm":["Who is your best friend? How did you meet?","Where were you born?","What do you like doing after school?","Have you got any cousins? Where do they live?"],"model":{"kind":"dialogue","title":"The New Boy","intro":"It's break time at school. Leo introduces Diego, a new classmate, to his cousin Kai.","lines":[{"sp":"Leo","t":"Kai, this is Diego. He's our new [[classmate]]. Diego, this is my cousin Kai."},{"sp":"Kai","t":"Hi, Diego! [[Nice to meet you]]."},{"sp":"Diego","t":"Nice to meet you too! Leo says you're from Australia."},{"sp":"Kai","t":"That's right. I [[was born in]] Sydney, but my family moved to Santiago last year. [[What about you]]?"},{"sp":"Diego","t":"I lived in Puerto Montt, in the south of Chile. It rains a lot there!"},{"sp":"Kai","t":"So, what do you like doing in your [[free time]]?"},{"sp":"Diego","t":"I love playing chess, and I'm [[interested in]] dinosaurs. I've got about twenty dinosaur books!"},{"sp":"Leo","t":"And he's really [[good at]] chess. He beat me three times yesterday!"},{"sp":"Kai","t":"Wow! Can you play table tennis too?"},{"sp":"Diego","t":"No, I can't. But I'd like to learn."},{"sp":"Kai","t":"Great! I play every Saturday at the sports centre. Come with us, and I can [[show you around]]!"},{"sp":"Diego","t":"Thanks! You're all really friendly."}],"questions":[{"q":"Where did Diego live before?","opts":["In Sydney","In Puerto Montt","In Santiago"],"a":1},{"q":"What is Diego interested in?","opts":["Dinosaurs","Table tennis","Football"],"a":0},{"q":"When does Kai play table tennis?","opts":["Every day after school","On Sundays with Leo","Every Saturday at the sports centre"],"a":2}]},"lang":[{"e":"classmate","t":"VOC","d":"a student in the same class as you","x":"Martina is my classmate. We sit together.","s":"CLASSmate"},{"e":"Nice to meet you.","t":"PHR","d":"a polite thing to say when you meet someone for the first time","x":"Hi, I'm Kai. Nice to meet you!","s":"NICE to MEET you"},{"e":"What about you?","t":"PHR","d":"a short way to ask someone the same question","x":"I love pizza. What about you?","s":"WHAT about YOU"},{"e":"was born in","t":"PHR","d":"words to say the place or year when you came into the world","x":"My dad was born in Concepción in 1988.","s":"was BORN in"},{"e":"free time","t":"COL","d":"the hours when you don't have school or homework","x":"In my free time I read comics.","s":"FREE TIME"},{"e":"be good at","t":"COL","d":"to do something very well","x":"Sofi is good at painting.","s":"be GOOD at"},{"e":"be interested in","t":"COL","d":"to want to learn more about something","x":"I'm interested in volcanoes and dinosaurs.","s":"be INterested in"},{"e":"show someone around","t":"PV","d":"to take a new person to see all the parts of a place","x":"Let's show the new girl around the school.","s":"SHOW someone aROUND"}],"pron":{"focus":"Linking words together","explain":"When a word ends in a consonant sound and the next word starts with a vowel sound, we join them: this‿is, good‿at, interested‿in. It makes your English smooth and natural.","tip":"Read each line slowly first, then faster and faster. Can you hear the words join together?","lines":[{"t":"This is my cousin Kai.","m":"THIS‿is my COUsin KAI↘."},{"t":"He's really good at chess.","m":"he's REALly GOOD‿at CHESS↘."},{"t":"I'm interested in dinosaurs.","m":"I'm INterested‿in DInosaurs↘."}]},"acts":[{"type":"findsomeone","items":[{"p":"was born in winter","q":"Were you born in winter?"},{"p":"has got more than three cousins","q":"Have you got more than three cousins?"},{"p":"can play a musical instrument","q":"Can you play a musical instrument?"},{"p":"moved house last year","q":"Did you move house last year?"},{"p":"is good at drawing","q":"Are you good at drawing?"},{"p":"is interested in animals","q":"Are you interested in animals?"},{"p":"knows the name of a neighbour","q":"Do you know your neighbour's name?"},{"p":"plays a sport in their free time","q":"Do you play a sport in your free time?"}],"follow":["Really? Tell me more!","When?","Which one?"]},{"type":"guess","cat":"Hobbies","items":["painting","chess","football","swimming","dancing","reading","cooking","skateboarding","playing the guitar","taking photos","table tennis","riding a bike"],"frames":["Do you do it outside?","Do you need a ball?","Can you do it alone?","Is it a sport?","Do you need special things for it?"]},{"type":"roleplay","cards":[{"sit":"Break time: Student A is new at school. Student B wants to be friendly.","a":"You are new. Answer the questions. Say where you were born, one thing you are good at and one thing you are interested in. Then ask: What about you?","b":"Say hello and your name. Ask: Where are you from? What do you like doing in your free time? Have you got any brothers or sisters?"},{"sit":"At a new club: Student A is the club leader. Student B is a new member.","a":"Welcome the new member: Hello! Welcome to the club. Ask: How old are you? What are you good at? Can you…?","b":"Answer the questions. Say where you were born and where you live now. Then ask: What do we do at the club?"},{"sit":"On a video call: Student A has a new pen friend in another country. Student B is the pen friend.","a":"Ask: Where do you live? Have you got any pets? What do you do in your free time?","b":"Answer the questions. Then say: I live in… I'm interested in… What about you?"}]}],"rec":{"prompt":"Record yourself: introduce yourself to a new pen friend. Say where you were born, who is in your family, what you are good at and what you like doing in your free time.","model":"Hi! My name's Sofi and I'm eight. I was born in Santiago, and I live there with my mum, my dad, my brother Leo and our dog, Pipo. I'm good at painting, and I'm really interested in animals. In my free time I draw cats and dogs. What about you?","use":["was born in","be good at","free time"]},"tips":[{"who":"teacher","t":"Model an introduction first: bring two students to the front and introduce them to each other with one fact each: Ana, this is Pedro. He's good at football."},{"who":"student","t":"Don't just answer: ask a question back! What about you? keeps the conversation going."}]},{"id":"planet-0-teen","lv":"planet","n":0,"age":"teen","title":"Getting to Know You","goals":["introduce yourself and your friends in a natural way","talk about where you grew up, your hobbies and your skills","keep a conversation going with follow-up questions"],"warm":["How did you meet your best friend?","What do people usually ask you when they meet you for the first time?","Have you ever been the new person in a group? How did you feel?","Which three words describe you best?"],"model":{"kind":"dialogue","title":"The Video Call","intro":"Sam is a new exchange student in Concepción. His neighbour Tomás introduces him to his friends Vale and Jose on a video call.","lines":[{"sp":"Tomás","t":"Hey, everyone! [[This is]] Sam, my new [[neighbour]]. He's an exchange student from Sydney."},{"sp":"Vale","t":"Hi, Sam! Nice to meet you. How long are you staying in Chile?"},{"sp":"Sam","t":"Nice to meet you too! I'm here for a year. I arrived last month."},{"sp":"Jose","t":"Cool! So what do you do in your free time?"},{"sp":"Sam","t":"I'm really [[into]] photography, and I play rugby and football."},{"sp":"Vale","t":"I love photography too, but I'm more [[interested in]] drawing."},{"sp":"Tomás","t":"She's really [[good at]] it. She designs the posters for her school concerts."},{"sp":"Sam","t":"That's amazing! What about you, Jose?"},{"sp":"Jose","t":"I'm into coding. I made my own video game last year! And I play volleyball."},{"sp":"Sam","t":"No way! Where did you [[grow up]]?"},{"sp":"Jose","t":"I was born in Valparaíso and I grew up there. You have to visit!"},{"sp":"Sam","t":"I'd love to. Maybe we can all [[hang out]] in the holidays."},{"sp":"Tomás","t":"Good idea! Let's [[make plans]] soon."}],"questions":[{"q":"Why is Sam in Chile?","opts":["He's on holiday with his family","He's an exchange student","He wants to learn coding"],"a":1},{"q":"What is Vale good at?","opts":["Drawing","Coding","Playing volleyball"],"a":0},{"q":"Where did Jose grow up?","opts":["In Concepción","In Sydney","In Valparaíso"],"a":2}]},"lang":[{"e":"neighbour","t":"VOC","d":"a person who lives next door or near your home","x":"Our neighbour looks after our cat when we go away.","s":"NEIGHbour"},{"e":"This is…","t":"PHR","d":"what you say when you introduce one person to another","x":"Mum, this is Jose, my friend from volleyball.","s":"THIS is"},{"e":"be into","t":"PHR","d":"to like something a lot (informal)","x":"My brother is really into skateboarding.","s":"be INto"},{"e":"be interested in","t":"COL","d":"to want to know or learn more about something","x":"I'm interested in photography and film.","s":"be INterested in"},{"e":"be good at","t":"COL","d":"to be able to do something very well","x":"Jose is good at maths and coding.","s":"be GOOD at"},{"e":"make plans","t":"COL","d":"to decide together what you are going to do","x":"Let's make plans for Saturday.","s":"MAKE PLANS"},{"e":"grow up","t":"PV","d":"to spend your childhood in a place","x":"I grew up in a small town in the south.","s":"grow UP"},{"e":"hang out","t":"PV","d":"to spend time with friends in a relaxed way","x":"We usually hang out at the park after school.","s":"hang OUT"}],"pron":{"focus":"Sounding interested","explain":"When you meet new people, your voice shows how you feel. Use a big rise on short reactions like Really↗? and a strong fall on That's amazing↘! A flat voice can sound bored, even when you are interested.","tip":"Practise with a partner: your partner says a fact about themselves and you react with Really?, No way! or That's amazing! Exaggerate the music of your voice.","lines":[{"t":"Nice to meet you too!","m":"NICE to MEET‿you TOO↘!"},{"t":"Where did you grow up?","m":"WHERE did you grow UP↘?"},{"t":"Really? That's amazing!","m":"REALly↗? | that's aMAzing↘!"}]},"acts":[{"type":"fluency","topics":["Introduce yourself: where you were born, where you grew up and where you live now.","Your hobbies: what you're into and what you're good at.","Your best friend: how you met and what you do when you hang out.","Something you can do that most people can't.","Your neighbourhood: the best places and the people who live near you.","A time you were the new person in a class, a team or a club."],"mins":[3,2,1]},{"type":"picture","prompts":["Who do you think the two girls are? Classmates, best friends or new friends?","Why are they waving? Who are they saying hello to, do you think?","What do you think is in their notebooks?","Imagine one of them is a new student. What questions does the other girl ask her?","What can students do to make a new classmate feel welcome at your school?"]},{"type":"agree","items":["It's easy to make new friends at a new school.","The first day at a new school is the hardest day of the year.","You can learn a lot about a person from their hobbies.","Online friends can be real friends.","It's better to have one best friend than lots of friends.","Moving to a new city is exciting, not scary.","Everyone should know their neighbours' names.","First impressions are always right."]}],"rec":{"prompt":"Record yourself: you are joining a new club or team. Introduce yourself to the group in about one minute.","model":"Hi, everyone! I'm Vale, and I'm thirteen. I was born in Valdivia, but I grew up in Santiago. I'm really into music: I can play the guitar and I sing in a school band. I'm also good at drawing, so I'm very interested in this art club. In my free time I hang out with my friends at the park. Nice to meet you all!","use":["grow up","be into","hang out"]},"tips":[{"who":"teacher","t":"Ban one-word answers! When a student answers with only Yes or No, the class says Tell me more! and the student adds one more sentence."},{"who":"student","t":"Before the fluency activity, write three keywords for each topic, not full sentences. Then look at your partner, not at your notes."}]},{"id":"planet-1-kid","lv":"planet","n":1,"age":"kid","title":"Festival Fun","goals":["talk about festivals and traditions in your town","give your opinion about music, art and shows","ask friends what they think of things"],"warm":["Do you like festivals? Why or why not?","What special traditions does your family have?","Do you prefer music, dancing or painting?","What do you do at Fiestas Patrias?"],"model":{"kind":"dialogue","title":"At the Festival","intro":"Leo and his cousin Kai are watching a festival parade in Valparaíso with Grandma Ana.","lines":[{"sp":"Kai","t":"Wow, look at the dancers! [[What do you think of]] their [[costumes]]?"},{"sp":"Leo","t":"They're amazing! I love the gold hats."},{"sp":"Kai","t":"Me too. And listen to those drums! I [[play the drums]] in my school band, you know."},{"sp":"Leo","t":"Really? How often do you practise?"},{"sp":"Kai","t":"Every day after school. Do you like music, Leo?"},{"sp":"Leo","t":"Yes, but [[I'm not keen on]] loud music. I prefer painting."},{"sp":"Grandma Ana","t":"Look, children! Now the [[audience]] is dancing in the street!"},{"sp":"Leo","t":"Grandma, do you [[watch the parade]] every year?"},{"sp":"Grandma Ana","t":"Yes, I do! It's our family tradition. And tomorrow we all [[dress up]] in costumes!"},{"sp":"Kai","t":"Great! [[In my opinion]], this is the best festival in Chile!"},{"sp":"Leo","t":"And the fireworks tonight are going to be fantastic!"}],"questions":[{"q":"How often does Kai practise the drums?","opts":["Every weekend","Once a month","Every day after school"],"a":2},{"q":"What does Leo prefer?","opts":["Painting","Loud music","Dancing"],"a":0},{"q":"What is Grandma Ana's family tradition?","opts":["Playing the drums","Watching the parade every year","Painting pictures"],"a":1}]},"lang":[{"e":"What do you think of…?","t":"PHR","d":"a question to ask for someone's idea about something","x":"What do you think of the costumes?","s":"what do you THINK of"},{"e":"in my opinion","t":"PHR","d":"words you say before you give your idea","x":"In my opinion, the parade is the best part.","s":"in my oPINion"},{"e":"I'm not keen on…","t":"PHR","d":"a polite way to say you don't like something much","x":"I'm not keen on loud music.","s":"I'm NOT KEEN on"},{"e":"watch a parade","t":"COL","d":"look at people who march and dance through the streets","x":"We watch the parade from Grandma's window.","s":"WATCH a paRADE"},{"e":"play the drums","t":"COL","d":"make music by hitting a drum with sticks or your hands","x":"Kai plays the drums in a band.","s":"PLAY the DRUMS"},{"e":"dress up","t":"PV","d":"put on special clothes or a costume for fun","x":"We dress up as pirates for the school party.","s":"dress UP"},{"e":"costume","t":"VOC","d":"special clothes you wear for a show or party","x":"My costume is red and gold.","s":"COStume"},{"e":"audience","t":"VOC","d":"the people who watch a show or concert","x":"The audience claps at the end of the show.","s":"AUdience"}],"pron":{"focus":"Questions with do and does","explain":"In questions, small words like do, does and you are quick and soft. The main verb and the last important word are strong. Yes/no questions usually go up at the end, and wh- questions usually go down.","tip":"Say the question slowly first, then faster. Keep do you very short and make the big words strong.","lines":[{"t":"Do you like the parade?","m":"do you LIKE the paRADE↗?"},{"t":"What do you think of the costumes?","m":"WHAT do you THINK‿of the COStumes↘?"},{"t":"Does your family have a special tradition?","m":"does your FAmily HAVE‿a SPEcial traDItion↗?"}]},"acts":[{"type":"findsomeone","items":[{"p":"plays a musical instrument","q":"Do you play a musical instrument?"},{"p":"loves dressing up in costumes","q":"Do you love dressing up in costumes?"},{"p":"watches fireworks at New Year","q":"Do you watch fireworks at New Year?"},{"p":"isn't keen on loud music","q":"Are you keen on loud music?"},{"p":"goes to a festival every year","q":"Do you go to a festival every year?"},{"p":"eats empanadas at Fiestas Patrias","q":"Do you eat empanadas at Fiestas Patrias?"},{"p":"likes painting or drawing","q":"Do you like painting or drawing?"},{"p":"dances at family parties","q":"Do you dance at family parties?"}],"follow":["How often?","What do you think of it?","Who do you go with?"]},{"type":"picture","prompts":["What are the people in the photo doing?","What colour are their clothes? Do you like them?","What's the weather like? How do you know?","In your opinion, is the music loud or quiet? Why?","Do you want to play the drums in a parade? Why or why not?"]},{"type":"wyr","items":[["play the drums in a parade","dance in a parade"],["paint a big picture","make a sculpture"],["watch fireworks","watch a puppet show"],["wear a funny costume","wear a beautiful costume"],["sing in front of an audience","sit in the audience"],["go to a music festival","go to a food festival"]]}],"rec":{"prompt":"Record yourself: describe a festival or tradition you like. Say what people do there and give your opinion.","model":"Every September my family goes to a fonda for Fiestas Patrias. It's our favourite tradition. My dad dances the cueca, and my little brother eats a lot of empanadas! There's music, and some people dress up in traditional clothes. In my opinion, it's the best party of the year. I'm not keen on the loud music at night, but I love the food.","use":["in my opinion","I'm not keen on…","dress up"]},"tips":[{"who":"teacher","t":"Before the Find Someone game, model one follow-up question with a student, so the class asks more than yes/no questions."},{"who":"student","t":"When you give your opinion, start with In my opinion or I think, and then say why with because."}]},{"id":"planet-1-teen","lv":"planet","n":1,"age":"teen","title":"Festival Critics","goals":["describe festivals, concerts and traditions in your city","give strong and soft opinions about music, art and shows","agree and disagree politely with a friend"],"warm":["What's the best festival or concert you know in Chile?","Do you prefer live music or music on your phone?","What traditions does your family or school have?","What kind of art do you like: street art, photos or paintings?"],"model":{"kind":"dialogue","title":"Festival Plans","intro":"Vale is visiting her friend Jose in Valparaíso, and they're looking at the programme for a street festival.","lines":[{"sp":"Vale","t":"The Summer Arts Festival starts on Friday! Are we going?"},{"sp":"Jose","t":"Maybe. [[What do you think of]] the programme?"},{"sp":"Vale","t":"It looks amazing. There's a parade on Saturday with drummers and dancers in costumes."},{"sp":"Jose","t":"Hmm, [[I'm not keen on]] parades. They're always so crowded."},{"sp":"Vale","t":"Really? [[In my opinion]], that's the best part! The [[audience]] dances in the street."},{"sp":"Jose","t":"OK, fair enough. Does your cousin's band play this year?"},{"sp":"Vale","t":"Yes! They [[perform on stage]] on Sunday, just before the fireworks."},{"sp":"Jose","t":"Cool. I love [[live music]]. I can film their show on my phone."},{"sp":"Vale","t":"Great idea. Let's [[check out]] the sculptures by the port too."},{"sp":"Jose","t":"Sculptures? [[I can't stand]] modern art!"},{"sp":"Vale","t":"Come on! Going to this festival together is our tradition now."},{"sp":"Jose","t":"Fine. But first, empanadas!"}],"questions":[{"q":"Why isn't Jose keen on parades?","opts":["They're too crowded","They're too expensive","They're too short"],"a":0},{"q":"When does the band perform?","opts":["On Friday night","On Saturday morning","On Sunday, before the fireworks"],"a":2},{"q":"What does Jose want to do at the concert?","opts":["Dance in the street","Film the show","Sell empanadas"],"a":1}]},"lang":[{"e":"What do you think of…?","t":"PHR","d":"a question to ask for someone's opinion","x":"What do you think of the new album?","s":"what do you THINK of"},{"e":"in my opinion","t":"PHR","d":"words that introduce your personal view","x":"In my opinion, street art makes the city more beautiful.","s":"in my oPINion"},{"e":"I'm not keen on…","t":"PHR","d":"a soft, polite way to say you don't really like something","x":"I'm not keen on big crowds.","s":"I'm NOT KEEN on"},{"e":"I can't stand…","t":"PHR","d":"a strong way to say you really hate something","x":"I can't stand waiting in long queues.","s":"I CAN'T STAND"},{"e":"live music","t":"COL","d":"music that people play in front of you, not a recording","x":"There's live music in the square every Friday.","s":"LIVE MUsic"},{"e":"perform on stage","t":"COL","d":"sing, dance or act for an audience in a show","x":"Our school band performs on stage in December.","s":"perFORM on STAGE"},{"e":"check out","t":"PV","d":"go and look at something interesting","x":"Let's check out the food stalls first.","s":"check OUT"},{"e":"audience","t":"VOC","d":"the people who watch a show, a film or a concert","x":"The audience sang every song with the band.","s":"AUdience"}],"pron":{"focus":"Stress on feeling words","explain":"When we give opinions, we stress the feeling words: LOVE, CAN'T STAND, NOT KEEN. Can't has a long, strong vowel. If you say it too quickly, it sounds like can, and people understand the opposite!","tip":"Make the feeling word louder and longer, and let your voice go down at the end so you sound sure.","lines":[{"t":"I can't stand modern art.","m":"I CAN'T STAND MOdern ART↘."},{"t":"I'm not keen on parades.","m":"I'm NOT KEEN‿on paRADES↘."},{"t":"What do you think of the programme?","m":"what do you THINK‿of the PROgramme↘?"}]},"acts":[{"type":"agree","items":["Festivals are more fun with friends than with family.","Live music is better than music on your phone.","Street art makes a city more beautiful.","Concert tickets in Chile are too expensive.","Traditional music is boring for teenagers.","Everybody should learn an instrument at school.","Fireworks are the best part of any festival."]},{"type":"taboo","cards":[{"w":"festival","taboo":["party","music","event"]},{"w":"parade","taboo":["street","march","walk"]},{"w":"drum","taboo":["hit","sticks","instrument"]},{"w":"costume","taboo":["clothes","wear","party"]},{"w":"audience","taboo":["people","watch","show"]},{"w":"fireworks","taboo":["sky","night","lights"]},{"w":"sculpture","taboo":["stone","art","statue"]},{"w":"dancer","taboo":["dance","move","stage"]},{"w":"tradition","taboo":["family","every year","custom"]}]},{"type":"roleplay","cards":[{"sit":"Choosing a festival for the weekend","a":"You want to go to a music festival. Say what you love about it and ask for your friend's opinion. Use: What do you think of…? / In my opinion…","b":"You prefer an art and food festival, and you aren't keen on big crowds. Give your reasons and try to agree on one plan together."},{"sit":"Interview for the school magazine","a":"You are a journalist. Interview a young street artist or musician. Ask: How often do you practise? Where do you perform? What do you think of traditional music?","b":"You are a young artist or musician. Answer the questions about your routine and give your opinions. Use: I usually… / I love… / I can't stand…"},{"sit":"Planning the school culture day","a":"You are on the school team. Ask your classmate how they want to take part: perform on stage, paint a mural or cook traditional food.","b":"You're shy about performing on stage, but you love drawing and cooking. Explain what you like and don't like, and suggest a job for you."}]}],"rec":{"prompt":"Record a one-minute review of a festival, concert or show you know. Say what happens there and give your opinion.","model":"Every summer my city has a street festival by the sea. There's live music, and dancers in amazing costumes perform in a parade. My friends and I always check out the food stalls first. In my opinion, the best part is the fireworks at night. I'm not keen on the crowds, but I love the atmosphere. Four stars from me!","use":["live music","check out","in my opinion"]},"tips":[{"who":"teacher","t":"For Agree or Disagree, ask students to stand on one side of the room to agree and on the other side to disagree, then give one reason each before they sit down."},{"who":"student","t":"Don't just say I like it. Use stronger or softer phrases like I love, I'm not keen on and I can't stand, and always add a reason."}]},{"id":"planet-2-kid","lv":"planet","n":2,"age":"kid","title":"Dress-Up Day","goals":["describe what people are wearing now","talk about the clothes you usually wear","give and answer compliments"],"warm":["What are you wearing today?","What do you usually wear at the weekend?","Have you got a favourite T-shirt or hoodie?","Do you like dressing up?"],"model":{"kind":"dialogue","title":"Party Clothes","intro":"Kai and Sofi are getting ready for Martina's birthday party.","lines":[{"sp":"Sofi","t":"Kai, [[what are you wearing]] to Martina's party?"},{"sp":"Kai","t":"My new [[striped]] T-shirt and jeans. What do you think?"},{"sp":"Sofi","t":"[[That looks great on you]]! I love the [[bright colours]]."},{"sp":"Kai","t":"[[Thanks, it's new]]! What about you?"},{"sp":"Sofi","t":"I usually wear a dress to parties, but today I'm wearing my yellow hoodie."},{"sp":"Kai","t":"Cool! Are you wearing your sparkly [[trainers]] too?"},{"sp":"Sofi","t":"Yes, I am. Now I'm looking for my cap. I can't find it!"},{"sp":"Kai","t":"Look! Pipo is sitting on it under the table."},{"sp":"Sofi","t":"Oh, Pipo! Give it back, please!"},{"sp":"Kai","t":"Ha ha! Quick, [[put on]] your cap. Grandma Ana is waiting in the car."},{"sp":"Sofi","t":"OK! Do I look good?"},{"sp":"Kai","t":"You look fantastic. Your [[curly hair]] looks great with that cap!"}],"questions":[{"q":"What is Kai wearing to the party?","opts":["A dress and trainers","A striped T-shirt and jeans","A yellow hoodie"],"a":1},{"q":"What does Sofi usually wear to parties?","opts":["A dress","A hoodie","A cap"],"a":0},{"q":"Where is Sofi's cap?","opts":["In the car","On Kai's head","Under Pipo"],"a":2}]},"lang":[{"e":"What are you wearing?","t":"PHR","d":"a question about someone's clothes right now","x":"What are you wearing to the party?","s":"what are you WEARing"},{"e":"That looks great on you!","t":"PHR","d":"a nice thing you say about someone's clothes","x":"Your new cap? That looks great on you!","s":"that looks GREAT on you"},{"e":"Thanks, it's new!","t":"PHR","d":"a happy answer when someone likes your new clothes","x":"I love your hoodie! — Thanks, it's new!","s":"THANKS, it's NEW"},{"e":"put on","t":"PV","d":"start to wear clothes, shoes or a hat","x":"Put on your scarf. It's cold!","s":"put ON"},{"e":"curly hair","t":"COL","d":"hair that grows in lots of small circles","x":"Martina has got long curly hair.","s":"CURly HAIR"},{"e":"bright colours","t":"COL","d":"strong, happy colours like yellow and orange","x":"I love clothes with bright colours.","s":"BRIGHT COLours"},{"e":"striped","t":"VOC","d":"with lines of different colours","x":"Leo has got a red and white striped jumper.","s":"STRIPED"},{"e":"trainers","t":"VOC","d":"sports shoes for running or for every day","x":"I wear my trainers for PE.","s":"TRAINers"}],"pron":{"focus":"Short forms in the present continuous","explain":"In fast English we join I am, she is and he is: I'm, she's, he's. The -ing word is strong: WEARing, LOOKing. Say I'm wearing quickly, like one word.","tip":"Point at your clothes and say I'm wearing… three times, a little faster each time.","lines":[{"t":"I'm wearing my yellow hoodie.","m":"I'm WEARing my YELlow HOOdie↘."},{"t":"What are you wearing today?","m":"WHAT‿are you WEARing toDAY↘?"},{"t":"That looks great on you!","m":"that looks GREAT‿on you↘!"}]},"acts":[{"type":"guess","cat":"Clothes and looks","items":["hoodie","trainers","sunglasses","scarf","cap","jeans","striped T-shirt","costume","curly hair","freckles"],"frames":["Do you wear it on your…?","Do you wear it when it's hot or cold?","Is it big or small?","Has your friend got…?"]},{"type":"picture","prompts":["How many people are in the photo?","What are they wearing? Find three bright colours.","In your opinion, who is wearing the coolest clothes? Why?","Are they happy or sad? What are they doing?","What do you usually wear when you play with your friends?"]},{"type":"wyr","items":[["wear a hoodie every day","wear a costume every day"],["have curly hair","have straight hair"],["wear sunglasses at night","wear a scarf at the beach"],["wear only striped clothes","wear only yellow clothes"],["wear your dad's shoes all day","wear your grandma's hat all day"],["dress up as a banana","dress up as a frog"]]}],"rec":{"prompt":"Record yourself: describe what you are wearing today and what you usually wear at the weekend.","model":"Today I'm wearing my school uniform: a white shirt, a grey jumper and black shoes. I'm not wearing my cap, because we can't wear caps at school! At the weekend I usually wear jeans, a striped T-shirt and my blue trainers. On cold days I put on my favourite red hoodie. It's baggy and really warm.","use":["striped","trainers","put on"]},"tips":[{"who":"teacher","t":"Before the photo activity, revise clothes and colours quickly: students point to something a classmate is wearing and say She's wearing… or He's wearing…"},{"who":"student","t":"Use I'm wearing… for now and I usually wear… for every day. Listen for usually and today in the questions."}]},{"id":"planet-2-teen","lv":"planet","n":2,"age":"teen","title":"Style Check","goals":["describe people's clothes, hair and personality","compare what people usually wear with what they're wearing now","give and accept compliments naturally"],"warm":["What are you wearing right now? Is it your usual style?","Do you prefer comfortable clothes or fashionable clothes?","What do you usually wear at the weekend?","Are you shy or confident with new people?"],"model":{"kind":"dialogue","title":"Photo Day","intro":"It's school photo day, and Sam and Tomás are meeting at the school gate.","lines":[{"sp":"Sam","t":"Morning, Tomás! Wow, a shirt! You usually wear a hoodie to school."},{"sp":"Tomás","t":"I know. It's photo day, so my mum chose it. Do I look OK?"},{"sp":"Sam","t":"Honestly? [[That looks great on you]]. You [[look smart]]!"},{"sp":"Tomás","t":"[[Thanks, it's new]]. But it's too tight. I prefer [[baggy clothes]]."},{"sp":"Sam","t":"And why are you wearing sunglasses? It's cloudy today!"},{"sp":"Tomás","t":"I always hide behind sunglasses in photos. I'm a bit [[shy]] with cameras."},{"sp":"Sam","t":"Shy? You're the most [[confident]] person in our class!"},{"sp":"Tomás","t":"Only on my skateboard. Hey, what are you wearing under that jacket?"},{"sp":"Sam","t":"My favourite football shirt from Sydney. I want to [[show it off]] in the photo!"},{"sp":"Tomás","t":"Ha! I don't think Mr Díaz is going to like that."},{"sp":"Sam","t":"We'll see! Come on, [[take off]] your sunglasses. The photographer is waiting."},{"sp":"Tomás","t":"OK, OK. Smile, everyone!"}],"questions":[{"q":"What does Tomás usually wear to school?","opts":["A shirt","A hoodie","A football shirt"],"a":1},{"q":"Why does Tomás wear sunglasses in photos?","opts":["He's shy with cameras","It's very sunny","They're new"],"a":0},{"q":"What does Sam want to show off?","opts":["His new jacket","His skateboard","His football shirt from Sydney"],"a":2}]},"lang":[{"e":"That looks great on you!","t":"PHR","d":"a friendly compliment about someone's clothes","x":"Is that jacket new? It looks great on you!","s":"that looks GREAT on you"},{"e":"Thanks, it's new!","t":"PHR","d":"a natural, happy reply to a compliment about clothes","x":"Nice jacket! — Thanks, it's new!","s":"THANKS, it's NEW"},{"e":"look smart","t":"COL","d":"look clean, tidy and well dressed","x":"You look smart in that shirt.","s":"look SMART"},{"e":"baggy clothes","t":"COL","d":"big, loose clothes that aren't tight","x":"I wear baggy clothes when I go skateboarding.","s":"BAGgy CLOTHES"},{"e":"show off","t":"PV","d":"let people see something because you're proud of it","x":"Sam is showing off his new phone.","s":"show OFF"},{"e":"take off","t":"PV","d":"remove clothes, shoes or glasses from your body","x":"Please take off your cap in the classroom.","s":"take OFF"},{"e":"confident","t":"VOC","d":"sure that you can do things well","x":"Vale feels confident when she sings.","s":"CONfident"},{"e":"shy","t":"VOC","d":"nervous and quiet with new people","x":"I'm a bit shy on the first day of school.","s":"SHY"}],"pron":{"focus":"Stress for contrast: usually vs today","explain":"When we compare a habit with now, we stress the words that are different: USUALLY and TODAY, HOODIE and SHIRT. The voice goes up a little in the first part and down at the end.","tip":"Find the two words you are comparing and make them louder and longer than the rest.","lines":[{"t":"You usually wear a hoodie, but today you're wearing a shirt.","m":"you USually wear‿a HOODie↗ | but toDAY you're wearing‿a SHIRT↘."},{"t":"Why are you wearing sunglasses?","m":"WHY are you WEARing SUNglasses↘?"},{"t":"Thanks, it's new!","m":"THANKS↗ | it's NEW↘!"}]},"acts":[{"type":"fluency","topics":["Describe your favourite outfit and when you usually wear it.","Describe what someone in this room is wearing today. Can your partner guess who it is?","Compare the clothes you wear at school and at the weekend.","Describe the style of a singer or a sports star you like.","Describe your perfect outfit for a party or a concert."],"mins":[3,2,1]},{"type":"picture","prompts":["Describe two people in the photo. What are they wearing?","Who looks the most confident? Why do you think so?","What are the friends doing right now? Where do you think they are?","Would you wear any of these outfits? Which one, and why?","What do you and your friends usually wear when you go out?"]},{"type":"roleplay","cards":[{"sit":"In a clothes shop","a":"You're the shop assistant. Ask: What are you looking for? What colours do you like? Give a compliment: That looks great on you!","b":"You need clothes for a school party. You want something comfortable and not too expensive. Say what you usually wear and ask for help."},{"sit":"A lost friend at a concert","a":"You can't find your friend at a concert. Go to the information desk and describe your friend. Use: He's wearing… / He's got… / He usually…","b":"You work at the information desk. Ask questions to find the friend: What's he wearing? Has he got curly hair? Is he wearing a cap?"},{"sit":"A video call before a party","a":"Show your friend your party outfit on a video call. Describe it and ask: Do I look OK? Is it too much?","b":"Give an honest but kind opinion. Start with a compliment, then make one small suggestion: Maybe you can take off the scarf…"}]}],"rec":{"prompt":"Record yourself describing your style: what you usually wear, what you're wearing now and your favourite piece of clothing.","model":"My style is quite simple. I usually wear baggy clothes, like jeans and a big hoodie, because they're comfortable. Today I'm wearing a striped T-shirt, black trousers and my old white trainers. My favourite piece of clothing is a green cap from my uncle. I'm a bit shy, so I don't often wear bright colours. But when I wear my cap, I feel confident!","use":["baggy clothes","shy","confident"]},"tips":[{"who":"teacher","t":"In the fluency activity, students change partners each round and repeat the same topic in less time. Praise extra detail and speed, not perfect grammar."},{"who":"student","t":"When someone gives you a compliment, don't just say thanks. Add something: Thanks, it's new! or Thanks, it's my brother's!"}]},{"id":"planet-3-kid","lv":"planet","n":3,"age":"kid","title":"Animal Adventures","goals":["talk about animals and where they live","tell a short story about a trip in the past","say sorry and answer when someone apologises"],"warm":["What's your favourite wild animal? Where does it live?","Did you go to a zoo, a farm or a beach last year?","What animals live in Chile?","What did you do last weekend?"],"model":{"kind":"dialogue","title":"Penguin Weekend","intro":"On Monday morning, Martina tells Leo about her weekend trip.","lines":[{"sp":"Leo","t":"Hi, Martina! [[What did you do at the weekend]]?"},{"sp":"Martina","t":"I went to La Serena with my family. We [[went on a boat trip]] to see penguins!"},{"sp":"Leo","t":"Cool! Did you see a lot of them?"},{"sp":"Martina","t":"Yes, we did! There were hundreds of penguins on the rocks. We saw some dolphins in the [[ocean]] too."},{"sp":"Leo","t":"Wow! Where do the penguins live?"},{"sp":"Martina","t":"On a small island. They make their [[nests]] in holes between the rocks."},{"sp":"Leo","t":"Did you [[take photos]]?"},{"sp":"Martina","t":"Lots! Look, here's a baby penguin. Oh no! I dropped your pencil case. [[I'm so sorry]]!"},{"sp":"Leo","t":"[[Don't worry]]. It's OK."},{"sp":"Martina","t":"Let me [[pick it up]] for you."},{"sp":"Leo","t":"Thanks! Wow, that baby penguin is so cute. I want to go there too!"}],"questions":[{"q":"Where did Martina go at the weekend?","opts":["To the zoo","To La Serena with her family","To a rainforest"],"a":1},{"q":"Where do the penguins make their nests?","opts":["In holes between the rocks","In tall trees","In the sand"],"a":0},{"q":"Why did Martina say sorry?","opts":["She lost her photos","She was late for school","She dropped Leo's pencil case"],"a":2}]},"lang":[{"e":"What did you do at the weekend?","t":"PHR","d":"a question about someone's Saturday and Sunday","x":"What did you do at the weekend? — I went to the park.","s":"what did you DO at the weekEND"},{"e":"I'm so sorry!","t":"PHR","d":"what you say when you make a mistake","x":"I'm so sorry! I broke your pencil.","s":"I'm SO SOrry"},{"e":"Don't worry.","t":"PHR","d":"a kind answer when someone says sorry","x":"I'm sorry I'm late. — Don't worry.","s":"DON'T WORry"},{"e":"go on a boat trip","t":"COL","d":"travel on a boat for fun to see things","x":"We went on a boat trip to see whales.","s":"go on a BOAT trip"},{"e":"take photos","t":"COL","d":"use a camera or a phone to make pictures","x":"I took photos of the animals at the zoo.","s":"take PHOtos"},{"e":"pick up","t":"PV","d":"take something from the floor or the ground","x":"Please pick up your rubbish.","s":"pick UP"},{"e":"nest","t":"VOC","d":"a home that birds build for their eggs","x":"There's a nest in the tree in our garden.","s":"NEST"},{"e":"ocean","t":"VOC","d":"a huge area of salty water","x":"Whales live in the ocean.","s":"Ocean"}],"pron":{"focus":"Past simple -ed endings","explain":"The -ed ending has three sounds. After sounds like p, k, s, sh and ch it sounds like /t/: looked, stopped. After most other sounds it sounds like /d/: lived, played. After t and d it is an extra syllable /ɪd/: hunted, needed.","tip":"Only add an extra syllable when the verb ends in t or d. Looked has one syllable, not two!","lines":[{"t":"We looked at the penguins.","m":"we LOOKED‿at the PENguins↘."},{"t":"The dinosaurs lived a long time ago.","m":"the DInosaurs LIVED‿a LONG time‿aGO↘."},{"t":"The eagle hunted a little mouse.","m":"the EAgle HUNted‿a LITtle MOUSE↘."}]},"acts":[{"type":"guess","cat":"Wild animals","items":["penguin","dolphin","camel","parrot","owl","whale","turtle","condor","frog","monkey","polar bear","scorpion"],"frames":["Does it live in the ocean / the desert / the rainforest?","Has it got fur or feathers?","Can it fly?","Is it big or small?"]},{"type":"picture","prompts":["What animal can you see in the photo? Is it big or small?","Where is the turtle going? Why, do you think?","What's the beach like? Describe the sand and the weather.","Is the turtle in danger? How can people help it?","When did you last go to the beach? What animals did you see there?"]},{"type":"story","starters":["Last summer, I went to the beach with my family. Suddenly, I saw…","One morning, Pipo ran into the garden
