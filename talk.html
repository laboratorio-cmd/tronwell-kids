k at my hands, but [[make eye contact]] with me too. That's important when you sign."},{"sp":"Kai","t":"Like this?"},{"sp":"Leo","t":"Perfect! I'll [[give you a thumbs-up]] for that!"},{"sp":"Kai","t":"When we do this on stage, the audience will be [[lost for words]]!"},{"sp":"Leo","t":"Well, that's the idea. It's a show without words!"}],"questions":[{"q":"What animal does Leo act out?","opts":["A dog","A monkey","A cat"],"a":1},{"q":"Who will choose the winners of the talent show?","opts":["Ms Rojas","Leo and Kai","The whole school"],"a":2},{"q":"What does Kai mean when she raises her eyebrows and shrugs?","opts":["I don't know","I'm angry","Yes, please"],"a":0}]},"lang":[{"e":"act out","t":"PV","d":"show a story, an animal or a word with your body and face","x":"In drama class, we acted out the story of the three little pigs.","s":"act OUT"},{"e":"work out","t":"PV","d":"find the answer to something by thinking","x":"Can you work out what my mime means?","s":"work OUT"},{"e":"keep a straight face","t":"ID","d":"not laugh or smile when something is funny","x":"Benja told a joke, and I couldn't keep a straight face.","s":"keep a STRAIGHT FACE"},{"e":"be lost for words","t":"ID","d":"be so surprised that you can't say anything","x":"When Sofi saw her birthday cake, she was lost for words.","s":"be LOST for WORDS"},{"e":"make eye contact","t":"COL","d":"look straight into someone's eyes","x":"Make eye contact with your audience when you give a presentation.","s":"make EYE CONtact"},{"e":"raise your eyebrows","t":"COL","d":"move your eyebrows up to show surprise or a question","x":"Mum raised her eyebrows when she saw my messy room.","s":"RAISE your EYEbrows"},{"e":"give someone a thumbs-up","t":"COL","d":"hold your thumb up to show that something is good","x":"The coach gave me a thumbs-up after my goal.","s":"give someone a THUMBS-UP"},{"e":"Do you mean…?","t":"PHR","d":"a question to check that you understand","x":"Do you mean the red book or the blue one?","s":"do you MEAN"}],"pron":{"focus":"Rising intonation in checking questions","explain":"When you check that you've understood, your voice goes up at the end: Do you mean a MONkey↗? This shows that you're not sure, and it invites the other person to answer.","tip":"Make the rise big, like a little hill, when you check. Then answer with your voice going down: YES↘.","lines":[{"t":"Do you mean a monkey?","m":"do you MEAN‿a MONkey↗?"},{"t":"Could you show me that sign again?","m":"could‿you SHOW me that SIGN‿aGAIN↗?"},{"t":"The winners will be chosen by the whole school.","m":"the WINners will be CHOsen | by the WHOLE SCHOOL↘."}]},"acts":[{"type":"picture","prompts":["Look at the two women. How do you think they're feeling? How do you know?","What language are they using? How is it different from a spoken language?","What do you think one of them has just said to make the other one laugh?","Why are facial expressions so important when people sign?","If you could learn three signs today, which words would you choose and why?"]},{"type":"guess","cat":"Mime it! Actions and feelings","items":["nodding","shrugging","frowning","waving goodbye","feeling bored","feeling surprised","whispering a secret","giving a thumbs-up","being lost","feeling cold","laughing at a joke"],"frames":["Are you…?","Is it something that is done with your hands?","Do you mean…?"]},{"type":"taboo","cards":[{"w":"gesture","taboo":["hand","move","show"]},{"w":"nod","taboo":["head","yes","down"]},{"w":"frown","taboo":["angry","face","eyebrows"]},{"w":"shrug","taboo":["shoulders","know","lift"]},{"w":"eye contact","taboo":["look","eyes","person"]},{"w":"sign language","taboo":["hands","deaf","words"]},{"w":"whisper","taboo":["quiet","secret","voice"]},{"w":"smile","taboo":["happy","mouth","teeth"]},{"w":"wave","taboo":["hand","hello","goodbye"]},{"w":"misunderstanding","taboo":["wrong","meaning","mistake"]}]}],"rec":{"prompt":"Record a short welcome guide for a new classmate. Explain three gestures or signs that are used at your school or in your family, say what they mean, and tell them how to check if they don't understand.","model":"Hi, and welcome to our class! Here are three gestures you need to know. First, a thumbs-up is used when something is good. Ms Rojas gives us a thumbs-up when we finish our work. Second, when someone shrugs, it means they don't know. Third, a wave is used at break time to say: come and play with us! Some signs are also taught in our class every Friday, so you'll learn them quickly. And if you don't understand someone, don't worry. Just ask: Do you mean…? You'll soon work it out!","use":["give someone a thumbs-up","Do you mean…?","work out"]},"tips":[{"who":"teacher","t":"For the mime game, give each team secret cards and encourage the guessers to use checking questions: Do you mean…? Is it something that is done with your hands?"},{"who":"student","t":"In passive sentences, the important thing comes first: A thumbs-up is used when something is good. You only need by + a person when the person is important."}]},{"id":"galaxy-7-teen","lv":"galaxy","n":7,"age":"teen","title":"Read the Room","goals":["discuss how body language, tone of voice and texting can cause misunderstandings","describe how messages and gestures are seen using the passive","check and clarify meaning politely in a conversation"],"warm":["Have you ever sent a message that was misunderstood? What happened?","Which emojis do you use most, and what do they mean to you?","Can you tell how a friend is feeling just by looking at them?","Do you prefer voice notes, texts or calls? Why?"],"model":{"kind":"dialogue","title":"Just a Thumbs-Up","intro":"Sam and Jose are preparing a class presentation about body language when Sam's phone buzzes.","lines":[{"sp":"Sam","t":"Oh no, I think Vale [[took my message the wrong way]]."},{"sp":"Jose","t":"Why? What did you send her?"},{"sp":"Sam","t":"She sent me her drawing for the poster, and I just replied with a thumbs-up."},{"sp":"Jose","t":"Ah. For a lot of people our age, a thumbs-up on its own [[comes across as]] a bit cold."},{"sp":"Sam","t":"Seriously? In Australia, it's used by everyone to mean great!"},{"sp":"Jose","t":"[[So you're saying that]] you actually liked it?"},{"sp":"Sam","t":"I loved it! What I meant was: perfect, don't change anything."},{"sp":"Jose","t":"That's the problem with texts. Your tone of voice can't be heard, and nobody can see your face."},{"sp":"Sam","t":"True. In person, I always [[pick up on]] little things, like a frown or a shrug."},{"sp":"Jose","t":"Hey, that could be the start of our presentation! People are often judged by their body language before they say a word."},{"sp":"Sam","t":"Good idea. And we should [[make eye contact]] with the audience instead of reading from our slides."},{"sp":"Jose","t":"And don't [[cross your arms]]. It's often seen as defensive."},{"sp":"Sam","t":"Got it. I'm going to call Vale now, just to make sure we're [[on the same page]]."},{"sp":"Jose","t":"Smart move. Sometimes you just have to [[read the room]], even when the room is a group chat!"}],"questions":[{"q":"Why is Vale upset with Sam?","opts":["He didn't reply to her message","His thumbs-up seemed cold to her","He didn't like her drawing"],"a":1},{"q":"What does Jose say about crossing your arms?","opts":["It's often seen as defensive","It helps you look confident","It's used in Australia to mean great"],"a":0},{"q":"What does Sam decide to do?","opts":["Send Vale another emoji","Change the poster","Call Vale to clear things up"],"a":2}]},"lang":[{"e":"come across as","t":"PV","d":"seem to have a particular quality to other people","x":"He doesn't mean to be rude, but he sometimes comes across as unfriendly.","s":"come aCROSS as"},{"e":"pick up on","t":"PV","d":"notice something that is not said directly","x":"My mum always picks up on it when I'm worried.","s":"pick UP on"},{"e":"read the room","t":"ID","d":"understand how the people around you are feeling","x":"Read the room before you tell that joke. Everyone is tired.","s":"READ the ROOM"},{"e":"on the same page","t":"ID","d":"agreeing or understanding things in the same way","x":"Let's check that we're all on the same page before we start filming.","s":"on the SAME PAGE"},{"e":"take something the wrong way","t":"ID","d":"feel offended by something that wasn't meant badly","x":"Please don't take this the wrong way, but your slides are too long.","s":"take something the WRONG WAY"},{"e":"make eye contact","t":"COL","d":"look directly at the person you're talking to","x":"Try to make eye contact with the interviewer.","s":"make EYE CONtact"},{"e":"cross your arms","t":"COL","d":"fold your arms over your chest","x":"When you cross your arms, people may think you're annoyed.","s":"CROSS your ARMS"},{"e":"So you're saying that…?","t":"PHR","d":"a phrase to check that you've understood someone's point","x":"So you're saying that the meeting is at five, not four?","s":"so you're SAYing that"}],"pron":{"focus":"Contrastive stress to clarify meaning","explain":"When we clear up a misunderstanding, we put extra stress on the word that corrects it: I didn't mean it was BAD. I meant it was PERfect. In checking questions, the stressed word shows exactly what you want to check.","tip":"Read each line three times, moving the strongest stress to a different word each time, and notice how the meaning changes.","lines":[{"t":"So you're saying that you actually liked it?","m":"so you're SAYing that you ACtually LIKED‿it↗?"},{"t":"I didn't mean it was bad. I meant it was perfect.","m":"I DIDn't mean‿it was BAD↘ | I meant‿it was PERfect↘."},{"t":"Crossing your arms is often seen as defensive.","m":"CROSSing your ARMS | is OFten seen‿as deFENsive↘."}]},"acts":[{"type":"picture","prompts":["Describe the photo. What do you think the relationship between the two women is, and what makes you say that?","Apart from hand movements, how is meaning shown in sign language?","What do you think one of them has just said? Invent the conversation.","Should sign language be taught in all Chilean schools? Why or why not?","Which is easier to misunderstand: a text message or a conversation in sign language? Why?"]},{"type":"roleplay","cards":[{"sit":"The group chat misunderstanding","a":"Yesterday you replied 'OK.' to your friend's long message about weekend plans. You were busy, not angry, but your friend seems upset today. Clarify what you meant: What I meant was… / I didn't mean it like that.","b":"Your friend replied 'OK.' to your long message, and you think they're annoyed. Tell them how it came across and check: So you're saying that…? Do you mean…?"},{"sit":"Presentation feedback","a":"You've just given a presentation. Ask your classmate for honest feedback on your body language, eye contact and tone of voice. Check anything you don't understand.","b":"You watched the presentation. Give friendly feedback, using the passive where possible: Your main points were explained clearly, but… / The slides were read too much… Suggest one improvement."},{"sit":"Lost in translation","a":"You're an exchange student in Chile. A classmate made a gesture you didn't understand. Describe it and ask what it means.","b":"You're the Chilean classmate. Explain what the gesture means and when it's used. Then ask about gestures that are used in your partner's country."}]},{"type":"fishbowl","questions":["Is it easier to be misunderstood in a text or face to face? Why?","Should schools teach students how to use body language in presentations and interviews?","Are emojis making us better or worse at communicating?","Can you really tell if someone is lying from their body language?","Should sign language be taught as a subject in every school?","Are voice notes a good solution to texting misunderstandings, or are they just annoying?"]}],"rec":{"prompt":"Record a voice note telling the story of a real or invented misunderstanding caused by a text, a gesture or a tone of voice. Explain how it happened, how it was cleared up and what you learnt.","model":"A few weeks ago, I was in a group chat planning a surprise party for a friend. I wrote 'Can't wait.' with a full stop, and somehow it came across as sarcastic! Another friend thought I didn't want to go. The next day, it was all cleared up at school. She asked me, 'So you're saying that you're actually excited?' and I said, 'Of course!' We laughed about it, but I learnt something important: tone of voice and facial expressions can't be seen in a text. Now, if a message might be taken the wrong way, I send a voice note instead.","use":["come across as","take something the wrong way","So you're saying that…?"]},"tips":[{"who":"teacher","t":"Before the fishbowl, put the checking phrases on the board (Sorry, what do you mean? / So you're saying that…? / Could you repeat that, please?) and ask the outside circle to note every time they hear one."},{"who":"student","t":"Use the passive when the action matters more than the person: Crossing your arms is often seen as rude. Add by + agent only when it's important: The video was made by our class."}]},{"id":"galaxy-8-kid","lv":"galaxy","n":8,"age":"kid","title":"The Hidden Fox","goals":["make guesses about pictures and mysteries with must, might and can't","describe a painting or a sculpture you like","agree on an answer with your team"],"warm":["Do you like drawing or painting? What do you usually draw?","Have you ever been to a museum or an art gallery? What did you see?","Is there a picture on your bedroom wall? What's in it?","Do you like mystery stories? Why or why not?"],"model":{"kind":"dialogue","title":"The Last Clue","intro":"Leo, Sofi and Kai are at an art museum in Santiago, doing a detective trail for children.","lines":[{"sp":"Kai","t":"Right, detectives, here's the last clue on the trail: 'Find the painting where an animal is hiding.'"},{"sp":"Leo","t":"It must be that big landscape with the horses. Can we go and [[take a closer look]]?"},{"sp":"Sofi","t":"It can't be that one. The horses aren't hiding — they're right in the middle!"},{"sp":"Kai","t":"Good point. OK, everyone, [[put your thinking caps on]]."},{"sp":"Leo","t":"What about this portrait of the old lady? There might be a cat under her chair."},{"sp":"Sofi","t":"No, that's just a shadow. But look [[in the background]]! There's something behind the window."},{"sp":"Kai","t":"Let me see… It could be a bird, or it might just be a cloud."},{"sp":"Leo","t":"It's got a tail and two little ears. It can't be a cloud!"},{"sp":"Sofi","t":"I think it's a fox. The artist must have painted it really small, so it's hard to find."},{"sp":"Kai","t":"Wait, the clue says the animal is orange. Can you [[make out]] anything orange?"},{"sp":"Leo","t":"Yes! Its tail is orange, and so are its ears. It must be the fox. We've [[worked it out]]!"},{"sp":"Sofi","t":"Hooray! We've [[cracked the case]]! Let's tell the guide."},{"sp":"Kai","t":"We must be the best detectives in the whole museum."},{"sp":"Leo","t":"Or the luckiest! Now, can we find the café? Solving mysteries makes me hungry."}],"questions":[{"q":"Why can't the hidden animal be in the landscape with the horses?","opts":["The horses are too small to see","The horses aren't hiding","The painting is too high on the wall"],"a":1},{"q":"Where does Sofi see something strange?","opts":["Under the old lady's chair","Next to the café","Behind the window in the background"],"a":2},{"q":"What helps the children to be sure it's a fox?","opts":["Its orange tail and ears","A sign next to the painting","The guide tells them"],"a":0}]},"lang":[{"e":"take a closer look","t":"COL","d":"look at something more carefully","x":"Take a closer look at the painting — can you see the little boat?","s":"take a CLOser LOOK"},{"e":"make a guess","t":"COL","d":"say what you think without being completely sure","x":"I don't know the answer, but I'll make a guess: it's a horse!","s":"make a GUESS"},{"e":"work out","t":"PV","d":"find the answer to a problem by thinking","x":"Can you work out who took the last biscuit?","s":"work OUT"},{"e":"make out","t":"PV","d":"manage to see something that is difficult to see","x":"It's very dark, but I can just make out a cat on the wall.","s":"make OUT"},{"e":"put your thinking cap on","t":"ID","d":"start thinking very hard about a problem","x":"This puzzle is tricky, so put your thinking cap on!","s":"put your THINKing cap ON"},{"e":"crack the case","t":"ID","d":"finally solve a mystery","x":"The detective found the last clue and cracked the case.","s":"CRACK the CASE"},{"e":"in the background","t":"PREP","d":"in the part of a picture that is behind the main things","x":"There are mountains in the background of the photo.","s":"in the BACKground"},{"e":"It must be…","t":"PHR","d":"what you say when you're almost sure about something","x":"It's got stripes and big teeth. It must be a tiger!","s":"it MUST be"}],"pron":{"focus":"Stress on must, might and can't","explain":"When we guess, we stress the modal to show how sure we are: It MUST be a fox! In British English, can't has a long 'ah' sound, like in 'aunt', and the t is often very quiet. Never make can't weak.","tip":"Hold up fingers while you speak: five for must, three for might, zero for can't. Make your voice strong on the modal.","lines":[{"t":"It must be a fox!","m":"it MUST be‿a FOX↘!"},{"t":"It can't be a cloud.","m":"it CAN'T be‿a CLOUD↘."},{"t":"It might be a bird, or it might be a cloud.","m":"it MIGHT be‿a BIRD↗ | or it MIGHT be‿a CLOUD↘."}]},"acts":[{"type":"picture","prompts":["Where do you think this is? What can you see on the wall?","Look at the paintings. Which one do you like best? Why?","Who might have painted them? Do you think it was one artist or lots of artists? Use It might be… / It must be…","Who is this gallery for: children, adults or everyone? It can't be only for… because…","If your painting was on this wall, what would it show?"]},{"type":"taboo","cards":[{"w":"portrait","taboo":["face","person","picture"]},{"w":"landscape","taboo":["mountains","nature","countryside"]},{"w":"sculpture","taboo":["stone","statue","shape"]},{"w":"museum","taboo":["paintings","visit","old"]},{"w":"detective","taboo":["mystery","solve","police"]},{"w":"clue","taboo":["help","find","information"]},{"w":"paintbrush","taboo":["paint","hair","colour"]},{"w":"author","taboo":["book","write","story"]},{"w":"masterpiece","taboo":["best","famous","art"]},{"w":"exhibition","taboo":["show","gallery","look"]}]},{"type":"roleplay","cards":[{"sit":"The case of the missing birthday cake","a":"You are the detective. Ask the witness: Where were you at three o'clock? What did you see? What did you hear? Then decide: It must have been… / It can't have been… / It might have been…","b":"You are the witness. At two o'clock, the cake was on the kitchen table. At three, Pipo the dog was in the kitchen, and his nose was covered in cream. Answer the detective's questions, but don't say who ate the cake!"},{"sit":"The case of the muddy footprints","a":"You are the detective. There are big muddy footprints in the classroom. Ask the caretaker questions: Was it raining this morning? Who came into the classroom? Then say who it must have been.","b":"You are the caretaker. It rained this morning. Mr Pérez, the PE teacher, came in to get some balls. He's got very big feet. The children were all in the hall. Answer the questions."},{"sit":"The case of the upside-down painting","a":"You are the museum guide. A famous landscape is hanging upside down! Ask the visitor: When did you arrive? What did you notice? Did anyone touch the painting?","b":"You are a visitor. You arrived at ten. You saw a new cleaner with a ladder near the painting, and he looked confused. Answer the guide's questions and make one guess of your own."}]}],"rec":{"prompt":"Be an art detective! Describe a painting or a photo in your home and make three guesses about it with must, might and can't.","model":"In our living room, there's a big landscape of a lake with mountains behind it. It must be somewhere in the south of Chile, because the trees are very green and there's snow on the mountains. The artist might have painted it on a cold morning, because there's mist over the water. It can't be a famous painting — my grandma bought it at a market! If you take a closer look, you can just make out a little red boat in the background. I think it's a masterpiece.","use":["take a closer look","make out","in the background"]},"tips":[{"who":"teacher","t":"Before the taboo game, let pairs brainstorm two clues for each word. For the role-play, write the detective's question frames on the board (Where were you…? What did you see…?) and ask each detective to report the answer to the class with must have, might have or can't have."},{"who":"student","t":"When you aren't sure, don't just say maybe. Choose the right word: must (almost sure), might or could (possible), or can't (impossible)."}]},{"id":"galaxy-8-teen","lv":"galaxy","n":8,"age":"teen","title":"Real or Fake?","goals":["speculate about artworks and mysteries with must, might, could and can't (have)","discuss what makes a work of art, a book or a film valuable","reach an agreement with a partner"],"warm":["Do you follow any artists or illustrators online? What do you like about their work?","Have you ever seen a photo or a video online that turned out to be fake? How did you know?","Would you rather visit an art gallery or watch a film about an artist? Why?","What's the best plot twist you've ever read or seen?"],"model":{"kind":"dialogue","title":"The Mystery Portrait","intro":"Vale and Tomás are at an exhibition in Concepción, where Mr Díaz has asked them to write about one mystery portrait for the school website.","lines":[{"sp":"Tomás","t":"So this is the mystery portrait. There's no name and no date. Any ideas?"},{"sp":"Vale","t":"[[At first glance]], I'd say it must be really old. Look how dark the colours are."},{"sp":"Tomás","t":"Hmm, it might just be dirty. Let's not [[jump to conclusions]]."},{"sp":"Vale","t":"Fair enough. But look at the girl's dress. It can't be from this century."},{"sp":"Tomás","t":"True. So we can [[rule out]] a modern artist. What about the brushstrokes?"},{"sp":"Vale","t":"They're tiny and incredibly careful. Whoever painted it must have spent months on it."},{"sp":"Tomás","t":"Wait, take a look at the corner. Is that a signature?"},{"sp":"Vale","t":"I can just about read it… R. Ferrada, 1910. But the date looks much fresher than the rest of the paint."},{"sp":"Tomás","t":"That's weird. I [[smell a rat]]. Someone could have added the date later to make it look more valuable."},{"sp":"Vale","t":"Or the artist might have touched it up years afterwards. Artists do that sometimes."},{"sp":"Tomás","t":"So what do we write? Mystery solved, or forgery?"},{"sp":"Vale","t":"Why don't we combine both ideas? We describe the clues and let our readers decide."},{"sp":"Tomás","t":"I suppose you're right. Everyone loves a good mystery. OK, [[let's go with]] that."},{"sp":"Vale","t":"Great. And if it [[turns out]] to be a forgery, we'll write a second article!"}],"questions":[{"q":"What have Vale and Tomás got to do?","opts":["Buy a painting for the school","Write about a portrait for the school website","Interview the artist of the portrait"],"a":1},{"q":"Why does Tomás smell a rat?","opts":["The date looks newer than the rest of the painting","The girl's dress looks modern","There is no signature at all"],"a":0},{"q":"What do they finally agree to do?","opts":["Say that it's definitely a forgery","Ask Mr Díaz to decide for them","Describe the clues and let readers decide"],"a":2}]},"lang":[{"e":"rule out","t":"PV","d":"decide that something is not possible","x":"The window was locked, so we can rule out a burglar.","s":"rule OUT"},{"e":"turn out","t":"PV","d":"be discovered to be true in the end","x":"The old drawing turned out to be by a famous artist.","s":"turn OUT"},{"e":"jump to conclusions","t":"ID","d":"decide something too quickly, before you know all the facts","x":"Don't jump to conclusions — maybe she just didn't see your message.","s":"JUMP to conCLUsions"},{"e":"smell a rat","t":"ID","d":"feel that something is wrong or dishonest","x":"When the seller wouldn't let me look at the back of the canvas, I smelt a rat.","s":"SMELL a RAT"},{"e":"make an educated guess","t":"COL","d":"guess using the information and knowledge you have","x":"Judging by the clothes, I'd make an educated guess that it's from the 1900s.","s":"make an EDucated GUESS"},{"e":"reach an agreement","t":"COL","d":"finally decide something together after discussing it","x":"After an hour of arguing, our group reached an agreement about the poster.","s":"REACH an aGREEment"},{"e":"at first glance","t":"PREP","d":"when you look at something for the first time, quickly","x":"At first glance, the two paintings look identical.","s":"at FIRST GLANCE"},{"e":"Let's go with…","t":"PHR","d":"what you say to choose one option in a group","x":"We've got three ideas for the title. Let's go with the funny one.","s":"LET'S go WITH"}],"pron":{"focus":"Weak have in past modals","explain":"In must have, might have and can't have, have is weak and linked to the modal: must have sounds like MUSTuv. The stress goes on the modal and on the main verb, not on have.","tip":"Say it weak, but write it in full: must have, never must of. Practise by tapping the desk only on the stressed words.","lines":[{"t":"Someone must have added the date later.","m":"SOMEone MUST‿have ADDed the DATE | LATer↘."},{"t":"She can't have painted it in a week.","m":"she CAN'T‿have PAINTed it‿in a WEEK↘."},{"t":"It might have been the artist's daughter.","m":"it MIGHT‿have been the ARTist's DAUGHter↘."}]},"acts":[{"type":"picture","prompts":["What kind of place is this, and what makes you think so?","Look at the paintings. Who might have painted them, and what might they be about?","Which painting would you choose for your bedroom, and why?","Some teenagers think galleries are boring. Why might that be, and how could a gallery like this attract more young people?","If one of your own photos or drawings could hang on this wall, which one would you choose?"]},{"type":"devil","motions":["Street art is just as valuable as the art in galleries.","Pictures made by AI shouldn't be called art.","A perfect forgery is just as good as the original.","The book is always better than the film.","Museums and galleries should be free for teenagers.","Schools should spend as much time on art and music as on maths."]},{"type":"story","starters":["When the gallery opened on Monday morning, its most famous painting was hanging upside down…","Tomás found an old sketchbook in the school library. On the last page, someone had drawn his face…","The author's new novel arrived at the bookshop, but the last chapter was completely blank…","During the school exhibition, a sculpture that nobody had made appeared in the middle of the hall…","Jose found a note in her school locker. It said: Look closely at the portrait in Room 3…"]}],"rec":{"prompt":"Choose a painting, a photo or a book cover you know well. Describe it and make at least three deductions about it, using must, might, could or can't (have).","model":"I'm looking at the cover of a mystery novel that my brother left on the sofa. At first glance, it's really simple: a dark street, a lamp and a red umbrella on the ground. The umbrella must be an important clue, because it's the only colourful thing in the picture. Someone might have dropped it while they were running away. It can't have been raining, though — the street is completely dry. I don't want to jump to conclusions, but I smell a rat. I'll have to read it to see how the plot turns out!","use":["at first glance","jump to conclusions","smell a rat"]},"tips":[{"who":"teacher","t":"In the devil's advocate debate, give each pair a motion and ask them to argue for the side they personally disagree with. The listeners note every modal of deduction they hear, and the pair with the most wins. Finish by asking the class to reach an agreement on one motion."},{"who":"student","t":"Show how sure you are: must (about 95%), might or could (about 50%), can't (0%). For the past, add have + past participle, and keep have weak when you speak."}]},{"id":"galaxy-9-kid","lv":"galaxy","n":9,"age":"kid","title":"Fun at the Fonda","goals":["describe festivals and the people, places and things in them with who, which and where","ask for information politely at a festival","invent a new festival with your group and present it"],"warm":["What's your favourite celebration of the year? Why?","What do you usually eat at Fiestas Patrias?","Have you ever worn a costume? What did you dress up as?","Do you like fireworks, or are they too loud for you?"],"model":{"kind":"dialogue","title":"Where Are the Kites?","intro":"It's Fiestas Patrias, and Leo, Sofi and Kai are at a big fonda in the park with Grandma Ana.","lines":[{"sp":"Kai","t":"Wow, there's [[a huge crowd]] here! Is it always this busy?"},{"sp":"Leo","t":"Every September! Fiestas Patrias is the national holiday that everyone waits for."},{"sp":"Sofi","t":"Look, Grandma! That's the girl who won the cueca contest at our school."},{"sp":"Grandma Ana","t":"She dances beautifully. Shall we watch the dancing later?"},{"sp":"Kai","t":"I'd love to [[join in]], but I don't know the steps yet."},{"sp":"Leo","t":"Don't worry, it's easy. You just wave your handkerchief and follow your partner."},{"sp":"Sofi","t":"First, can we find the stall where they sell kites? I want to [[fly a kite]] today."},{"sp":"Kai","t":"I'll ask that man. [[Excuse me, could you tell me]] where the kite stall is?"},{"sp":"Man","t":"Of course! It's next to the stage, behind the stall which sells empanadas."},{"sp":"Grandma Ana","t":"Empanadas! Leo, [[would you mind]] getting four for us? Here's some money."},{"sp":"Leo","t":"No problem, Grandma. Cheese ones, which are Sofi's favourite, or meat ones?"},{"sp":"Sofi","t":"Cheese, please! Oh, I'm so excited. I'm going to [[have a whale of a time]]!"},{"sp":"Grandma Ana","t":"You're [[full of beans]] today, Sofi! Save some energy for the dancing tonight."}],"questions":[{"q":"Who does Sofi see at the fonda?","opts":["Her teacher, Ms Rojas","The girl who won the cueca contest at school","The man who sells kites"],"a":1},{"q":"Where is the kite stall?","opts":["Next to the stage","Inside the school","Near Grandma's house"],"a":0},{"q":"What does Grandma Ana ask Leo to do?","opts":["Dance the cueca","Fly a kite with Sofi","Buy some empanadas"],"a":2}]},"lang":[{"e":"dress up","t":"PV","d":"put on special clothes to look like someone or something else","x":"At carnival, I dressed up as a pirate.","s":"dress UP"},{"e":"join in","t":"PV","d":"start taking part in something that other people are doing","x":"Everyone was singing, so I joined in.","s":"join IN"},{"e":"have a whale of a time","t":"ID","d":"enjoy yourself very, very much","x":"We had a whale of a time at my cousin's birthday party.","s":"have a WHALE of a TIME"},{"e":"full of beans","t":"ID","d":"very lively and full of energy","x":"My little brother is always full of beans in the morning.","s":"FULL of BEANS"},{"e":"fly a kite","t":"COL","d":"make a kite go up in the wind and hold it with a string","x":"In September, we fly kites in the park.","s":"FLY a KITE"},{"e":"a huge crowd","t":"COL","d":"a very large number of people in one place","x":"There was a huge crowd outside the stadium.","s":"a HUGE CROWD"},{"e":"Excuse me, could you tell me…?","t":"PHR","d":"a polite way to ask a stranger for information","x":"Excuse me, could you tell me where the toilets are?","s":"exCUSE me | could you TELL me"},{"e":"Would you mind…?","t":"PHR","d":"a polite way to ask someone to do something for you","x":"Would you mind holding my balloon for a minute?","s":"would you MIND"}],"pron":{"focus":"Sounding polite in requests","explain":"Polite requests sound kind when your voice is soft and goes up a little at the end. Could you and would you are quick and linked: could‿you sounds like cud-joo. Put the stress on the important words, like TELL and MIND.","tip":"Say each request twice: first like a robot, then with a smile. Can you hear how much friendlier the second one is?","lines":[{"t":"Excuse me, could you tell me where the kite stall is?","m":"exCUSE me | could‿you TELL me where the KITE stall‿is↗?"},{"t":"Would you mind getting four empanadas?","m":"would‿you MIND getting FOUR empaNAdas↗?"},{"t":"That's the girl who won the contest.","m":"THAT'S the GIRL who WON the CONtest↘."}]},"acts":[{"type":"picture","prompts":["Where do you think these people are? What are they celebrating?","Describe the dancer who you like best. What is he or she wearing?","What can you see in the air? How do you think the dancers feel?","Would you like to dance in a carnival like this? What costume would you wear?","Which celebration in your town is the most colourful? What happens there?"]},{"type":"pitch","brief":"Your school wants a brand-new festival! In groups, invent one, draw a poster and present it to the class. Use who, which and where: It's a festival where… The guests who come can… The food, which is…","ideas":["A Festival of Lights, where everyone makes a paper lantern","A Pet Parade, which is for all the dogs and cats in the neighbourhood","A Kite Day in the park, where the highest kite wins a prize","A Pancake Feast, where families cook together","A Costume Day, when even the teachers dress up"],"questions":["What's the name of your festival?","Where does it take place, and when?","Who can come? What do guests need to bring?","Which games or traditions are part of it?","Why will people love it?"]},{"type":"roleplay","cards":[{"sit":"At the fonda information stand","a":"You're a visitor. Ask politely: Excuse me, could you tell me where the cueca stage is? Could you tell me what time the dancing starts?","b":"You work at the information stand. The cueca stage is next to the big tree, and the dancing starts at six o'clock. Answer politely and give one more tip about the fonda."},{"sit":"At the costume shop","a":"You need a costume for the school parade. Ask: Would you mind showing me the costume which has the gold crown? I was wondering if I could try it on.","b":"You're the shop assistant. You've got three costumes: a pirate, a king with a gold crown and a dinosaur. Help the customer choose, and say which one is your favourite."},{"sit":"At a birthday party","a":"You're a guest. Ask the host politely: Would you mind telling me where the toilet is? Could you tell me who made this amazing cake?","b":"You're the host. The toilet is upstairs, on the left. Your grandma made the cake — she's the woman who is wearing a red hat."}]}],"rec":{"prompt":"Record yourself describing your favourite celebration. Say where it takes place, who is there and what you do. Use who, which and where.","model":"My favourite celebration is Fiestas Patrias, which is in September. We always go to my grandma's house, where the whole family has a big lunch. My uncle, who is a brilliant cook, makes the empanadas, and after lunch my cousins and I fly kites in the park. Last year I joined in the cueca contest at school, and the girl who danced with me was my best friend. We didn't win, but we had a whale of a time! The best part is the music, which goes on until late at night.","use":["join in","have a whale of a time","fly a kite"]},"tips":[{"who":"teacher","t":"Before the pitch, present your own festival on the board as a model, underlining who, which and where. Give each group a big sheet of paper for the poster, and let the class vote for the best festival (but not their own!)."},{"who":"student","t":"Use who for people, which for things and where for places. With people you don't know, start with Excuse me and use could you or would you mind to sound polite."}]},{"id":"galaxy-9-teen","lv":"galaxy","n":9,"age":"teen","title":"New Year Volunteers","goals":["describe festivals and traditions with defining and non-defining relative clauses","make polite requests and ask indirect questions in formal situations","argue for the tradition you think matters most"],"warm":["Which festival would you love to go to, in Chile or abroad? Why?","How do you and your family usually celebrate New Year?","Do you think traditions are still important for teenagers? Why or why not?","Have you ever helped to organise a party or an event? How did it go?"],"model":{"kind":"dialogue","title":"At the Information Point","intro":"Jose and Sam are volunteers at an information point during the New Year celebrations in Valparaíso.","lines":[{"sp":"Sam","t":"I can't believe we [[signed up for]] this. There must be a million people here!"},{"sp":"Jose","t":"Welcome to New Year in Valparaíso! The fireworks, which last about twenty minutes, are some of the biggest in South America."},{"sp":"Visitor","t":"Excuse me, [[I was wondering if]] you could help me. Could you tell me where the best place to watch the fireworks is?"},{"sp":"Jose","t":"Of course. Most people go up the hills, where you can see the whole bay."},{"sp":"Visitor","t":"Lovely. And [[would you mind]] writing down the name of the hill?"},{"sp":"Sam","t":"Not at all. Cerro Alegre — it's the one which has all the colourful houses."},{"sp":"Visitor","t":"Thank you. Is it true that people walk round the block with a suitcase at midnight?"},{"sp":"Jose","t":"It is! It's a custom that has been [[passed down]] for generations. People say you'll travel a lot in the new year."},{"sp":"Visitor","t":"How wonderful. This is [[a once-in-a-lifetime experience]] for me."},{"sp":"Sam","t":"For me too. In Sydney, the harbour fireworks [[steal the show]], but here the whole city celebrates together."},{"sp":"Jose","t":"Wait until midnight, when all the ships in the bay sound their horns."},{"sp":"Visitor","t":"I'll be there. Thank you both, you've been so helpful!"},{"sp":"Sam","t":"Our pleasure. Happy New Year! … Jose, our shift ends at eleven, right?"},{"sp":"Jose","t":"Yes, then we can finally [[let our hair down]]. My family [[keeps the tradition alive]], so grab a suitcase — we're walking round the block!"}],"questions":[{"q":"Why are Jose and Sam at the information point?","opts":["They are lost tourists","They signed up as volunteers","They are selling suitcases"],"a":1},{"q":"Where does Jose recommend watching the fireworks from?","opts":["The hills","A boat in the bay","The information point"],"a":0},{"q":"What will Jose and Sam probably do after their shift?","opts":["Go home to sleep","Fly back to Sydney","Walk round the block with a suitcase"],"a":2}]},"lang":[{"e":"sign up for","t":"PV","d":"put your name on a list to take part in something","x":"I've signed up for the dance workshop on Saturday.","s":"sign UP for"},{"e":"pass down","t":"PV","d":"give knowledge or customs to younger people in the family","x":"This empanada recipe was passed down from my great-grandmother.","s":"pass DOWN"},{"e":"steal the show","t":"ID","d":"be the most impressive or popular part of an event","x":"The little girl in the dragon costume stole the show at the parade.","s":"STEAL the SHOW"},{"e":"let your hair down","t":"ID","d":"relax and enjoy yourself, especially after working hard","x":"After the exams, we let our hair down at Tomás's barbecue.","s":"LET your HAIR DOWN"},{"e":"a once-in-a-lifetime experience","t":"COL","d":"something so special that you will probably only do it once","x":"Seeing the carnival in Arica was a once-in-a-lifetime experience.","s":"a ONCE-in-a-LIFEtime exPERience"},{"e":"keep a tradition alive","t":"COL","d":"continue a custom so that it doesn't disappear","x":"My grandparents keep the tradition alive by dancing the cueca every September.","s":"KEEP a traDItion aLIVE"},{"e":"I was wondering if…","t":"PHR","d":"a very polite way to start a request","x":"I was wondering if I could borrow your camera for the festival.","s":"I was WONdering if"},{"e":"Would you mind…?","t":"PHR","d":"a polite way to ask someone to do something","x":"Would you mind taking a photo of us in front of the stage?","s":"would you MIND"}],"pron":{"focus":"Pausing in relative clauses","explain":"When you speak, the commas around a non-defining clause become short pauses, and the extra information is said a little faster and lower, like a side comment. A defining clause has no pauses, because the information is essential.","tip":"Read each sentence twice: once with pauses and once without. Listen for the difference, then ask a partner which version means extra information.","lines":[{"t":"The fireworks, which last about twenty minutes, are amazing.","m":"the FIREworks | which LAST about twenty MINutes | are aMAZing↘."},{"t":"The girl who won the contest is my cousin.","m":"the GIRL who WON the CONtest‿is my COUSin↘."},{"t":"I was wondering if you could help me.","m":"I was WONdering‿if you could HELP me↗."}]},"acts":[{"type":"picture","prompts":["Where do you think this photo was taken, and what's being celebrated?","Describe the dancer who catches your eye first. What might their costume be made of?","How do you think the people in the crowd are feeling? What can they probably hear?","Would you rather dance in a parade like this or watch it from the crowd? Why?","Which traditions from your family or your town would you like to keep alive, and why?"]},{"type":"balloon","sit":"A hot-air balloon full of traditions is losing height, and only one can stay on board. Each student defends one tradition and explains why the world needs it. Use relative clauses: It's a tradition which… It's the day when… People who…","roles":[{"name":"Dancing the cueca at Fiestas Patrias","why":"It's a dance which connects young and old people, and it's part of Chile's identity."},{"name":"Fireworks at New Year","why":"They're the moment when whole cities celebrate together, like in Valparaíso and Sydney."},{"name":"Birthday cakes with candles","why":"It's a tradition which people all over the world understand, and making a wish is magic at any age."},{"name":"Carnival parades with costumes","why":"They're celebrations where music, dance and handmade costumes are passed down through families."},{"name":"Big family feasts","why":"A feast is the place where families who live far apart finally sit at the same table."},{"name":"Paper lantern festivals","why":"They're peaceful celebrations which fill the streets with light and bring neighbours together."}]},{"type":"roleplay","cards":[{"sit":"At a festival information point","a":"You're a tourist in Valparaíso for New Year. Ask politely where you can watch the fireworks, what time they start and whether there are buses after midnight. Use: I was wondering if… / Could you tell me…?","b":"You're a volunteer. The best view is from Cerro Alegre, the fireworks start at midnight, and there are special buses until three in the morning. Answer politely and give one extra tip."},{"sit":"Calling a restaurant","a":"You want to book a table for six for your grandmother's 70th birthday on Saturday. Ask politely if they have a table by the window and whether you can bring your own cake.","b":"You work at the restaurant. You've got a table for six at eight o'clock, but not by the window. Guests can bring a cake, but there's a small charge for serving it. Offer an alternative."},{"sit":"Talking to a neighbour","a":"You're having a small party for your best friend's 15th birthday. Ask your neighbour politely whether they would mind some music until 11 p.m., and if you could borrow some chairs.","b":"You're the neighbour. You're fine with music until 10.30, because you start work early. You're happy to lend four chairs. Negotiate politely."}]}],"rec":{"prompt":"Record an audio message for an exchange student who is coming to Chile. Describe a celebration they shouldn't miss, using relative clauses, and give them one polite tip.","model":"Hi! If you're in Chile in September, you can't miss Fiestas Patrias, which is our biggest national holiday. It's a time when families get together, eat empanadas and dance the cueca. The fondas, which are huge outdoor fairs, are where you'll find the best food and music. My grandparents, who live near Chillán, keep the tradition alive with a massive family lunch every year. It's the perfect chance to let your hair down before the last months of school. One tip: if you don't know what something is, just ask, Excuse me, could you tell me what this is? People love sharing their traditions.","use":["keep a tradition alive","let your hair down"]},"tips":[{"who":"teacher","t":"For the balloon debate, give each student a tradition card and one minute to prepare. Ask for at least two relative clauses in every speech, and let the class vote on which tradition stays in the balloon."},{"who":"student","t":"In formal situations, soften your requests: I was wondering if you could… sounds much more polite than Can you…? And in indirect questions, the verb comes after the subject: Could you tell me where the stage is?"}]}];

function enVoices(){
  if(VOICES) return VOICES;
  var v = voices().filter(function(x){ return /^en[-_]US/i.test(x.lang); });
  if(!v.length) v = voices().filter(function(x){ return /^en/i.test(x.lang); });
  v.sort(function(a, b){ var r = function(x){ return /(Natural|Google|Aria|Jenny|Guy|Samantha|Online)/i.test(x.name) ? 0 : 1; }; return r(a) - r(b); });

}

/* ---------- 90-minute class clock ---------- */
var CLK = {left: 3600, iv: null};
function clock(a){
  if(a === "start" && !CLK.iv) CLK.iv = setInterval(function(){ CLK.left = Math.max(0, CLK.left - 1); clockPaint(); if(!CLK.left){ clearInterval(CLK.iv); CLK.iv = null; chime(); } }, 1000);
  if(a === "pause" && CLK.iv){ clearInterval(CLK.iv); CLK.iv = null; }
  if(a === "reset"){ clockStop(); }
  clockPaint();
}
function clockStop(){ if(CLK.iv) clearInterval(CLK.iv); CLK.iv = null; CLK.left = 3600; }
function clockPaint(){
  var c = $("clk"); if(!c) return; c.textContent = fmt(CLK.left); c.classList.toggle("run", !!CLK.iv);
  var el = (3600 - CLK.left) / 60, acc = 0, cur = -1;
  if(CLK.left < 3600){ cur = STAGES.length - 1; for(var i = 0; i < STAGES.length; i++){ acc += STAGES[i].m; if(el < acc){ cur = i; break; } } }
  STAGES.forEach(function(s, i){ var t = $("t-" + s.id); if(t) t.classList.toggle("now", i === cur); });
}

    '<div class="useit" id="useit">' + L.lang.map(function(it){ return '<button class="ui" onclick="useIt(this)">' + esc(it.e) + '</button>'; }).join("") + '</div>' +
    '<div class="meter"><div class="bar"><i id="ubar"></i></div><b id="ucount">0 / ' + L.lang.length + '</b><span class="msg" id="umsg"></span></div>' +
    '<h3 style="margin:22px 0 10px;font-size:1.15em">⚡ Quick check</h3><div id="quiz"></div>' +
    '<div class="wrap2" style="margin-top:22px"><div><h3 style="font-size:1.15em;margin-bottom:10px">💡 Tips</h3><div class="tips">' + L.tips.filter(function(tp){ return tp.who === "student" || isTeacher(); }).map(function(tp){ return '<div class="tip' + (tp.who === "teacher" ? " t" : "") + '"><span class="ti">' + (tp.who === "teacher" ? "👩‍🏫" : "🎯") + '</span><div><b>' + (tp.who === "teacher" ? "For the teacher" : "For you") + '</b>' + esc(tp.t) + esL(tp.es) + '</div></div>'; }).join("") + '</div></div>' +
    '<div class="self"><h3 style="font-size:1.15em;margin-bottom:10px">🙋 Self-check</h3>' + L.goals.map(function(g, q){ return '<label><input type="checkbox"> <span>I can ' + esc(g) + esL(L.goals_es && L.goals_es[q]) + '</span></label>'; }).join("") + '</div></div></div>';
  var prev = idx > 0 ? list[idx - 1] : null, next = idx < list.length - 1 ? list[idx + 1] : null;
  h += '</div><div class="lnav">' + (prev ? '<button class="btn soft" onclick="go(\'' + k + '-' + prev.n + '\')">← ' + esc(lessonOf(k, prev.n, age).title) + '</button>' : "<span></span>") +
    (next ? '<button class="btn" onclick="go(\'' + k + '-' + next.n + '\')">' + esc(lessonOf(k, next.n, age).title) + ' →</button>' : '<button class="btn gr" onclick="go(\'' + k + '\')">Back to ' + lvName(k) + '</button>') + '</div>';
  $("app").innerHTML = h;
  $("lbody").style.setProperty("--fs", FS + "px");
  L.acts.forEach(function(a, i){ ACTS[a.type](a, i, L); });
  buildQuiz(); MSEL = null;
}
var MSEL = null;
/* quick check finished → lesson done; first time: +3 stars in the Kids portal */
function qAns(k, b){
  var box = $("qo" + k); if(box.classList.contains("lock")) return; box.classList.add("lock");
  var ok = b.dataset.ok === "1"; box.querySelectorAll("button").forEach(function(x){ if(x.dataset.ok === "1") x.classList.add("ok"); });
  if(!ok) b.classList.add("no"); else QZ.ok++;
  var f = $("qf" + k); f.classList.add("show"); f.style.color = ok ? "var(--green-d)" : "var(--red)"; f.textContent = (ok ? "✓ Correct! " : "✗ Not quite. ") + f.textContent;
  QZ.n++;
  if(QZ.n === QZ.total){ var s = $("qscore"), p = QZ.ok / QZ.total, first = !PR.done[CUR.id];
    PR.done[CUR.id] = true; saveP();
    if(first){ STARS = load("twk2_stars", 0) + 3; save("twk2_stars", STARS); renderNav(); }
    s.innerHTML = '<b>' + QZ.ok + ' / 6</b><div style="font-weight:800;margin-bottom:12px">' + (p === 1 ? "Perfect! 🏆" : p >= .67 ? "Great job — almost there! 🔥" : "Good effort — review the phrases and try again. 💪") + (first ? " · " + (isTeen() ? "+3 XP" : "+3 ⭐") : "") + '</div>' + tbtn("↺ Try a new quiz", "buildQuiz()", "");
    s.style.display = "block"; }
}
/* microphone: a grown-up says yes once (shared with Speak Up! in the Practice Zone) */
var _recStart = recStart;
recStart = function(key, maxSec, onStop){
  if(!load("twk2_micok", false)){
    var note = $("rn_" + key);
    if(note) note.innerHTML = '<div class="notice">🎤 ' + (isTeen() ? "This uses the microphone. Your voice stays on this device and is never sent." : "Ask a grown-up to say yes: this uses the microphone.") +
      ' · Se usa el micrófono: la voz se queda en este equipo y no se envía. <button class="btn sm" style="margin-left:8px" onclick="save(\'twk2_micok\',true);this.parentNode.parentNode.innerHTML=\'\';toggleRec(\'' + key + '\')">👍 OK</button></div>';
    if(onStop) onStop(null); return;
  }
  _recStart(key, maxSec, onStop);
};
renderNav();
route();
