stions about your name, age, city and birthday","welcome a new classmate"],"goals_es":["saludar y presentarte","hacer y responder preguntas sobre tu nombre, edad, ciudad y cumpleaños","darle la bienvenida a un compañero nuevo"],"warm":["What's your name?","How old are you?","When is your birthday?","Who is your best friend?"],"warm_es":["¿Cómo te llamas?","¿Cuántos años tienes?","¿Cuándo es tu cumpleaños?","¿Quién es tu mejor amigo o amiga?"],"model":{"kind":"dialogue","title":"The New Classmate","intro":"It's Monday morning. Lucía is new at Leo's school.","intro_es":"Es lunes en la mañana. Lucía es nueva en el colegio de Leo.","lines":[{"sp":"Leo","t":"[[Good morning]]! Are you new here?","es":"¡Buenos días! ¿Eres nueva aquí?"},{"sp":"Lucía","t":"Yes, I am. Hi! [[My name's]] Lucía.","es":"Sí. ¡Hola! Me llamo Lucía."},{"sp":"Leo","t":"Hi, Lucía! I'm Leo. [[Nice to meet you]]!","es":"¡Hola, Lucía! Yo soy Leo. ¡Mucho gusto!"},{"sp":"Lucía","t":"Nice to meet you too, Leo.","es":"Igualmente, Leo."},{"sp":"Leo","t":"[[Where are you from]]?","es":"¿De dónde eres?"},{"sp":"Lucía","t":"I'm from Arica. It's a [[city]] [[in the north of]] Chile.","es":"Soy de Arica. Es una ciudad en el norte de Chile."},{"sp":"Leo","t":"Cool! How old are you?","es":"¡Qué bien! ¿Cuántos años tienes?"},{"sp":"Lucía","t":"I'm ten. My [[birthday]] is in May. And you?","es":"Tengo diez. Mi cumpleaños es en mayo. ¿Y tú?"},{"sp":"Leo","t":"I'm ten too! My birthday is in October. Look, this is my [[best friend]], Benja.","es":"¡Yo también tengo diez! Mi cumpleaños es en octubre. Mira, él es mi mejor amigo, Benja."},{"sp":"Benja","t":"Hi, Lucía! Welcome to our class!","es":"¡Hola, Lucía! ¡Bienvenida a nuestro curso!"},{"sp":"Lucía","t":"Thank you! I'm very happy to be here.","es":"¡Gracias! Estoy muy feliz de estar aquí."}],"questions":[{"q":"When is Lucía's birthday?","opts":["In October","In June","In May"],"a":2},{"q":"How old is Leo?","opts":["Ten","Nine","Eleven"],"a":0},{"q":"Who is Benja?","opt er","es":"número de teléfono"},{"e":"group chat","t":"VOC","d":"a chat on your phone with a group of people","x":"Our class has got a group chat.","s":"GROUP chat","es":"chat grupal"},{"e":"My name's…","t":"PHR","d":"you say this to tell people what you are called","x":"Hi, everyone! My name's Vale.","s":"my NAME'S","es":"Me llamo…"},{"e":"Nice to meet you!","t":"PHR","d":"you say this the first time you meet someone","x":"Nice to meet you, Sam!","s":"NICE to MEET you","es":"¡Mucho gusto!"},{"e":"Where are you from?","t":"PHR","d":"a question about someone's home city or country","x":"Where are you from? — I'm from Valparaíso.","s":"WHERE are you FROM","es":"¿De dónde eres?"},{"e":"See you later!","t":"PHR","d":"a friendly way to say goodbye","x":"I have to go now. See you later!","s":"see you LAter","es":"¡Nos vemos!"}],"pron":{"focus":"Short forms: name's, I'm, what's","explain":"In conversation, we join small words: My name is becomes My name's, I am becomes I'm, and What is becomes What's. It sounds friendly and natural.","explain_es":"En una conversación, juntamos palabras pequeñas: My name is se convierte en My name's, I am en I'm y What is en What's. Suena amistoso y natural.","tip":"Say the short form as one word: name's sounds like names.","tip_es":"Di la forma corta como una sola palabra: name's suena como names.","lines":[{"t":"My name's Sam.","m":"my name's SAM↘."},{"t":"I'm from Sydney.","m":"I'm from SYDney↘."},{"t":"What's your phone number?","m":"what's your PHONE number↘?"}]},"acts":[{"type":"guess","cat":"Secret cities","items":["Santiago","Valparaíso","Concepción","Arica","Puerto Montt","Sydney","London","Tokyo","Lima","New York"],"frames":["Is it in Chile?","Is it near the sea?","Is it a big city?","Are you from…?"]},{"type":"roulette","items":["What's your name? Have you got a nickname?","How old are you?","Where are you from?","When is your birthday?","Who is your best friend?","What's your favourite colour?","What music do you like?","What's your favourite food?","Where do you meet your friends?","What's your favourite school subject?"]},{"type":"roleplay","cards":[{"sit":"First day at a new school.","a":"You are a new student from another city. Say hello, your name and where you are from. Ask one question about the school.","b":"You are a student at the school. Say hello and ask: What's your name? Where are you from? How old are you? Then invite A to lunch."},{"sit":"Summer camp: you are in the same volleyball team.","a":"Introduce yourself. Ask: When is your birthday? What sports do you like?","b":"Answer the questions. Then ask: What's your phone number? I can add you to the team group chat."},{"sit":"A video call with a new friend from Australia. In Chile it's morning, but in Sydney it's night.","a":"You are in Chile. Say: Good morning! Ask: How old are you? When is your birthday?","b":"You are in Sydney. Answer, then ask: Where are you from in Chile? At the end, say: Good night!"}]}],"rec":{"prompt":"Record a short introduction for a new class group: say your name, age, city and birthday, and one thing you love.","prompt_es":"Graba una presentación corta para un nuevo grupo de curso: di tu nombre, edad, ciudad y cumpleaños, y una cosa que te encanta.","model":"Hi, everyone! My name's Vale. I'm thirteen, and I'm from Santiago, the capital of Chile. My birthday is in September, during Fiestas Patrias! I love music and drawing. Nice to meet you all. Where are you from?","use":["My name's…","Nice to meet you!","Where are you from?"]},"tips":[{"who":"teacher","t":"For the guessing game, give each student a secret city card. The others ask Are you from…? and yes/no questions with the frames until they guess.","es":"Para el juego de adivinanzas, entrega a cada estudiante una tarjeta con una ciudad secreta. Los demás preguntan Are you from…? y preguntas de sí o no con los modelos hasta adivinar."},{"who":"student","t":"Don't stop at one answer. Add one more piece of information: I'm from Concepción. It's near the sea.","es":"No te quedes en una sola respuesta. Agrega un dato más: I'm from Concepción. It's near the sea."}]},{"id":"rocket-1-kid","lv":"rocket","n":1,"age":"kid","title":"Little Detectives","goals":["describe what people look like with has got","say what people can and can't do","ask questions to guess a person"],"goals_es":["describir cómo son las personas con has got","decir qué pueden y qué no pueden hacer las personas","hacer preguntas para adivinar quién es una persona"],"warm":["What colour are your eyes?","Have you got long hair or short hair?","Can you swim?","Who in your family has got glasses?"],"warm_es":["¿De qué color son tus ojos?","¿Tienes el pelo largo o corto?","¿Sabes nadar?","¿Quién de tu familia usa lentes?"],"model":{"kind":"dialogue","title":"Who Is It?","intro":"Sofi and Leo are playing a guessing game with Leo's class photo.","intro_es":"Sofi y Leo están jugando a adivinar con la foto del curso de Leo.","lines":[{"sp":"Sofi","t":"Leo, let's play a guessing game with your class photo!","es":"Leo, ¡juguemos a adivinar con la foto de tu curso!"},{"sp":"Leo","t":"OK! I'm the [[detective]]. [[Is it a boy or a girl]]?","es":"¡Bueno! Yo soy el detective. ¿Es un niño o una niña?"},{"sp":"Sofi","t":"A girl. [[She's got]] long, [[curly hair]].","es":"Una niña. Tiene el pelo largo y crespo."},{"sp":"Leo","t":"[[Has she got]] blue eyes?","es":"¿Tiene los ojos azules?"},{"sp":"Sofi","t":"No, she hasn't. She's got brown eyes and a big [[smile]].","es":"No. Tiene los ojos cafés y una gran sonrisa."},{"sp":"Leo","t":"[[Can she]] play football?","es":"¿Sabe jugar fútbol?"},{"sp":"Sofi","t":"Yes, she can. She can run very fast, too.","es":"Sí, sabe. Y también corre muy rápido."},{"sp":"Leo","t":"Hmm… Has she got [[glasses]]?","es":"Mmm… ¿Usa lentes?"},{"sp":"Sofi","t":"Yes, she has. Red glasses!","es":"Sí. ¡Lentes rojos!"},{"sp":"Leo","t":"It's Martina! I'm a great detective!","es":"¡Es Martina! ¡Soy un gran detective!"},{"sp":"Sofi","t":"Yes! Now it's my turn.","es":"¡Sí! Ahora me toca a mí."}],"questions":[{"q":"What has the girl got?","opts":["Short, straight hair","Long, curly hair","Blue eyes"],"a":1},{"q":"Can she play football?","opts":["Yes, she can","No, she can't","We don't know"],"a":0},{"q":"What colour are her glasses?","opts":["Blue","Brown","Red"],"a":2}]},"lang":[{"e":"curly hair","t":"VOC","d":"hair that is not straight but has lots of round shapes","x":"Kai has got long, curly hair.","s":"CURly HAIR","es":"pelo crespo"},{"e":"glasses","t":"VOC","d":"two pieces of glass that you wear to see better","x":"My grandma has got red glasses.","s":"GLASSes","es":"lentes"},{"e":"smile","t":"VOC","d":"the happy shape your mouth makes","x":"Benja has got a big smile.","s":"SMILE","es":"sonrisa"},{"e":"detective","t":"VOC","d":"a person who finds the answer to a mystery","x":"The detective asks a lot of questions.","s":"deTECtive","es":"detective"},{"e":"She's got…","t":"PHR","d":"you say this to describe a girl's hair, eyes or things","x":"She's got short, blond hair.","s":"she's GOT","es":"Ella tiene…"},{"e":"Has she got…?","t":"PHR","d":"a question to ask about how a girl or woman looks","x":"Has she got blue eyes?","s":"has she GOT","es":"¿Ella tiene…?"},{"e":"Can she…?","t":"PHR","d":"a question about what a girl or woman is able to do","x":"Can she play the guitar?","s":"CAN she","es":"¿Ella sabe…? / ¿Ella puede…?"},{"e":"Is it a boy or a girl?","t":"PHR","d":"a good first question in a guessing game","x":"Is it a boy or a girl? — A boy!","s":"is it a BOY or a GIRL","es":"¿Es un niño o una niña?"}],"pron":{"focus":"Short forms: she's got, he's got, I've got","explain":"We usually say the short forms: she's got, he's got, I've got. The strong words are the describing words: she's got LONG, CURly HAIR.","explain_es":"Normalmente usamos las formas cortas: she's got, he's got, I've got. Las palabras fuertes son las que describen: she's got LONG, CURly HAIR.","tip":"Say she's got quickly, like one word: shesgot.","tip_es":"Di she's got rápido, como si fuera una sola palabra: shesgot.","lines":[{"t":"She's got long, curly hair.","m":"she's got LONG | CURly HAIR↘."},{"t":"He's got a big smile.","m":"he's got‿a BIG SMILE↘."},{"t":"I've got brown eyes.","m":"I've got BROWN EYES↘."}]},"acts":[{"type":"guess","cat":"Secret person","items":["a man with a beard","a girl with curly hair","a boy with blond hair","a woman with red hair","a bald man","an old man with glasses","a tall girl","a baby with a big smile","a detective with a hat","a girl with blue eyes"],"frames":["Is it a man or a woman?","Has he got…? / Has she got…?","Is he tall? / Is she tall?","Is it…?"]},{"type":"picture","prompts":["How many kids are in the photo?","Who has got a hat? What colour is it?","Who has got long hair? Who has got short hair?","Are they friends? How do you know?","Choose one kid and describe him or her: He's got… / She's got…"]},{"type":"roulette","items":["What colour are your eyes?","Have you got long hair or short hair?","Has your mum got curly hair?","Who in your family has got a beard?","Can you swim?","Can your best friend dance?","Have you got a pet? What does it look like?","Can you play the guitar?","Who is very tall in your family?","What does your teacher look like?"]}],"rec":{"prompt":"Record yourself: describe a person in your family. Say what he or she looks like and what he or she can do.","prompt_es":"Grábate: describe a una persona de tu familia. Di cómo es físicamente y qué sabe hacer.","model":"This is my grandma, Ana. She's got short, grey hair and big brown eyes. She's got glasses and a lovely smile. She can cook very well, and she can play the piano. She can't ride a bike, but she can swim!","use":["She's got…","glasses","smile"]},"tips":[{"who":"teacher","t":"For the guessing game, use picture cards of people (not famous people). Students ask Is it a man or a woman? and Has he got…? and answer Yes, he has. or No, he hasn't.","es":"Para el juego de adivinanzas, usa tarjetas con dibujos o fotos de personas (no famosas). Los estudiantes preguntan Is it a man or a woman? y Has he got…? y responden Yes, he has. o No, he hasn't."},{"who":"student","t":"Remember: he and she go with has got, but I, you, we and they go with have got.","es":"Recuerda: he y she van con has got, pero I, you, we y they van con have got."}]},{"id":"rocket-1-teen","lv":"rocket","n":1,"age":"teen","title":"The Photo Detective","goals":["describe people's hair, eyes and looks with have got","talk about what you and your friends can and can't do","describe a person so that others can find them"],"goals_es":["describir el pelo, los ojos y el aspecto de las personas con have got","hablar de lo que tú y tus amigos pueden y no pueden hacer","describir a una persona para que otros la encuentren"],"warm":["What does your best friend look like?","What can you do really well?","Who in your family has got the same eyes as you?","Can you remember faces easily?"],"warm_es":["¿Cómo es físicamente tu mejor amigo o amiga?","¿Qué sabes hacer muy bien?","¿Quién de tu familia tiene los mismos ojos que tú?","¿Recuerdas las caras con facilidad?"],"model":{"kind":"dialogue","title":"Where's Isla?","intro":"Vale is meeting Sam's cousin Isla at the bus station, but she doesn't know what Isla looks like. She calls Sam.","intro_es":"Vale va a encontrarse con Isla, la prima de Sam, en el terminal de buses, pero no sabe cómo es. Entonces llama a Sam.","lines":[{"sp":"Vale","t":"Sam, I'm at the bus station. [[What does your cousin look like]]?","es":"Sam, estoy en el terminal de buses. ¿Cómo es tu prima?"},{"sp":"Sam","t":"Isla? She's tall, and [[she's got]] [[red hair]].","es":"¿Isla? Es alta y pelirroja."},{"sp":"Vale","t":"Long or short?","es":"¿Pelo largo o corto?"},{"sp":"Sam","t":"Short and curly. And she's got [[glasses]].","es":"Corto y crespo. Y usa lentes."},{"sp":"Vale","t":"Hmm, there are two girls with red hair here. [[Has she got]] a guitar?","es":"Mmm, aquí hay dos chicas pelirrojas. ¿Tiene una guitarra?"},{"sp":"Sam","t":"Yes, she has! She can [[play the guitar]] really well.","es":"¡Sí! Toca la guitarra muy bien."},{"sp":"Vale","t":"OK, I can see her! She's got a big [[smile]].","es":"¡Ok, ya la veo! Tiene una sonrisa enorme."},{"sp":"Sam","t":"That's Isla. Say hi from me!","es":"Esa es Isla. ¡Salúdala de mi parte!"},{"sp":"Vale","t":"Hi! Are you Isla? I'm Vale, Sam's friend.","es":"¡Hola! ¿Eres Isla? Soy Vale, la amiga de Sam."},{"sp":"Isla","t":"Hi, Vale! Nice to meet you. You're a great [[detective]]!","es":"¡Hola, Vale! Mucho gusto. ¡Eres una gran detective!"}],"questions":[{"q":"Where is Vale?","opts":["At school","At the bus station","At a concert"],"a":1},{"q":"What has Isla got?","opts":["Short, curly red hair","Long, blond hair","Short, black hair"],"a":0},{"q":"What can Isla do really well?","opts":["Sing","Draw","Play the guitar"],"a":2}]},"lang":[{"e":"red hair","t":"VOC","d":"hair with an orange-red colour","x":"Isla has got short, red hair.","s":"RED HAIR","es":"pelo rojo / pelirrojo"},{"e":"glasses","t":"VOC","d":"two pieces of glass in a frame that help you see","x":"I can't read without my glasses.","s":"GLASSes","es":"lentes"},{"e":"smile","t":"VOC","d":"the happy shape of your mouth","x":"Jose has got a really friendly smile.","s":"SMILE","es":"sonrisa"},{"e":"detective","t":"VOC","d":"a person who looks for clues to find answers","x":"In the film, the detective finds the missing phone.","s":"deTECtive","es":"detective"},{"e":"What does she look like?","t":"PHR","d":"a question about how a person looks","x":"What does your sister look like? — She's tall and she's got dark hair.","s":"what does she LOOK like","es":"¿Cómo es (físicamente)?"},{"e":"She's got…","t":"PHR","d":"you use this to describe a girl's hair, eyes or things","x":"She's got green eyes and long, dark hair.","s":"she's GOT","es":"Ella tiene…"},{"e":"Has she got…?","t":"PHR","d":"a question to check something about a person's looks","x":"Has she got a backpack?","s":"has she GOT","es":"¿Ella tiene…?"},{"e":"play the guitar","t":"COL","d":"make music with a guitar","x":"Can you play the guitar?","s":"PLAY the giTAR","es":"tocar la guitarra"}],"pron":{"focus":"Short answers: Yes, she has. / No, he hasn't.","explain":"With have got questions, we answer with has or have, not got: Has she got glasses? — Yes, she has. Put the stress on the last word.","explain_es":"En las preguntas con have got, respondemos con has o have, sin got: Has she got glasses? — Yes, she has. El acento va en la última palabra.","tip":"Keep it short: Yes, she has. or No, he hasn't. Don't add got at the end!","tip_es":"Hazlo corto: Yes, she has. o No, he hasn't. ¡No agregues got al final!","lines":[{"t":"Has she got glasses?","m":"has‿she got GLASSes↗?"},{"t":"Yes, she has.","m":"YES↘ | she HAS↘."},{"t":"No, he hasn't.","m":"NO↘ | he HASn't↘."}]},"acts":[{"type":"findsomeone","items":[{"p":"has got curly hair","q":"Have you got curly hair?"},{"p":"can play a musical instrument","q":"Can you play a musical instrument?"},{"p":"has got the same eye colour as their mum or dad","q":"Have you got the same eye colour as your mum or dad?"},{"p":"can cook pasta","q":"Can you cook pasta?"},{"p":"has got a cousin in another country","q":"Have you got a cousin in another country?"},{"p":"can't swim","q":"Can you swim?"},{"p":"has got glasses","q":"Have you got glasses?"},{"p":"can skateboard","q":"Can you skateboard?"}],"follow":["Really? Tell me more!","Can you show me?"]},{"type":"roleplay","cards":[{"sit":"At the bus station: you are meeting a friend's cousin for the first time.","a":"Call your friend (B). Ask: What does your cousin look like? Has he got…? Is he tall or short? Then say: I can see him!","b":"Describe your cousin: He's tall. He's got short, blond hair and glasses. He's got a red backpack. He can play the guitar."},{"sit":"At the shopping centre: you can't find your little brother.","a":"Talk to the security guard (B). Say: My brother is eight. He's got… He hasn't got… Answer B's questions.","b":"You are the security guard. Ask: What does he look like? Has he got…? Is he tall or short? At the end, say: Is that him?"},{"sit":"A school talent show: you need a partner for your act.","a":"Ask B: Can you sing? Can you dance? Can you play an instrument? Say what you can and can't do.","b":"Answer with Yes, I can. or No, I can't. Then tell A about one special talent you've got."}]},{"type":"minute","items":["Describe your best friend.","Describe a person in your family.","Things you can do really well","Things you can't do yet","A character from your favourite film: what does he or she look like?","Your perfect superhero: what has he or she got, and what can he or she do?"],"sec":45}],"rec":{"prompt":"Record a voice message: a friend is meeting your cousin or best friend at the bus station. Describe him or her so your friend can find them.","prompt_es":"Graba un mensaje de voz: un amigo se va a encontrar con tu primo o tu mejor amigo en el terminal de buses. Descríbelo para que tu amigo lo pueda encontrar.","model":"Hi, it's Tomás! My cousin Pablo is meeting you at the station. He's tall, and he's got short, black hair and brown eyes. He hasn't got glasses, but he's got a big smile. He can play the guitar, so look for a guitar case! See you soon!","use":["She's got…","glasses","play the guitar"]},"tips":[{"who":"teacher","t":"Before the role-play, show the mission photo and ask the class to describe one person in it. Write useful chunks on the board: He's got… / She hasn't got… / He can…","es":"Antes del role-play, muestra la foto de la misión y pide al curso que describa a una persona. Escribe frases útiles en la pizarra: He's got… / She hasn't got… / He can…"},{"who":"student","t":"When you describe a person, go from top to bottom: hair, eyes, face, and then clothes or things.","es":"Cuando describas a una persona, ve de arriba hacia abajo: pelo, ojos, cara y después la ropa o las cosas que lleva."}]},{"id":"rocket-2-kid","lv":"rocket","n":2,"age":"kid","title":"Picnic Time!","goals":["ask if there is any food or drink at home","ask for food and drink politely","talk about your favourite snacks"],"goals_es":["preguntar si hay comida o bebida en casa","pedir comida y bebida de forma amable","hablar de tus snacks favoritos"],"warm":["What do you have for breakfast?","Do you like cheese sandwiches?","What is your favourite snack?","What is in your lunch box today?"],"warm_es":["¿Qué tomas de desayuno?","¿Te gustan los sándwiches de queso?","¿Cuál es tu snack favorito?","¿Qué hay en tu lonchera hoy?"],"model":{"kind":"dialogue","title":"A Picnic for the Park","intro":"Leo and Grandma Ana are in the kitchen. They want to make a picnic.","intro_es":"Leo y la abuela Ana están en la cocina. Quieren preparar un pícnic.","lines":[{"sp":"Grandma Ana","t":"Let's make a picnic for the park, Leo!","es":"¡Preparemos un pícnic para el parque, Leo!"},{"sp":"Leo","t":"Great! [[Is there any]] bread?","es":"¡Genial! ¿Hay pan?"},{"sp":"Grandma Ana","t":"Yes, there's some bread, and there's some [[cheese]].","es":"Sí, hay pan y hay queso."},{"sp":"Leo","t":"Yummy! Let's make cheese [[sandwiches]].","es":"¡Qué rico! Hagamos sándwiches de queso."},{"sp":"Grandma Ana","t":"Good idea. Is there any orange [[juice]]?","es":"Buena idea. ¿Hay jugo de naranja?"},{"sp":"Leo","t":"No, [[there isn't any]] juice. But there's some water.","es":"No, no hay jugo. Pero hay agua."},{"sp":"Grandma Ana","t":"OK. Are there any [[biscuits]]?","es":"Ok. ¿Hay galletas?"},{"sp":"Leo","t":"No, there aren't any. Oh no!","es":"No, no hay. ¡Oh, no!"},{"sp":"Grandma Ana","t":"No problem. Let's go to the shop.","es":"No hay problema. Vamos a la tienda."},{"sp":"Leo","t":"[[Can I have some]] biscuits and some orange juice, please?","es":"¿Me da galletas y jugo de naranja, por favor?"},{"sp":"Shop assistant","t":"Of course. [[Here you are]]!","es":"Claro. ¡Aquí tienes!"},{"sp":"Leo","t":"Thank you! Now, where's Pipo? He loves picnics!","es":"¡Gracias! Ahora, ¿dónde está Pipo? ¡Le encantan los pícnics!"}],"questions":[{"q":"What is there in the kitchen?","opts":["Juice and biscuits","Bread and cheese","Eggs and milk"],"a":1},{"q":"What drink is there at home?","opts":["Water","Orange juice","Milk"],"a":0},{"q":"What does Leo ask for at the shop?","opts":["Bread and cheese","Water and eggs","Biscuits and orange juice"],"a":2}]},"lang":[{"e":"sandwich","t":"VOC","d":"two pieces of bread with food in the middle","x":"I'd like a cheese sandwich, please.","s":"SANDwich","es":"sándwich"},{"e":"biscuit","t":"VOC","d":"a small, flat, sweet food from a box or a packet","x":"Can I have a chocolate biscuit?","s":"BIScuit","es":"galleta"},{"e":"juice","t":"VOC","d":"a drink made from fruit","x":"Orange juice is my favourite drink.","s":"JUICE","es":"jugo"},{"e":"cheese","t":"VOC","d":"a yellow or white food made from milk","x":"There's some cheese in the fridge.","s":"CHEESE","es":"queso"},{"e":"Is there any…?","t":"PHR","d":"a question to find out if we have something, like milk or bread","x":"Is there any milk for my cereal?","s":"is there ANy","es":"¿Hay…?"},{"e":"there isn't any…","t":"PHR","d":"you say this when you have none of something","x":"There isn't any bread. Let's go to the shop!","s":"there ISn't any","es":"no hay…"},{"e":"Can I have some…, please?","t":"PHR","d":"a polite way to ask for food or drink","x":"Can I have some water, please?","s":"can I HAVE some … PLEASE","es":"¿Me das…, por favor?"},{"e":"Here you are!","t":"PHR","d":"you say this when you give something to a person","x":"Can I have the juice, please? — Here you are!","s":"HERE you ARE","es":"¡Aquí tienes!"}],"pron":{"focus":"Soft some and any, strong food words","explain":"Some and any are quick and soft. The food word is strong and loud: some WAter, any JUICE. In yes/no questions, your voice goes up at the end ↗.","explain_es":"Some y any se dicen rápido y suave. La palabra de la comida es fuerte: some WAter, any JUICE. En las preguntas de sí o no, la voz sube al final ↗.","tip":"Say the food word louder, like you are very, very hungry!","tip_es":"Di la palabra de la comida más fuerte, ¡como si tuvieras muchísima hambre!","lines":[{"t":"Is there any juice?","m":"is there‿any JUICE↗?"},{"t":"There isn't any bread.","m":"there ISn't‿any BREAD↘."},{"t":"Can I have some water, please?","m":"can I HAVE some WAter | PLEASE↗?"}]},"acts":[{"type":"guess","cat":"Food and drink","items":["bread","cheese","milk","juice","egg","sandwich","biscuit","rice","chips","salad","honey","water"],"frames":["Is it a drink or a food?","Is it sweet?","Is it white?","Do you eat it for breakfast?"]},{"type":"picture","prompts":["What is there in the fridge? Say: There is some… / There are some…","Is there any juice? What colour is it?","Are there any eggs? Is there any cheese?","What fruit can you see? What is your favourite fruit?","What is there in your fridge at home?"]},{"type":"roleplay","cards":[{"sit":"At the school snack shop","a":"You are hungry and thirsty. Ask for two things: Can I have some…, please? Then say: Thank you!","b":"You work at the snack shop. There are some sandwiches and some biscuits, and there's some juice, but there aren't any chips. Say: Here you are! or Sorry, there aren't any…"},{"sit":"Making a picnic at home","a":"You want a picnic. Ask your partner about three things: Is there any…? / Are there any…?","b":"You are at home. There is some bread, some cheese and some water. There isn't any juice and there aren't any biscuits. Answer your partner."},{"sit":"Breakfast at Grandma's house","a":"You are the grandma or grandpa. Ask: What would you like for breakfast? Say: There's some bread and some honey.","b":"You are the grandchild. Say: I'd like some…, please. Then ask: Is there any milk?"}]}],"rec":{"prompt":"Record yourself: say what there is in your fridge at home and ask for your favourite snack politely.","prompt_es":"Grábate: di qué hay en el refrigerador de os verbos con he, she e it terminan en -s, y esta tiene tres sonidos: s en gets, z en plays, y una sílaba extra, iz, en watches y catches. ¡La gente nota cuando la olvidas!","tip":"Record yourself and listen: can you hear the -s at the end of each verb?","tip_es":"Grábate y escucha: ¿se oye la -s al final de cada verbo?","lines":[{"t":"She gets up at six.","m":"she GETS‿up at SIX↘."},{"t":"He watches videos at night.","m":"he WATCHes VIdeos at NIGHT↘."},{"t":"Does he catch the bus?","m":"does he CATCH the BUS↗?"}]},"acts":[{"type":"findsomeone","items":[{"p":"wakes up before half past six","q":"Do you wake up before half past six?"},{"p":"doesn't have breakfast on school days","q":"Do you have breakfast on school days?"},{"p":"catches the bus to school","q":"Do you catch the bus to school?"},{"p":"tidies their room every week","q":"Do you tidy your room every week?"},{"p":"practises a musical instrument","q":"Do you practise a musical instrument?"},{"p":"does sport after school","q":"Do you do sport after school?"},{"p":"checks their phone in bed","q":"Do you check your phone in bed?"},{"p":"goes to bed after eleven","q":"Do you go to bed after eleven?"}],"follow":["What time?","How often?","Do you like it?"]},{"type":"agree","items":["School starts too early in Chile.","Breakfast is the most important meal of the day.","Teenagers don't sleep enough.","Phones in bed are a bad idea.","Tidying your room every day is a waste of time.","Weekends are too short.","Everybody in the family helps at home."]},{"type":"minute","sec":45,"items":["My morning routine: I wake up at… Then I…","What I do after school","My favourite day of the week and why","A job I hate doing at home","My perfect Saturday: I get up at… I…","A day in the life of my pet or my favourite animal","How my weekend is different from my school days"]}],"rec":{"prompt":"Record a short day-in-my-life video: talk about your routine on a school day.","prompt_es":"Graba un video corto de un día en mi vida: habla de tu rutina en un día de colegio.","model":"Hi, everyone! On school days, I wake up at half past six. I'm not a morning person, so I hate getting up early. I have breakfast and I catch the bus at quarter past seven. After school, I do my homework and I practise the guitar. I usually go to bed at eleven.","use":["I'm not a morning person.","catch the bus","after school"]},"tips":[{"who":"teacher","t":"Before Agree or Disagree, write the frames I agree because… and I don't agree because… on the board. After Find Someone Who, students report to the class: Two people catch the bus. Nobody goes to bed before ten.","es":"Antes de Agree or Disagree, escribe en la pizarra los modelos I agree because… y I don't agree because… Después de Find Someone Who, los estudiantes informan al curso: Two people catch the bus. Nobody goes to bed before ten."},{"who":"student","t":"When you talk about a classmate, use -s and doesn't: Tomás gets up at seven. He doesn't have breakfast.","es":"Cuando hables de un compañero, usa -s y doesn't: Tomás gets up at seven. He doesn't have breakfast."}]},{"id":"rocket-4-kid","lv":"rocket","n":4,"age":"kid","title":"Art Class Fun","goals":["say what people are doing now","talk about your favourite school subjects","ask for things politely in class"],"goals_es":["decir qué están haciendo las personas ahora","hablar de tus asignaturas favoritas","pedir cosas de forma amable en clases"],"warm":["What is your favourite subject?","What day do you have art?","What is your teacher doing now?","Do you like exams?"],"warm_es":["¿Cuál es tu asignatura favorita?","¿Qué día tienes artes?","¿Qué está haciendo tu profesor o profesora ahora?","¿Te gustan las pruebas?"],"model":{"kind":"dialogue","title":"In the Art Room","intro":"It's Monday morning, and Ms Rojas has a surprise for the class.","intro_es":"Es lunes en la mañana y la profesora Rojas tiene una sorpresa para el curso.","lines":[{"sp":"Ms Rojas","t":"Good morning! Today we aren't having [[maths]]. We're having [[art]]!","es":"¡Buenos días! Hoy no tenemos matemáticas. ¡Tenemos artes!"},{"sp":"Benja","t":"Yay! I love art!","es":"¡Bien! ¡Me encantan las artes!"},{"sp":"Ms Rojas","t":"Leo, [[what are you doing]]?","es":"Leo, ¿qué estás haciendo?"},{"sp":"Leo","t":"I'm painting a picture of Pipo, our dog. [[Can I borrow]] your big [[paintbrush]], please?","es":"Estoy pintando a Pipo, nuestro perro. ¿Me presta su pincel grande, por favor?"},{"sp":"Ms Rojas","t":"Sure, here you are. Martina, are you painting, too?","es":"Claro, aquí tienes. Martina, ¿tú también estás pintando?"},{"sp":"Martina","t":"No, I'm not. I'm drawing a horse.","es":"No. Estoy dibujando un caballo."},{"sp":"Ms Rojas","t":"Lovely! And Benja? Is he working?","es":"¡Qué lindo! ¿Y Benja? ¿Está trabajando?"},{"sp":"Martina","t":"No, he isn't. He's [[looking out of the window]]!","es":"No. ¡Está mirando por la ventana!"},{"sp":"Ms Rojas","t":"Benja, [[could you]] come back to your desk, please?","es":"Benja, ¿podrías volver a tu puesto, por favor?"},{"sp":"Benja","t":"Sorry! The big kids are doing a [[science]] experiment outside. It's very cool!","es":"¡Perdón! Los niños grandes están haciendo un experimento de ciencias afuera. ¡Es genial!"}],"questions":[{"q":"What subject are they having today?","opts":["Maths","Art","Science"],"a":1},{"q":"What is Leo painting?","opts":["His dog, Pipo","A horse","A football"],"a":0},{"q":"Why is Benja looking out of the window?","opts":["It's raining","He's tired","The big kids are doing a science experiment"],"a":2}]},"lang":[{"e":"art","t":"VOC","d":"the school subject where you paint and draw","x":"We have art on Wednesdays.","s":"ART","es":"artes"},{"e":"maths","t":"VOC","d":"the school subject with numbers, like 2 + 2 = 4","x":"I'm good at maths.","s":"MATHS","es":"matemáticas"},{"e":"science","t":"VOC","d":"the subject where you learn about plants, animals and the world","x":"We use a microscope in science.","s":"SCIence","es":"ciencias"},{"e":"paintbrush","t":"VOC","d":"a small stick with soft hair at the end, for painting","x":"Can I use your paintbrush?","s":"PAINTbrush","es":"pincel"},{"e":"What are you doing?","t":"PHR","d":"a question about someone's action at this moment","x":"What are you doing? — I'm reading.","s":"WHAT are you DOing","es":"¿Qué estás haciendo?"},{"e":"Can I borrow your…?","t":"PHR","d":"a polite question when you want to use someone's thing for a short time","x":"Can I borrow your ruler, please?","s":"can I BORrow your","es":"¿Me prestas tu…?"},{"e":"Could you…, please?","t":"PHR","d":"a very polite way to ask someone to do something","x":"Could you open the window, please?","s":"COULD you … PLEASE","es":"¿Podrías…, por favor?"},{"e":"look out of the window","t":"COL","d":"look at things outside when you are inside a room","x":"Benja is looking out of the window again!","s":"LOOK out of the WINdow","es":"mirar por la ventana"}],"pron":{"focus":"Short forms: I'm, he's, we're","explain":"When we speak, we join the words: I am → I'm, he is → he's, we are → we're. It's shorter and it sounds natural. The -ing verb is the strong word.","explain_es":"Cuando hablamos, unimos las palabras: I am → I'm, he is → he's, we are → we're. Es más corto y suena natural. El verbo con -ing es la palabra fuerte.","tip":"Point to a friend and say what they are doing: He's writing! She's reading!","tip_es":"Apunta a un compañero y di qué está haciendo: He's writing! She's reading!","lines":[{"t":"I'm painting a picture.","m":"I'm PAINTing‿a PICture↘."},{"t":"What are you doing?","m":"WHAT‿are you DOing↘?"},{"t":"Are you listening?","m":"are you LIStening↗?"}]},"acts":[{"type":"guess","cat":"Mime it! What am I doing?","items":["painting","drawing","reading","writing","singing","playing the guitar","using a microscope","doing maths","sleeping","eating a sandwich","listening to music","playing football"],"frames":["Are you painting?","Are you doing maths?","Is it in art or in music?","Yes, I am. / No, I'm not."]},{"type":"picture","prompts":["What are the pupils doing? Are they raising their hands?","What colours can you see in the classroom?","What subject are they having, do you think?","What is the teacher doing, do you think?","Do you raise your hand in class? When?"]},{"type":"ranking","task":"Put these school subjects in order, from your favourite to your least favourite. Then tell a partner: My number one is… because…","items":["maths","science","art","music","PE","computing","English"]}],"rec":{"prompt":"Record yourself: say your favourite school subject and what your family is doing right now.","prompt_es":"Grábate: di cuál es tu asignatura favorita y qué está haciendo tu familia en este momento.","model":"My favourite subject is art. I love painting! I don't like maths very much. Right now, I'm sitting in my bedroom. My sister is reading a book and my dad is cooking dinner. Our dog isn't sleeping. He's playing with a ball!","use":["art","maths"]},"tips":[{"who":"teacher","t":"For the mime game, a student mimes a school action and the class asks Are you painting? The student answers Yes, I am or No, I'm not. The first student to guess mimes next.","es":"Para el juego de mímica, un estudiante hace la mímica de una acción del colegio y el curso pregunta Are you painting? El estudiante responde Yes, I am o No, I'm not. El primero que adivina hace la siguiente mímica."},{"who":"student","t":"For now, use am, is or are + -ing: I'm reading. For every day, use the normal verb: I read every day.","es":"Para ahora, usa am, is o are + -ing: I'm reading. Para todos los días, usa el verbo normal: I read every day."}]},{"id":"rocket-4-teen","lv":"rocket","n":4,"age":"teen","title":"Project Day","goals":["describe what people are doing right now","talk about school subjects you like and don't like","ask classmates for help and to borrow things politely"],"goals_es":["describir qué están haciendo las personas en este momento","hablar de las asignaturas que te gustan y no te gustan","pedir ayuda y cosas prestadas a tus compañeros de forma amable"],"warm":["What's your favourite subject this year?","Which subject is the most difficult for you?","What are your friends doing right now, do you think?","Do you study with music?"],"warm_es":["¿Cuál es tu asignatura favorita este año?","¿Qué asignatura es la más difícil para ti?","¿Qué crees que están haciendo tus amigos en este momento?","¿Estudias con música?"],"model":{"kind":"dialogue","title":"Where Are You, Tomás?","intro":"Vale and Jose are in the library for their history project. Tomás isn't there, so Vale phones him.","intro_es":"Vale y Jose están en la biblioteca para su trabajo de historia. Tomás no está, así que Vale lo llama.","lines":[{"sp":"Vale","t":"Hi, Tomás! [[What are you doing]]? We're in the library.","es":"¡Hola, Tomás! ¿Qué estás haciendo? Estamos en la biblioteca."},{"sp":"Tomás","t":"Oh no! I'm at home. I'm [[studying for]] my maths [[exam]].","es":"¡Oh, no! Estoy en mi casa. Estoy estudiando para mi prueba de matemáticas."},{"sp":"Vale","t":"We need to finish our [[history]] project today! Jose is writing the text now.","es":"¡Tenemos que terminar nuestro trabajo de historia hoy! Jose está escribiendo el texto ahora."},{"sp":"Tomás","t":"Sorry! Is Sam taking the photos?","es":"¡Perdón! ¿Sam está sacando las fotos?"},{"sp":"Vale","t":"No, he isn't. He's at football practice. [[Could you]] come now, please?","es":"No. Está en el entrenamiento de fútbol. ¿Podrías venir ahora, por favor?"},{"sp":"Tomás","t":"Sure. [[Can I borrow]] your history notes later?","es":"Claro. ¿Me prestas tus apuntes de historia después?"},{"sp":"Vale","t":"Of course. Bring your laptop, too. We're making a presentation.","es":"Por supuesto. Trae tu computador portátil también. Estamos haciendo una presentación."},{"sp":"Tomás","t":"No problem. I'm [[good at]] [[computing]], so I can help with the slides.","es":"No hay problema. Soy bueno en computación, así que puedo ayudar con las diapositivas."},{"sp":"Vale","t":"Great! See you in ten minutes.","es":"¡Genial! Nos vemos en diez minutos."},{"sp":"Tomás","t":"See you! I'm leaving now.","es":"¡Nos vemos! Ya salgo."}],"questions":[{"q":"Where are Vale and Jose?","opts":["In the library","At the skate park","At home"],"a":0},{"q":"What is Tomás doing?","opts":["He's playing football","He's studying for a maths exam","He's taking photos"],"a":1},{"q":"Why isn't Sam in the library?","opts":["He's at home","He's in the computer room","He's at football practice"],"a":2}]},"lang":[{"e":"exam","t":"VOC","d":"an important test at school","x":"I'm studying for my science exam.","s":"exAM","es":"prueba, examen"},{"e":"history","t":"VOC","d":"the subject about people and events in the past","x":"In history, we're learning about the Incas.","s":"HIStory","es":"historia"},{"e":"computing","t":"VOC","d":"the subject where you learn to use and program computers","x":"Jose loves computing and coding.","s":"comPUting","es":"computación"},{"e":"What are you doing?","t":"PHR","d":"a question about an action that is happening at this moment","x":"What are you doing? — I'm making a video.","s":"WHAT are you DOing","es":"¿Qué estás haciendo?"},{"e":"Could you…, please?","t":"PHR","d":"a polite way to ask someone to do something for you","x":"Could you send me the photos, please?","s":"COULD you … PLEASE","es":"¿Podrías…, por favor?"},{"e":"Can I borrow your…?","t":"PHR","d":"a polite question to use someone's thing and give it back later","x":"Can I borrow your charger? My phone is dead.","s":"can I BORrow your","es":"¿Me prestas tu…?"},{"e":"study for an exam","t":"COL","d":"read and learn things because you have a test soon","x":"Sam is studying for his English exam.","s":"STUdy for an exAM","es":"estudiar para una prueba"},{"e":"be good at","t":"PREP","d":"can do something very well","x":"Vale is good at art and music.","s":"be GOOD at","es":"ser bueno/a en"}],"pron":{"focus":"Weak are and question intonation","explain":"In fast speech, are is weak and short: What are you doing? sounds like what-er-you DOing. The -ing verb is strong. Wh- questions go down ↘ at the end, and yes/no questions go up ↗.","explain_es":"Al hablar rápido, are es débil y corto: What are you doing? suena como what-er-you DOing. El verbo con -ing es fuerte. Las preguntas con Wh- bajan ↘ al final y las preguntas de sí o no suben ↗.","tip":"Practise with a friend: one person mimes and the other asks Are you…ing? as fast as possible.","tip_es":"Practica con un amigo: uno hace la mímica y el otro pregunta Are you…ing? lo más rápido posible.","lines":[{"t":"What are you doing?","m":"WHAT‿are you DOing↘?"},{"t":"We're working on a project.","m":"we're WORKing‿on a PROject↘."},{"t":"Are you studying for the exam?","m":"are you STUdying for the exAM↗?"}]},"acts":[{"type":"guess","cat":"School subjects","items":["maths","science","art","music","history","geography","computing","English","PE","Spanish"],"frames":["Do you use a computer in this subject?","Is it about numbers?","Do you study it in the lab?","Is it…?"]},{"type":"roleplay","cards":[{"sit":"Group project in the library","a":"You are working on a project and your partner is late. Phone them and ask: What are you doing? Then ask them to come: Could you…, please?","b":"You are at home. Choose what you are doing now: watching TV, cooking or studying. Say sorry and explain: I'm…ing. Then ask: Can I borrow your…?"},{"sit":"Before a maths exam","a":"You haven't got a pen, a ruler or a calculator. Ask your partner: Can I borrow your…, please?","b":"You have a pen and a ruler, but you are using your calculator. Answer: Sure, here you are. / Sorry, I'm using it."},{"sit":"A video call after school","a":"Call your friend. Ask: What are you doing? Is your brother or sister at home? What is he or she doing?","b":"You are at home with your family. Say what everybody is doing right now: My mum is… My brother is…"}]},{"type":"picture","prompts":["What are the pupils doing in the picture?","What subject are they having, do you think? Why?","Why are they raising their hands? What is the teacher asking, do you think?","Is this classroom like your classroom? What's different?","Do you raise your hand a lot in class? In which subject?"]}],"rec":{"prompt":"Record a voice message to a friend: say where you are, what you are doing now and what your family is doing.","prompt_es":"Graba un mensaje de voz para un amigo: di dónde estás, qué estás haciendo ahora y qué está haciendo tu familia.","model":"Hi, Vale! I'm at home now. I'm studying for my history exam, but it's very boring! My mum is working on her laptop and my brother is playing video games. Could you send me your notes, please? I'm good at maths, so I can help you tomorrow!","use":["study for an exam","Could you…, please?","be good at"]},"tips":[{"who":"teacher","t":"Show the classroom photo for one minute, then hide it. In pairs, students say what the pupils are doing from memory. Then show it again and check together.","es":"Muestra la foto de la sala de clases por un minuto y luego escóndela. En parejas, los estudiantes dicen de memoria qué están haciendo los alumnos. Después muéstrala otra vez y revisen juntos."},{"who":"student","t":"Use the present continuous for now (I'm studying) and the present simple for routines (I study on Mondays). Listen for words like now and every day.","es":"Usa el presente continuo para ahora (I'm studying) y el presente simple para las rutinas (I study on Mondays). Fíjate en palabras como now y every day."}]},{"id":"rocket-5-kid","lv":"rocket","n":5,"age":"kid","title":"Our Family Band","goals":["talk about musical instruments you like","compare instruments with louder, easier and the best","suggest ideas with Let's…, Why don't we…? and How about…?"],"goals_es":["hablar de los instrumentos musicales que te gustan","comparar instrumentos con louder, easier y the best","proponer ideas con Let's…, Why don't we…? y How about…?"],"warm":["Can you play an instrument?","Who is the best singer in your family?","Do you like loud music or quiet music?"],"warm_es":["¿Sabes tocar algún instrumento?","¿Quién canta mejor en tu familia?","¿Te gusta la música fuerte o la música suave?"],"model":{"kind":"dialogue","title":"Let's Start a Band!","intro":"Leo and his cousin Kai are in Leo's bedroom after school.","intro_es":"Leo y su prima Kai están en el cuarto de Leo después del colegio.","lines":[{"sp":"Leo","t":"There's a concert at school next month. [[Why don't we]] [[start a band]]?","es":"Hay un concierto en el colegio el próximo mes. ¿Por qué no formamos una banda?"},{"sp":"Kai","t":"Great idea! I can play the [[guitar]].","es":"¡Buena idea! Yo sé tocar la guitarra."},{"sp":"Leo","t":"And I can play the [[drums]]!","es":"¡Y yo sé tocar la batería!"},{"sp":"Kai","t":"Hmm. The drums are [[louder]] than the guitar. Don't be too loud, OK?","es":"Mmm. La batería suena más fuerte que la guitarra. No hagas demasiado ruido, ¿ok?"},{"sp":"Leo","t":"OK, OK! But we need a singer. Who can sing?","es":"¡Ok, ok! Pero necesitamos a alguien que cante. ¿Quién sabe cantar?"},{"sp":"Kai","t":"[[How about]] asking Sofi? She sings better than me.","es":"¿Qué tal si le preguntamos a Sofi? Ella canta mejor que yo."},{"sp":"Leo","t":"Yes! She's [[the best]] singer in our family.","es":"¡Sí! Es la mejor cantante de nuestra familia."},{"sp":"Kai","t":"And Benja? Can he play an instrument?","es":"¿Y Benja? ¿Sabe tocar algún instrumento?"},{"sp":"Leo","t":"Yes, he can play the piano. He practises every day.","es":"Sí, sabe tocar el piano. Practica todos los días."},{"sp":"Kai","t":"Perfect! [[Let's]] practise on Saturday!","es":"¡Perfecto! ¡Vamos a practicar el sábado!"}],"questions":[{"q":"What instrument can Kai play?","opts":["The drums","The guitar","The piano"],"a":1},{"q":"Who is the best singer in the family?","opts":["Sofi","Kai","Leo"],"a":0},{"q":"When do they want to practise?","opts":["On Friday","On Sunday","On Saturday"],"a":2}]},"lang":[{"e":"guitar","t":"VOC","d":"an instrument with six strings","x":"Kai plays the guitar in our band.","s":"guiTAR","es":"guitarra"},{"e":"drums","t":"VOC","d":"an instrument you hit with two sticks","x":"Leo plays the drums every Saturday.","s":"DRUMS","es":"batería"},{"e":"loud","t":"VOC","d":"making a lot of noise","x":"The drums are louder than the piano.","s":"LOUD","es":"fuerte, ruidoso"},{"e":"start a band","t":"COL","d":"make a new music group with friends","x":"My cousins want to start a band.","s":"START a BAND","es":"formar una banda"},{"e":"the best…","t":"PHR","d":"better than all the others","x":"Sofi is the best singer in our family.","s":"the BEST","es":"el mejor… / la mejor…"},{"e":"Why don't we…?","t":"PHR","d":"a friendly question to give an idea","x":"Why don't we play at the concert?","s":"WHY DON'T we","es":"¿Por qué no…?"},{"e":"How about…?","t":"PHR","d":"a question to suggest something, with a verb + -ing","x":"How about asking Sofi?","s":"how aBOUT","es":"¿Qué tal si…?"},{"e":"Let's…","t":"PHR","d":"we say this to do something together","x":"Let's practise on Saturday!","s":"LET'S","es":"¡Vamos a…!"}],"pron":{"focus":"Strong words in comparisons","explain":"Say the important words strong and long: LOUDer, BETter, EAsiest. Small words like than, the and is are quick and soft.","explain_es":"Di las palabras importantes fuerte y largo: LOUDer, BETter, EAsiest. Las palabras pequeñas como than, the e is son rápidas y suaves.","tip":"Say than very fast and soft, almost like thn.","tip_es":"Di than muy rápido y suave, casi como thn.","lines":[{"t":"The drums are louder than the guitar.","m":"the DRUMS are LOUDer than the guiTAR↘."},{"t":"Sofi sings better than me.","m":"SOfi SINGS BETter than ME↘."},{"t":"Which instrument is the easiest?","m":"WHICH INstrument is the EAsiest↘?"}]},"acts":[{"type":"findsomeone","items":[{"p":"can play an instrument","q":"Can you play an instrument?"},{"p":"has got headphones","q":"Have you got headphones?"},{"p":"sings in the shower","q":"Do you sing in the shower?"},{"p":"likes rock music","q":"Do you like rock music?"},{"p":"thinks the drums are the best instrument","q":"Do you think the drums are the best instrument?"},{"p":"has got a piano at home","q":"Have you got a piano at home?"},{"p":"likes quiet music","q":"Do you like quiet music?"},{"p":"sings better than their mum or dad","q":"Do you sing better than your mum or dad?"}],"follow":["What instrument?","Who is the best singer in your family?","What's your favourite song?"]},{"type":"picture","prompts":["What instruments can you see in the photo?","Which instrument is louder: the guitar or the drums?","Are the kids happy? How do you know?","Which instrument is the easiest to play, do you think?","Would you like to play in a band? What instrument?"]},{"type":"wyr","items":[["play the drums","play the violin"],["sing in a band","dance in a band"],["listen to loud music","listen to quiet music"],["play the piano","play the guitar"],["sing with a microphone","sing in the shower"],["play at a school concert","play at a birthday party"]]}],"rec":{"prompt":"Record yourself: talk about your dream band. Who is in it? What instruments do they play? Who is the best?","prompt_es":"Grábate: habla de tu banda soñada. ¿Quiénes están en ella? ¿Qué instrumentos tocan? ¿Quién es el mejor?","model":"There are four people in my dream band. My cousin plays the guitar. My best friend plays the drums. The drums are louder than the guitar! I'm the singer. My sister plays the piano. She's the best musician in the band. Let's start a band!","use":["the best…","Let's…","start a band"]},"tips":[{"who":"teacher","t":"Before the dialogue, play short sounds of instruments (or mime them) and ask: Which is louder? Which is quieter? Students answer with louder than or quieter than.","es":"Antes del diálogo, pon sonidos cortos de instrumentos (o haz la mímica) y pregunta: Which is louder? Which is quieter? Los estudiantes responden con louder than o quieter than."},{"who":"student","t":"When you give an idea, use Why don't we…? or How about…? It sounds friendly!","es":"Cuando des una idea, usa Why don't we…? o How about…? ¡Suena amable!"}]},{"id":"rocket-5-teen","lv":"rocket","n":5,"age":"teen","title":"Talent Show Plans","goals":["talk about your music taste and instruments","compare singers, songs and instruments","make suggestions to plan a band"],"goals_es":["hablar de tus gustos musicales y de instrumentos","comparar cantantes, canciones e instrumentos","hacer sugerencias para organizar una banda"],"warm":["What music do you listen to on your phone?","Who is the best singer in the world, in your opinion?","Is it easier to play the guitar or the piano?","Do you listen to music with headphones?"],"warm_es":["¿Qué música escuchas en tu celular?","En tu opinión, ¿quién es el mejor cantante del mundo?","¿Es más fácil tocar la guitarra o el piano?","¿Escuchas música con audífonos?"],"model":{"kind":"dialogue","title":"We Need a Drummer!","intro":"Vale and Sam are in the school music room at lunchtime.","intro_es":"Vale y Sam están en la sala de música del colegio a la hora de almuerzo.","lines":[{"sp":"Vale","t":"The talent show is next month. [[Why don't we]] [[start a band]]?","es":"El show de talentos es el próximo mes. ¿Por qué no formamos una banda?"},{"sp":"Sam","t":"Cool! I can play the [[guitar]], but I'm not a good singer.","es":"¡Genial! Sé tocar la guitarra, pero no soy buen cantante."},{"sp":"Vale","t":"No problem. I can sing. And Tomás plays the [[drums]].","es":"No hay problema. Yo puedo cantar. Y Tomás toca la batería."},{"sp":"Sam","t":"Tomás? He's [[the loudest]] drummer in the school!","es":"¿Tomás? ¡Es el baterista más ruidoso del colegio!"},{"sp":"Vale","t":"That's true! But he's [[better than]] everyone else.","es":"¡Es verdad! Pero es mejor que todos los demás."},{"sp":"Sam","t":"OK. What song can we play?","es":"Ok. ¿Qué canción podemos tocar?"},{"sp":"Vale","t":"[[How about]] playing a [[rock]] song? Rock is more fun than pop.","es":"¿Qué tal si tocamos una canción de rock? El rock es más divertido que el pop."},{"sp":"Sam","t":"Hmm, pop songs are easier. And people know them.","es":"Mmm, las canciones pop son más fáciles. Y la gente las conoce."},{"sp":"Vale","t":"OK, let's play one rock song and one pop song.","es":"Ok, toquemos una canción de rock y una de pop."},{"sp":"Sam","t":"Perfect! And Jose can record us on her phone.","es":"¡Perfecto! Y Jose nos puede grabar con su celular."},{"sp":"Vale","t":"Great idea! Let's practise in Tomás's garage on Saturday.","es":"¡Buena idea! Ensayemos en el garaje de Tomás el sábado."}],"questions":[{"q":"What instrument does Sam play?","opts":["The drums","The guitar","The piano"],"a":1},{"q":"Why does Sam want to play pop songs?","opts":["They are easier","They are louder","They are longer"],"a":0},{"q":"Where do they want to practise?","opts":["In the music room","At Jose's house","In Tomás's garage"],"a":2}]},"lang":[{"e":"start a band","t":"COL","d":"make a new music group with friends","x":"My friends and I want to start a band.","s":"START a BAND","es":"formar una banda"},{"e":"guitar","t":"VOC","d":"an instrument with six strings","x":"Sam plays the guitar in the band.","s":"guiTAR","es":"guitarra"},{"e":"drums","t":"VOC","d":"an instrument you hit with two sticks","x":"Tomás plays the drums in his garage.","s":"DRUMS","es":"batería"},{"e":"rock","t":"VOC","d":"a type of loud music with electric guitars and drums","x":"Vale listens to rock music every day.","s":"ROCK","es":"rock"},{"e":"the loudest…","t":"PHR","d":"louder than all the others","x":"Tomás is the loudest drummer in the school.","s":"the LOUDest","es":"el más ruidoso… / la más ruidosa…"},{"e":"better than…","t":"PHR","d":"we use it to say one person or thing is good, and the other is not as good","x":"Tomás plays the drums better than me.","s":"BETter than","es":"mejor que…"},{"e":"How about…?","t":"PHR","d":"a question to suggest something, with a verb + -ing","x":"How about playing a rock song?","s":"how aBOUT","es":"¿Qué tal si…?"},{"e":"Why don't we…?","t":"PHR","d":"a friendly question to give an idea to a group","x":"Why don't we practise on Saturday?","s":"WHY DON'T we","es":"¿Por qué no…?"}],"pron":{"focus":"Friendly suggestions: linking and falling voice","explain":"In suggestions, we join small words together (start‿a, playing‿a) and the voice goes down at the end ↘. This makes the idea sound friendly and confident.","explain_es":"En las sugerencias, unimos las palabras pequeñas (start‿a, playing‿a) y la voz baja al final ↘. Así la idea suena amable y segura.","tip":"Say each suggestion with a smile. Happy ideas sound better!","tip_es":"Di cada sugerencia sonriendo. ¡Las ideas alegres suenan mejor!","lines":[{"t":"Why don't we start a band?","m":"WHY don't we START‿a BAND↘?"},{"t":"How about playing a rock song?","m":"how‿aBOUT PLAYing‿a ROCK song↘?"},{"t":"Let's practise on Saturday!","m":"LET'S PRACtise‿on SATurday↘!"}]},"acts":[{"type":"findsomeone","items":[{"p":"can play the guitar","q":"Can you play the guitar?"},{"p":"listens to music every day","q":"Do you listen to music every day?"},{"p":"thinks rock is better than pop","q":"Do you think rock is better than pop?"},{"p":"has got big headphones","q":"Have you got big headphones?"},{"p":"plays in a school band","q":"Do you play in a school band?"},{"p":"knows all the words of a song in English","q":"Do you know all the words of a song in English?"},{"p":"thinks the piano is easier than the violin","q":"Do you think the piano is easier than the violin?"},{"p":"makes music on a phone or laptop","q":"Do you make music on your phone or laptop?"}],"follow":["Which one is your favourite?","Who is the best in your family?","How often?"]},{"type":"ranking","task":"Rank these from the easiest to learn (1) to the most difficult (7). Then compare with a partner: I think the piano is easier than the violin. The saxophone is the most difficult!","items":["guitar","drums","piano","violin","trumpet","saxophone","singing"]},{"type":"roleplay","cards":[{"sit":"You want to start a band for the school talent show.","a":"You love rock. Give two ideas with Why don't we…? and How about…? Say who is the best singer in your class.","b":"You love pop. Say: Pop songs are easier than rock songs. Give one idea with Let's… Choose one song together at the end."},{"sit":"Your new band needs a name and a place to practise.","a":"Suggest a name and a place: How about calling the band…? Why don't we practise at…?","b":"Say: That's a good idea! or Hmm, I don't like that. Then give a better idea: Let's practise at… It's bigger and quieter."},{"sit":"At a music shop: choosing a first instrument.","a":"You are the customer. Ask: Which instrument is the easiest to play? Is the violin quieter than the trumpet?","b":"You work at the shop. Answer and compare: The guitar is easier than the violin. The piano is the best for beginners."}]}],"rec":{"prompt":"Record yourself: describe your perfect band for the talent show. Who plays what? Who is the best? Suggest a song.","prompt_es":"Grábate: describe tu banda perfecta para el show de talentos. ¿Quién toca qué? ¿Quién es el mejor? Sugiere una canción.","model":"There are three people in my perfect band. Vale is the singer. She's got the best voice in our school. Sam plays the guitar, and Tomás plays the drums. The drums are the loudest instrument in the band! Why don't we play a rock song? Rock is more fun than pop!","use":["the loudest…","Why don't we…?","rock"]},"tips":[{"who":"teacher","t":"Before the ranking, give pairs one minute to list all the instruments they know. Then they rank them and compare with easier than and the most difficult.","es":"Antes del ranking, dales un minuto a las parejas para hacer una lista de todos los instrumentos que conozcan. Luego los ordenan y comparan con easier than y the most difficult."},{"who":"student","t":"In the role-play, don't just say yes or no. Give a reason: Let's play pop. It's easier!","es":"En el roleplay, no digas solo sí o no. Da una razón: Let's play pop. It's easier!"}]},{"id":"rocket-6-kid","lv":"rocket","n":6,"age":"kid","title":"Sports Star Stories","goals":["talk about sports you did last weekend","ask and answer questions with Were you…? and Was it…?","describe a match or a sports day"],"goals_es":["hablar de los deportes que hiciste el fin de semana pasado","hacer y responder preguntas con Were you…? y Was it…?","describir un partido o un día deportivo"],"warm":["What sport did you play last week?","Were you at a match last weekend?","Have you got a medal? What was it for?"],"warm_es":["¿Qué deporte practicaste la semana pasada?","¿Fuiste a un partido el fin de semana pasado?","¿Tienes una medalla? ¿Por qué la ganaste?"],"model":{"kind":"dialogue","title":"A Silver Medal","intro":"It's Monday morning. Benja is telling Leo about his karate competition.","intro_es":"Es lunes en la mañana. Benja le cuenta a Leo sobre su competencia de karate.","lines":[{"sp":"Leo","t":"Hi, Benja! [[Were you at]] the [[karate]] competition on Saturday?","es":"¡Hola, Benja! ¿Estuviste en la competencia de karate el sábado?"},{"sp":"Benja","t":"Yes, I was! It was at the big [[stadium]] in the city.","es":"¡Sí! Fue en el estadio grande de la ciudad."},{"sp":"Leo","t":"Wow! [[Was it]] difficult?","es":"¡Wow! ¿Fue difícil?"},{"sp":"Benja","t":"Yes, it was. [[There were]] thirty children in my group.","es":"Sí, fue difícil. Había treinta niños en mi grupo."},{"sp":"Leo","t":"Were you nervous?","es":"¿Estabas nervioso?"},{"sp":"Benja","t":"A little. But I [[practised a lot]] last week.","es":"Un poco. Pero practiqué mucho la semana pasada."},{"sp":"Leo","t":"And? Were you the winner?","es":"¿Y? ¿Fuiste el ganador?"},{"sp":"Benja","t":"No, I wasn't. But I was second! Look, a silver [[medal]]!","es":"No. ¡Pero salí segundo! Mira, ¡una medalla de plata!"},{"sp":"Leo","t":"That's great! [[Well done]], Benja!","es":"¡Qué bien! ¡Bien hecho, Benja!"},{"sp":"Benja","t":"Thanks! Next time, I want the gold medal!","es":"¡Gracias! ¡La próxima vez quiero la medalla de oro!"}],"questions":[{"q":"Where was the competition?","opts":["At school","At the stadium","At the park"],"a":1},{"q":"How many children were in Benja's group?","opts":["Thirty","Thirteen","Three"],"a":0},{"q":"What medal did Benja get?","opts":["Gold","Bronze","Silver"],"a":2}]},"lang":[{"e":"karate","t":"VOC","d":"a sport from Japan with fast kicks and arm moves","x":"Benja does karate on Tuesdays.","s":"kaRAte","es":"karate"},{"e":"stadium","t":"VOC","d":"a very big place for sport with a lot of seats","x":"There were a lot of fans at the stadium.","s":"STAdium","es":"estadio"},{"e":"medal","t":"VOC","d":"a prize you wear round your neck","x":"Sofi got a gold medal.","s":"MEdal","es":"medalla"},{"e":"Were you at…?","t":"PHR","d":"a question to ask if a person was in a place","x":"Were you at the match on Sunday?","s":"WERE you at","es":"¿Estuviste en…?"},{"e":"Was it…?","t":"PHR","d":"a question to ask how something was","x":"Was it exciting? — Yes, it was!","s":"WAS it","es":"¿Fue…? / ¿Estuvo…?"},{"e":"There were…","t":"PHR","d":"we use it to say how many people or things were in a place","x":"There were two teams on the pitch.","s":"there WERE","es":"Había…"},{"e":"Well done!","t":"PHR","d":"you say this to a person who did something very well","x":"You were second? Well done!","s":"WELL DONE","es":"¡Bien hecho! / ¡Felicitaciones!"},{"e":"practise a lot","t":"COL","d":"train again and again to be better","x":"I practised a lot before the match.","s":"PRACtise a LOT","es":"practicar mucho, entrenar mucho"}],"pron":{"focus":"The -ed ending: three sounds","explain":"Past -ed can sound like /d/ (played), /t/ (practised, kicked) or /ɪd/ (shouted). We only add an extra part after t or d: SHOUT-ed, WAIT-ed.","explain_es":"La terminación -ed del pasado puede sonar como /d/ (played), /t/ (practised, kicked) o /ɪd/ (shouted). Solo agregamos una sílaba extra después de t o d: SHOUT-ed, WAIT-ed.","tip":"Don't say practis-ED. Say practist, with one short sound at the end!","tip_es":"No digas practis-ED. Di practist, ¡con un solo sonido corto al final!","lines":[{"t":"I practised a lot last week.","m":"I PRACtised‿a LOT last WEEK↘."},{"t":"Leo kicked the ball very hard.","m":"LEo KICKED the BALL very HARD↘."},{"t":"The fans shouted his name.","m":"the FANS SHOUTed his NAME↘."}]},"acts":[{"type":"findsomeone","items":[{"p":"played football last weekend","q":"Did you play football last weekend?"},{"p":"was at a match last month","q":"Were you at a match last month?"},{"p":"has got a medal","q":"Have you got a medal?"},{"p":"climbed a tree last week","q":"Did you climb a tree last week?"},{"p":"watched a match on TV last week","q":"Did you watch a match on TV last week?"},{"p":"walked to school today","q":"Did you walk to school today?"},{"p":"was the winner of a race at school","q":"Were you the winner of a race at school?"},{"p":"played badminton last summer","q":"Did you play badminton last summer?"}],"follow":["Where was it?","Who was with you?","Was it fun?"]},{"type":"picture","prompts":["What sport are the children playing?","Imagine this match was yesterday. Was it sunny or rainy?","How many children were there on the pitch?","Who was the winner, do you think? Why?","When did you last play football with your friends? Where was it?"]},{"type":"story","starters":["Last Saturday, there was a big match at the stadium. My team…","Yesterday, my dog jumped onto the pitch and…","On Sports Day, I was very nervous. I…","Last summer, my family and I tried surfing. The waves were…","At the gymnastics competition, there were…"]}],"rec":{"prompt":"Record yourself: talk about a match, a race or a sports day you remember. Where was it? Who was there? Was it exciting?","prompt_es":"Grábate: habla de un partido, una carrera o un día deportivo que recuerdes. ¿Dónde fue? ¿Quién estaba ahí? ¿Fue emocionante?","model":"Last Saturday there was a football match at my school. There were a lot of fans. My mum and my sister were there. In the first half, we played very well. I kicked the ball and… goal! We were the winners. My dad said: Well done! It was very exciting!","use":["There were…","Well done!"]},"tips":[{"who":"teacher","t":"Write was / were and played / practised / kicked on the board. In Find Someone Who, students answer with full short answers: Yes, I did. / No, I didn't. / Yes, I was. / No, I wasn't.","es":"Escribe was / were y played / practised / kicked en la pizarra. En Find Someone Who, los estudiantes responden con respuestas cortas completas: Yes, I did. / No, I didn't. / Yes, I was. / No, I wasn't."},{"who":"student","t":"Tell your story with time words: First…, Then…, In the end… You sound like a real sports reporter!","es":"Cuenta tu historia con palabras de tiempo: First…, Then…, In the end… ¡Suenas como un verdadero periodista deportivo!"}]},{"id":"rocket-6-teen","lv":"rocket","n":6,"age":"teen","title":"Match Day Memories","goals":["talk about a sports event you watched or played","ask friends about their weekend with Were you…? and Did you…?","describe exciting moments in a match"],"goals_es":["hablar de un evento deportivo que viste o en el que jugaste","preguntar a tus amigos por su fin de semana con Were you…? y Did you…?","describir momentos emocionantes de un partido"],"warm":["Did you watch any sport last weekend?","Were you at a stadium last year? Which one?","What sports did you try at school this year?","Was PE easy or difficult this week?"],"warm_es":["¿Viste algún deporte el fin de semana pasado?","¿Fuiste a un estadio el año pasado? ¿A cuál?","¿Qué deportes probaste en el colegio este año?","¿La clase de educación física fue fácil o difícil esta semana?"],"model":{"kind":"dialogue","title":"The Volleyball Final","intro":"On Monday, Tomás asks Jose about her volleyball final.","intro_es":"El lunes, Tomás le pregunta a Jose por su final de vóleibol.","lines":[{"sp":"Tomás","t":"Hey, Jose! How was the volleyball [[final]] on Saturday?","es":"¡Hola, Jose! ¿Cómo estuvo la final de vóleibol el sábado?"},{"sp":"Jose","t":"It was amazing! [[There were]] about two hundred people at the sports centre.","es":"¡Fue increíble! Había como doscientas personas en el centro deportivo."},{"sp":"Tomás","t":"Wow! [[Were you nervous]]?","es":"¡Wow! ¿Estabas nerviosa?"},{"sp":"Jose","t":"Yes, I was! At the start, we [[played badly]].","es":"¡Sí! Al principio jugamos mal."},{"sp":"Tomás","t":"Oh no! What happened then?","es":"¡Oh, no! ¿Y qué pasó después?"},{"sp":"Jose","t":"Our [[coach]] talked to us. We [[tried again]] and we played much better.","es":"Nuestro entrenador habló con nosotras. Lo intentamos de nuevo y jugamos mucho mejor."},{"sp":"Tomás","t":"So, were you the winners?","es":"Entonces, ¿ganaron?"},{"sp":"Jose","t":"Yes, we were! Now there's a gold [[medal]] on my bedroom wall.","es":"¡Sí! Ahora hay una medalla de oro en la pared de mi habitación."},{"sp":"Tomás","t":"Brilliant! [[Well done]]! Was Sam there?","es":"¡Genial! ¡Bien hecho! ¿Sam estaba ahí?"},{"sp":"Jose","t":"Yes, he was. He posted his photos of the match last night.","es":"Sí, estaba. Anoche publicó sus fotos del partido."},{"sp":"Tomás","t":"Cool! I want to see them.","es":"¡Qué bueno! Quiero verlas."}],"questions":[{"q":"How many people were at the sports centre?","opts":["About two hundred","About twenty","About two thousand"],"a":0},{"q":"How did the team play at the start?","opts":["Very well","Badly","Much better"],"a":1},{"q":"What did Sam do last night?","opts":["He played volleyball","He watched a film","He posted his photos"],"a":2}]},"lang":[{"e":"final","t":"VOC","d":"the last and most important match of a competition","x":"Our team played in the final on Saturday.","s":"FInal","es":"final"},{"e":"coach","t":"VOC","d":"the person who trains a team","x":"Our coach was very happy after the match.","s":"COACH","es":"entrenador, entrenadora"},{"e":"medal","t":"VOC","d":"a prize you wear round your neck","x":"Jose's team got gold medals.","s":"MEdal","es":"medalla"},{"e":"There were…","t":"PHR","d":"we use it to say how many people or things were in a place","x":"There were two hundred fans at the match.","s":"there WERE","es":"Había…"},{"e":"Were you nervous?","t":"PHR","d":"a question to ask if someone felt worried before something","x":"Were you nervous before the final?","s":"WERE you NERvous","es":"¿Estabas nervioso? / ¿Estabas nerviosa?"},{"e":"Well done!","t":"PHR","d":"you say this to a person who did something very well","x":"You were the winners? Well done!","s":"WELL DONE","es":"¡Bien hecho! / ¡Felicitaciones!"},{"e":"play badly","t":"COL","d":"not play well in a game","x":"We played badly in the first half.","s":"PLAY BADly","es":"jugar mal"},{"e":"try again","t":"COL","d":"do something one more time after a problem","x":"It wasn't easy, but she tried again.","s":"TRY aGAIN","es":"intentarlo de nuevo"}],"pron":{"focus":"Was and were: weak and strong","explain":"Was and were are usually weak and quick in the middle of a sentence: It wəz amazing. But in short answers they are strong: Yes, I WAS! Yes, we WERE!","explain_es":"Was y were suelen ser débiles y rápidos en medio de la oración: It wəz amazing. Pero en las respuestas cortas son fuertes: Yes, I WAS! Yes, we WERE!","tip":"Practise in pairs: one asks Were you…?, the other answers with a strong Yes, I WAS!","tip_es":"Practica en parejas: uno pregunta Were you…? y el otro responde con un fuerte Yes, I WAS!","lines":[{"t":"It was amazing!","m":"it was aMAZing↘!"},{"t":"Were you nervous? Yes, I was.","m":"were you NERvous↗? | YES, I WAS↘."},{"t":"There were two hundred people.","m":"there were TWO HUNdred PEOple↘."}]},"acts":[{"type":"findsomeone","items":[{"p":"watched a football match last weekend","q":"Did you watch a football match last weekend?"},{"p":"was at a stadium this year","q":"Were you at a stadium this year?"},{"p":"played a sport with friends last week","q":"Did you play a sport with friends last week?"},{"p":"tried climbing or surfing last summer","q":"Did you try climbing or surfing last summer?"},{"p":"was tired after PE this week","q":"Were you tired after PE this week?"},{"p":"posted a sports video online last month","q":"Did you post a sports video online last month?"},{"p":"has got a medal from a competition","q":"Have you got a medal from a competition?"},{"p":"stayed in bed late on Sunday","q":"Did you stay in bed late on Sunday?"}],"follow":["Who was with you?","Was it exciting?","Where was it?"]},{"type":"guess","cat":"My sport last weekend","items":["rugby","golf","hockey","karate","surfing","gymnastics","climbing","badminton","sailing","horse riding","volleyball","skateboarding"],"frames":["Were you in a team?","Did you need a ball?","Were you in the water?","Was it outside?","Was it…?"]},{"type":"roleplay","cards":[{"sit":"Monday morning at school: talking about the weekend.","a":"Last weekend you were at a big match at the stadium. Answer B's questions. Use: There were… / It was… / We played…","b":"Ask A about the weekend: Where were you? Was it exciting? Who was with you? Who was the winner? React: Well done! or Oh no!"},{"sit":"A video call with your cousin after a climbing competition.","a":"You were in a climbing competition and you were third. Tell B about it: I was nervous at the start, but I tried again…","b":"Ask questions: Were you nervous? How many people were there? Was it difficult? React: No way! / Brilliant!"},{"sit":"The school newspaper: an interview after a match.","a":"You are the reporter. Ask the player: When was the match? Were you happy with your team? What happened in the second half?","b":"You are the player. Your team played badly at the start, but you scored a goal at the end. Answer A's questions."}]}],"rec":{"prompt":"Record yourself: tell a friend about a sports event you watched or played. When and where was it? What happened? How did you feel?","prompt_es":"Grábate: cuéntale a un amigo sobre un evento deportivo que viste o en el que jugaste. ¿Cuándo y dónde fue? ¿Qué pasó? ¿Cómo te sentiste?","model":"Last Sunday I watched a rugby match at the stadium with my dad. There were thousands of fans. At the start, our team played badly and I was nervous. But in the second half, they tried again and played much better. They were the winners! It was the best day of the month.","use":["There were…","play badly","try again"]},"tips":[{"who":"teacher","t":"Before the role-play, brainstorm reactions on the board: No way! / Brilliant! / Oh no! / Well done! Students must use two reactions in each conversation.","es":"Antes del roleplay, haz una lluvia de ideas de reacciones en la pizarra: No way! / Brilliant! / Oh no! / Well done! Los estudiantes deben usar dos reacciones en cada conversación."},{"who":"student","t":"In the guessing game, answer with Yes, I was / No, I wasn't or Yes, I did / No, I didn't, not just yes or no.","es":"En el juego de adivinar, responde con Yes, I was / No, I wasn't o Yes, I did / No, I didn't, no solo con yes o no."}]},{"id":"rocket-7-kid","lv":"rocket","n":7,"age":"kid","title":"Grandma's Old Box","goals":["talk about old and new technology","say what people had and didn't have in the past","ask and answer Did you…? questions"],"goals_es":["hablar de la tecnología antigua y la nueva","decir qué tenían y qué no tenían las personas en el pasado","hacer y responder preguntas con Did you…?"],"warm":["Did you watch TV yesterday?","What technology have you got at home?","Did your grandparents have a mobile phone when they were young?"],"warm_es":["¿Viste televisión ayer?","¿Qué tecnología tienes en tu casa?","¿Tus abuelos tenían celular cuando eran jóvenes?"],"model":{"kind":"dialogue","title":"When Grandma Was a Girl","intro":"Sofi is at Grandma Ana's house. She finds an old box under the bed.","intro_es":"Sofi está en la casa de la abuela Ana. Encuentra una caja vieja debajo de la cama.","lines":[{"sp":"Sofi","t":"Grandma, look! I found this box under the bed.","es":"¡Abuela, mira! Encontré esta caja debajo de la cama."},{"sp":"Grandma Ana","t":"Oh! That's my old [[camera]]. I [[took photos]] of the family with it.","es":"¡Oh! Es mi cámara antigua. Saqué fotos de la familia con ella."},{"sp":"Sofi","t":"Where's the screen?","es":"¿Dónde está la pantalla?"},{"sp":"Grandma Ana","t":"It didn't have a screen. It had a film inside.","es":"No tenía pantalla. Tenía un rollo adentro."},{"sp":"Sofi","t":"[[Did you have]] a [[mobile phone]] [[when you were young]]?","es":"¿Tenías celular cuando eras joven?"},{"sp":"Grandma Ana","t":"[[No, I didn't]]. We had one telephone in the kitchen.","es":"No, no tenía. Teníamos un teléfono en la cocina."},{"sp":"Sofi","t":"So how did you talk to your friends?","es":"¿Y cómo hablabas con tus amigos?"},{"sp":"Grandma Ana","t":"I saw them at school, and I wrote [[letters]] to my cousin in Valparaíso.","es":"Los veía en el colegio, y le escribía cartas a mi prima de Valparaíso."},{"sp":"Sofi","t":"Letters? [[That's so cool]]! Can I write a letter to you?","es":"¿Cartas? ¡Qué genial! ¿Te puedo escribir una carta?"},{"sp":"Grandma Ana","t":"Yes, please! I love letters.","es":"¡Sí, por favor! Me encantan las cartas."}],"questions":[{"q":"Where did Sofi find the box?","opts":["In the kitchen","Under the bed","At school"],"a":1},{"q":"What did the old camera have inside?","opts":["A film","A screen","A letter"],"a":0},{"q":"Who did Grandma write letters to?","opts":["Her teacher","Her mum","Her cousin"],"a":2}]},"lang":[{"e":"camera","t":"VOC","d":"a machine for taking photos","x":"Grandma's old camera had a film inside.","s":"CAMera","es":"cámara"},{"e":"mobile phone","t":"VOC","d":"a small phone you can carry everywhere","x":"My mum's got a new mobile phone.","s":"MObile PHONE","es":"celular"},{"e":"letter","t":"VOC","d":"a message on paper that you send in the post","x":"I wrote a letter to my grandma.","s":"LETter","es":"carta"},{"e":"take photos","t":"COL","d":"use a camera or a phone to make pictures","x":"I took photos of Pipo in the park.","s":"TAKE PHOtos","es":"sacar fotos"},{"e":"Did you have…?","t":"PHR","d":"a question about things a person had in the past","x":"Did you have a computer at school?","s":"DID you HAVE","es":"¿Tenías…?"},{"e":"No, I didn't.","t":"PHR","d":"a short answer to say no to a Did you…? question","x":"Did you see the film? — No, I didn't.","s":"NO, I DIDn't","es":"No, no tenía. / No, no lo hice."},{"e":"when you were young","t":"PHR","d":"in the years when you were a child","x":"Did you have a TV when you were young?","s":"when you were YOUNG","es":"cuando eras joven, cuando eras niño"},{"e":"That's so cool!","t":"PHR","d":"you say this when something is really interesting or fun","x":"Your grandma had a radio? That's so cool!","s":"THAT'S so COOL","es":"¡Qué genial!"}],"pron":{"focus":"Did you…? questions","explain":"In fast English, did and you join together and sound like didja. In Did you…? questions, the voice goes up at the end ↗.","explain_es":"En inglés rápido, did y you se unen y suenan como didja. En las preguntas con Did you…?, la voz sube al final ↗.","tip":"Practise with a partner: ask Did you…? with your voice going up, and answer Yes, I did or No, I didn't with your voice going down.","tip_es":"Practica con un compañero: pregunta Did you…? subiendo la voz, y responde Yes, I did o No, I didn't bajando la voz.","lines":[{"t":"Did you have a mobile phone?","m":"did‿you HAVE‿a MObile PHONE↗?"},{"t":"No, I didn't.","m":"NO↘, | I DIDn't↘."},{"t":"Did you take a photo?","m":"did‿you TAKE‿a PHOto↗?"}]},"acts":[{"type":"guess","cat":"Old and new things","items":["telephone","mobile phone","camera","television","radio","computer","laptop","light bulb","candle","letter","robot"],"frames":["Is it old or new?","Did your grandma have one?","Can you take photos with it?","Has it got a screen?","Is it a…?"]},{"type":"picture","prompts":["What are the children making?","What colour are the robots?","Who is helping the children?","Imagine you were in this class yesterday. What did you make? What did your robot do?","Did you make something at school last week? What was it?"]},{"type":"roulette","items":["What did you have for breakfast today?","What did you watch on TV yesterday?","Did you take a photo last weekend? What was in it?","Did you write a letter or a card this year? Who was it for?","What did you see on the way to school today?","Did your mum or dad have a computer at school?","Where did you go last Saturday?","What game did you play yesterday?","Who did you see last Sunday?","Did you find anything fun at home last week?"]}],"rec":{"prompt":"Record yourself: talk about your grandma or grandpa when they were young. What did they have? What didn't they have?","prompt_es":"Grábate: habla de tu abuela o tu abuelo cuando eran jóvenes. ¿Qué tenían? ¿Qué no tenían?","model":"When my grandpa was young, he didn't have a mobile phone or a laptop. His family had a big radio and a small television. He wrote letters to his friends. He took photos with an old camera. I think that's so cool!","use":["take photos","letter","That's so cool!"]},"tips":[{"who":"teacher","t":"Bring an old object (or show a photo of one), like a film camera or a radio. Students ask Did you have…? questions about it before the guessing game.","es":"Trae un objeto antiguo (o muestra una foto), como una cámara de rollo o una radio. Los estudiantes hacen preguntas con Did you have…? sobre el objeto antes del juego de adivinar."},{"who":"student","t":"Ask a grandparent at home: Did you have a TV when you were young? Tell the class next time!","es":"Pregúntale a tu abuelo o abuela en casa: Did you have a TV when you were young? ¡Cuéntale al curso la próxima clase!"}]},{"id":"rocket-7-teen","lv":"rocket","n":7,"age":"teen","title":"Life Before Phones","goals":["compare technology in the past and now","ask an older person about their life with Did you…?","tell a short
