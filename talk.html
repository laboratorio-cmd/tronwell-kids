l you do if you lose?","What are your plans after the competition?"]},{"type":"agree","items":["Extreme sports are too risky for teenagers.","You won't become a top athlete unless you start very young.","Losing a match teaches you more than winning one.","Coaches should be friends with their players.","E-sports competitions are real sport.","Watching sport is more fun than playing it.","Schools should give students more time for sport."]}],"rec":{"prompt":"Record a short video message for your team or club before an important match, race or competition. Say when it is, what the plan is and what you predict. End with something positive.","model":"Hi, everyone! As you know, the final is on Saturday at five, and we're playing against a really tough opponent. Here's the plan: we're training every afternoon this week, and on Thursday we're watching videos of their matches. I know some of you have butterflies in your stomach, and so do I! But I think we'll win if we play as a team. Get some sleep, eat well, and let's go for gold!","use":["a tough opponent","have butterflies in your stomach","go for gold"]},"tips":[{"who":"teacher","t":"For the expert interview, make groups of three or four: one athlete and two or three journalists. Give the journalists five minutes to plan their questions, then swap roles so everyone is the athlete once."},{"who":"student","t":"In the interview, mix your future forms: I'm competing on… (arrangement), I'm going to… (plan), I think I'll… (prediction). Your answers will sound much more natural."}]},{"id":"comet-6-kid","lv":"comet","n":6,"age":"kid","title":"Pack Your Bags!","goals":["give travel advice with must, have to and should","talk about holidays and trips you have been on or want to go on","say what people should and shouldn't pack for different places"],"warm":["Where did you go on your last holiday?","Have you ever been on a plane? How did you feel?","What's the best souvenir you have ever bought or been given?","Would you prefer a holiday at the beach or in the mountains? Why?"],"model":{"kind":"dialogue","title":"Packing for Pucón","intro":"Leo is going on a camping trip to Pucón with his best friend's family, and his cousin Kai is helping him pack.","lines":[{"sp":"Kai","t":"So, Leo, when do you [[set off]] for Pucón?"},{"sp":"Leo","t":"On Saturday morning. We're going by bus, and we're staying at a campsite by the lake."},{"sp":"Kai","t":"Cool! Let me see your backpack. Wow, it's enormous! What's in here?"},{"sp":"Leo","t":"My football, three comics, my tablet and some board games."},{"sp":"Kai","t":"Leo, you have to [[travel light]]! You'll carry that backpack everywhere."},{"sp":"Leo","t":"OK, OK. So what must I take?"},{"sp":"Kai","t":"Well, you must take a warm jacket. It gets really cold at night by the lake."},{"sp":"Leo","t":"Should I take my swimming things?"},{"sp":"Kai","t":"Yes, you should. But you mustn't swim without an adult. The lake is very deep."},{"sp":"Leo","t":"Do I have to take a sleeping bag?"},{"sp":"Kai","t":"No, you don't have to. Benja's mum has got lots. Oh, and [[don't forget to]] pack a raincoat. [[Better safe than sorry]]!"},{"sp":"Leo","t":"Good idea. Can we [[go sightseeing]] too?"},{"sp":"Kai","t":"Of course! You ought to see the volcano. And [[bring me back]] a souvenir!"},{"sp":"Leo","t":"Deal! Right, I'm ready to go!"},{"sp":"Kai","t":"Not yet! First take out those comics. Then [[have a great trip]]!"}],"questions":[{"q":"How is Leo travelling to Pucón?","opts":["By plane","By bus","By car"],"a":1},{"q":"Why must Leo take a warm jacket?","opts":["It gets really cold at night by the lake","It's going to snow","His mum told him to"],"a":0},{"q":"Why doesn't Leo have to take a sleeping bag?","opts":["The campsite has got beds","Kai is lending him one","Benja's mum has got lots"],"a":2}]},"lang":[{"e":"set off","t":"PV","d":"to start a journey","x":"We set off very early to get to the beach before lunch.","s":"set OFF"},{"e":"bring back","t":"PV","d":"to come home from a place with something for someone","x":"Can you bring me back some sweets from your trip?","s":"bring BACK"},{"e":"travel light","t":"COL","d":"to take very few bags or things with you","x":"I always travel light, so I only take a small backpack.","s":"TRAVel LIGHT"},{"e":"go sightseeing","t":"COL","d":"to visit famous or interesting places as a tourist","x":"We went sightseeing in Valparaíso and took lots of photos.","s":"go SIGHTseeing"},{"e":"Better safe than sorry!","t":"ID","d":"it's better to be careful now than to have problems later","x":"Take an umbrella, just in case. Better safe than sorry!","s":"BETTer SAFE than SORry"},{"e":"Don't forget to…","t":"PHR","d":"a friendly way to remind someone to do something","x":"Don't forget to put your passport in your bag!","s":"DON'T forGET to"},{"e":"Have a great trip!","t":"PHR","d":"a friendly thing to say to someone before they go away","x":"Bye, Sofi! Have a great trip, and send me some photos!","s":"have a GREAT TRIP"},{"e":"on holiday","t":"PREP","d":"away from home and school, travelling or relaxing","x":"We're going on holiday to the south in February.","s":"on HOLiday"}],"pron":{"focus":"Have to and mustn't","explain":"In have to, the v sounds like an f and to is short and weak: /hæftə/. In mustn't, we don't say the first t: /ˈmʌsnt/. The important words, like the verb after have to, are strong.","tip":"Say HAF-tuh three times fast, then put it in a sentence. For mustn't, say MUSS-nt with no t in the middle.","lines":[{"t":"You have to travel light.","m":"you HAVE‿to TRAVel LIGHT↘."},{"t":"You mustn't swim without an adult.","m":"you MUSTn't SWIM | withOUT‿an ADult↘."},{"t":"Do I have to take a sleeping bag?","m":"do‿I HAVE‿to TAKE‿a SLEEPing bag↗?"}]},"acts":[{"type":"taboo","cards":[{"w":"passport","taboo":["document","country","travel"]},{"w":"luggage","taboo":["bags","suitcase","airport"]},{"w":"boarding pass","taboo":["plane","ticket","card"]},{"w":"souvenir","taboo":["buy","remember","present"]},{"w":"campsite","taboo":["tent","sleep","camping"]},{"w":"backpack","taboo":["bag","shoulders","carry"]},{"w":"guidebook","taboo":["book","tourist","information"]},{"w":"delayed","taboo":["late","time","flight"]},{"w":"sightseeing","taboo":["visit","famous","tourist"]},{"w":"sun cream","taboo":["sun","skin","beach"]}]},{"type":"picture","prompts":["Where do you think these two travellers are? What can you see around them?","Why are they looking at the map? Do you think they are lost?","What must you have in your backpack in a hot, sunny desert?","What should they do if they can't find the way?","Would you like to visit a desert? Why or why not?"]},{"type":"wyr","items":[["travel by plane","travel by train"],["sleep in a tent at a campsite","sleep in a big hotel"],["go sightseeing in a big city","spend all day at the beach"],["carry a heavy backpack","pull a big suitcase"],["visit a hot desert","visit a snowy mountain"],["buy one souvenir for yourself","buy small souvenirs for your whole family"],["have a long delay with your best friend","have a quick flight on your own"]]}],"rec":{"prompt":"Record a travel tip video for a friend who is going on a trip. Tell them what they must take, what they should do and what they don't have to bring.","model":"Hi, Martina! You're going to Pucón next week, so here are my tips. First, you must take a warm jacket, because it gets really cold at night. You should also pack sun cream and a hat. You don't have to take a sleeping bag, because the campsite has got blankets. Try to travel light, because you'll carry your backpack everywhere. And you mustn't swim in the lake without an adult. Don't forget to go sightseeing, and bring me back a souvenir. Have a great trip!","use":["travel light","Don't forget to…","Have a great trip!"]},"tips":[{"who":"teacher","t":"Before the taboo game, brainstorm travel words on the board in two lists: at the airport and at the campsite. In the would-you-rather round, ask students to give a reason with must, should or don't have to."},{"who":"student","t":"Mustn't and don't have to are different! You mustn't = it isn't allowed. You don't have to = it isn't necessary, but you can if you want."}]},{"id":"comet-6-teen","lv":"comet","n":6,"age":"teen","title":"Weekend Getaway","goals":["give and ask for travel advice with must, have to and should","plan a trip with a friend and agree on a budget","talk about your own travel experiences"],"warm":["What's the best trip you have ever been on?","Do you prefer travelling with your family or with friends? Why?","What do you always pack when you go away?","Which place in Chile would you show a visitor from abroad? Why?"],"model":{"kind":"dialogue","title":"Planning the Valparaíso Trip","intro":"Tomás and Sam are planning a weekend trip from Concepción to Valparaíso to visit their friend Jose.","lines":[{"sp":"Sam","t":"So, are we still going to Valparaíso to visit Jose next weekend?"},{"sp":"Tomás","t":"Definitely! My dad's coming with us, but he says we have to plan everything ourselves."},{"sp":"Sam","t":"Fair enough. What do we have to do first?"},{"sp":"Tomás","t":"We have to [[book the tickets]] tonight. The night buses [[sell out]] really fast."},{"sp":"Sam","t":"OK. Do we have to pay for a hostel?"},{"sp":"Tomás","t":"No, we don't have to. Jose's parents said we can stay with them, and they'll [[pick us up]] at the bus station."},{"sp":"Sam","t":"Brilliant. Should I bring my guidebook?"},{"sp":"Tomás","t":"You don't really need it. Jose knows lots of places [[off the beaten track]]."},{"sp":"Sam","t":"Cool. I want to [[go sightseeing]] and take photos of the street art on the hills."},{"sp":"Tomás","t":"Then you should bring your camera. But remember, we're [[on a budget]]. We've only got 40,000 pesos each."},{"sp":"Sam","t":"True. So we mustn't spend it all on souvenirs on the first day!"},{"sp":"Tomás","t":"Exactly. Oh, and you ought to pack a warm jacket. It gets windy by the sea at night."},{"sp":"Sam","t":"[[Sounds like a plan]]. What time does the bus leave?"},{"sp":"Tomás","t":"At ten on Friday night. Then we [[hit the road]]!"}],"questions":[{"q":"Why do they have to book the tickets tonight?","opts":["The night buses sell out really fast","Tickets are cheaper at night","Jose asked them to"],"a":0},{"q":"Where are they going to stay?","opts":["In a hostel","At a campsite","With Jose's family"],"a":2},{"q":"Why should Sam pack a warm jacket?","opts":["It's going to rain all weekend","It gets windy by the sea at night","The bus is very cold"],"a":1}]},"lang":[{"e":"sell out","t":"PV","d":"to be all sold, so there are no more left","x":"The concert tickets sold out in ten minutes.","s":"sell OUT"},{"e":"pick someone up","t":"PV","d":"to collect someone in a car and take them somewhere","x":"My mum will pick us up at the airport at eight.","s":"pick someone UP"},{"e":"book the tickets","t":"COL","d":"to arrange and pay for your tickets before you travel","x":"We booked the tickets online last week.","s":"BOOK the TICKets"},{"e":"go sightseeing","t":"COL","d":"to visit the famous places in a city as a tourist","x":"We went sightseeing all morning and had lunch by the sea.","s":"go SIGHTseeing"},{"e":"off the beaten track","t":"ID","d":"far from the places where most tourists go","x":"We found a little beach off the beaten track with nobody on it.","s":"OFF the BEATen TRACK"},{"e":"hit the road","t":"ID","d":"to leave and start a trip (informal)","x":"It's getting late. Let's hit the road!","s":"HIT the ROAD"},{"e":"on a budget","t":"PREP","d":"with only a small amount of money to spend","x":"We're on a budget, so we're cooking our own food.","s":"on a BUDget"},{"e":"Sounds like a plan!","t":"PHR","d":"a friendly way to say you agree with a suggestion","x":"Pizza and a film on Saturday? Sounds like a plan!","s":"SOUNDS like a PLAN"}],"pron":{"focus":"Weak have to and silent t in mustn't","explain":"In fast speech, have to sounds like /hæftə/ and has to sounds like /hæstə/. In mustn't, the first t is silent: /ˈmʌsnt/. The main verb after the modal carries the stress: we have to BOOK…","tip":"Record yourself saying the three lines. Check that to is short and weak, and that the main verb is louder and longer.","lines":[{"t":"We have to book the tickets tonight.","m":"we HAVE‿to BOOK the TICKets toNIGHT↘."},{"t":"We mustn't spend it all on the first day.","m":"we MUSTn't SPEND‿it ALL | on the FIRST DAY↘."},{"t":"Should I bring my guidebook?","m":"should‿I BRING my GUIDEbook↗?"}]},"acts":[{"type":"picture","prompts":["Where do you think these two travellers are, and how did they get there?","What do you think they are looking for on the map?","What must you always carry when you travel in a hot desert?","Would you rather travel with a paper map or only with your phone? Why?","What advice would you give these two before they hit the road again?"]},{"type":"ranking","task":"You and your partner are going on a three-day hiking trip in the Atacama Desert, but you can only take five of these things. Agree on a ranking from most to least important. Use: We must take… because… / We don't have to take… because… / We should…","items":["a big bottle of water","sun cream and a hat","a phone and a power bank","a warm jacket for the night","a paper map and a guidebook","a speaker for music","snacks for the whole trip"]},{"type":"negotiation","sit":"Two friends are planning a weekend trip together. They have 100,000 pesos in total for travel, food and somewhere to stay. They must agree on where to go, where to stay and what to do.","a":{"role":"You love the outdoors and nature.","goal":"You want to go camping in a national park and go on a long hike.","limits":"You don't mind sleeping in a tent. You can accept one night in a hostel if your partner agrees to the hike."},"b":{"role":"You love cities, food and photography.","goal":"You want to go to Valparaíso, go sightseeing and try the local food.","limits":"You don't want to sleep in a tent for two nights. You can accept one night at a campsite if your partner agrees to visit a city too."}}],"rec":{"prompt":"Record a voice message for a friend from abroad who is visiting your town. Tell them what they must, should and don't have to do.","model":"Hi Sam! I'm so excited that you're visiting Concepción next month. Here are some tips. First, you don't have to book a hotel, because you can stay with my family, and we'll pick you up at the airport. You should bring a raincoat, because it rains a lot here in winter. And you must try my mum's empanadas. They're the best in Chile! We're on a budget, but we can go sightseeing in the city centre and visit some places off the beaten track. Sounds like a plan?","use":["pick someone up","on a budget","off the beaten track"]},"tips":[{"who":"teacher","t":"Give pairs eight minutes for the negotiation, then ask them to write their final plan in three sentences with must, should and don't have to. A few pairs report their plan to the class."},{"who":"student","t":"Use should or ought to for advice and must or have to for rules and things that are really necessary. To sound softer, try: If I were you, I'd…"}]},{"id":"comet-7-kid","lv":"comet","n":7,"age":"kid","title":"Kindness Heroes","goals":["talk about how people help others in your neighbourhood","say what you would do in different situations with if and would","describe good friends and role models"],"warm":["Who is a good friend? What makes them a good friend?","Have you ever helped a neighbour or someone at school? What did you do?","Who is your role model? Why?","What would you do with a free afternoon to help someone?"],"model":{"kind":"dialogue","title":"The Library Bus","intro":"At break time, Martina finds Benja sitting alone in the playground.","lines":[{"sp":"Martina","t":"Benja, why are you sitting alone? Where's Leo?"},{"sp":"Benja","t":"We [[fell out]] this morning. He said my drawing was silly, so I shouted at him."},{"sp":"Martina","t":"Oh no! [[If I were you, I'd]] talk to him at lunch. You two always [[make up]] in the end."},{"sp":"Benja","t":"Maybe. What are you reading?"},{"sp":"Martina","t":"It's from the mobile library. It's a big blue bus full of books which comes to our park every Saturday."},{"sp":"Benja","t":"A library on a bus? That's so cool!"},{"sp":"Martina","t":"My aunt drives it. She's got [[a heart of gold]]. She reads stories to the little kids too."},{"sp":"Benja","t":"I'd love to help. [[What would you do if]] you were a volunteer there?"},{"sp":"Martina","t":"I'd read stories to the younger children, and I'd help the shy ones [[make friends]]."},{"sp":"Benja","t":"Does the bus need more books? We could [[raise money]] with a cake sale!"},{"sp":"Martina","t":"Great idea! Let's ask Ms Rojas. And let's ask Leo to [[lend a hand]] too."},{"sp":"Benja","t":"OK. But first, I'm going to say sorry to him!"}],"questions":[{"q":"Why is Benja sitting alone?","opts":["He's reading a book","He fell out with Leo","He's waiting for Ms Rojas"],"a":1},{"q":"Who drives the mobile library?","opts":["Martina's aunt","Ms Rojas","Benja's mum"],"a":0},{"q":"How do Benja and Martina want to help the mobile library?","opts":["By driving the bus","By painting the bus","By raising money with a cake sale"],"a":2}]},"lang":[{"e":"fall out (with someone)","t":"PV","d":"to stop being friends for a time after an argument","x":"I fell out with my brother because he broke my game.","s":"fall OUT"},{"e":"make up","t":"PV","d":"to become friends again after an argument","x":"We argued at break, but we made up after lunch.","s":"make UP"},{"e":"make friends","t":"COL","d":"to meet people and start a friendship","x":"It's easy to make friends at football club.","s":"make FRIENDS"},{"e":"raise money","t":"COL","d":"to collect money for a good cause","x":"Our class raised money for the animal shelter with a cake sale.","s":"RAISE MONey"},{"e":"have a heart of gold","t":"ID","d":"to be very kind and generous","x":"My grandma has a heart of gold. She helps everyone in our street.","s":"have a HEART of GOLD"},{"e":"lend a hand","t":"ID","d":"to help someone with a job","x":"Can you lend a hand with these boxes, please?","s":"LEND a HAND"},{"e":"If I were you, I'd…","t":"PHR","d":"a way to give someone advice","x":"If I were you, I'd tell the teacher.","s":"if I WERE you I'd"},{"e":"What would you do if…?","t":"PHR","d":"a question about an imaginary situation","x":"What would you do if you found a lost puppy?","s":"WHAT would you DO if"}],"pron":{"focus":"I'd and would you","explain":"In fast speech we say I'd, not I would. The d is very short, so listen carefully! In questions, would and you link together: would‿you sounds like /wʊdʒu/. Stress the main verb: I'd HELP.","tip":"Clap on the stressed words. Say I'd and would you quickly and softly, like one small word.","lines":[{"t":"If I were you, I'd say sorry.","m":"if‿I WERE you | I'd SAY SORry↘."},{"t":"What would you do if you won?","m":"WHAT would‿you DO | if‿you WON↘?"},{"t":"I'd read stories to the children.","m":"I'd READ STOries | to the CHILdren↘."}]},"acts":[{"type":"picture","prompts":["What can you see in the picture? Who do you think comes to this bus?","Why do you think there are chairs in front of the bus?","If this bus came to your neighbourhood, what books would you look for?","What would you do if you were a volunteer on this bus for a day?","Would you rather read inside the bus or on the chairs outside? Why?"]},{"type":"wyr","items":[["help at an animal shelter","help at a mobile library"],["donate your toys","donate your books"],["have a friend who is very funny","have a friend who is very reliable"],["say sorry first after an argument","wait for your friend to say sorry"],["raise money with a cake sale","raise money with a talent show"],["read stories to little kids","teach little kids a new game"],["be famous for being kind","be famous for being clever"]]},{"type":"balloon","sit":"Six helpers are in a hot-air balloon, but it's too heavy! One person has to jump out onto a big, soft mattress. Each person explains why the town needs them: If I left the balloon, the town would… The class votes.","roles":[{"name":"The mobile library driver","why":"brings books to children who live far from a library"},{"name":"The animal shelter volunteer","why":"looks after lost dogs and cats every weekend"},{"name":"The school crossing helper","why":"helps children cross the road safely every morning"},{"name":"The friendly neighbour","why":"waters everyone's plants and fixes bikes for free"},{"name":"The football coach","why":"teaches kids to play as a team and to be good friends"},{"name":"The baker","why":"gives free bread to families who need it"}]}],"rec":{"prompt":"Record a short message about a person you admire who helps others. Say who they are, what they do and what you would do if you were them.","model":"My role model is my grandma. She's a volunteer at the library near our school, and she reads stories to little kids every Tuesday. She's very patient, and she has a heart of gold. When I fall out with my brother, she always helps us make up. If I had more free time, I would lend a hand at the library too. I would read my favourite comics to the children!","use":["have a heart of gold","make up","lend a hand"]},"tips":[{"who":"teacher","t":"Before the balloon game, model one role yourself: If I left the balloon, the children would have no books! Give each student 30 seconds to speak, then the class votes."},{"who":"student","t":"In the second conditional, use the past after if and would in the other part: If I had a bus, I would fill it with books. Don't say If I would have."}]},{"id":"comet-7-teen","lv":"comet","n":7,"age":"teen","title":"Make a Difference","goals":["talk about friendship, volunteering and helping your community","discuss imaginary situations with the second conditional","present and defend an idea for a community project"],"warm":["What makes someone a reliable friend?","Have you ever volunteered or helped at a charity event? What did you do?","Who is a role model for you? Why?","If you had one free hour every week, how would you use it to help others?"],"model":{"kind":"dialogue","title":"Saturdays on the Bus","intro":"Vale has just seen a poster for the mobile library, and she wants Tomás to volunteer with her.","lines":[{"sp":"Vale","t":"Tomás, look! The mobile library needs teenage volunteers on Saturdays."},{"sp":"Tomás","t":"The blue bus that parks outside the community centre? I thought that was just for little kids."},{"sp":"Vale","t":"It is, but they need people to read stories and run art workshops. I'm going to [[sign up]]."},{"sp":"Tomás","t":"Honestly, if I had more free time, I would join you. But I've got skateboarding on Saturdays."},{"sp":"Vale","t":"Come on, it's only two hours! You'd really [[make a difference]] to those kids."},{"sp":"Tomás","t":"Hmm. What would you do if nobody came to your workshop?"},{"sp":"Vale","t":"I'd [[go the extra mile]] and put posters up all over the neighbourhood!"},{"sp":"Tomás","t":"Ha! You would. OK, what if I ran a film club on the bus? We could watch short films together."},{"sp":"Vale","t":"That's brilliant! It's [[for a good cause]], and you love films."},{"sp":"Tomás","t":"But I don't want to promise something and then not do it."},{"sp":"Vale","t":"You're the most reliable person I know. You always [[keep your promises]]."},{"sp":"Tomás","t":"Thanks, Vale. The library helped me a lot when I was little, so maybe it's time to [[give back]]."},{"sp":"Vale","t":"So, are you in?"},{"sp":"Tomás","t":"[[Count me in]]! Let's sign up together."}],"questions":[{"q":"What does the mobile library need?","opts":["Money for a new bus","Volunteers to read stories and run workshops","A driver for Saturdays"],"a":1},{"q":"Why isn't Tomás sure at first?","opts":["He has skateboarding on Saturdays","He doesn't like children","He can't draw"],"a":0},{"q":"What does Tomás decide to do?","opts":["Put posters up in the neighbourhood","Teach skateboarding to kids","Run a film club on the bus"],"a":2}]},"lang":[{"e":"sign up","t":"PV","d":"to put your name on a list to join an activity","x":"I've signed up for the beach clean-up on Sunday.","s":"sign UP"},{"e":"give back","t":"PV","d":"to help the people or place that helped you","x":"She was a member of the club as a child, and now she gives back by coaching.","s":"give BACK"},{"e":"make a difference","t":"COL","d":"to have a good effect on people or a situation","x":"Even one hour a week can make a difference.","s":"MAKE a DIFFerence"},{"e":"keep a promise","t":"COL","d":"to do what you said you would do","x":"He's very reliable. He always keeps his promises.","s":"KEEP a PROMise"},{"e":"go the extra mile","t":"ID","d":"to do more than people expect of you","x":"Our coach always goes the extra mile for the team.","s":"GO the EXtra MILE"},{"e":"for a good cause","t":"PREP","d":"to help people who need it, not for yourself","x":"The tickets are expensive, but it's for a good cause.","s":"for a GOOD CAUSE"},{"e":"Count me in!","t":"PHR","d":"a way to say you want to take part","x":"A volleyball match after school? Count me in!","s":"COUNT me IN"},{"e":"What if…?","t":"PHR","d":"a way to suggest an idea or imagine a situation","x":"What if we sold cakes to raise money?","s":"WHAT if"}],"pron":{"focus":"Contractions and weak would","explain":"In the second conditional, we usually contract would: I'd, you'd, we'd. In questions, would is weak and links to you: would‿you sounds like /wʊdʒu/. The verbs and the key ideas are stressed.","tip":"Practise the lines in two halves. Make a short pause at the comma, and let your voice go down at the end.","lines":[{"t":"If I had more free time, I would join you.","m":"if‿I HAD more FREE TIME | I would JOIN you↘."},{"t":"What would you do if nobody came?","m":"WHAT would‿you DO | if NObody CAME↘?"},{"t":"You'd really make a difference.","m":"you'd REALly MAKE‿a DIFFerence↘."}]},"acts":[{"type":"picture","prompts":["What can you see in the picture? Who do you think uses this service?","Why might a town need a library on wheels?","If you volunteered here for a day, what would you do to get more teenagers interested?","What would happen if this bus stopped coming to the neighbourhood?","Would you rather read on paper or on a screen? Why?"]},{"type":"roulette","items":["What would you do if you found a wallet with 50,000 pesos in it?","What would you do if your best friend told everyone your secret?","If you could volunteer anywhere in the world, where would you go?","What would you do if a new student had nobody to sit with at lunch?","If you were the head of your school for a day, what would you change?","What would you do if you fell out with a friend in a group chat?","If you had a million pesos to donate, which charity would you choose? Why?","What would you do if you saw someone being unkind to a younger student?","If you could meet your role model, what would you ask them?","What would you do if an elderly neighbour needed help every afternoon?"]},{"type":"pitch","brief":"Your school will give 200,000 pesos to one student project that helps the local community. In groups, prepare a two-minute pitch: What is the problem? What is your idea? Who will volunteer? What difference will it make?","ideas":["A homework club where older students help younger ones","A tech help afternoon for elderly neighbours","A clothes and book swap for families who need them","A clean-up day for the local park or beach","A dog-walking team for the animal shelter"],"questions":["What problem does your project solve?","Who would volunteer, and how often?","How would you spend the 200,000 pesos?","What would you do if not enough people came?","How would you know if your project made a difference?"]}],"rec":{"prompt":"Record a one-minute message for your school radio. Invite students to volunteer for a project, explain the idea and say what difference it would make.","model":"Hi everyone, this is Vale from the art club. Every Saturday, the mobile library visits our neighbourhood, and they need volunteers. If you signed up, you would read stories, run art workshops or help children choose books. It's only two hours a week, but you would really make a difference. The library helped me a lot when I was younger, so now it's time to give back. Are you interested? Then talk to Mr Díaz and sign up this week!","use":["sign up","make a difference","give back"]},"tips":[{"who":"teacher","t":"Give groups ten minutes to prepare their pitch. After each pitch, the class asks two questions from the list, then everyone votes for the best project (but not their own)."},{"who":"student","t":"When you answer What would you do if…?, start with I'd… and add a reason with because. Then ask your partner: What about you?"}]},{"id":"comet-8-kid","lv":"comet","n":8,"age":"kid","title":"Junior Detectives","goals":["describe a mystery and what happened using the passive","ask and answer questions like a detective and a witness","share ideas in a group and keep the discussion going"],"warm":["Do you like mystery stories or detective cartoons? Which ones?","Have you ever lost something important? Was it found in the end?","What do you need to be a good detective?","What is the most important rule at your school? Why?"],"model":{"kind":"dialogue","title":"The Missing Painting","intro":"Sofi's painting has disappeared from the classroom wall, so Leo and Martina decide to investigate.","lines":[{"sp":"Leo","t":"Martina, did you hear? Sofi's painting was taken from the classroom wall!"},{"sp":"Martina","t":"The one with Pipo in it? It won a prize last week!"},{"sp":"Leo","t":"Yes, and Sofi's really sad. Let's [[look into]] it. We can [[solve the mystery]]!"},{"sp":"Martina","t":"OK, Detective Leo. First, we need to [[look for clues]]."},{"sp":"Leo","t":"Look, the tape is still on the wall. The painting wasn't pulled off. It was taken down carefully."},{"sp":"Martina","t":"So maybe it wasn't stolen. Maybe somebody moved it. [[What do you think]]?"},{"sp":"Leo","t":"[[That's a good point, but]] who would move it?"},{"sp":"Martina","t":"Let's ask Mr Pérez, the caretaker. He sees everything."},{"sp":"Mr Pérez","t":"A painting? Yes, it was carried to the office by Ms Rojas this morning. She looked very happy!"},{"sp":"Leo","t":"Happy? A prize-winning painting and a happy teacher. I'm starting to [[put two and two together]]. Let's [[find out]] if I'm right!"},{"sp":"Ms Rojas","t":"Don't worry, Leo. Sofi's painting isn't lost. I'm having it framed for the school entrance."},{"sp":"Martina","t":"So everyone can see it! You were right, Detective Leo."},{"sp":"Leo","t":"Brilliant! [[Case closed]]!"}],"questions":[{"q":"What clue did Leo find?","opts":["Paint on the floor","Tape on the wall","A fingerprint on the door"],"a":1},{"q":"Who carried the painting to the office?","opts":["Mr Pérez","Sofi","Ms Rojas"],"a":2},{"q":"Why did Ms Rojas take the painting?","opts":["She's having it framed for the school entrance","She didn't like it","She wanted to take it home"],"a":0}]},"lang":[{"e":"look into","t":"PV","d":"to try to find out the facts about a problem","x":"The teacher is looking into the missing books.","s":"look INto"},{"e":"find out","t":"PV","d":"to get new information about something","x":"I want to find out who ate my sandwich!","s":"find OUT"},{"e":"solve a mystery","t":"COL","d":"to find the answer to something strange or secret","x":"The children solved the mystery of the lost keys.","s":"SOLVE a MYStery"},{"e":"look for clues","t":"COL","d":"to search for small signs that show what happened","x":"Detectives look for clues like footprints and hairs.","s":"LOOK for CLUES"},{"e":"put two and two together","t":"ID","d":"to understand what happened from the things you know","x":"I saw the crumbs and the happy dog, and I put two and two together.","s":"PUT TWO and TWO toGETHer"},{"e":"That's a good point, but…","t":"PHR","d":"a polite way to agree a little and then give a different idea","x":"That's a good point, but the door was locked.","s":"that's a GOOD POINT but"},{"e":"What do you think?","t":"PHR","d":"a question to ask someone for their opinion","x":"I think it was the cat. What do you think?","s":"WHAT do you THINK"},{"e":"Case closed!","t":"PHR","d":"what you say when a mystery is finished and solved","x":"The lost ball was in the garden all the time. Case closed!","s":"CASE CLOSED"}],"pron":{"focus":"Weak was in the passive","explain":"In passive sentences, was is weak and quick: /wəz/. We stress the past participle because it is the important information: it was TAKen, it was CARRied.","tip":"Whisper was and say the past participle loudly. Then say the whole sentence at normal speed.","lines":[{"t":"The painting was taken this morning.","m":"the PAINTing was TAKen | this MORNing↘."},{"t":"It was carried to the office.","m":"it‿was CARRied | to the OFFice↘."},{"t":"Who was it taken by?","m":"WHO was‿it TAKen by↘?"}]},"acts":[{"type":"picture","prompts":["What is this object, and who usually uses it?","What small clues could a detective find with it?","If you had this magnifying glass for a day, what would you look at first?","What else does a good detective need?","Can you name a detective from a book, a film or a cartoon? What is special about them?"]},{"type":"roleplay","cards":[{"sit":"The missing lunchbox","a":"You are the detective. Ask the witness: When was it last seen? Where was it left? Was anybody seen near it? Take notes.","b":"You are the witness. Say: It was left on the bench at break. A boy in a red cap was seen near it. At the end, say: Oh! I remember now. It was put in the lost property box!"},{"sit":"The broken window","a":"You are the detective. Ask: When was the window broken? Was anything taken? Who saw it happen?","b":"You are the witness. Say: It was broken at lunchtime. Nothing was taken. A football was found on the floor under the window!"},{"sit":"The escaped class hamster","a":"You are the detective. Ask: When was the hamster last seen? Was the cage closed? What clues were found?","b":"You are the witness. Say: It was fed at nine o'clock. The cage door was left open. Tiny footprints were found in the flour in the school kitchen!"}]},{"type":"podcast","title":"The Junior Detectives Show","segments":["Mystery news: something was lost or taken at school or at home. What was it, and when was it found?","Witness interview: ask a witness three questions about what they saw","Detective tips: what a good detective must and mustn't do","Clue of the week: describe an object, and the listeners guess what it is","Case closed: tell everyone how the mystery was solved"]}],"rec":{"prompt":"Record a news report about a funny mystery at your home or school. Say what was lost or taken, what clues were found and how the case was solved.","model":"Good morning! This is Leo from the Junior Detectives Show. Yesterday, my sister's favourite sock was taken from her bedroom. I looked for clues and found some dog hair under the sofa. Then we checked the video from the security camera. In the video, Pipo was seen running with something in his mouth. I put two and two together, and the sock was found in his bed. Case closed!","use":["look for clues","put two and two together","Case closed!"]},"tips":[{"who":"teacher","t":"Before the role-play, write passive questions on the board: When was it taken? Where was it found? Who was it seen by? Students swap roles after each card."},{"who":"student","t":"To make the passive, use was or were + past participle: The painting was taken. Add by to say who did it: It was taken by Ms Rojas."}]},{"id":"comet-8-teen","lv":"comet","n":8,"age":"teen","title":"Crack the Case","goals":["tell a mystery story using present and past passives","interview an expert and ask follow-up questions","give and defend your opinion on rules and keep the discussion going"],"warm":["Do you prefer mystery series, detective films or escape-room games? Why?","Have you ever had something lost or stolen? What happened?","Which school rule do you think is the most unfair?","Would you be a good detective? Why or why not?"],"model":{"kind":"dialogue","title":"The Lost Camera","intro":"After a volleyball match, Sam can't find his camera, so Jose and Tomás help him investigate.","lines":[{"sp":"Sam","t":"Guys, my camera has disappeared! I left it in the changing room during the match."},{"sp":"Jose","t":"Are you sure? Was the changing room locked?"},{"sp":"Sam","t":"It's usually locked by the coach, but today the door was left open."},{"sp":"Tomás","t":"OK, we have to [[track it down]]. Was anything else taken?"},{"sp":"Sam","t":"No, just my camera. My wallet was still in my bag."},{"sp":"Jose","t":"That's strange. A thief would take the money too. [[What do you reckon]], Tomás?"},{"sp":"Tomás","t":"Maybe it was taken by mistake. Lots of people have black camera bags."},{"sp":"Sam","t":"[[That's a good point, but]] mine has my name on it."},{"sp":"Jose","t":"Let's ask the caretaker if we can [[check the footage]] from the security camera in the corridor."},{"sp":"Tomás","t":"Look! At four o'clock, a girl was filmed carrying a black bag out of the changing room."},{"sp":"Sam","t":"So we've [[caught her red-handed]]!"},{"sp":"Jose","t":"Not so fast. Look, she's walking towards the office. I think she [[handed it in]]."},{"sp":"Caretaker","t":"You're right. A camera was found in the changing room and handed in to lost property."},{"sp":"Sam","t":"Phew! So it [[turned up]] in the end. Thanks, detectives!"},{"sp":"Tomás","t":"No problem. We [[solved the case]] in twenty minutes!"}],"questions":[{"q":"Why did Jose think it wasn't a normal thief?","opts":["The wallet wasn't taken","The door was locked","The bag had Sam's name on it"],"a":0},{"q":"What did they see in the security footage?","opts":["A boy taking Sam's wallet","A girl carrying a black bag","The coach locking the door"],"a":1},{"q":"Where was the camera in the end?","opts":["In the coach's car","Still in the changing room","In lost property"],"a":2}]},"lang":[{"e":"track down","t":"PV","d":"to find someone or something after searching for a long time","x":"It took me a week, but I finally tracked down my old skateboard.","s":"track DOWN"},{"e":"hand in","t":"PV","d":"to give something you found to a person in charge","x":"I found a phone on the bus, so I handed it in to the driver.","s":"hand IN"},{"e":"turn up","t":"PV","d":"to be found, often by chance, after being lost","x":"My keys turned up in my jacket pocket.","s":"turn UP"},{"e":"check the footage","t":"COL","d":"to watch the video from a camera to see what happened","x":"The shop checked the footage to see who took the bike.","s":"CHECK the FOOTage"},{"e":"solve a case","t":"COL","d":"to find out the truth about a crime or a mystery","x":"The detective solved the case with one tiny clue.","s":"SOLVE a CASE"},{"e":"catch someone red-handed","t":"ID","d":"to see someone at the moment they are doing something wrong","x":"My brother was caught red-handed eating my chocolate.","s":"CATCH someone red-HANDed"},{"e":"That's a good point, but…","t":"PHR","d":"a polite way to accept an idea and then disagree a little","x":"That's a good point, but the door was locked all night.","s":"that's a GOOD POINT but"},{"e":"What do you reckon?","t":"PHR","d":"an informal way to ask for someone's opinion","x":"I think we should check the footage. What do you reckon?","s":"WHAT do you RECKon"}],"pron":{"focus":"Stress and rhythm in passive sentences","explain":"In the passive, the auxiliary (is, was, were) is weak and the past participle is strong. By and a are weak too, so the sentence has a strong rhythm: it was FILMED by a seCURity CAMera.","tip":"Tap the desk on each capital syllable. Keep the small words between the taps short and quick.","lines":[{"t":"It was filmed by a security camera.","m":"it‿was FILMED by‿a seCURity CAMera↘."},{"t":"A camera was handed in this afternoon.","m":"a CAMera was HANDed‿IN | this afterNOON↘."},{"t":"That's a good point, but what about the wallet?","m":"that's a GOOD POINT | but WHAT‿about the WALLet↘?"}]},"acts":[{"type":"story","starters":["On Monday morning, the school's prize-winning science project was missing from the lab, but the door was still locked…","Every night, a strange message was written on the classroom board, and nobody knew who was doing it…","The new skate park was opened on Saturday, and by Sunday every ramp was covered in yellow notes with riddles on them…","A mysterious parcel was delivered to our door, but there was no name on it, only a drawing of a key…","The volleyball team's lucky mascot was taken the day before the final, and a clue was left in its place…"]},{"type":"expert","topic":"How detectives solve cases","expert":"You are a police detective with twenty years of experience. Explain how evidence is collected, how witnesses are interviewed and how cases are solved. Keep it positive and not scary, and invent interesting details.","journalists":"You are reporters for the school newspaper. Ask the expert questions, take notes and ask at least one follow-up question each, for example: Can you give us an example?","questions":["How are fingerprints collected and used?","What makes a good witness?","How are security cameras used to solve cases?","What is the most interesting case you have ever solved?","What skills must a good detective have?","Would you recommend this job to a teenager? Why?"]},{"type":"speed","motions":["Phones should be collected at the start of every school day.","Students who arrive late should pay a small fine to the class fund.","There should be security cameras in every classroom.","Students should help to write the school rules.","People who drop litter in parks should pay a big fine.","If you find money in the street, you should always hand it in."]}],"rec":{"prompt":"Record a short news report about a mystery at your school, real or invented. Use the passive to say what happened, what clues were found and how the case was solved.","model":"This is Jose with the school news. On Friday, the volleyball team's lucky mascot disappeared from the sports hall. At first, everyone thought it was stolen. Then a clue was found: a trail of glitter in the corridor. We checked the footage from the security camera, and a student was seen carrying the mascot to the art room. In the end, it turned up there. The art club was giving it a new coat of paint for the final! So we solved the case, and we won the match too.","use":["check the footage","turn up","solve a case"]},"tips":[{"who":"teacher","t":"Before the expert interview, give the journalists five minutes to prepare their questions in pairs. Remind everyone to keep the discussion going with That's a good point, but… and What do you reckon?"},{"who":"student","t":"Use the passive when the action is more important than the person: My bike was stolen. Only use by when it's important to say who did it: The case was solved by Jose."}]},{"id":"comet-9-kid","lv":"comet","n":9,"age":"kid","title":"School Swap Reporters","goals":["report what other people told you about their school","ask polite questions with Can you tell me…?","give your opinion about school rules"],"warm":["What's your favourite subject at school? Why?","Do you wear a uniform? Do you like it?","What do you usually do at break?","Would you like to go to a school in another country? Which one?"],"model":{"kind":"dialogue","title":"News from Sydney","intro":"Kai had a video call with her best friend from her old school in Sydney, and now she's telling Leo and Martina what her friend said.","lines":[{"sp":"Leo","t":"Kai, you look happy! What's up?"},{"sp":"Kai","t":"I had a video call with Ruby, my best friend in Sydney. She told me that her school had a new head teacher."},{"sp":"Martina","t":"Is he nice?"},{"sp":"Kai","t":"She said that he was really strict. Now everyone has to [[wear a uniform]] with a tie, even the little ones!"},{"sp":"Leo","t":"A tie? Poor Ruby! [[Can you tell me]] what else has changed?"},{"sp":"Kai","t":"Well, on Fridays they have online lessons at home. Ruby said she loved them because she could stay in her pyjamas!"},{"sp":"Martina","t":"Lucky her! Do they [[do homework]] on Fridays too?"},{"sp":"Kai","t":"Yes, but she told me it was [[a piece of cake]]. She always finishes it before lunch."},{"sp":"Leo","t":"I'd love that. I have to [[hand in]] my science poster tomorrow, and I haven't finished it!"},{"sp":"Martina","t":"[[In my opinion]], online lessons are boring. I'd miss playing with my friends [[at break]]."},{"sp":"Leo","t":"I see your point, but no school bus in the morning sounds great!"},{"sp":"Kai","t":"Ruby wants to [[find out]] about our school too. She asked me what time our lessons started."},{"sp":"Martina","t":"Let's make her a video about our school!"}],"questions":[{"q":"What did Ruby say about the new head teacher?","opts":["He was very funny","He was really strict","He taught online lessons"],"a":1},{"q":"Why does Ruby love her Friday lessons?","opts":["She can stay in her pyjamas","She has no homework","She plays with her friends at break"],"a":0},{"q":"What do the friends decide to do at the end?","opts":["Write Ruby a letter","Call the head teacher","Make a video about their school"],"a":2}]},"lang":[{"e":"hand in","t":"PV","d":"give your work to the teacher","x":"Please hand in your homework on Monday.","s":"hand IN"},{"e":"find out","t":"PV","d":"learn a new piece of information","x":"I want to find out what time the library opens.","s":"find OUT"},{"e":"wear a uniform","t":"COL","d":"put on the same special clothes as everyone at your school","x":"We wear a uniform with a blue jumper.","s":"WEAR a UNiform"},{"e":"do homework","t":"COL","d":"complete the school tasks you get to do at home","x":"I always do my homework before dinner.","s":"do HOMEwork"},{"e":"a piece of cake","t":"ID","d":"very, very easy","x":"The spelling test was a piece of cake!","s":"a PIECE of CAKE"},{"e":"Can you tell me…?","t":"PHR","d":"a polite way to start a question","x":"Can you tell me where the art room is?","s":"can you TELL me"},{"e":"In my opinion,…","t":"PHR","d":"words you use before you say what you think","x":"In my opinion, breaks should be longer.","s":"in MY oPINion"},{"e":"at break","t":"PREP","d":"during the short rest between lessons","x":"We play football at break.","s":"at BREAK"}],"pron":{"focus":"Weak 'that' in reported speech","explain":"When we report what someone said, 'that' is weak: quick and quiet, with a very short vowel. The important words are strong: she SAID that she was TIRED.","tip":"Say the sentence first without 'that'. Then add 'that' very softly, without stopping.","lines":[{"t":"She said that she was tired.","m":"she SAID that she was TIRED↘."},{"t":"He told me that the test was easy.","m":"he TOLD me that the TEST was EAsy↘."},{"t":"Can you tell me where the library is?","m":"can you TELL me | where the LIbrary‿is↘?"}]},"acts":[{"type":"findsomeone","items":[{"p":"walks to school","q":"Do you walk to school?"},{"p":"thinks maths is the best subject","q":"Do you think maths is the best subject?"},{"p":"did their homework yesterday","q":"Did you do your homework yesterday?"},{"p":"likes wearing a uniform","q":"Do you like wearing a uniform?"},{"p":"plays football at break","q":"Do you play football at break?"},{"p":"would like to go to a boarding school","q":"Would you like to go to a boarding school?"},{"p":"has had an online lesson","q":"Have you ever had an online lesson?"},{"p":"has passed a test this month","q":"Have you passed a test this month?"}],"follow":["Why?","What was it like?","Now report to the class: Benja told me that he…"]},{"type":"picture","prompts":["What are the pupils wearing? Do you wear something similar?","Why do you think the pupils are laughing?","This classroom is in Uzbekistan. Can you find Uzbekistan on the globe or on a map?","What can you learn with a globe? Which country would you like to visit?","Imagine you visited this class. What would you ask the pupils? Start with: Can you tell me…?"]},{"type":"pitch","brief":"In groups, design the Dream School of the future. Plan it together, then present it to the class in two minutes. Everyone in the group must say something!","ideas":["a school with a small zoo in the playground","a school where lessons are outside in the park every Friday","a school where pupils choose all their own subjects","a school on a big boat that visits a new city every month","a school with a break every thirty minutes"],"questions":["What subjects do pupils study?","Do pupils wear a uniform? What does it look like?","How long is the break, and what can you do?","Who is the head teacher? Is he or she strict?","Is there any homework? How much?","Why is your school better than all the others?"]}],"rec":{"prompt":"Record a short news report about a friend's school. Say what your friend told you, then give your opinion.","model":"Yesterday I talked to my cousin on a video call. She told me that her school was very different from mine. She said that everyone had to wear a hat in the playground, and that they ate their lunch outside. She also told me that her homework was a piece of cake! In my opinion, eating outside is a great idea, but I always lose my hat!","use":["a piece of cake","In my opinion,…"]},"tips":[{"who":"teacher","t":"After Find Someone Who, ask each pupil to report one answer with He told me that… or She said that… Write the changes on the board: like → liked, can → could, will → would."},{"who":"student","t":"When you report, move the verb one step back in time: I like maths becomes She said she liked maths. If you forget, don't stop. Just keep talking!"}]},{"id":"comet-9-teen","lv":"comet","n":9,"age":"teen","title":"Study Abroad Stories","goals":["report what someone said using reported speech","compare different types of schools and ways of learning","agree and disagree politely in a discussion"],"warm":["What's the strictest rule at your school? Do you agree with it?","Would you rather have lessons online or in person? Why?","If you could add one subject to your timetable, what would it be?","Have you ever thought about studying abroad? Where?"],"model":{"kind":"dialogue","title":"Boarding School or Online?","intro":"At lunch, Sam tells Jose and Tomás about his cousin Oliver, who goes to a boarding school in Australia.","lines":[{"sp":"Jose","t":"Sam, you said your cousin goes to a boarding school. What's it like?"},{"sp":"Sam","t":"Oliver loves it now, but he told me he hated it at first. The rules are really strict."},{"sp":"Tomás","t":"Strict how?"},{"sp":"Sam","t":"Everyone has to [[follow the rules]] about phones. He said the staff collected them every night at nine."},{"sp":"Tomás","t":"At nine? I'd never survive! Doesn't he miss his family?"},{"sp":"Sam","t":"A bit, but he said he'd made loads of friends. Before they [[sit an exam]], they study together."},{"sp":"Jose","t":"Sounds useful. When I was ill last year, I studied online for a month and started to [[fall behind]]."},{"sp":"Tomás","t":"Really? I loved online learning. I could [[hand in]] my homework from bed!"},{"sp":"Jose","t":"[[I see your point, but]] I learn much better [[in person]]. I need my classmates around me."},{"sp":"Sam","t":"Same here. It works for Oliver, too: his mum told me he'd passed maths [[with flying colours]]."},{"sp":"Tomás","t":"In my opinion, boarding schools aren't for everyone, though."},{"sp":"Jose","t":"[[I'm not sure I agree]]. I think most people would get used to it."},{"sp":"Sam","t":"So can you tell me which you'd choose: boarding school or online learning?"},{"sp":"Tomás","t":"Online, obviously. My bed is my favourite classroom!"}],"questions":[{"q":"What did Oliver tell Sam about his first days at boarding school?","opts":["He loved it immediately","He hated it at first","He wanted to study online"],"a":1},{"q":"Why didn't Jose enjoy her online lessons?","opts":["She started to fall behind","Her internet was too slow","She couldn't hand in her homework"],"a":0},{"q":"What would Tomás choose?","opts":["Boarding school","A school in Australia","Online learning"],"a":2}]},"lang":[{"e":"fall behind","t":"PV","d":"make less progress than the other people in your class","x":"I missed two weeks of school and fell behind in maths.","s":"fall beHIND"},{"e":"hand in","t":"PV","d":"give something, like homework or a phone, to a teacher or person in charge","x":"We have to hand in our essays by Friday.","s":"hand IN"},{"e":"sit an exam","t":"COL","d":"take an important test","x":"We sit our final exams in December.","s":"SIT an eXAM"},{"e":"follow the rules","t":"COL","d":"do what the rules say","x":"At my school, everyone has to follow the rules about phones.","s":"FOLlow the RULES"},{"e":"with flying colours","t":"ID","d":"very successfully, with a high mark","x":"She passed her English exam with flying colours.","s":"with FLYing COLours"},{"e":"I see your point, but…","t":"PHR","d":"a polite way to disagree after listening to someone","x":"I see your point, but I think uniforms are useful.","s":"I SEE your POINT, but"},{"e":"I'm not sure I agree.","t":"PHR","d":"a soft way to say you think differently","x":"Homework is a waste of time? I'm not sure I agree.","s":"I'm NOT SURE I aGREE"},{"e":"in person","t":"PREP","d":"physically there, not online","x":"I prefer meeting my teachers in person.","s":"in PERson"}],"pron":{"focus":"Short forms in reported speech: he'd, she'd, they'd","explain":"In reported speech we often use he'd or she'd (he had / she would). The 'd is tiny and easy to miss, so the main verb after it carries the stress: he'd PASSED, she'd HELP.","tip":"Practise in pairs: one person says the line with he had, the other with he'd. Can you hear the difference? Then both use the short form.","lines":[{"t":"He told me he'd passed his exam.","m":"he TOLD me | he'd PASSED his‿eXAM↘."},{"t":"She said she'd help me with my project.","m":"she SAID she'd HELP me with my PROject↘."},{"t":"I see your point, but I'm not sure I agree.","m":"I SEE your POINT↗ | but I'm NOT SURE I aGREE↘."}]},"acts":[{"type":"picture","prompts":["This photo was taken in a classroom in Uzbekistan. What do you know about the country?","Why do you think the pupils are laughing? What might the teacher have just said?","What do you think they are learning about with the globe?","How is their uniform similar to or different from what students wear at your school?","If you spent a term at this school, what would you want to find out first?"]},{"type":"expert","topic":"A year at a school abroad","expert":"You've just spent a year as an exchange student at a school in another country (choose Japan, Finland, Kenya or the UK). Invent details about the uniform, the timetable, the rules, the exams and the food.","journalists":"You're reporters for the school podcast. Interview the expert and take notes. Then report to the class what he or she told you: She said that… / He told us that…","questions":["Can you tell us what a normal school day was like?","Did you have to wear a uniform? What was it like?","Were the teachers strict? What happened if someone broke a rule?","How were the exams different from ours?","What did you miss most about school in Chile?","Would you recommend the experience? Why or why not?"]},{"type":"speed","motions":["School should start at ten o'clock in the morning.","Uniforms should be banned in all schools.","Homework should be optional.","Projects are better than exams.","Every student should spend one term at a school abroad.","Online learning is better than learning in person."]}],"rec":{"prompt":"Record a one-minute podcast clip: report what someone told you about their school (real or invented), then give your opinion.","model":"This week I interviewed my cousin, who goes to a boarding school in the south of Chile. He told me that the rules were really strict and that students had to hand in their phones every night. He said he'd hated it at first, but now he loves living with his friends. My sister thinks boarding schools are a great idea, but I'm not sure I agree. I don't think I could follow the rules about phones!","use":["hand in","follow the rules","I'm not sure I agree."]},"tips":[{"who":"teacher","t":"In the expert interview, make the journalists report back using reported speech. Write two columns on the board (is → was, will → would, can → could) and tick each change you hear."},{"who":"student","t":"In the speed debate, use opinion phrases to stay polite when you disagree: I see your point, but… / I'm not sure I agree. Then give a reason or an example."}]},{"id":"galaxy-0-kid","lv":"galaxy","n":0,"age":"kid","title":"Holiday News Swap","goals":["tell your holiday news using past and present tenses","talk about your plans and goals for the new school year","ask follow-up questions to keep a chat going"],"warm":["What was the best day of your summer holidays?","Did you bring back a souvenir from anywhere?","What are you looking forward to this year?","How do you feel on the first day back at school?"],"model":{"kind":"dialogue","title":"Back at the School Gate","intro":"It's the first morning of the new school year, and Leo meets Benja and Martina at the school gate.","lines":[{"sp":"Benja","t":"Leo! [[Long time no see]]! How was your summer?"},{"sp":"Leo","t":"Amazing, thanks! We went camping by a lake in the south. I learnt to fish with Dad."},{"sp":"Martina","t":"Cool! Did you catch anything?"},{"sp":"Leo","t":"Only one tiny fish. But the funniest thing happened while we were cooking dinner one night. Pipo ran into the forest!"},{"sp":"Benja","t":"Oh no! Did you find him?"},{"sp":"Leo","t":"Sofi found him asleep under a tree. He was totally fine. What about you two?"},{"sp":"Martina","t":"I stayed with my grandparents in Valparaíso. We [[hung out]] at the beach every day. [[Time flies]] when you're having fun!"},{"sp":"Benja","t":"I didn't go anywhere, but my cousins came to stay. We built a treehouse in my garden."},{"sp":"Leo","t":"A treehouse? I want to see it! Let's [[catch up]] properly at break."},{"sp":"Martina","t":"Are you two nervous about this year? I've got [[butterflies in my stomach]]."},{"sp":"Benja","t":"A little. We've got a new timetable, and I've heard there are three new pupils in our class."},{"sp":"Leo","t":"That's great! We can [[make new friends]]. And I'm really [[looking forward to]] swimming lessons on Fridays."},{"sp":"Martina","t":"Me too. Have you got any goals for this year?"},{"sp":"Leo","t":"Yes! I'm going to join the football team. What about you?"},{"sp":"Martina","t":"I'm going to read a book every month. Oh, there's the bell. Let's go!"}],"questions":[{"q":"What happened while Leo's family was cooking dinner?","opts":["Leo caught a big fish","Pipo ran into the forest","It started to rain"],"a":1},{"q":"Where did Martina spend her summer?","opts":["In Valparaíso with her grandparents","At home with her cousins","Camping in the south"],"a":0},{"q":"What is Leo looking forward to?","opts":["Reading a book every month","Building a treehouse","Swimming lessons on Fridays"],"a":2}]},"lang":[{"e":"catch up","t":"PV","d":"talk to find out each other's news","x":"Let's catch up at break. I want to hear about your trip!","s":"catch UP"},{"e":"hang out","t":"PV","d":"spend relaxed free time with friends","x":"We hung out at the park every afternoon.","s":"hang OUT"},{"e":"look forward to","t":"PV","d":"feel happy about something that is coming","x":"I'm looking forward to the school trip.","s":"look FORward to"},{"e":"time flies","t":"ID","d":"time seems to pass very quickly","x":"The holidays are over already? Time flies!","s":"TIME FLIES"},{"e":"have butterflies in your stomach","t":"ID","d":"feel nervous before something important","x":"I always have butterflies in my stomach on the first day of school.","s":"have BUTterflies in your STOMach"},{"e":"make new friends","t":"COL","d":"meet people and start to be friends with them","x":"At summer camp, I made lots of new friends.","s":"make NEW FRIENDS"},{"e":"set a goal","t":"COL","d":"decide on something you want to achieve","x":"This year I've set a goal: to read twenty books.","s":"SET a GOAL"},{"e":"Long time no see!","t":"PHR","d":"a friendly greeting when you haven't seen someone for a long time","x":"Hi, Benja! Long time no see!","s":"LONG time no SEE"}],"pron":{"focus":"Short forms in the present perfect: I've, we've, she's","explain":"In natural speech we use short forms: I've seen, we've got, she's gone. The 've and 's are quick and soft, and the main verb after them is strong.","tip":"Say the long form first (I have seen), then squeeze it into the short form (I've SEEN). Keep the main verb loud and clear.","lines":[{"t":"I've just seen my new timetable.","m":"I've JUST SEEN my NEW TIMEtable↘."},{"t":"Have you been anywhere nice?","m":"have you BEEN‿anywhere NICE↗?"},{"t":"We've got so much to catch up on!","m":"we've GOT so MUCH to catch‿UP‿on↘!"}]},"acts":[{"type":"findsomeone","items":[{"p":"went to the beach this summer","q":"Did you go to the beach this summer?"},{"p":"has learnt something new during the holidays","q":"Have you learnt something new during the holidays?"},{"p":"bought a souvenir on a trip","q":"Did you buy a souvenir on a trip?"},{"p":"was reading a book in bed last night","q":"Were you reading a book in bed last night?"},{"p":"has got a new pencil case","q":"Have you got a new pencil case?"},{"p":"usually walks to school","q":"Do you usually walk to school?"},{"p":"is going to join a new club this year","q":"Are you going to join a new club this year?"},{"p":"thinks this year will be easier than last year","q":"Do you think this year will be easier than last year?"}],"follow":["Where?","What was it like?","Why do you think so?"]},{"type":"picture","prompts":["Who are the people in the photo? Where are they?","Why do you think they are smiling? What are they talking about?","Imagine it's their first day back at school. What news are they sharing?","What do you talk about with your friends on the first day back?","How is this classroom similar to or different from yours?"]},{"type":"fluency","topics":["The best day of my summer holidays","A funny thing that happened while I was on holiday","Something I've learnt to do recently","What I'm looking forward to this year","My big goal for this school year","My favourite holiday memory"],"mins":[3,2,1]}],"rec":{"prompt":"Record your holiday news for a new classmate: say what you did, what's new at school and one goal for this year.","model":"Hi! Long time no see! This summer I went to the south with my family. We were camping next to a lake, and one night, while we were cooking dinner, our dog ran away! Luckily, my sister found him. Now I'm back at school, and I've already met two new classmates. I'm really looking forward to swimming lessons. My goal for this year is to join the football team. I think it will be a great year!","use":["Long time no see!","look forward to"]},"tips":[{"who":"teacher","t":"In the fluency activity, pupils change partners each round and tell the same story in less time. Praise them for keeping the interesting details, not only for speed."},{"who":"student","t":"Use time words to help your partner follow your story: first, then, while, suddenly, in the end."}]},{"id":"galaxy-0-teen","lv":"galaxy","n":0,"age":"teen","title":"New Term, New Faces","goals":["catch up with friends about the summer using a range of tenses","start a conversation with someone new","talk about your goals for the new term"],"warm":["What's one thing you did this summer that you'd happily do again?","How do you usually feel the night before the first day of term?","What's one thing you're looking forward to this term?","Has anything changed at school since last year?"],"model":{"kind":"dialogue","title":"The New Guy","intro":"On the first day of term, Vale and Tomás are catching up before class when the new exchange student, Sam, sits down next to them.","lines":[{"sp":"Vale","t":"Tomás! [[How have you been]]? I haven't seen you since December!"},{"sp":"Tomás","t":"Pretty good! I was working at my aunt's café most of the summer, so I didn't go anywhere."},{"sp":"Vale","t":"Lucky you. I spent two weeks at a music camp. We were rehearsing every day, but it was amazing."},{"sp":"Tomás","t":"We need to [[catch up]] properly. Shall we [[hang out]] at the skate park on Friday?"},{"sp":"Vale","t":"Definitely. Hey, I think that's the new exchange student. Let's [[break the ice]]."},{"sp":"Tomás","t":"Hi! Are you new here? I'm Tomás, and this is Vale."},{"sp":"Sam","t":"Hi, I'm Sam. I arrived from Sydney last week, so I'm still trying to [[settle in]]."},{"sp":"Vale","t":"Welcome! How are you finding Chile so far?"},{"sp":"Sam","t":"I love it, but I haven't got used to the timetable yet. In Sydney, school finished at three!"},{"sp":"Tomás","t":"Don't worry, you'll get used to it. Are you nervous?"},{"sp":"Sam","t":"A bit. I want to [[make friends]] quickly, so I'm going to try out for the volleyball team."},{"sp":"Vale","t":"You'll [[hit the ground running]], I'm sure. Have you got any other goals for this term?"},{"sp":"Sam","t":"I've [[set myself a goal]]: to speak only Spanish at lunch. Don't laugh if I make mistakes!"},{"sp":"Tomás","t":"We won't! And our goal is to help you. Right, Vale?"},{"sp":"Vale","t":"Right. Oh, here comes Mr Díaz. Let's talk more at break!"}],"questions":[{"q":"What did Tomás do last summer?","opts":["He went to a music camp","He worked at his aunt's café","He travelled to Sydney"],"a":1},{"q":"What does Sam find difficult at the moment?","opts":["Getting used to the timetable","Making friends","Understanding Mr Díaz"],"a":0},{"q":"What is Sam's goal for lunchtimes?","opts":["To sit with the volleyball team","To eat at Tomás's aunt's café","To speak only Spanish"],"a":2}]},"lang":[{"e":"catch up","t":"PV","d":"tell each other your recent news","x":"Let's get a juice after school and catch up.","s":"catch UP"},{"e":"hang out","t":"PV","d":"spend free time with friends in a relaxed way","x":"We usually hang out at the skate park on Fridays.","s":"hang OUT"},{"e":"settle in","t":"PV","d":"start to feel comfortable in a new place","x":"It took me a few weeks to settle in at my new school.","s":"settle IN"},{"e":"break the ice","t":"ID","d":"say or do something to start a conversation with new people","x":"I told a joke to break the ice with my new classmates.","s":"BREAK the ICE"},{"e":"hit the ground running","t":"ID","d":"start something new quickly and successfully","x":"She joined the team in March and hit the ground running.","s":"HIT the GROUND RUNning"},{"e":"set yourself a goal","t":"COL","d":"decide what you want to achieve","x":"I've set myself a goal: to run five kilometres by June.","s":"SET yourSELF a GOAL"},{"e":"make friends","t":"COL","d":"start new friendships","x":"Joining a club is a great way to make friends.","s":"make FRIENDS"},{"e":"How have you been?","t":"PHR","d":"a friendly question when you haven't seen someone for a while","x":"Hi! How have you been? It's been ages!","s":"how have you BEEN"}],"pron":{"focus":"Sounding interested: intonation in follow-up questions","explain":"When you catch up with friends, your voice shows you're interested. Yes/no questions and short replies like Really? usually go up ↗. Wh- questions usually go down ↘.","tip":"Say Really? twice: once in a flat voice and once with a rising tone. Notice how much friendlier the second one sounds, then use it in the lines.","lines":[{"t":"Really? Did you have a good time?","m":"REALly↗? | did you HAVE a GOOD TIME↗?"},{"t":"Are you nervous about the new term?","m":"are you NERvous about the NEW TERM↗?"},{"t":"What are you looking forward to?","m":"WHAT are you LOOKing FORward to↘?"}]},"acts":[{"type":"roulette","items":["What's the best thing you did this summer?","What were you doing at this time yesterday?","Have you ever met someone interesting while you were travelling?","What's something you've never done but want to try this year?","What are you going to do differently this term?","Which subject do you think will be the hardest this year? Why?","What souvenir would you bring back for your best friend from your dream trip?","What's a holiday memory that always makes you laugh?","How long does it take you to get used to getting up early again?","Who do you usually hang out with at weekends, and what do you do?"]},{"type":"picture","prompts":["What do you think these students are chatting about?","How would you describe the atmosphere in this classroom?","Imagine one of them has just come back from an amazing trip. What happened?","What makes a classroom a good place to learn and make friends?","Is your first day back usually like this? What's similar and what's different?"]},{"type":"devil","motions":["Summer holidays should be shorter, with more breaks during the year.","Students should be allowed to choose their own timetable.","Phones should be banned at school, even at break.","Everyone should set a goal on the first day of term.","It's better to have a few close friends than lots of people to hang out with.","The first week of term should be for fun activities only, not lessons."]}],"rec":{"prompt":"Record a voice message to a friend you haven't seen all summer: catch up on your news, say how you're settling into the new term and share one goal.","model":"Hey! How have you been? I haven't seen you since December! This summer I worked at my aunt's café, and while I was there, I learnt to make the best sandwiches in town. Now I'm back at school, and I'm still getting used to the new timetable. We've got a new classmate from Sydney, and he's really nice. I've set myself a goal for this term: I'm going to make a short film. Let's hang out soon and catch up properly!","use":["How have you been?","set yourself a goal","catch up"]},"tips":[{"who":"teacher","t":"Before the devil's advocate debate, give students two minutes to note arguments for and against. Then give out the sides at random, so they practise defending ideas they don't agree with."},{"who":"student","t":"When you catch up, don't just answer. Ask a follow-up question every time: Really? What was that like? Who did you go with?"}]},{"id":"galaxy-1-kid","lv":"galaxy","n":1,"age":"kid","title":"Never Give Up!","goals":["talk about a time something went wrong and how you bounced back","ask for and give advice","encourage a friend who wants to give up"],"warm":["What's something you're really good at? How did you learn it?","Have you ever wanted to give up something? What happened?","Who gives you the best advice when things go wrong?"],"model":{"kind":"dialogue","title":"After the Swimming Test","intro":"Martina didn't pass her swimming test this morning. At break, Leo and Kai try to cheer her up.","lines":[{"sp":"Leo","t":"Martina, what's wrong? You look really sad."},{"sp":"Martina","t":"I failed my swimming test. I was swimming the last length when I swallowed lots of water, and I stopped."},{"sp":"Kai","t":"Oh no! But you were doing so well in your lessons."},{"sp":"Martina","t":"I know. I was so nervous that I forgot to breathe properly. I think I'm going to [[give up]] swimming."},{"sp":"Leo","t":"Don't give up! Everyone [[makes mistakes]]. Last year I missed a penalty in the final, remember?"},{"sp":"Martina","t":"Yes, and everybody was cheering for you."},{"sp":"Leo","t":"Exactly. I felt terrible, but I [[bounced back]]. Now I'm the team's best penalty taker!"},{"sp":"Kai","t":"[[Keep your chin up]], Martina. When can you take the test again?"},{"sp":"Martina","t":"In three weeks. What should I do?"},{"sp":"Kai","t":"[[If I were you, I'd]] practise breathing with your teacher in every lesson."},{"sp":"Leo","t":"And [[why don't you]] come to the pool with us on Saturdays? We can practise together."},{"sp":"Martina","t":"That's a great idea. Do you really think I can pass?"},{"sp":"Kai","t":"Of course! Just [[do your best]]. [[Practice makes perfect]]!"},{"sp":"Martina","t":"Thanks, you two. Next time I'm going to swim all the way to the end!"}],"questions":[{"q":"What happened during Martina's swimming test?","opts":["She forgot her swimming hat","She swallowed water and stopped","She arrived late"],"a":1},{"q":"How did Leo feel after he missed a penalty?","opts":["Terrible, but he bounced back","Happy and proud","Angry with his team"],"a":0},{"q":"What does Kai advise Martina to do?","opts":["Give up swimming","Take the test tomorrow","Practise breathing with her teacher"],"a":2}]},"lang":[{"e":"give up","t":"PV","d":"stop trying to do something","x":"Don't give up! You're nearly there.","s":"give UP"},{"e":"bounce back","t":"PV","d":"feel good again quickly after something goes wrong","x":"We lost the first match, but we bounced back and won the next one.","s":"bounce BACK"},{"e":"keep your chin up","t":"ID","d":"stay happy and positive when things are difficult","x":"Keep your chin up! You'll do better next time.","s":"keep your CHIN UP"},{"e":"practice makes perfect","t":"ID","d":"if you do something again and again, you get very good at it","x":"I play the piano every day because practice makes perfect.","s":"PRACtice makes PERfect"},{"e":"make a mistake","t":"COL","d":"do something wrong without wanting to","x":"I made a mistake in my maths homework.","s":"make a misTAKE"},{"e":"do your best","t":"COL","d":"try as hard as you can","x":"It doesn't matter if you win. Just do your best!","s":"do your BEST"},{"e":"Why don't you…?","t":"PHR","d":"a friendly way to suggest an idea","x":"Why don't you practise with me after school?","s":"WHY DON'T you"},{"e":"If I were you, I'd…","t":"PHR","d":"a way to say what you would do in someone else's situation","x":"If I were you, I'd ask the coach for help.","s":"if I were YOU, I'd"}],"pron":{"focus":"Giving advice: strong words and linking","explain":"In advice, small words like should and you are weak, and the main verb is strong: you should TRY again. In Why don't you, the words join together and sound like 'why donchu'.","tip":"Clap on the strong words as you say each line. Then say it again, a little faster, and join the linked words.","lines":[{"t":"You should try again.","m":"you should TRY‿aGAIN↘."},{"t":"Why don't you practise with us?","m":"WHY don't‿you PRACtise with US↘?"},{"t":"If I were you, I'd ask the coach.","m":"if I were YOU↗ | I'd ASK the COACH↘."}]},"acts":[{"type":"picture","prompts":["What is the boy doing? Where is he?","How do you think he is feeling right now? Why?","What do you think happened just before this photo, and what will happen next?","Have you ever played chess or another game where you need to think hard? Did you win?","What advice would you give someone who is playing in their first chess competition?"]},{"type":"roleplay","cards":[{"sit":"Before the school play","a":"You have a big part in the school play tomorrow, but you're very nervous and you think you'll forget your words. Tell your friend how you feel and ask: What should I do?","b":"Your friend is nervous about the school play. Give two pieces of advice: You should… / Why don't you…? / If I were you, I'd… Then say something kind to give your friend confidence."},{"sit":"After the football match","a":"Your team lost the match 5–0, and you want to give up football. Tell your friend what happened.","b":"Your friend wants to give up football. Tell them about a time you made a mistake and bounced back. Give advice: Why don't you…? Don't give up!"},{"sit":"The spelling test","a":"You failed your spelling test because you didn't practise. You've got another test next Friday. Ask your friend for advice.","b":"Help your friend make a plan for next Friday. Use You should… and If I were you, I'd… Then suggest a reward if they pass, like playing their favourite game together."}]},{"type":"taboo","cards":[{"w":"mistake","taboo":["wrong","error","bad"]},{"w":"practise","taboo":["again","better","train"]},{"w":"give up","taboo":["stop","quit","try"]},{"w":"reward","taboo":["prize","present","good"]},{"w":"coach","taboo":["teacher","team","sport"]},{"w":"medal","taboo":["gold","silver","win"]},{"w":"nervous","taboo":["worried","afraid","feel"]},{"w":"confidence","taboo":["sure","believe","yourself"]},{"w":"effort","taboo":["hard","work","energy"]},{"w":"champion","taboo":["winner","first","best"]}]}],"rec":{"prompt":"Record a short story about a time something went wrong for you. Say what happened, how you bounced back and what advice you'd give a friend.","model":"Last year I was playing in a basketball match when I missed an easy shot. Our team lost, and I wanted to give up basketball. Then my coach told me that everyone makes mistakes. I started practising every day after school, and three months later, I scored the winning basket! My advice? If something goes wrong, don't give up. Keep your chin up and do your best. Practice makes perfect!","use":["give up","keep your chin up","practice makes perfect"]},"tips":[{"who":"teacher","t":"Put the three advice phrases on the board (You should… / Why don't you…? / If I were you, I'd…). In the role-play, the advice-giver must use a different phrase each time."},{"who":"student","t":"Mistakes are part of learning English too! If you make one, just correct it and keep talking."}]},{"id":"galaxy-1-teen","lv":"galaxy","n":1,"age":"teen","title":"Fail Forward","goals":["describe a setback and what you learnt from it","give and respond to advice","discuss success, failure and pressure"],"warm":["What's the biggest thing you've ever achieved?","Do you work better under pressure or with lots of time?","Who do you go to for advice? Why them?","Is it OK to give up something you don't enjoy?"],"model":{"kind":"dialogue","title":"After the Final","intro":"Jose's volleyball team lost the regional final last weekend. On Monday, she talks to Sam and Tomás in the school canteen.","lines":[{"sp":"Sam","t":"Hey, Jose. You've been quiet all morning. Are you still thinking about the final?"},{"sp":"Jose","t":"I can't stop thinking about it. We were winning the last set 23–20, and then I missed three serves in a row."},{"sp":"Tomás","t":"That could happen to anyone. You were [[under pressure]]."},{"sp":"Jose","t":"I know, but the whole team was counting on me. Honestly, I feel like [[giving up]] volleyball."},{"sp":"Sam","t":"Come on, you can't quit now! You've been training for this all year."},{"sp":"Jose","t":"But what if it happens again? I've totally lost my confidence."},{"sp":"Tomás","t":"Everybody [[makes mistakes]] in big matches. The best players are the ones who [[bounce back]]."},{"sp":"Sam","t":"Exactly. When I was playing rugby in Sydney, I dropped an easy ball in a semi-final, and we lost. I [[learnt the hard way]] that panicking only makes things worse."},{"sp":"Jose","t":"So what did you do?"},{"sp":"Sam","t":"My coach made me practise catching while the whole team shouted at me. It was awful at first, but it really [[boosted my confidence]]."},{"sp":"Jose","t":"So what should I do?"},{"sp":"Tomás","t":"[[If I were you, I'd]] ask your coach to let you practise serving while everyone's shouting."},{"sp":"Sam","t":"And why don't you watch the video of the match? You'll see exactly what went wrong."},{"sp":"Jose","t":"Maybe you're right. Perhaps losing was [[a blessing in disguise]]. Now I know what I need to work on."},{"sp":"Tomás","t":"That's the spirit! And we're coming to watch your next match."}],"questions":[{"q":"What went wrong for Jose in the final?","opts":["She missed three serves in a row","She hurt her ankle","She arrived late"],"a":0},{"q":"How did Sam's coach help him?","opts":["He let Sam miss the next match","He made Sam practise while the team shouted","He told Sam to give up rugby"],"a":1},{"q":"How does Jose feel at the end of the conversation?","
