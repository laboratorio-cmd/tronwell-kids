<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRONWELL KIDS · Talk Club</title>
<meta name="description" content="TRONWELL KIDS Talk Club: 60-minute English conversation lessons for kids and teens, one for every mission of the Practice Zone.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js" crossorigin="anonymous" defer></script>
<style>
:root{
  --ink:#111827;--gray:#526173;--gray-2:#7b8797;--line:#dce7f2;--soft:#f7faff;--tint:#eef7ff;--bg:#ffffff;
  --blue:#0066cc;--blue-2:#08a8e8;--blue-d:#004f9e;
  --orange:#f58220;--orange-d:#e56f0b;--orange-soft:#fff4e9;
  --green:#2f9e6e;--green-d:#23825a;--green-soft:#e8f6ef;--green-xs:#f4fbf7;
  --red:#d14c4c;--red-soft:#fdecec;
  --A0:#0f9ca3;--A1:#2f9e6e;--A2:#6b961b;--B1:#0a8fd6;--B2:#0066cc;--C1:#e56f0b;--C2:#8a3fc7;
  --fs:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Roboto',Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-weight:900;letter-spacing:-.025em;line-height:1.12}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block}
input,select,textarea{font-family:inherit}
.app img.emoji,main img.emoji,header img.emoji{display:inline-block!important;position:static!important;width:1em!important;height:1em!important;margin:0 .04em!important;vertical-align:-.12em!important;object-fit:contain!important;opacity:1!important;border-radius:0!important;transform:none!important;box-shadow:none!important}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header::before{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--blue),var(--blue-2) 45%,var(--green) 70%,var(--orange))}
.hw{max-width:1240px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{cursor:pointer;width:132px;display:flex;flex-direction:column}
.logo .lw{font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:26px;color:var(--blue);letter-spacing:-1px;line-height:1}
.logo .lb{position:relative;height:12px;margin-top:3px;background:linear-gradient(90deg,rgba(3,169,244,0),#6cc9f7 55%,#03a9f4);display:flex;justify-content:flex-end;align-items:center;padding-right:8px}
.logo .lb span{font-size:8px;font-weight:800;font-style:italic;color:#fff}
.logo .lb i{position:absolute;right:0;top:0;bottom:0;width:4px;background:#f7a600}
.club{font-weight:900;font-size:15px;color:var(--green-d);padding-left:14px;border-left:1px solid var(--line);letter-spacing:-.01em}
.club small{display:block;font-size:10px;font-weight:700;color:var(--gray-2);letter-spacing:.12em;text-transform:uppercase}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{font-weight:800;font-size:13.5px;padding:8px 13px;border-radius:10px;color:var(--gray)}
nav button:hover{background:var(--soft);color:var(--ink)}
nav button.on{background:var(--tint);color:var(--blue)}
nav button.nlv.on{background:var(--soft);color:var(--c);box-shadow:inset 0 -2px 0 var(--c)}
nav button.nexam{color:var(--orange-d)}
main{max-width:1240px;margin:0 auto;padding:26px 22px 80px}
footer{border-top:1px solid var(--line);text-align:center;color:var(--gray);font-size:13px;padding:24px;background:var(--soft)}
footer b{color:var(--blue)}

/* ---------- common ---------- */
.eyebrow{font-size:11.5px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--orange-d);display:flex;align-items:center;gap:9px}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--orange);border-radius:2px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;font-weight:800;font-size:14.5px;padding:12px 20px;border-radius:11px;transition:filter .15s,transform .1s,box-shadow .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.or{background:var(--orange);box-shadow:0 8px 20px rgba(245,130,32,.25)}
.btn.gr{background:var(--green)}
.btn.soft{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.soft:hover{border-color:var(--blue);color:var(--blue)}
.btn.sm{font-size:13px;padding:8px 13px;border-radius:9px}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{font-weight:800;font-size:13.5px;color:var(--gray);padding:6px 0;margin-bottom:12px}
.back:hover{color:var(--blue)}
.sec{margin-top:52px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.sec-h h2{font-size:30px}
.sec-h p{color:var(--gray);margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--blue);border:1px solid #d6e8fa}
.chip.g{background:var(--green-soft);color:var(--green-d);border-color:#cdebdc}
.chip.o{background:var(--orange-soft);color:var(--orange-d);border-color:#fbdcc0}
.lvtag{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:26px;padding:0 9px;border-radius:8px;font-weight:900;font-size:13px;color:#fff;background:var(--c,var(--blue))}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,calc(100% + 60px));visibility:hidden;background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;font-size:14px;z-index:99;transition:transform .3s,visibility .3s;max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0);visibility:visible}
.empty{text-align:center;color:var(--gray);padding:40px;border:1px dashed var(--line);border-radius:16px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:34px;align-items:center;padding:14px 0 8px}
.hero h1{font-size:clamp(38px,5vw,60px);margin:12px 0 14px}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero h1 span{color:var(--green)}
.hero p.lead{font-size:17px;color:var(--gray);max-width:520px}
.hero .ph{position:relative;border-radius:26px;overflow:hidden;height:360px;background:var(--tint);box-shadow:0 20px 50px rgba(0,102,204,.14)}
.hero .ph img{width:100%;height:100%;object-fit:cover}
.hero .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(8,168,232,.18),rgba(47,158,110,.12) 55%,rgba(245,130,32,.18))}
.bubble{position:absolute;z-index:2;background:#fff;border-radius:16px;padding:10px 14px;font-weight:800;font-size:14px;box-shadow:0 12px 28px rgba(17,24,39,.14)}
.bubble.a{left:-18px;bottom:38px;color:var(--orange-d)}
.bubble.b{right:16px;top:20px;color:var(--blue)}
.bubble.c{right:-10px;bottom:-12px;color:var(--green-d)}
.stats{display:flex;gap:28px;margin-top:24px;flex-wrap:wrap}
.stats b{font-size:30px;font-weight:900;display:block;color:var(--ink);letter-spacing:-.03em}
.stats span{font-size:11.5px;font-weight:800;color:var(--gray-2);text-transform:uppercase;letter-spacing:.08em}
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.lv{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s;text-align:left}
.lv:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(0,102,204,.12)}
.lv .im{height:150px;position:relative;overflow:hidden;background:var(--tint)}
.lv .im img{width:100%;height:100%;object-fit:cover}
.lv .im::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(17,24,39,.45),transparent 60%)}
.lv .tag{position:absolute;left:16px;top:16px;z-index:1;font-weight:900;font-size:26px;color:#fff;background:var(--c);border-radius:14px;padding:2px 14px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.lv .bd{padding:18px 20px 20px}
.lv h3{font-size:21px;margin-bottom:6px}
.lv p{color:var(--gray);font-size:14px}
.lv .go{margin-top:12px;font-weight:900;color:var(--c);font-size:13.5px;display:flex;justify-content:space-between}
.lv .go small{color:var(--gray-2);font-weight:700}
.doms{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.dom{border:1px solid var(--line);border-radius:20px;padding:20px;background:linear-gradient(160deg,#fff,var(--soft))}
.dom .di{font-size:28px}
.dom h3{font-size:19px;margin:8px 0 4px}
.dom p{font-size:13.5px;color:var(--gray)}
.dom .tps{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dom .tps span{font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.flow{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.flow > div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 10px;position:relative}
.flow .m{position:absolute;right:10px;top:10px;font-size:11px;font-weight:900;color:var(--orange-d)}
.flow .ic{font-size:20px}
.flow b{display:block;font-size:13px;margin-top:6px;line-height:1.2}
.flow span{font-size:11.5px;color:var(--gray);line-height:1.35;display:block;margin-top:3px}
.ctas{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:16px;border-radius:22px;padding:24px 26px;flex-wrap:wrap}
.cta.exam{background:linear-gradient(110deg,#fff4e9,#fff)}
.cta.bank{background:linear-gradient(110deg,var(--green-soft),#fff)}
.cta h3{font-size:22px}
.cta p{color:var(--gray);font-size:14px;max-width:420px}

/* ---------- level page ---------- */
.lvhead{border-radius:24px;padding:26px 30px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;background:linear-gradient(110deg,var(--hb),#fff);border:1px solid var(--line)}
.lvhead .big{font-size:64px;font-weight:900;color:var(--c);line-height:1;letter-spacing:-.04em}
.lvhead h1{font-size:32px}
.lvhead p{color:var(--gray);font-weight:500;max-width:640px}
.lvhead .can{margin-left:auto;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;font-size:13px;color:var(--gray)}
.lvhead .can b{display:block;color:var(--green-d);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.fbar{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 4px}
.fchip{border:1px solid var(--line);background:#fff;color:var(--gray);border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px}
.fchip:hover{border-color:var(--blue);color:var(--blue)}
.fchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dgroup{margin-top:26px}
.dgroup h3{font-size:19px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dgroup h3 small{font-size:12px;font-weight:700;color:var(--gray-2);letter-spacing:0}
.topics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tp{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s;text-align:left;position:relative}
.tp:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,102,204,.12)}
.tp .im{height:132px;overflow:hidden;position:relative;background:var(--tint)}
.tp .im img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.tp:hover .im img{transform:scale(1.05)}
.tp .ic{position:absolute;left:12px;bottom:-16px;width:40px;height:40px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.tp .done{position:absolute;right:10px;top:10px;background:var(--green);color:#fff;font-size:11px;font-weight:900;padding:4px 9px;border-radius:999px}
.tp .bd{padding:22px 16px 16px}
.tp small{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-2)}
.tp h3{font-size:17px;margin:4px 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- lesson ---------- */
.lhero{position:relative;border-radius:26px;overflow:hidden;height:280px;background:var(--tint)}
.lhero img{width:100%;height:100%;object-fit:cover}
.lhero .ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,30,60,.86) 0%,rgba(10,30,60,.45) 60%,rgba(10,30,60,.08));display:flex;flex-direction:column;justify-content:flex-end;padding:28px 32px;color:#fff}
.lhero .meta{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.lhero .meta span{font-size:12px;font-weight:800;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(4px)}
.lhero .meta span.lvb{background:var(--c)}
.lhero h1{font-size:clamp(28px,4vw,44px)}
.lhero .goals{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.lhero .goals span{font-size:12.5px;font-weight:600;background:rgba(47,158,110,.85);padding:4px 11px;border-radius:999px}
.credit{position:absolute;right:12px;top:10px;font-size:10px;color:rgba(255,255,255,.85);background:rgba(17,24,39,.4);padding:2px 8px;border-radius:10px;z-index:2}
.credit a{color:inherit}
.ltools{position:sticky;top:66px;z-index:30;display:flex;gap:4px;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);padding:8px 10px;margin:14px 0 6px;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 20px rgba(16,35,63,.05)}
.ltools a{font-size:12.5px;font-weight:800;color:var(--gray);text-decoration:none;padding:6px 9px;border-radius:9px;white-space:nowrap}
.ltools a:hover{background:var(--tint);color:var(--blue)}
.ltools a.now{background:var(--orange-soft);color:var(--orange-d)}
.ltools .rt{margin-left:auto;display:flex;gap:4px;align-items:center}
.ltools .rt button{min-width:34px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:12.5px;padding:0 8px}
.ltools .clk{font-weight:900;font-variant-numeric:tabular-nums;font-size:15px;min-width:52px;text-align:center}
.ltools .clk.run{color:var(--orange-d)}
.lbody{font-size:var(--fs)}
.blk{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px 26px;margin-top:18px;scroll-margin-top:130px;box-shadow:0 3px 14px rgba(16,35,63,.025)}
.blk-h{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.blk-h .n{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;background:linear-gradient(135deg,var(--blue),var(--blue-2));color:#fff}
.blk-h h2{font-size:1.45em}
.blk-h .tag{margin-left:auto;font-size:12px;font-weight:900;color:var(--orange-d);background:var(--orange-soft);padding:4px 11px;border-radius:999px}
.blk-h .tag.self{color:var(--green-d);background:var(--green-soft)}
.ins{color:var(--gray);margin-bottom:16px;font-size:.95em}
.tnote{background:var(--green-xs);border-left:3px solid var(--green);border-radius:0 10px 10px 0;padding:9px 13px;font-size:.86em;color:var(--gray);margin:-4px 0 16px}
.tnote b{color:var(--green-d)}
.warm{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.warm div{background:var(--tint);border:1px solid #d6e8fa;border-radius:16px;padding:16px 18px;font-weight:700;font-size:1.05em;display:flex;gap:12px;align-items:flex-start}
.warm div b{color:var(--blue);font-size:1.3em;font-weight:900;line-height:1}

/* model input */
.model{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}
.dlg{display:flex;flex-direction:column;gap:10px}
.ln{display:flex;gap:10px;align-items:flex-start}
.ln .sp{flex-shrink:0;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.8em;color:#fff;background:var(--blue)}
.ln.s1 .sp{background:var(--green)}.ln.s2 .sp{background:var(--orange)}
.ln .bb{background:var(--soft);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 14px;cursor:pointer;transition:background .15s;max-width:620px}
.ln .bb:hover{border-color:#bcd6f0}
.ln .bb small{display:block;font-size:.72em;font-weight:900;color:var(--gray-2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.ln.reading .bb,.para.reading{background:#fff7d6;border-color:#f3dd8b}
.para{font-size:1.02em;line-height:1.75;margin-bottom:12px;padding:4px 8px;border-radius:8px;cursor:pointer}
mark.tl{background:linear-gradient(transparent 55%,#ffe0b8 55%);color:inherit;font-weight:700;cursor:help;border-radius:2px;padding:0 1px}
.mside{display:flex;flex-direction:column;gap:12px}
.mside .im{height:180px;border-radius:16px;overflow:hidden;background:var(--tint)}
.mside .im img{width:100%;height:100%;object-fit:cover}

/* language */
.tfilter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.lang{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ex{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:#fff;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-content:start}
.ex .ty{grid-column:1/-1;font-size:10.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.ty.PV{color:var(--blue)}.ty.ID{color:var(--orange-d)}.ty.COL{color:#7a5cd6}.ty.PREP{color:var(--green-d)}
.ex .e{font-size:1.18em;font-weight:900;color:var(--ink);letter-spacing:-.01em}
.ex .st{font-size:.8em;font-weight:700;color:var(--gray-2);letter-spacing:.02em}
.ex .d{grid-column:1/-1;font-size:.93em}
.ex .x{grid-column:1/-1;font-size:.9em;color:var(--gray);font-style:italic;border-left:3px solid var(--green-soft);padding-left:10px;margin-top:4px}
.ex .uk{grid-column:1/-1;font-size:.8em;font-weight:700;color:#7a5cd6;background:#f4f1ff;border-radius:8px;padding:3px 8px;justify-self:start;margin-top:4px}
.say{width:38px;height:38px;border-radius:11px;background:var(--orange-soft);border:1px solid #fbdcc0;font-size:16px;align-self:start;grid-row:2/4;grid-column:2}
.say:hover{background:#ffe6cf}
.say.on{background:var(--orange);color:#fff}
.stk{grid-column:1/-1;display:none;background:var(--orange-soft);border-radius:10px;padding:6px 10px;font-weight:800;color:var(--orange-d);font-size:.9em}
.stk.show{display:block}

/* functional language */
.func{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.phrases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.phrases button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--green-xs);border:1px solid #d3ecdf;border-radius:12px;padding:10px 12px;transition:.15s}
.phrases button:hover{border-color:var(--green)}
.phrases b{font-size:1em;color:var(--ink)}
.phrases span{font-size:.8em;color:var(--green-d);font-weight:700}
.taskcard{background:linear-gradient(160deg,var(--blue-d),var(--blue) 60%,var(--blue-2));color:#fff;border-radius:18px;padding:18px 20px}
.taskcard small{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#ffd4ae}
.taskcard p{margin-top:6px;font-weight:600;line-height:1.5}

/* pronunciation */
.pron{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.pbox{background:var(--tint);border-radius:16px;padding:16px 18px}
.pbox h3{font-size:1.1em;color:var(--blue)}
.pbox p{font-size:.92em;margin-top:6px}
.pbox .tip{margin-top:10px;background:#fff;border-radius:10px;padding:8px 12px;font-size:.88em;border:1px dashed #b9d8f3}
.plines{display:flex;flex-direction:column;gap:8px}
.pl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.pl .m{flex:1;min-width:220px;font-size:1.12em;font-weight:500;letter-spacing:.01em}
.pl .m .lk{color:var(--orange-d);font-weight:900}
.pl .m .ar{color:var(--green-d);font-weight:900}
.pl .m .ps{color:var(--gray-2)}
.pl > button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-weight:800;font-size:.82em}
.pl > button:hover{border-color:var(--blue);color:var(--blue)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8em;color:var(--gray);margin-top:10px}

/* activities */
.stage{background:linear-gradient(135deg,var(--tint),var(--green-xs) 55%,var(--orange-soft));border-radius:20px;padding:28px;text-align:center;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.big-card{background:#fff;border-radius:18px;padding:22px 26px;font-size:1.35em;font-weight:800;box-shadow:0 10px 26px rgba(17,24,39,.08);max-width:720px;width:100%;line-height:1.35}
.big-card small{display:block;font-size:.5em;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--orange-d);margin-bottom:8px}
.counter{font-size:13px;font-weight:800;color:var(--gray)}
.timer{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.ring{--p:100;width:88px;height:88px;border-radius:50%;background:conic-gradient(var(--orange) calc(var(--p)*1%),#fde3cb 0);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring span{width:70px;height:70px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;font-variant-numeric:tabular-nums}
.ring.done{background:conic-gradient(var(--red) 100%,var(--red) 0)}
.ring.g{background:conic-gradient(var(--green) calc(var(--p)*1%),#cfeee0 0)}
.wyr{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;width:100%;max-width:780px}
.wyr .opt{background:#fff;border:2px solid transparent;border-radius:18px;padding:22px 18px;font-size:1.15em;font-weight:800;min-height:120px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(17,24,39,.07);transition:.15s}
.wyr .opt:hover{border-color:var(--blue-2)}
.wyr .opt.pick{border-color:var(--orange);background:var(--orange-soft)}
.wyr .or{font-size:1.3em;font-weight:900;color:var(--orange-d)}
.vote{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.vote button{background:#fff;border:2px solid var(--line);border-radius:12px;padding:9px 16px;font-weight:800;font-size:.95em}
.vote button.pick{border-color:var(--blue);background:var(--tint);color:var(--blue)}
.phr{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.phr span{font-size:.84em;font-weight:700;background:#fff;border:1px dashed var(--green);color:var(--green-d);padding:5px 11px;border-radius:999px}
.spin{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--blue) 0 45deg,var(--green) 45deg 90deg,var(--orange) 90deg 135deg,var(--blue-2) 135deg 180deg,var(--blue) 180deg 225deg,var(--green) 225deg 270deg,var(--orange) 270deg 315deg,var(--blue-2) 315deg);display:flex;align-items:center;justify-content:center;transition:transform 1.4s cubic-bezier(.2,.8,.2,1);box-shadow:0 10px 26px rgba(17,24,39,.12)}
.spin span{width:72px;height:72px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:var(--blue)}
.cards3{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cards3 div{background:#fff;border-radius:14px;padding:12px 16px;font-weight:800;font-size:1.05em;box-shadow:0 6px 18px rgba(17,24,39,.08);border-top:4px solid var(--blue-2)}
.cards3 div:nth-child(2){border-top-color:var(--orange)}.cards3 div:nth-child(3){border-top-color:var(--green)}
.pic{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start;text-align:left;width:100%}
.pic img{width:100%;height:300px;object-fit:cover;border-radius:18px}
.plist{display:flex;flex-direction:column;gap:10px}
.plist div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:700;display:flex;gap:10px}
.plist div b{color:var(--orange-d)}
.rank{display:flex;flex-direction:column;gap:8px;max-width:580px;width:100%;margin:0 auto}
.ri{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:800;transition:background .3s}
.ri .num{width:32px;height:32px;border-radius:9px;background:var(--tint);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:900}
.ri .t{flex:1;text-align:left}
.ri button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--soft);font-weight:800}
.ri.moved{background:var(--orange-soft)}
.rp{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;text-align:left}
.rpc{background:#fff;border-radius:16px;padding:16px 18px;border:1px solid var(--line)}
.rpc .who{font-size:11.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;color:var(--blue)}
.rpc.b .who{color:var(--orange-d)}
.rpc .hid{background:repeating-linear-gradient(45deg,var(--tint),var(--tint) 10px,#fff 10px,#fff 20px);border-radius:12px;padding:20px;text-align:center;color:var(--gray);font-weight:800;cursor:pointer;width:100%}
.rpc.b .hid{background:repeating-linear-gradient(45deg,var(--orange-soft),var(--orange-soft) 10px,#fff 10px,#fff 20px)}
.rpc dl{font-size:.95em}
.rpc dt{font-size:.75em;font-weight:900;color:var(--gray-2);text-transform:uppercase;letter-spacing:.08em;margin-top:8px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tabs button{padding:7px 14px;border-radius:10px;font-weight:800;border:1px solid var(--line);background:#fff;font-size:.88em}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.side{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:1.1em;padding:8px 18px;border-radius:999px;background:var(--green);color:#fff}
.side.against{background:var(--red)}
.rounds{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rounds button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:900}
.rounds button.on{border-color:var(--orange);background:var(--orange-soft);color:var(--orange-d)}
.rounds button.ok{border-color:var(--green);background:var(--green-soft);color:var(--green-d)}
.taboo{background:#fff;border-radius:20px;padding:22px 28px;box-shadow:0 10px 26px rgba(17,24,39,.1);min-width:280px;border-top:6px solid var(--orange)}
.taboo .w{font-size:1.6em;font-weight:900;color:var(--blue)}
.taboo ul{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:6px}
.taboo li{font-weight:800;color:var(--red);text-decoration:line-through;text-decoration-thickness:2px}
.score{font-weight:900;font-size:1.1em;color:var(--green-d)}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.role{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;transition:.2s}
.role b{display:block;font-size:1.02em}
.role span{font-size:.85em;color:var(--gray)}
.role.out{opacity:.35;text-decoration:line-through}
.role.on{border-color:var(--orange);background:var(--orange-soft)}
.qlist{display:flex;flex-direction:column;gap:8px;width:100%;max-width:720px;text-align:left}
.qlist div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700}
.qlist div b{color:var(--blue);margin-right:6px}
.check{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.check label{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.88em;cursor:pointer}
.check input{accent-color:var(--green)}

/* exercises */
.exs{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.exs > .exc:first-child{grid-row:span 2}
.exc{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}
.exc h3{font-size:1.02em;margin-bottom:4px}
.exc p.h{font-size:.82em;color:var(--gray);margin-bottom:10px}
.gi{font-size:.95em;margin-bottom:10px;line-height:2.15}
.gi input{display:inline-block;width:175px;max-width:100%;margin:0 5px;vertical-align:baseline;border:1.5px solid var(--line);border-radius:7px;padding:3px 8px;font-size:.95em;font-weight:700;color:var(--blue);outline:none}
.gi input:focus{border-color:var(--blue)}
.gi input.ok{border-color:var(--green);background:var(--green-soft);color:var(--green-d)}
.gi input.no{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.gi .ans{margin-left:6px;font-size:.82em;font-weight:800;color:var(--green-d)}
.bankw{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.bankw span{font-size:.78em;font-weight:800;background:var(--orange-soft);color:var(--orange-d);border-radius:999px;padding:3px 9px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt div{display:flex;flex-direction:column;gap:6px}
.mi{border:1.5px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 10px;font-size:.86em;font-weight:700;text-align:left;transition:.12s}
.mi:hover{border-color:var(--blue)}
.mi.sel{border-color:var(--orange);background:var(--orange-soft)}
.mi.ok{border-color:var(--green);background:var(--green-soft);color:var(--green-d);pointer-events:none}
.mi.bad{border-color:var(--red);background:var(--red-soft)}
.fx{margin-bottom:12px;font-size:.95em}
.fx .w{display:inline-block;border-radius:5px;padding:1px 1px;cursor:pointer;transition:.12s}
.fx .w:hover{background:var(--tint)}
.fx .w.hit{background:var(--green-soft);color:var(--green-d);font-weight:800}
.fx .w.miss{background:var(--red-soft);color:var(--red);text-decoration:line-through}
.fx .fixed{display:block;font-size:.85em;font-weight:800;color:var(--green-d);margin-top:3px}
.exsc{font-size:.85em;font-weight:900;color:var(--green-d);margin-left:8px}

/* record */
.recbox{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.recq{background:var(--tint);border-radius:16px;padding:16px 18px}
.recq b{display:block;font-size:1.1em;line-height:1.35}
.recq .use{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.recctl{display:flex;flex-direction:column;gap:10px}
.mic{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#fff;border-radius:999px;padding:11px 20px;font-weight:900;font-size:.95em;align-self:flex-start}
.mic.rec{background:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(209,76,76,.5)}70%{box-shadow:0 0 0 12px rgba(209,76,76,0)}100%{box-shadow:0 0 0 0 rgba(209,76,76,0)}}
.recs{display:flex;flex-direction:column;gap:6px}
.recs div{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.86em;font-weight:700}
.recs audio{height:34px;flex:1;min-width:0}
.modelans{background:var(--green-xs);border:1px solid #d3ecdf;border-radius:14px;padding:14px 16px;font-size:.95em;line-height:1.65}
.notice{background:#fff4e5;border:1px solid #f3d3a7;border-radius:10px;padding:9px 12px;font-size:.88em}
.notice a{color:var(--blue);font-weight:800}

/* use it, quiz, tips */
.useit{display:flex;flex-wrap:wrap;gap:8px}
.ui{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:.9em;transition:.15s}
.ui:hover{border-color:var(--blue-2)}
.ui.on{background:var(--green-soft);border-color:var(--green);color:var(--green-d)}
.ui.on::before{content:"✓ "}
.meter{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
.bar{flex:1;min-width:200px;height:12px;border-radius:999px;background:#e5eef7;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:999px;transition:width .35s}
.meter b{font-size:1.15em;font-weight:900}
.msg{font-weight:800;color:var(--green-d)}
.qz{display:flex;flex-direction:column;gap:12px}
.q{border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.q .qt{font-weight:800;margin-bottom:10px}
.q .qt span{color:var(--orange-d);margin-right:6px}
.q .qt em{font-style:normal;color:var(--blue)}
.qo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qo button{text-align:left;background:var(--soft);border:2px solid var(--line);border-radius:11px;padding:9px 12px;font-weight:700;font-size:.92em;transition:.12s}
.qo button:hover{border-color:var(--blue-2)}
.qo button.ok{background:var(--green-soft);border-color:var(--green);color:var(--green-d)}
.qo button.no{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.qo.lock button{pointer-events:none}
.qf{font-size:.86em;font-weight:700;margin-top:8px;display:none}
.qf.show{display:block}
.qscore{display:none;text-align:center;background:linear-gradient(110deg,var(--tint),var(--green-soft));border-radius:18px;padding:20px;margin-top:6px}
.qscore b{font-size:38px;font-weight:900;display:block}
.wrap2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tips{display:flex;flex-direction:column;gap:10px}
.tip{display:flex;gap:12px;background:var(--green-xs);border:1px solid #d3ecdf;border-radius:14px;padding:12px 14px;font-size:.94em}
.tip .ti{font-size:1.3em}
.tip b{display:block;font-size:.75em;font-weight:900;color:var(--green-d);letter-spacing:.1em;text-transform:uppercase}
.tip.t{background:var(--tint);border-color:#d6e8fa}.tip.t b{color:var(--blue)}
.self label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-weight:600;font-size:.95em;cursor:pointer}
.self input{width:18px;height:18px;accent-color:var(--green);margin-top:2px;flex-shrink:0}
.cefr{margin-top:12px;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:.86em;color:var(--gray)}
.cefr b{color:var(--ink)}
.lnav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}

/* bank */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.filters input,.filters select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 14px;font-size:15px;color:var(--ink);outline:none}
.filters input{flex:1;min-width:220px}
.filters input:focus,.filters select:focus{border-color:var(--blue)}
.bcount{font-size:13px;font-weight:800;color:var(--gray);margin-bottom:10px}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.src{grid-column:1/-1;display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.src button{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--tint);color:var(--blue);border:1px solid #d6e8fa}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fcard{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:#fff}
.fcard h4{font-size:1em;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.fcard ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.fcard li{font-size:.9em;cursor:pointer}
.fcard li:hover{color:var(--blue)}
.fcard li span{color:var(--gray-2);font-size:.85em}

/* exam zone */
.ezhero{border-radius:26px;overflow:hidden;position:relative;min-height:240px;background:linear-gradient(120deg,#14325a,#0066cc 60%,#08a8e8);color:#fff;display:flex;align-items:flex-end}
.ezhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.28}
.ezhero .in{position:relative;padding:30px 34px}
.ezhero h1{font-size:clamp(30px,4vw,46px)}
.ezhero p{color:#dce8f4;max-width:620px;margin-top:8px}
.exams{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
.exams .exam{display:flex;flex-direction:column;justify-content:flex-start;border:1px solid var(--line);border-radius:22px;padding:22px;background:#fff;cursor:pointer;transition:transform .18s,box-shadow .18s;text-align:left}
.exams .exam:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(0,102,204,.12)}
.exams .exam h2{font-size:26px}
.exams .exam .parts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.exams .exam .parts div{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px}
.exams .exam .parts b{min-width:62px;color:var(--orange-d)}
.etabs{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0 6px;border-bottom:1px solid var(--line);padding-bottom:10px}
.etabs button{padding:9px 16px;border-radius:10px;font-weight:900;font-size:14px;color:var(--gray)}
.etabs button.on{background:var(--blue);color:#fff}
.cue{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:18px 22px;max-width:560px;text-align:left;box-shadow:6px 6px 0 var(--tint)}
.cue h3{font-size:1.15em;margin-bottom:8px}
.cue ul{padding-left:1.2em;margin:6px 0}
.cue li{margin:3px 0}
.notes{width:100%;max-width:560px;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.95em;outline:none}
.crit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.crit div{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:#fff}
.crit h4{color:var(--blue)}
.crit p{font-size:.92em;color:var(--gray);margin:6px 0}
.crit ul{padding-left:1.1em;font-size:.9em}
.etips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.etips div{background:var(--green-xs);border:1px solid #d3ecdf;border-radius:12px;padding:10px 12px;font-size:.92em}
.sentence{font-size:1.3em;font-weight:800}
.hidden-s{filter:blur(7px);user-select:none}
.phase{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--orange-d)}

@media(max-width:1100px){.lang,.bgrid,.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.topics{grid-template-columns:repeat(3,minmax(0,1fr))}.flow{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:860px){
  .hero,.pic,.rp,.model,.func,.pron,.recbox,.wrap2,.exams,.ctas,.doms{grid-template-columns:1fr}
  .levels,.warm,.qo,.exs,.crit,.etips{grid-template-columns:1fr}
  .exs > .exc:first-child{grid-row:auto}
  .topics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .roles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wyr{grid-template-columns:1fr}.wyr .or{text-align:center}
  .hero .ph{height:250px}.bubble.a{left:10px}.bubble.c{right:10px}
  .ltools{position:static}
  main{padding:18px 14px 50px}.blk{padding:18px}.stage{padding:18px}
  .lvhead .can{margin-left:0}
}
@media(max-width:560px){header{position:static}.hw{gap:8px 14px}nav{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}nav::-webkit-scrollbar{display:none}nav button{flex-shrink:0;padding:7px 10px;font-size:13px}.topics,.lang,.bgrid,.fgrid,.phrases,.roles,.mt{grid-template-columns:1fr}.flow{grid-template-columns:repeat(2,minmax(0,1fr))}nav{margin-left:0}.lhero{height:240px}}

/* ---------- 7 levels, Spanish support, new activities ---------- */
.lv .esb{position:absolute;right:12px;top:12px;z-index:1;background:rgba(255,255,255,.95);color:var(--ink);font-size:11.5px;font-weight:800;border-radius:999px;padding:4px 10px}
.lv h3{font-size:19px}
.lv p{font-size:13px}
.lvhead .esnote{font-size:13.5px;color:var(--green-d);font-weight:700;margin-top:6px}
.lsearch{margin-left:auto;min-width:220px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;outline:none;background:#fff}
.lsearch:focus{border-color:var(--blue)}
.dom .dlow{display:block;font-size:12px;font-weight:800;color:var(--green-d);margin-bottom:4px}
.dom .tps span.more{background:var(--green-soft);border-color:#cfeadc;color:var(--green-d)}
.lbody .es,.ex .es{display:block;font-size:.84em;font-weight:500;font-style:italic;color:#5b6b7d;margin-top:3px;letter-spacing:0;text-transform:none;line-height:1.4}
.lbody .ins .es{margin-top:4px}
.lbody .phrases .es{color:#5b6b7d;font-weight:500}
.lbody .taskcard .es{color:rgba(255,255,255,.88)}
.lbody.noes .es{display:none}
.ex .esd{font-style:normal;font-weight:700;color:var(--green-d)}
.ltools .rt .esbtn{opacity:.55}
.ltools .rt .esbtn.on{opacity:1;background:var(--green-soft);border-color:#bfe3cf;color:var(--green-d)}
/* Find someone who… */
.fsw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
.fsc{display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;cursor:text;transition:.15s}
.fsc small{font-size:.72em;font-weight:800;color:var(--gray-2);text-transform:uppercase;letter-spacing:.06em}
.fsc b{font-size:1em;line-height:1.3}
.fsc .fq{font-size:.82em;font-weight:700;color:var(--blue)}
.fsw.noq .fq{visibility:hidden}
.fsc input{border:1.5px dashed var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:.9em;font-weight:700;color:var(--green-d);outline:none;margin-top:auto}
.fsc input:focus{border-color:var(--blue);border-style:solid}
.fsc.ok{background:var(--green-xs);border-color:var(--green)}
.fsc.ok input{border-style:solid;border-color:var(--green);background:#fff}
.phr .lbl{border:0;background:none;color:var(--gray);padding:5px 2px}
/* Guess the secret word */
.gboard{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:760px}
.gboard button{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:800;font-size:1em;transition:.15s}
.gboard button:hover{border-color:var(--blue)}
.gboard button.x{opacity:.35;text-decoration:line-through;background:var(--soft)}
.score.over{color:var(--red)}
.gsecret{width:100%;max-width:420px;text-align:center}
.gsecret .h{font-size:.85em;color:var(--gray);margin:10px 0 6px}
.gsecret p{font-size:1.4em;font-weight:900;color:var(--blue)}
@media(max-width:1100px){.levels{grid-template-columns:repeat(3,minmax(0,1fr))}.fsw{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){.levels{grid-template-columns:repeat(2,minmax(0,1fr))}.lsearch{margin-left:0;width:100%}}
@media(max-width:560px){.levels{grid-template-columns:1fr}.fsw{grid-template-columns:1fr}}
.lbody .pbox .tip{gap:8px}

},{"t":"How are you?","m":"how‿ARE‿you↘?"},{"t":"I'm fine, thanks.","m":"I'm FINE | THANKS↘."}]},"acts":[{"type":"guess","cat":"Greetings","items":["hello","goodbye","good morning","good night","thank you","please","yes","no","nice to meet you","see you tomorrow"],"frames":["Is it…?","Do you say it in the morning?","Do you say it at night?","Do you say it to a new friend?"]},{"type":"roleplay","cards":[{"sit":"First day: there's a new student in your class.","a":"You are the new student. Say hello and your name. Answer: I'm fine, thanks. Then say: Nice to meet you too.","b":"You are a student in the class. Say hello and ask: What's your name? How are you? Then say: Nice to meet you."},{"sit":"A video call with a friend in Sydney.","a":"You are in Chile and it's morning. Say: Good morning! How are you?","b":"You are in Sydney and it's night. Say: Hi! I'm fine, thanks, but I'm tired. Good night!"},{"sit":"You meet your friend's cousin at the skate park.","a":"You are the friend. Say: Hi! I'm… What's your name? At the end, say: Goodbye! See you!","b":"You are the cousin. Say: Hello! My name's… Nice to meet you. At the end, say: Bye!"}]},{"type":"roulette","items":["What's your name? Have you got a nickname? (My nickname is…)","How are you today? (I'm fine / great / a bit tired.)","Who is your best friend? (My best friend is…)","What do you say to your teacher in the morning? (Good morning, …!)","What do you say to your family before bed? (Good night, …!)","Do you say hi or hello to your friends? (I say…)","How do you say thank you in two languages? (Gracias and thank you!)","Is it morning or night in Sydney now? (I think it's…)","Who is a new friend this year? (… is a new friend.)"]}],"rec":{"prompt":"Record a short hello video for a new exchange student. Say hello, your name and how you are. Then introduce a friend and say goodbye.","prompt_es":"Graba un video corto para saludar a un estudiante de intercambio nuevo. Saluda, di tu nombre y cómo estás. Luego presenta a rthday"],["keep your old teddy bear","give it to a little cousin"],["play ball games at the beach","do puzzles at home"]]}],"rec":{"prompt":"Describe your bedroom: say three things you've got and where they are.","prompt_es":"Describe tu dormitorio: di tres cosas que tienes y dónde están.","model":"I've got an old teddy bear. It's on the shelf. My bike is in the garage. And my kite? It's under the bed, I think!","use":["shelf","kite","under the bed"]},"tips":[{"who":"teacher","t":"Ask students to bring a photo of an old toy. They show it and say: This is my old… It's in a box under my bed now.","es":"Pide a los estudiantes que traigan una foto de un juguete de cuando eran pequeños. La muestran y dicen: This is my old… It's in a box under my bed now."},{"who":"student","t":"Use in, on and under every day: say where your phone, keys and bag are.","es":"Usa in, on y under todos los días: di dónde están tu celular, tus llaves y tu mochila."}]},{"id":"tiny-7-kid","lv":"tiny","n":7,"age":"kid","title":"Family Photo Fun","goals":["introduce your family with This is my…","say who people are with He's my… and She's my…"],"goals_es":["presentar a tu familia con This is my…","decir quién es cada persona con He's my… y She's my…"],"warm":["Have you got a brother or a sister?","How many people are in your family?","Have you got a pet?","Who is tall in your family?"],"warm_es":["¿Tienes un hermano o una hermana?","¿Cuántas personas hay en tu familia?","¿Tienes una mascota?","¿Quién es alto en tu familia?"],"model":{"kind":"dialogue","title":"Photos on the Fridge","intro":"Benja is at Leo's house. He looks at the family photos on the fridge.","intro_es":"Benja está en la casa de Leo. Mira las fotos de la familia en el refrigerador.","lines":[{"sp":"Benja","t":"[[Who's this]], Leo?","es":"¿Quién es ella, Leo?"},{"sp":"Leo","t":"[[She's my]] [[aunt]]. She's very funny!","es":"Es mi tía. ¡Es muy divertida!"},{"sp":"Benja","t":"And who's the [[baby]]?","es":"¿Y quién es el bebé?"},{"s hh!","tip":"Put your hand in front of your mouth. Can you feel the air in He's?","tip_es":"Pon la mano frente a la boca. ¿Sientes el aire en He's?","lines":[{"t":"This is my mum.","m":"this‿is my MUM↘."},{"t":"He's my brother.","m":"HE'S my BROther↘."},{"t":"She's my sister.","m":"SHE'S my SIster↘."}]},"acts":[{"type":"findsomeone","items":[{"p":"has got a brother","q":"Have you got a brother?"},{"p":"has got a sister","q":"Have you got a sister?"},{"p":"has got a baby in the family","q":"Have you got a baby in your family?"},{"p":"has got a cousin","q":"Have you got a cousin?"},{"p":"has got an uncle","q":"Have you got an uncle?"},{"p":"has got an aunt","q":"Have you got an aunt?"},{"p":"has got a big family","q":"Have you got a big family?"},{"p":"lives with a grandma or a grandpa","q":"Do you live with your grandma or grandpa?"}],"follow":["What's his name? / What's her name?","How old is he? / How old is she?"]},{"type":"picture","prompts":["Who can you see in the photo? I can see a mum, a dad and…","How many children can you see?","Where are they: at home, at school or in the park?","Are they happy? Look at their faces!","Do you like picnics? Who goes on picnics with you?"]},{"type":"roleplay","cards":[{"sit":"At the park: A meets B's family","a":"You are A. Point and ask: Who's he? Who's she? Is she your sister?","b":"You are B. Your family is at the park. Answer: He's my dad. She's my grandma. Yes, she's my sister!"},{"sit":"A family photo","a":"You are A. Show your family photo and say: This is my family. This is my mum. He's my brother.","b":"You are B. Look at the photo and ask: Who's he? Is she your aunt? Then say: Your family is great!"},{"sit":"Grandma's birthday party","a":"You are A. Introduce your grandma to your friend: This is my grandma. She's 70 today!","b":"You are B. Say: Hello! Happy birthday! Then ask A: Is he your grandpa? Is she your aunt?"}]}],"rec":{"prompt":"Show a family photo or draw your family. Introduce three people.","prompt_es":"Muestra una foto de tu familia o dibuja a tu familia. Presenta a tres personas.","model":"This is my family. This is my mum. She's funny. He's my brother, Diego. He's six. And she's my grandma. I love my family!","use":["He's my…","She's my…","I love…"]},"tips":[{"who":"teacher","t":"Families are all different. Students can talk about any people they love, or draw a family of animals or cartoon characters.","es":"Todas las familias son diferentes. Los estudiantes pueden hablar de cualquier persona que quieran, o dibujar una familia de animales o de personajes de dibujos animados."},{"who":"student","t":"Use he for a boy or a man and she for a girl or a woman. Check before you speak!","es":"Usa he para un niño o un hombre, y she para una niña o una mujer. ¡Revisa antes de hablar!"}]},{"id":"tiny-7-teen","lv":"tiny","n":7,"age":"teen","title":"Who's in the Photo?","goals":["introduce people with This is my…","say who people are and one thing about them: He's my uncle. He's a chef."],"goals_es":["presentar a personas con This is my…","decir quién es cada persona y algo sobre ella: He's my uncle. He's a chef."],"warm":["Have you got brothers or sisters?","Who is a good cook in your family?","Have you got family photos on your phone?","Who is funny in your family?"],"warm_es":["¿Tienes hermanos o hermanas?","¿Quién cocina bien en tu familia?","¿Tienes fotos de tu familia en tu celular?","¿Quién es divertido en tu familia?"],"model":{"kind":"dialogue","title":"The Sunday Barbecue","intro":"Jose shows Sam a photo of her family's Sunday barbecue.","intro_es":"Jose le muestra a Sam una foto del asado familiar del domingo.","lines":[{"sp":"Jose","t":"Look! [[This is my]] family at our Sunday barbecue.","es":"¡Mira! Esta es mi familia en nuestro asado del domingo."},{"sp":"Sam","t":"Cool! [[Who's that]]? The tall man?","es":"¡Genial! ¿Quién es ese? ¿El hombre alto?"},{"sp":"Jose","t":"[[He's my]] [[uncle]], Rodrigo. He's a chef.","es":"Es mi tío, Rodrigo. Es chef."},{"sp":"Sam","t":"And who's she, with the baby?","es":"¿Y quién es ella, la que está con el bebé?"},{"sp":"Jose","t":"[[She's my]] [[aunt]]. The baby is my new [[cousin]].","es":"Es mi tía. El bebé es mi nuevo primo."},{"sp":"Sam","t":"And are they your [[grandparents]]?","es":"¿Y ellos son tus abuelos?"},{"sp":"Jose","t":"Yes! My grandma is 75. She plays volleyball with me!","es":"¡Sí! Mi abuela tiene 75 años. ¡Juega vóleibol conmigo!"},{"sp":"Sam","t":"[[No way]]! Your family is awesome!","es":"¡No puede ser! ¡Tu familia es increíble!"}],"questions":[{"q":"Who is the tall man?","opts":["Jose's dad","Jose's uncle","Jose's cousin"],"a":1},{"q":"Who is the baby?","opts":["Jose's new cousin","Jose's brother","Sam's cousin"],"a":0},{"q":"What does Jose's grandma do with Jose?","opts":["She cooks","She takes photos","She plays volleyball"],"a":2}]},"lang":[{"e":"This is my…","t":"PHR","d":"you say this to introduce a person","x":"This is my friend Sam. He's from Sydney.","s":"THIS is my","es":"Este / Esta es mi…"},{"e":"Who's that?","t":"PHR","d":"a question about a person you don't know","x":"Who's that? — She's my sister.","s":"WHO'S THAT","es":"¿Quién es?"},{"e":"He's my… / She's my…","t":"PHR","d":"you say this to explain who a person is","x":"He's my brother and she's my cousin.","s":"HE'S my / SHE'S my","es":"Él es mi… / Ella es mi…"},{"e":"No way!","t":"PHR","d":"you say this when you are very surprised","x":"Your grandpa can skateboard? No way!","s":"NO WAY","es":"¡No puede ser!"},{"e":"uncle","t":"VOC","d":"your mum's or dad's brother","x":"My uncle makes great empanadas.","s":"UNcle","es":"tío"},{"e":"aunt","t":"VOC","d":"your mum's or dad's sister","x":"My aunt lives in Concepción.","s":"AUNT","es":"tía"},{"e":"cousin","t":"VOC","d":"the child of your aunt or uncle","x":"My cousin and I play volleyball on Saturdays.","s":"COUsin","es":"primo / prima"},{"e":"grandparents","t":"VOC","d":"your grandma and your grandpa","x":"I visit my grandparents on Sundays.","s":"GRANDparents","es":"abuelos"}],"pron":{"focus":"Short forms: He's, She's, Who's","explain":"He's, She's and Who's are one short word. The 's at the end sounds like a bee: zzz.","explain_es":"He's, She's y Who's son una sola palabra corta. La 's del final suena como una abeja: zzz.","tip":"In She's, push your lips forward: shhh. In He's, just breathe out: hhh.","tip_es":"En She's, adelanta los labios: shhh. En He's, solo suelta el aire: hhh.","lines":[{"t":"Who's that?","m":"WHO'S THAT↘?"},{"t":"He's my uncle.","m":"HE'S my‿UNcle↘."},{"t":"She's my aunt.","m":"SHE'S my‿AUNT↘."}]},"acts":[{"type":"guess","cat":"Family","items":["mum","dad","brother","sister","grandma","grandpa","baby","uncle","aunt","cousin"],"frames":["Is it a man or a woman?","Is he / she old?","Is it your mum's sister?","Is it…?"]},{"type":"picture","prompts":["Who can you see in the photo? I can see a mum, a dad and…","Where are they: at home, at the beach or in a park?","Who has got the phone for the selfie?","Do you take selfies with your family? Where?","Is a picnic in the park a good family plan for you? Why / Why not?"]},{"type":"ranking","task":"Rank these family plans from 1 (the best) to 7. Then tell a partner: Number one is… because…","items":["a barbecue at Grandma's house","a picnic in the park","a film night at home","a day at the beach","a family football match","cooking empanadas together","a trip to Valparaíso"]}],"rec":{"prompt":"Choose a photo with your family or friends. Introduce three people and say one thing about each person.","prompt_es":"Elige una foto con tu familia o tus amigos. Presenta a tres personas y di algo de cada una.","model":"This is my family at the beach. This is my dad. He's a taxi driver. She's my aunt, Carmen. She's very funny. And he's my little brother. He loves football, like me!","use":["This is my…","He's my… / She's my…","aunt"]},"tips":[{"who":"teacher","t":"Some students prefer not to talk about their family. Let them use a famous family from a series or a .","m":"and a PENcil case | for my ART class↘."}]},"acts":[{"type":"findsomeone","items":[{"p":"has got a blue pen","q":"Have you got a blue pen?"},{"p":"has got scissors in their bag","q":"Have you got scissors in your bag?"},{"p":"has got stickers on their pencil case","q":"Have you got stickers on your pencil case?"},{"p":"has got a notebook for every subject","q":"Have you got a notebook for every subject?"},{"p":"likes art class","q":"Do you like art class?"},{"p":"has got a calculator","q":"Have you got a calculator?"},{"p":"has got a new school bag","q":"Have you got a new school bag?"},{"p":"draws in their notebook","q":"Do you draw in your notebook?"}],"follow":["What colour is it?","Can I see it?"]},{"type":"ranking","task":"Rank these school things from 1 (very important) to 7 (not very important). Then tell a partner: Number one is… because…","items":["a pen","a notebook","a calculator","coloured pencils","an eraser","a ruler","a pencil case"]},{"type":"roleplay","cards":[{"sit":"At the school shop","a":"You are the shop assistant. Say: Hello! Can I help you? … Here you are. It's 1,000 pesos.","b":"You are a student with a school list. Ask: Have you got a ruler? What's this? Then say: Thank you!"},{"sit":"In class: no pen!","a":"You haven't got a pen. Ask your partner: Have you got a pen, please?","b":"Give A a pen and say: Here you are. Then point to a thing on A's desk and ask: What's this?"},{"sit":"The box of lost things","a":"You are Mr Díaz. Take a thing out of the box and ask: What's this? Is it your…?","b":"You are a student. Answer: It's a…! Yes, it's my… / No, it isn't."}]}],"rec":{"prompt":"Show your desk or your pencil case. Name five things and say one thing about each.","prompt_es":"Muestra tu escritorio o tu estuche. Nombra cinco cosas y di algo de cada una.","model":"This is my pencil case. What's this? It's a black pen. It's for my notebook. This is an eraser. It's small and white. And here's my ruler. I've got scissors too, for art clas
