use we have maths first thing on Mondays now."},{"sp":"Leo","t":"But we have science twice a week. I'm going to love that!"},{"sp":"Benja","t":"Look, who's that boy next to Ms Rojas? He looks a bit lost."},{"sp":"Leo","t":"I think he's new. Let's go and say hello. Hi! I'm Leo, and this is Benja."},{"sp":"Nico","t":"Hi! I'm Nico. My family moved here from Antofagasta in January."},{"sp":"Benja","t":"Welcome! Do you like football? We always play [[at break time]]."},{"sp":"Nico","t":"I love it! I played in a team back home."},{"sp":"Martina","t":"Hi, everyone! Who's this?"},{"sp":"Leo","t":"Martina, [[let me introduce you to]] Nico. He's in our class now."},{"sp":"Martina","t":"Hi, Nico! Don't worry, you'll [[make friends]] really quickly here."},{"sp":"Nico","t":"Thanks! I think I'm going to like this school."}],"questions":[{"q":"What did Benja learn to do in the summer?","opts":["Swim underwater","Ride a horse","Play the drums"],"a":1},{"q":"Why did Benja have butterflies in his stomach?","opts":["He was nervous about the new timetable","He had a football match after school","He didn't know anyone in his class"],"a":0},{"q":"Where did Nico's family move from?","opts":["The south of Chile","Sydney","Antofagasta"],"a":2}]},"lang":[{"e":"catch up","t":"PV","d":"talk to a friend about everything that happened while you were apart","x":"Benja and I caught up at break time.","s":"catch UP"},{"e":"settle in","t":"PV","d":"start to feel happy and relaxed in a new place","x":"Nico is settling in really well at our school.","s":"settle IN"},{"e":"make friends","t":"COL","d":"meet new people and start to like each other","x":"It's easy to make friends in the football club.","s":"make FRIENDS"},{"e":"set a goal","t":"COL","d":"decide on something you want to do or get better at","x":"Let's set a goal for this term: one new book every week!","s":"set a GOAL"},{"e":"have butterflies in your stomach","t":"ID","d":"feel nervous before something important or new","x":"I had butterflies in my stomach before my first swimming lesson.","s":"have BUTterflies in your STOMach"},{"e":"Let me introduce you to…","t":"PHR","d":"what you say when you help two people meet for the first time","x":"Martina, let me introduce you to my cousin Kai.","s":"let me introDUCE you to"},{"e":"How was your summer?","t":"PHR","d":"a friendly question about someone's holidays","x":"Hi, Benja! How was your summer?","s":"HOW was your SUMmer"},{"e":"at break time","t":"PREP","d":"during the short rest between lessons","x":"We always play football at break time.","s":"at BREAK time"}],"pron":{"focus":"Questions that go up and down","explain":"Yes/no questions usually go up at the end: Are you nervous↗? Questions with words like how, what and where usually go down at the end: How was your summer↘?","tip":"Draw an arrow in the air with your finger as you ask each question: up for yes/no questions, down for wh- questions.","lines":[{"t":"How was your summer?","m":"HOW was your SUMmer↘?"},{"t":"Are you going to join a club?","m":"are you GOing to JOIN‿a CLUB↗?"},{"t":"Where did you go in the holidays?","m":"WHERE did you GO‿in the HOLidays↘?"}]},"acts":[{"type":"picture","prompts":["Where are the students going? How do you know?","What do you think they are carrying in their backpacks?","How do you think they are feeling: excited, nervous or tired? Why?","What's the weather like in the photo? What was the weather like on your first day back?","What did you put in your school bag on the first day this year?"]},{"type":"findsomeone","items":[{"p":"went to the beach in the summer holidays","q":"Did you go to the beach in the summer holidays?"},{"p":"learnt something new this summer","q":"Did you learn something new this summer?"},{"p":"felt nervous on the first day of term","q":"Did you feel nervous on the first day of term?"},{"p":"is going to join a club this year","q":"Are you going to join a club this year?"},{"p":"has a new classmate this year","q":"Do you have a new classmate this year?"},{"p":"likes the new timetable","q":"Do you like the new timetable?"},{"p":"is reading a good book at the moment","q":"Are you reading a good book at the moment?"},{"p":"thinks this year will be easy","q":"Do you think this year will be easy?"}],"follow":["What did you do?","Why?","Can you tell me more?"]},{"type":"fluency","topics":["The best day of my summer holidays","My favourite and least favourite lessons on the new timetable","Three goals for this term and how I'm going to reach them","How to make friends with a new classmate","What I think this year will be like"],"mins":[3,2,1]}],"rec":{"prompt":"Record a welcome-back message for the class blog. Say what you did in the summer holidays, how you felt on the first day and what your goals are for this term.","model":"Hi, everyone! My summer holidays were brilliant. I stayed with my grandma by the sea, and I learnt to swim underwater. On the first day of term I had butterflies in my stomach, but I caught up with my friends at break time and I felt much better. This term I'm going to join the art club. I also want to improve my reading, so I'm going to read a book every week. I think this year will be amazing!","use":["have butterflies in your stomach","catch up","at break time"]},"tips":[{"who":"teacher","t":"Before the fluency activity, talk for one minute about your own summer and goals so students hear past, present and future forms together. Then students speak for 3, 2 and 1 minutes, each time with a new partner."},{"who":"student","t":"Use the past simple for your holidays (I went, I learnt), the present simple for your new timetable (We have science on Tuesdays) and going to for your plans (I'm going to join the art club)."}]},{"id":"comet-0-teen","lv":"comet","n":0,"age":"teen","title":"New Term, Fresh Start","goals":["catch up with friends about your summer holidays","talk about your plans and goals for the new term","give ideas to help a new student settle in"],"warm":["What was the best thing you did this summer?","How did you feel the night before the first day of term?","What's one thing you're looking forward to this year?","Is there anything new at your school this year?"],"model":{"kind":"dialogue","title":"The First-Day Video Call","intro":"It's the evening of the first day of term, and Vale, in Santiago, is on a video call with her friend Tomás in Concepción.","lines":[{"sp":"Vale","t":"Tomás! You're online at last! [[What have you been up to]]?"},{"sp":"Tomás","t":"Sorry! I was at my uncle's house in the countryside, and the wi-fi was terrible. I spent the whole summer skateboarding."},{"sp":"Vale","t":"Sounds perfect. So, how was your first day back?"},{"sp":"Tomás","t":"Better than I expected. I was nervous because I'm in a new class, but a guy called Felipe [[broke the ice]] by asking about my skateboard."},{"sp":"Vale","t":"Nice! Do you think you'll [[settle in]] quickly?"},{"sp":"Tomás","t":"I'm getting there. What about you? Any news?"},{"sp":"Vale","t":"Loads! We've got a new timetable with music on Fridays, so I'm already [[looking forward to]] the end of the week."},{"sp":"Tomás","t":"Ha! Are you going to join any clubs this year?"},{"sp":"Vale","t":"Yes, I've [[signed up for]] the school band. I'm going to play the keyboard. What about your goals?"},{"sp":"Tomás","t":"I've [[set myself a goal]]: I'm going to make a short film with my new classmates."},{"sp":"Vale","t":"That's a brilliant way to [[make a good impression]]!"},{"sp":"Tomás","t":"I hope so! Anyway, let's [[catch up]] properly at the weekend. I want to hear everything."},{"sp":"Vale","t":"Deal. I think this year will be great for both of us!"}],"questions":[{"q":"Why was Tomás offline all summer?","opts":["He lost his phone","The wi-fi at his uncle's house was terrible","He was too busy making films"],"a":1},{"q":"How did Felipe break the ice?","opts":["He asked Tomás about his skateboard","He invited Tomás to join the school band","He told a funny story in class"],"a":0},{"q":"What is Vale going to do in the school band?","opts":["Sing","Play the drums","Play the keyboard"],"a":2}]},"lang":[{"e":"catch up","t":"PV","d":"talk with someone about all the news since you last saw them","x":"Let's get a snack after school and catch up.","s":"catch UP"},{"e":"settle in","t":"PV","d":"get used to a new school, class or home and feel comfortable there","x":"It took Sam a few weeks to settle in, but now he loves it here.","s":"settle IN"},{"e":"sign up for","t":"PV","d":"put your name on a list to join an activity","x":"I've signed up for the drama club this term.","s":"sign UP for"},{"e":"look forward to","t":"PV","d":"feel excited about something that is going to happen","x":"I'm really looking forward to the school trip in May.","s":"look FORward to"},{"e":"set yourself a goal","t":"COL","d":"decide on something you want to achieve","x":"I've set myself a goal: I'm going to run 5 km by June.","s":"set yourSELF a GOAL"},{"e":"make a good impression","t":"COL","d":"make people think good things about you","x":"Sam made a good impression by learning everyone's names on his first day.","s":"make a GOOD imPRESSion"},{"e":"break the ice","t":"ID","d":"say or do something to help people relax when they first meet","x":"Our teacher broke the ice with a funny quiz about the summer.","s":"break the ICE"},{"e":"What have you been up to?","t":"PHR","d":"an informal question about what someone has been doing recently","x":"Hey, it's been ages! What have you been up to?","s":"WHAT have you been UP to"}],"pron":{"focus":"Linking sounds","explain":"When a word ends in a consonant sound and the next word starts with a vowel sound, we join them: been‿up, signed‿up, catch‿up‿at. This makes your English sound smooth and natural.","tip":"Say each line slowly with the links, then faster and faster until each linked group sounds like one long word.","lines":[{"t":"What have you been up to?","m":"WHAT have you been‿UP to↘?"},{"t":"I've signed up for the band.","m":"I've SIGNED‿UP for the BAND↘."},{"t":"Let's catch up at the weekend.","m":"let's CATCH‿UP‿at the weekEND↘."}]},"acts":[{"type":"roulette","items":["What was the best thing that happened in your summer holidays?","Did you learn anything new over the summer? What was it?","What are you reading, watching or listening to at the moment?","What do you usually do on the evening before the first day of term?","Which lesson on your new timetable are you looking forward to most? Why?","Are you going to sign up for any clubs or teams this year? Which ones?","What's one thing you're going to do differently this year?","How do you usually break the ice with someone new?","What do you think will be the hardest part of this year?","What advice would you give a new student to help them settle in?"]},{"type":"ranking","task":"A new student is starting at your school next week. Rank these ideas from most to least helpful, then explain your top three to your partner: I think … is the most helpful because …","items":["Show them around the school on their first day","Add them to the class group chat","Invite them to sit with you at lunch","Introduce them to people with the same hobbies","Explain the timetable and the school rules","Invite them to join a club or team","Ask them about their old school and city"]},{"type":"speed","motions":["The summer holidays should be shorter.","School should start at ten o'clock in the morning.","Every student should join at least one club.","It's better to sit next to someone new than next to your best friend.","Setting goals at the start of the year is a waste of time.","Students should choose some of their own lessons."]}],"rec":{"prompt":"Record a voice note for a friend who lives in another city. Tell them about your summer, how your first days back went and your goals for this term.","model":"Hey! Sorry I've been offline. What have you been up to? My summer was quiet but fun. I went camping with my cousins and learnt to surf, badly! The first day back was strange because we've got a new timetable, but I'm settling in. I've signed up for the volleyball team, and my main goal is to get better marks in maths. I think it's going to be a busy term, but I'm really looking forward to it. Let's catch up properly soon!","use":["settle in","sign up for","look forward to"]},"tips":[{"who":"teacher","t":"In the speed debate, give each pair 60 seconds per motion, then rotate partners so students talk to as many classmates as possible. It's a great way to break the ice at the start of term."},{"who":"student","t":"Mix your tenses to make your news interesting: what you did (past simple), what you're doing these days (present continuous) and what you're going to do (going to)."}]},{"id":"comet-1-kid","lv":"comet","n":1,"age":"kid","title":"Screen Smart","goals":["talk about how you use tablets, phones and computers","say what you enjoy, can't stand and want to do on screens","give tips to stay safe online"],"warm":["How much screen time do you have on a school day?","What's your favourite app or game? Why?","Do you enjoy video calls with your family?","What do you do when you're bored and there are no screens?"],"model":{"kind":"dialogue","title":"A Call from Sydney","intro":"After school, Leo is having a video call with his cousin Kai in Sydney.","lines":[{"sp":"Kai","t":"Hi, Leo! Can you hear me? It's seven in the morning here, so I'm having breakfast."},{"sp":"Leo","t":"Hi, Kai! It's five o'clock here, and I'm doing my homework. Well, I'm trying to."},{"sp":"Kai","t":"Trying? What's wrong?"},{"sp":"Leo","t":"I've got a new football game, and I really enjoy playing it. I [[was glued to the screen]] all weekend!"},{"sp":"Kai","t":"Ha! My mum has a rule: one hour of [[screen time]] a day, and then I have to [[log off]]."},{"sp":"Leo","t":"Only one hour? Don't you want to play more?"},{"sp":"Kai","t":"Sometimes, but I've learnt to stop. Now I spend more time playing table tennis."},{"sp":"Leo","t":"Good idea. But first I need to finish my homework, and I can't stand doing maths!"},{"sp":"Kai","t":"Why don't you [[look up]] a video about it? That really helps me."},{"sp":"Leo","t":"Maybe. Oh, and I want to change my password. Benja knows it!"},{"sp":"Kai","t":"Leo! You have to [[keep it secret]], even from your best friend."},{"sp":"Mum","t":"Leo, [[it's time to]] [[switch off]] the tablet and finish your homework."},{"sp":"Leo","t":"[[Just five more minutes]], Mum, please! I'm talking to Kai!"},{"sp":"Kai","t":"Go on, Leo! Bye! Let's play online on Saturday."}],"questions":[{"q":"What time is it in Sydney?","opts":["Five o'clock in the afternoon","Seven in the morning","Seven in the evening"],"a":1},{"q":"What is Kai's mum's rule?","opts":["One hour of screen time a day","No games at the weekend","No video calls during breakfast"],"a":0},{"q":"Why does Leo want to change his password?","opts":["He forgot it","It's too long","Benja knows it"],"a":2}]},"lang":[{"e":"log off","t":"PV","d":"leave a game, website or computer system when you finish using it","x":"Remember to log off when you finish on the school computer.","s":"log OFF"},{"e":"switch off","t":"PV","d":"make a machine stop working, for example with a button","x":"I switch off my tablet at seven o'clock.","s":"switch OFF"},{"e":"look up","t":"PV","d":"find information in a book or on the internet","x":"Benja looked up the word in an online dictionary.","s":"look UP"},{"e":"screen time","t":"COL","d":"the time you spend looking at phones, tablets and computers","x":"My screen time is about one hour a day.","s":"SCREEN time"},{"e":"keep something secret","t":"COL","d":"not tell something to anyone","x":"Always keep your password secret.","s":"keep something SEcret"},{"e":"be glued to the screen","t":"ID","d":"look at a screen for a long time and not want to stop","x":"Sofi is glued to the screen when her favourite cartoon is on.","s":"be GLUED to the SCREEN"},{"e":"Just five more minutes!","t":"PHR","d":"what you say when you want to keep playing a bit longer","x":"Just five more minutes, Dad, please!","s":"JUST FIVE more MINutes"},{"e":"It's time to…","t":"PHR","d":"words you use to say that something must happen now","x":"It's time to switch off the tablet and go to bed.","s":"it's TIME to"}],"pron":{"focus":"The -ing sound","explain":"The -ing ending is one soft sound made at the back of your mouth and through your nose, as in playing and chatting. Don't add a hard g at the end, and don't change it to a short n sound.","tip":"Put a finger on the side of your nose and say sing. You should feel a little buzz on the -ng. Keep that buzz in every -ing word.","lines":[{"t":"I really enjoy playing games.","m":"I REALly enJOY PLAYing GAMES↘."},{"t":"I can't stand doing maths!","m":"I CAN'T STAND DOing MATHS↘!"},{"t":"Are you chatting with Kai?","m":"are you CHATting with KAI↗?"}]},"acts":[{"type":"taboo","cards":[{"w":"password","taboo":["secret","word","account"]},{"w":"charger","taboo":["battery","phone","power"]},{"w":"app","taboo":["phone","program","download"]},{"w":"notification","taboo":["alert","screen","message"]},{"w":"download","taboo":["internet","copy","file"]},{"w":"online","taboo":["internet","connected","offline"]},{"w":"video call","taboo":["see","talk","camera"]},{"w":"tablet","taboo":["screen","computer","touch"]},{"w":"log off","taboo":["stop","finish","computer"]},{"w":"screen time","taboo":["hours","phone","tablet"]}]},{"type":"wyr","items":[["play a video game for an hour","play football outside for an hour"],["have no tablet for a week","have no sweets for a week"],["watch cartoons on a big TV","watch cartoons on a small tablet"],["make a funny video with your friends","draw a comic with your friends"],["learn to make your own game","learn to make your own cartoon"],["read a book on a tablet","read a paper book"],["have a video call with your cousin","write a letter to your cousin"]]},{"type":"pitch","brief":"Your team is inventing a new app that helps kids enjoy their screens AND have time for other things. Plan it together, then present it to the class in two minutes. Use: Our app helps kids to… / Kids will enjoy… / You can use it to…","ideas":["An app that switches off games when it's time for homework","A game that you can only play outside, walking or running","An app that reminds you to drink water and move your body","A homework helper that explains maths with funny videos","A family app that plans screen-free activities for the weekend"],"questions":["What is the name of your app?","What does it do?","Who is it for, and how old are they?","Why will kids enjoy using it?","How does it help kids stop being glued to the screen?","Is it free? Why or why not?"]}],"rec":{"prompt":"Record a short message about your screen time. Say what you enjoy doing on screens, what your family's rules are and one thing you want to change.","model":"On school days, my screen time is about one hour. I really enjoy playing football games and having video calls with my grandma. Sometimes I'm glued to the screen and I forget to do my homework! My family has two rules: no tablets at dinner, and I have to log off at seven o'clock. I want to spend more time outside, so I've decided to play in the park every Saturday morning.","use":["screen time","be glued to the screen","log off"]},"tips":[{"who":"teacher","t":"Play Taboo in teams of three: one student describes and two guess. Encourage full sentences such as You use it when… and It's something that…"},{"who":"student","t":"After enjoy, can't stand and finish, use -ing: I enjoy playing. After want, decide and learn, use to: I want to play."}]},{"id":"comet-1-teen","lv":"comet","n":1,"age":"teen","title":"Notifications Off","goals":["talk about your digital habits and how you want to change them","give your opinion about phones and social media","discuss how to stay safe and kind online"],"warm":["What's the first thing you do when you wake up?","Which app do you use the most? What do you use it for?","Have you ever tried to spend a whole day without your phone? How did it go?","How do you feel when your battery is about to die?"],"model":{"kind":"dialogue","title":"The Screen-Time Report","intro":"Jose and Sam are working on their digital-habits project in the school library.","lines":[{"sp":"Jose","t":"Sam, look at this. My phone says I spent six hours a day online last week!"},{"sp":"Sam","t":"Six hours? What were you doing?"},{"sp":"Jose","t":"Mostly coding, I promise! But I also [[scroll through]] videos before bed and [[lose track of time]]."},{"sp":"Sam","t":"Same here. I [[check my phone]] every time it buzzes, even in class."},{"sp":"Jose","t":"I know! And [[I can't stand it when]] notifications interrupt me while I'm concentrating."},{"sp":"Sam","t":"So why don't you [[turn them off]]? I've decided to try it this week."},{"sp":"Jose","t":"Good idea. I want to [[cut down on]] social media too. Some of the comments are really mean."},{"sp":"Sam","t":"Yeah, there was some cyberbullying in our class group chat last term. Mr Díaz talked to everyone about it."},{"sp":"Jose","t":"That's why I always [[think twice]] before I [[post a photo]] of someone else."},{"sp":"Sam","t":"Me too. I take loads of photos, so I always ask people first."},{"sp":"Jose","t":"OK, let's make a deal. No phones while we're doing homework this week."},{"sp":"Sam","t":"Deal! But can I use mine to take photos for our project?"},{"sp":"Jose","t":"Only if you avoid opening any other apps!"}],"questions":[{"q":"How long did Jose spend online every day last week?","opts":["About two hours","Six hours","Ten hours"],"a":1},{"q":"What has Sam decided to try this week?","opts":["Turning off his notifications","Deleting his social media apps","Leaving his phone at home"],"a":0},{"q":"What does Sam do before he posts a photo of someone?","opts":["He edits it","He shows it to Mr Díaz","He asks them first"],"a":2}]},"lang":[{"e":"scroll through","t":"PV","d":"move quickly through posts, pages or videos on a screen","x":"I scrolled through my feed for an hour without noticing.","s":"SCROLL through"},{"e":"turn off","t":"PV","d":"stop a device or a setting from working","x":"I turn off my notifications when I'm studying.","s":"turn OFF"},{"e":"cut down on","t":"PV","d":"do or use less of something","x":"I'm trying to cut down on screen time before bed.","s":"cut DOWN on"},{"e":"check your phone","t":"COL","d":"look at your phone to see if you have new messages","x":"I try not to check my phone during lessons.","s":"CHECK your PHONE"},{"e":"post a photo","t":"COL","d":"share a picture on social media","x":"Always ask your friends before you post a photo of them.","s":"post a PHOto"},{"e":"lose track of time","t":"ID","d":"stop noticing how much time is passing","x":"I lost track of time watching videos and missed the bus.","s":"lose TRACK of TIME"},{"e":"think twice","t":"ID","d":"think very carefully before you decide to do something","x":"Think twice before you share your location online.","s":"think TWICE"},{"e":"I can't stand it when…","t":"PHR","d":"a way to say that something really annoys you","x":"I can't stand it when people check their phones at dinner.","s":"I CAN'T STAND it when"}],"pron":{"focus":"Weak to","explain":"In natural speech, to before a verb is usually weak and quick, like tuh, not a long too. We don't stress it. The verbs around it get the stress: WANT to CUT, deCIDed to TURN.","tip":"Read each line to a partner. Your partner listens only for to: it should be short and soft, almost hidden between the stressed words.","lines":[{"t":"I want to cut down on social media.","m":"I WANT to cut DOWN on SOcial MEdia↘."},{"t":"I've decided to turn off my notifications.","m":"I've deCIDed to turn OFF my notifiCAtions↘."},{"t":"Do you enjoy scrolling through videos?","m":"do you enJOY SCROLLing through VIdeos↗?"}]},"acts":[{"type":"picture","prompts":["What do you think the students are looking at on the phone? What makes you think so?","How do you think they are feeling? Describe their faces and body language.","Do you think this photo was taken during a lesson or at break time? Why?","When was the last time you and your friends crowded round one phone? What were you watching?","Should students be allowed to use phones in class for projects? Why or why not?"]},{"type":"findsomeone","items":[{"p":"checks their phone as soon as they wake up","q":"Do you check your phone as soon as you wake up?"},{"p":"has turned off most of their notifications","q":"Have you turned off most of your notifications?"},{"p":"enjoys making videos","q":"Do you enjoy making videos?"},{"p":"is trying to cut down on screen time","q":"Are you trying to cut down on screen time?"},{"p":"changes their passwords regularly","q":"Do you change your passwords regularly?"},{"p":"deleted an app last month","q":"Did you delete an app last month?"},{"p":"wants to learn to code","q":"Do you want to learn to code?"},{"p":"puts their phone on silent at night","q":"Do you put your phone on silent at night?"}],"follow":["Why?","How often?","Has it helped you?"]},{"type":"devil","motions":["Phones should be banned at school, even at break time.","Students under 16 shouldn't use social media.","Online friends are just as real as friends at school.","Video games are a waste of time.","Parents should be able to read their children's messages.","Everybody should have one screen-free day a week."]}],"rec":{"prompt":"Record a short voice note about your digital habits. Say what you enjoy doing online, what you can't stand, and one change you've decided to make.","model":"I spend about four hours a day online, mostly watching videos and chatting with friends. I really enjoy making short films on my phone, but I can't stand it when notifications interrupt me while I'm editing. The worst thing is that I often lose track of time at night. So I've decided to make a change: from now on, I'm going to turn off my phone at ten o'clock and leave it in the kitchen. I hope to sleep better!","use":["I can't stand it when…","lose track of time","turn off"]},"tips":[{"who":"teacher","t":"In the devil's advocate activity, students argue the opposite of what they really think. Give them one minute to prepare and suggest phrases like Some people say…, but… and Have you thought about…?"},{"who":"student","t":"Check the verb that comes next: enjoy, avoid and can't stand take -ing (I avoid using my phone in bed), while want, decide and hope take to (I've decided to turn it off)."}]},{"id":"comet-2-kid","lv":"comet","n":2,"age":"kid","title":"Storm Reporters","goals":["describe wild weather and say what happened in a storm","tell a weather story with was and were + -ing","make suggestions with Why don't we…? and give advice with You should…"],"warm":["What's the weather like today?","What's your favourite kind of weather? Why?","Have you ever got caught in the rain? What happened?","What do you wear when it's freezing?"],"model":{"kind":"dialogue","title":"A Stormy Saturday","intro":"It's Saturday afternoon, and Leo and Sofi are at home with Grandma Ana while a big storm passes over the city.","lines":[{"sp":"Sofi","t":"Leo, look out of the window! It's [[raining cats and dogs]]!"},{"sp":"Leo","t":"I know. And listen to that [[strong wind]]! Benja and I were going to play football in the park."},{"sp":"Sofi","t":"What were you doing when the thunder started? I was painting, and I jumped!"},{"sp":"Leo","t":"I was reading my comic. Pipo ran under the bed!"},{"sp":"Grandma Ana","t":"Poor Pipo. The forecast said there was going to be [[heavy rain]] all afternoon."},{"sp":"Leo","t":"Why didn't you tell us, Grandma? I left my football in the garden."},{"sp":"Grandma Ana","t":"I did tell you, Leo! [[You should]] listen more carefully."},{"sp":"Sofi","t":"Oh no! The wind [[blew down]] the little tree next to the gate!"},{"sp":"Leo","t":"Don't worry. Dad can help us plant it again tomorrow. So, what can we do now?"},{"sp":"Sofi","t":"[[Why don't we]] make hot chocolate and play a board game?"},{"sp":"Grandma Ana","t":"Good idea. And when it [[clears up]], you can go outside and look for a rainbow."},{"sp":"Leo","t":"And my football! It's going to be soaked."},{"sp":"Sofi","t":"Then you can [[dry it off]] with Pipo's towel!"}],"questions":[{"q":"What was Sofi doing when the thunder started?","opts":["Reading a comic","Painting","Playing football"],"a":1},{"q":"What did the wind blow down?","opts":["The little tree next to the gate","Leo's football","The garden fence"],"a":0},{"q":"What does Sofi suggest?","opts":["Going to the park","Watching cartoons","Making hot chocolate and playing a board game"],"a":2}]},"lang":[{"e":"blow down","t":"PV","d":"make something fall to the ground with strong wind","x":"The wind blew down a big tree in the park.","s":"blow DOWN"},{"e":"clear up","t":"PV","d":"become bright and sunny after rain or clouds","x":"The sky cleared up and we went to the beach.","s":"clear UP"},{"e":"dry off","t":"PV","d":"make yourself or something dry after it gets wet","x":"We dried off with big towels after the match.","s":"dry OFF"},{"e":"heavy rain","t":"COL","d":"a lot of rain falling very fast","x":"There was heavy rain all night, and the streets were full of water.","s":"HEAvy RAIN"},{"e":"strong wind","t":"COL","d":"air that moves very fast and hard","x":"A strong wind blew my hat into the river.","s":"STRONG WIND"},{"e":"raining cats and dogs","t":"ID","d":"a funny way to say it's raining very, very hard","x":"Take your raincoat. It's raining cats and dogs!","s":"RAINing CATS and DOGS"},{"e":"Why don't we…?","t":"PHR","d":"a friendly way to suggest doing something together","x":"It's snowing! Why don't we build a snowman?","s":"why DON'T we"},{"e":"You should…","t":"PHR","d":"words you use to give someone advice","x":"You should take an umbrella today.","s":"you SHOULD"}],"pron":{"focus":"Three sounds for -ed","explain":"The past simple -ed ending has three sounds. It sounds like t in jumped and walked, like d in rained and played, and it's an extra syllable, id, only after t or d: started, waited.","tip":"Count the syllables on your fingers: rained = 1, jumped = 1, started = 2. Don't add an extra syllable to rained or jumped!","lines":[{"t":"It rained all afternoon.","m":"it RAINED‿all afterNOON↘."},{"t":"The storm started at six.","m":"the STORM STARTed‿at SIX↘."},{"t":"We jumped in the puddles.","m":"we JUMPED‿in the PUDdles↘."}]},"acts":[{"type":"picture","prompts":["What can you see in the photo? Describe the sky and the hills.","What do you think the weather was like an hour before this photo?","Imagine you were walking on these hills when the storm started. What were you doing? What did you do?","How many colours can you see in the rainbow? Can you name them?","Where would you like to go when the rain stops? Why?"]},{"type":"story","starters":["We were having a picnic in the park when suddenly…","I was walking to school in the fog when I heard…","It was the hottest day of the year, and we were…","My dog was sleeping in the garden when the thunder…","While we were building a snowman, something funny happened…","The lights went out while my family was…"]},{"type":"podcast","title":"Weather Kids Radio","segments":["Today's weather: describe the weather outside right now, like a real weather reporter.","Storm story: interview a classmate about a time they got caught in the rain. Ask: What were you doing when it started?","Tomorrow's forecast: say what the weather will be like tomorrow and give advice: You should… / Don't forget to…","Weather around the world: describe the weather in another place, like Sydney or the Atacama Desert.","Fun fact of the day: share something surprising about the weather."]}],"rec":{"prompt":"Record a weather story. Tell us about a time the weather was wild or surprising: say what you were doing, what happened and what you learnt.","model":"Last winter, I was walking home from school with my mum when it started to rain. At first it was just a little rain, but then it was raining cats and dogs! We didn't have an umbrella, so we got completely soaked. A strong wind was blowing, and my hat flew away. When we got home, we dried off and had hot soup. Now I always check the forecast, and I keep a raincoat in my school bag.","use":["raining cats and dogs","strong wind","dry off"]},"tips":[{"who":"teacher","t":"Before the story activity, draw a timeline on the board: a long wavy line for the past continuous (I was walking…) and a lightning bolt for the past simple that interrupts it (…when the storm started)."},{"who":"student","t":"Use was or were + -ing for the long action and the past simple for the short action: I was sleeping when the thunder woke me up."}]},{"id":"comet-2-teen","lv":"comet","n":2,"age":"teen","title":"Weather Gone Wild","goals":["tell a story about extreme weather using past tenses","talk about weather and climate in Chile and around the world","make suggestions and criticise mistakes in a friendly way"],"warm":["What's the most extreme weather you've ever experienced?","How do you usually check the forecast?","Which season do you prefer in your city, and why?","Is the weather in Chile changing? What have you noticed?"],"model":{"kind":"dialogue","title":"Rain Here, Heat There","intro":"On Sunday evening, Tomás in Concepción and Vale in Santiago are on a video call. Their weekends had very different weather.","lines":[{"sp":"Vale","t":"Tomás, you look exhausted! What happened?"},{"sp":"Tomás","t":"Don't ask. I [[got caught in]] a thunderstorm at the skate park yesterday."},{"sp":"Vale","t":"Oh no! What were you doing when it started?"},{"sp":"Tomás","t":"I was filming my friend's new trick. Then there was a flash of lightning, and the [[heavy rain]] started."},{"sp":"Vale","t":"Didn't you check the forecast?"},{"sp":"Tomás","t":"No, it was sunny in the morning! We ran to a bus stop, but we were [[soaked to the skin]] in seconds."},{"sp":"Vale","t":"[[Why didn't you]] take a jacket? You live in Concepción!"},{"sp":"Tomás","t":"I know, I know. What about Santiago?"},{"sp":"Vale","t":"The opposite! It was [[boiling hot]], thirty-five degrees. There's a heatwave this week."},{"sp":"Tomás","t":"Thirty-five? What did you do?"},{"sp":"Vale","t":"I was trying to draw in my room, but I couldn't concentrate. In the end we went to my aunt's pool to [[cool down]]."},{"sp":"Tomás","t":"Lucky you! Here the wind didn't [[die down]] until midnight."},{"sp":"Vale","t":"Is your camera OK?"},{"sp":"Tomás","t":"Yes, luckily it was in my backpack. Next weekend I'm definitely staying at home."},{"sp":"Vale","t":"Me too. [[Why don't we]] watch a film together on a video call?"},{"sp":"Tomás","t":"Perfect. Inside, with no rain and no heatwave!"}],"questions":[{"q":"What was Tomás doing when the storm started?","opts":["Filming his friend's new trick","Waiting at a bus stop","Checking the forecast"],"a":0},{"q":"How hot was it in Santiago?","opts":["Twenty-five degrees","Thirty degrees","Thirty-five degrees"],"a":2},{"q":"What does Vale suggest for next weekend?","opts":["Going to her aunt's pool","Watching a film together on a video call","Meeting at the skate park"],"a":1}]},"lang":[{"e":"get caught in","t":"PV","d":"be outside when bad weather suddenly starts","x":"We got caught in a thunderstorm on the way home.","s":"get CAUGHT in"},{"e":"die down","t":"PV","d":"become weaker and quieter, like wind or noise","x":"We waited in a café until the wind died down.","s":"die DOWN"},{"e":"cool down","t":"PV","d":"become less hot","x":"During the heatwave we went to the river to cool down.","s":"cool DOWN"},{"e":"heavy rain","t":"COL","d":"a large amount of rain falling hard","x":"Heavy rain closed several roads in the south.","s":"HEAvy RAIN"},{"e":"boiling hot","t":"COL","d":"extremely hot","x":"It was boiling hot in Santiago last January.","s":"BOILing HOT"},{"e":"soaked to the skin","t":"ID","d":"completely wet, all the way through your clothes","x":"We forgot our jackets and got soaked to the skin.","s":"SOAKED to the SKIN"},{"e":"Why don't we…?","t":"PHR","d":"a friendly way to make a suggestion","x":"It's too hot to go out. Why don't we stay in and watch a film?","s":"why DON'T we"},{"e":"Why didn't you…?","t":"PHR","d":"a question that shows you think someone made a mistake","x":"Why didn't you check the forecast before the trip?","s":"why DIDn't you"}],"pron":{"focus":"Weak was and were","explain":"In past continuous sentences, was and were are usually weak and quick, and the -ing verb gets the stress. In short answers like Yes, I was, they are strong. Pausing before when also helps your listener follow the story.","tip":"Tap the table on the stressed words only. Was and were should squeeze in quickly between the taps.","lines":[{"t":"I was filming my friend.","m":"I was FILMing my FRIEND↘."},{"t":"What were you doing when it started?","m":"WHAT were you DOing | when‿it STARTed↘?"},{"t":"We were walking home when the storm hit.","m":"we were WALKing HOME | when the STORM HIT↘."}]},"acts":[{"type":"taboo","cards":[{"w":"thunderstorm","taboo":["rain","lightning","loud"]},{"w":"drought","taboo":["rain","dry","water"]},{"w":"heatwave","taboo":["hot","summer","temperature"]},{"w":"flood","taboo":["water","river","rain"]},{"w":"fog","taboo":["see","cloud","grey"]},{"w":"forecast","taboo":["weather","tomorrow","report"]},{"w":"hurricane","taboo":["wind","storm","tropical"]},{"w":"freezing","taboo":["cold","ice","winter"]},{"w":"climate","taboo":["weather","years","change"]},{"w":"soaked","taboo":["wet","rain","clothes"]}]},{"type":"roleplay","cards":[{"sit":"Two friends are planning a hike in the hills this Saturday, but the forecast says there could be a thunderstorm in the afternoon.","a":"You really want to go. Suggest leaving very early and give two reasons why it will be fine. Use: Why don't we…? / We could…","b":"You're worried about the storm. Suggest a different plan and explain why. Use: I think we should… / What if it…?"},{"sit":"You went camping with a friend. Your friend forgot the cover for the tent, it rained all night, and now everything is soaked.","a":"You're annoyed. Tell your friend how you feel and criticise them in a friendly way. Use: Why didn't you…? / You should check… next time.","b":"Explain why you forgot and apologise. Then suggest a way to save the trip. Use: I'm really sorry… / Why don't we…?"},{"sit":"There's a heatwave, and your class is going on a school trip to the city centre tomorrow.","a":"You're the class representative. Suggest three ways to stay cool and safe on the trip. Use: We should… / Why don't we…?","b":"You're Mr Díaz, the teacher. Ask questions, agree with two ideas and politely say no to one. Use: That's a good idea, but…"}]},{"type":"expert","topic":"Extreme weather and climate in Chile","expert":"You are Dr Rosa Díaz, a climate scientist. Using what you know (or can imagine), explain droughts in central Chile, heavy rain and floods in the south, coastal fog in the north and heatwaves in Santiago. Answer in full sentences and give one piece of advice for each problem.","journalists":"You are reporters for the school news channel. Prepare your questions, take notes and ask follow-up questions like Why? and Can you give us an example?","questions":["Why is central Chile having more droughts these days?","What should people do during a heatwave?","What causes the thick fog on the coast in the north of Chile?","How can a city prepare for floods?","Is the climate in Chile changing? How do scientists know?","What can teenagers do to help?"]}],"rec":{"prompt":"Record a short story about a time you got caught in extreme weather (or invent one). Say where you were, what you were doing, what happened and what you learnt.","model":"Last summer, I was walking along the beach with my cousins when the wind suddenly got really strong. A few minutes later, we got caught in a thunderstorm. We ran to a café, but we were already soaked to the skin. We had hot chocolate and waited until the wind died down. My cousin laughed and asked me why I hadn't checked the forecast. He was right! Now I always check it before I go out, even in summer.","use":["get caught in","soaked to the skin","die down"]},"tips":[{"who":"teacher","t":"Before the expert interview, give the experts five minutes to prepare notes and the journalists time to write follow-up questions. Swap roles halfway so everyone tries both."},{"who":"student","t":"In a weather story, use the past continuous to set the scene (The wind was blowing and we were walking home…) and the past simple for the main events (Suddenly the lights went out)."}]},{"id":"comet-3-kid","lv":"comet","n":3,"age":"kid","title":"Pancake Party","goals":["order food and drinks politely in a restaurant","talk about food you've already tried and food you haven't tried yet","describe dishes and food words so that others can guess them"],"warm":["What's the most delicious thing you've ever eaten?","Have you ever cooked something on your own? What was it?","What do you like to eat on your birthday?","Do you like spicy food? Why or why not?"],"model":{"kind":"dialogue","title":"Sunday Pancakes","intro":"On Sunday morning, Grandma Ana is teaching Leo and Sofi how to make pancakes.","lines":[{"sp":"Grandma Ana","t":"Good morning, chefs! Are you ready to make some pancakes?"},{"sp":"Leo","t":"Yes! I've already found the recipe. We need flour, eggs, milk and a little sugar."},{"sp":"Sofi","t":"Oh no, Grandma! We've [[run out of]] milk!"},{"sp":"Grandma Ana","t":"Don't worry. I've just bought some. It's in my bag."},{"sp":"Leo","t":"Great! Can I mix everything? It looks like [[a piece of cake]]."},{"sp":"Grandma Ana","t":"Of course, but go slowly, or you'll [[make a mess]]."},{"sp":"Sofi","t":"Too late! There's flour on Pipo's nose!"},{"sp":"Leo","t":"Sorry, Pipo! Grandma, what can Sofi do?"},{"sp":"Grandma Ana","t":"Sofi, can you [[cut up]] the bananas and strawberries? Use the plastic knife."},{"sp":"Sofi","t":"OK! Have you made the first pancake yet?"},{"sp":"Grandma Ana","t":"Not yet. The pan isn't hot enough. Leo, can you [[set the table]], please?"},{"sp":"Leo","t":"Done! There are plates, forks and glasses for everyone."},{"sp":"Grandma Ana","t":"Here are the first pancakes. [[Help yourselves]]!"},{"sp":"Sofi","t":"Mmm! These are the best pancakes in the world!"}],"questions":[{"q":"What have they run out of?","opts":["Eggs","Milk","Sugar"],"a":1},{"q":"Why can't Grandma make the first pancake yet?","opts":["The pan isn't hot enough","Leo hasn't mixed everything","Pipo has eaten the flour"],"a":0},{"q":"What does Leo do near the end?","opts":["He cuts up the fruit","He goes to the shop","He sets the table"],"a":2}]},"lang":[{"e":"run out of","t":"PV","d":"use all of something, so there is none left","x":"We've run out of bread. Can you buy some?","s":"run OUT of"},{"e":"cut up","t":"PV","d":"cut something into small pieces","x":"Dad cut up the apples for the fruit salad.","s":"cut UP"},{"e":"set the table","t":"COL","d":"put plates, forks and glasses on the table before a meal","x":"It's your turn to set the table tonight.","s":"SET the TAble"},{"e":"make a mess","t":"COL","d":"make a place dirty or untidy","x":"We made a big mess in the kitchen, but we cleaned it all up.","s":"make a MESS"},{"e":"a piece of cake","t":"ID","d":"very, very easy","x":"This recipe is a piece of cake. You only need three ingredients!","s":"a PIECE of CAKE"},{"e":"Help yourself!","t":"PHR","d":"take as much food as you want","x":"There are lots of sandwiches on the table. Help yourself!","s":"help yourSELF"},{"e":"Are you ready to order?","t":"PHR","d":"what a waiter asks when it's time to choose your food","x":"Good evening! Are you ready to order?","s":"are you READy to ORder"},{"e":"Could I have …, please?","t":"PHR","d":"a polite way to ask for food or drink","x":"Could I have the tomato soup, please?","s":"could I HAVE … PLEASE"}],"pron":{"focus":"Short forms: I've, we've, she's","explain":"In conversation, we nearly always use short forms with the present perfect: I've, we've, she's, haven't. Say them quickly and softly, and put the stress on the main verb or on the most important word.","tip":"Don't say I have or we have slowly. Squeeze them into one quick sound, I've or we've, then make the stressed word loud and clear.","lines":[{"t":"I've just bought some milk.","m":"I've JUST‿bought some MILK↘."},{"t":"Have you made the pancakes yet?","m":"have you MADE the PANcakes‿yet↗?"},{"t":"We've run out of eggs!","m":"we've RUN‿OUT‿of EGGS↘!"}]},"acts":[{"type":"taboo","cards":[{"w":"pizza","taboo":["cheese","Italy","tomato"]},{"w":"waiter","taboo":["restaurant","food","bring"]},{"w":"dessert","taboo":["sweet","end","cake"]},{"w":"menu","taboo":["list","order","dishes"]},{"w":"bill","taboo":["pay","money","restaurant"]},{"w":"spicy","taboo":["hot","chilli","mouth"]},{"w":"empanada","taboo":["Chile","meat","oven"]},{"w":"vegetarian","taboo":["meat","fish","vegetables"]},{"w":"recipe","taboo":["cook","instructions","book"]},{"w":"breakfast","taboo":["morning","eat","cereal"]}]},{"type":"roleplay","cards":[{"sit":"At the pizza restaurant","a":"You are the customer, and you're very hungry! Ask: Could I see the menu, please? Order a starter, a pizza and a drink. Ask: Is the chilli pizza very spicy? At the end, ask for the bill.","b":"You are the waiter. Say: Good evening! Are you ready to order? Today's pizzas are cheese, vegetable and chilli. The chilli pizza is very spicy! Ask: Would you like a dessert? At the end, say: Here's your bill. That's 9,500 pesos."},{"sit":"At the school café","a":"You are a vegetarian customer. You don't eat meat or fish. Ask: What have you got today? Have you got any cheese empanadas? Then order a dessert too.","b":"You work at the school café. Today you've got cheese empanadas, chicken sandwiches, tomato soup and chocolate cake. Say: Sorry, we've just sold the last cheese empanada! Would you like some tomato soup?"},{"sit":"In Grandma's kitchen","a":"You want to make a fruit salad with your grandparent. Ask: Have we got any bananas? Have you washed the strawberries yet? Offer to help.","b":"You are the grandparent. You've already washed the strawberries, but you've run out of bananas. Give instructions: Cut up the apples, please. Put them in the big bowl."}]},{"type":"picture","prompts":["What is the girl making? What ingredients can you see?","Why do you think she's smiling? Do you think she has made pizza before?","What has she already put on the pizza? What hasn't she put on it yet?","Would you like to eat her pizza? What would you add to it?","Have you ever made pizza or another dish at home? Tell your partner how you made it."]}],"rec":{"prompt":"Record a short message for a friend about the last meal you cooked or helped to cook. Say what you made, who helped you and if it was easy or difficult.","model":"Last Sunday, I made pancakes with my grandma. First, we found the recipe, but then we realised we had run out of milk! Luckily, Grandma had just bought some. I mixed the flour, eggs and milk, and my sister cut up the bananas. I made a big mess, but it was a piece of cake. The pancakes were delicious!","use":["run out of","cut up","a piece of cake"]},"tips":[{"who":"teacher","t":"Before the role-play, write a simple menu with prices in pesos on the board. Let the waiters write the orders in a notebook, and swap roles after each round."},{"who":"student","t":"When you order, always use Could I have …, please? It's polite and easy to remember. Smile and look at the waiter!"}]},{"id":"comet-3-teen","lv":"comet","n":3,"age":"teen","title":"Pop-Up Restaurant","goals":["talk about food experiences using already, just and yet","pitch an idea for a food business and answer questions about it","explain and defend your food preferences"],"warm":["What's the best restaurant or food stall in your town? Why?","Have you ever cooked a whole meal for your family or friends?","What's a dish you haven't tried yet but would like to?","Do you prefer eating out or eating at home? Why?"],"model":{"kind":"dialogue","title":"The Night Before","intro":"Jose and Tomás are getting ready for their class pop-up restaurant, which opens tomorrow.","lines":[{"sp":"Jose","t":"OK, let's check the list. Have you printed the menus yet?"},{"sp":"Tomás","t":"Yes, I've just picked them up from the library. Vale's design looks amazing."},{"sp":"Jose","t":"Great. And how many people have [[booked a table]]?"},{"sp":"Tomás","t":"Forty-two! The lunch has almost [[sold out]] already."},{"sp":"Jose","t":"Forty-two? I think we've [[bitten off more than we can chew]]."},{"sp":"Tomás","t":"Relax, you've [[tried out]] every recipe twice. What's still on your list?"},{"sp":"Jose","t":"Well, I haven't made the lemon cake yet, and we haven't got the fish."},{"sp":"Tomás","t":"Sam's picking up the fish at the market tomorrow morning. He's already ordered it."},{"sp":"Jose","t":"Perfect. Oh, and Mr Díaz is a vegetarian, so I'm making him a special pumpkin soup."},{"sp":"Tomás","t":"Nice. And lots of teachers [[have a sweet tooth]], so the dessert is important."},{"sp":"Jose","t":"That's why I'm making two cakes! Can you help me in the kitchen tonight?"},{"sp":"Tomás","t":"Sure, but I'm not cooking. I'll [[do the washing-up]] instead."},{"sp":"Jose","t":"Deal! Now let's practise. Excuse me, waiter. [[What do you recommend]]?"},{"sp":"Tomás","t":"Today I'd go for the fried fish, madam. And don't miss the lemon cake!"}],"questions":[{"q":"Why does Jose think they've bitten off more than they can chew?","opts":["Forty-two people have booked","They haven't printed the menus","Sam has forgotten the fish"],"a":0},{"q":"What hasn't Jose done yet?","opts":["Tried out the recipes","Made the lemon cake","Ordered the fish"],"a":1},{"q":"How is Tomás going to help tonight?","opts":["By making the soup","By buying the fish","By doing the washing-up"],"a":2}]},"lang":[{"e":"sell out","t":"PV","d":"be all sold, so there is nothing left to buy","x":"The concert tickets sold out in ten minutes.","s":"sell OUT"},{"e":"try out","t":"PV","d":"test something new to see if it's good","x":"We tried out a new brownie recipe last night.","s":"try OUT"},{"e":"eat out","t":"PV","d":"have a meal in a restaurant, not at home","x":"My family usually eats out on Friday nights.","s":"eat OUT"},{"e":"book a table","t":"COL","d":"ask a restaurant to keep a table for you","x":"Let's book a table for six at eight o'clock.","s":"BOOK a TAble"},{"e":"do the washing-up","t":"COL","d":"wash the plates, glasses and pans after a meal","x":"If you cook, I'll do the washing-up.","s":"do the WASHing-UP"},{"e":"have a sweet tooth","t":"ID","d":"love eating sugary food like cakes and sweets","x":"My brother has a real sweet tooth. He has dessert every day.","s":"have a SWEET TOOTH"},{"e":"bite off more than you can chew","t":"ID","d":"try to do more than you are able to do","x":"Three exams and a football match on the same day? I've bitten off more than I can chew!","s":"BITE off MORE than you can CHEW"},{"e":"What do you recommend?","t":"PHR","d":"a question to ask someone to suggest the best choice","x":"Everything looks delicious. What do you recommend?","s":"what do you recomMEND"}],"pron":{"focus":"Have in questions and yet at the end","explain":"In questions, have is weak and fast, so Have you sounds like one short word. In positive sentences, we use short forms (I've, we've) and stress already or the main verb. Yes/no questions with yet usually go up at the end, and negatives go down.","tip":"Record yourself saying the three lines. Listen: does your voice go up on the question and down on the other two?","lines":[{"t":"Have you printed the menus yet?","m":"have you PRINTed the MEnus‿yet↗?"},{"t":"We've already sold forty tickets.","m":"we've alREADy sold FORty TICKets↘."},{"t":"I haven't made the cake yet.","m":"I HAVEn't MADE the CAKE‿yet↘."}]},"acts":[{"type":"findsomeone","items":[{"p":"has cooked dinner for their family this month","q":"Have you cooked dinner for your family this month?"},{"p":"has eaten out this week","q":"Have you eaten out this week?"},{"p":"has tried a vegetarian burger","q":"Have you ever tried a vegetarian burger?"},{"p":"has a real sweet tooth","q":"Do you have a sweet tooth?"},{"p":"can make empanadas without any help","q":"Can you make empanadas without any help?"},{"p":"has posted a photo of their food online","q":"Have you ever posted a photo of your food online?"},{"p":"has burnt something in the kitchen","q":"Have you ever burnt something in the kitchen?"},{"p":"has helped at a food stall or café","q":"Have you ever helped at a food stall or café?"}],"follow":["When was that?","What happened?","Would you do it again?"]},{"type":"pitch","brief":"Your class is opening a food truck at the school fair. In groups, choose a name, three dishes and their prices in pesos. Then pitch your truck to the class in one minute. At the end, the class votes for the best truck.","ideas":["A healthy truck with smoothies, salads and vegetarian wraps","A Chilean classics truck with empanadas, sopaipillas and mote con huesillo","A spicy challenge truck with three levels of chilli","An all-day breakfast truck with pancakes, eggs and fresh juice","A dessert truck for people with a sweet tooth"],"questions":["What's on your menu, and how much does everything cost?","Is there anything for vegetarians?","Why will students choose your truck and not another one?","How many people do you need to cook and take orders?","What will you do if you sell out early?","Have you tried out any of the recipes yet?"]},{"type":"wyr","items":[["eat only spicy food for a month","eat only sweet food for a month"],["be a famous chef","be a food critic who eats in the best restaurants"],["cook for a hundred people","do the washing-up for a hundred people"],["never eat pizza again","never eat chocolate again"],["have your own personal chef","eat out for free once a week"],["eat breakfast food for dinner every day","eat dinner food for breakfast every day"],["work as a waiter in a busy café","work in the kitchen of a busy café"]]}],"rec":{"prompt":"Record a voice message to a friend about a food experience. Tell them about a meal you've eaten out or cooked recently, what was good or bad about it, and a dish you haven't tried yet but want to.","model":"Hey! I've just got back from my cousin's birthday dinner. We ate out at a new Peruvian restaurant in the city centre, and it was amazing. I tried ceviche for the first time. It was a bit spicy, but really fresh. Everyone ordered dessert, because we all have a sweet tooth. Next time, I want to try lomo saltado. I haven't had it yet, but my cousin says it's the best dish on the menu. You should come with us!","use":["eat out","have a sweet tooth"]},"tips":[{"who":"teacher","t":"Give groups ten minutes to prepare the pitch and a strict one-minute limit to present it. After each pitch, the class must ask at least one question with yet or already."},{"who":"student","t":"In Find Someone Who, don't just say yes or no. Add one detail: when it happened, where you were or how the food tasted."}]},{"id":"comet-4-kid","lv":"comet","n":4,"age":"kid","title":"Film Night","goals":["describe a film or TV show and say what you think of it","compare films using comparatives and superlatives","present a short film review show with a partner"],"warm":["What's the last film you watched? Where did you watch it?","Do you prefer cartoons or films with real actors? Why?","What do you like eating at the cinema?","What's the funniest TV show you know?"],"model":{"kind":"dialogue","title":"What Shall We Watch?","intro":"It's Friday night, and Leo, Sofi and Kai are choosing a film to watch at home.","lines":[{"sp":"Sofi","t":"It's Friday! And [[it's my turn to choose]] the film tonight."},{"sp":"Leo","t":"No way! You chose last week, and we watched the same cartoon again."},{"sp":"Kai","t":"Let's choose together. How about Ocean Friends? It's a documentary about dolphins."},{"sp":"Sofi","t":"Dolphins? [[What's it about]] exactly?"},{"sp":"Kai","t":"It follows a baby dolphin for one year. My teacher says it's [[worth watching]]."},{"sp":"Leo","t":"Hmm. I'd prefer something more exciting, like Robot Football. It has amazing special effects."},{"sp":"Sofi","t":"But that film is much longer than the others. It's nearly three hours!"},{"sp":"Kai","t":"And there isn't much action at the start. My friend fell asleep."},{"sp":"Leo","t":"OK, OK. Let's watch the dolphins. But only if we [[make popcorn]]."},{"sp":"Sofi","t":"Yes! There's a little popcorn left in the cupboard, and a few apples."},{"sp":"Kai","t":"Great. Leo, can you [[turn up]] the sound? The music is really beautiful."},{"sp":"Leo","t":"Sure. Sofi, don't eat all the popcorn!"},{"sp":"Sofi","t":"Shh! I want to [[find out]] if the baby dolphin finds its mum."},{"sp":"Kai","t":"Don't worry. I'm sure it has [[a happy ending]]."}],"questions":[{"q":"What is Ocean Friends?","opts":["A cartoon about robots","A documentary about dolphins","A series about football"],"a":1},{"q":"Why don't they watch Robot Football?","opts":["It's too long","It's too sad","Sofi has already seen it"],"a":0},{"q":"What does Leo want before the film starts?","opts":["Some apples","A new TV","Some popcorn"],"a":2}]},"lang":[{"e":"turn up","t":"PV","d":"make the sound louder","x":"Can you turn up the TV? I can't hear it.","s":"turn UP"},{"e":"find out","t":"PV","d":"learn something that you didn't know before","x":"Watch the last episode to find out who took the treasure.","s":"find OUT"},{"e":"make popcorn","t":"COL","d":"cook popcorn to eat, usually in a pan or a microwave","x":"Dad always makes popcorn when we watch a film.","s":"make POPcorn"},{"e":"a happy ending","t":"COL","d":"when a story finishes in a good way","x":"I love films with a happy ending.","s":"a HAPpy ENDing"},{"e":"a couch potato","t":"ID","d":"a person who watches a lot of TV and doesn't move much","x":"Don't be a couch potato! Let's go to the park.","s":"a COUCH poTAto"},{"e":"What's it about?","t":"PHR","d":"a question to ask about the story of a film or book","x":"I haven't seen that cartoon. What's it about?","s":"what's it aBOUT"},{"e":"It's my turn to choose.","t":"PHR","d":"you say this when you can decide this time","x":"You chose last week. It's my turn to choose!","s":"it's MY TURN to CHOOSE"},{"e":"It's worth watching.","t":"PHR","d":"it's good, so you should see it","x":"The new documentary about penguins is worth watching.","s":"it's WORTH WATCHing"}],"pron":{"focus":"Stress in comparatives and superlatives","explain":"In comparatives, than is weak and fast, and the adjective gets the strong stress: LONGer than. In superlatives, the is weak too: the FUNniest, the most exCITing.","tip":"Say than like a tiny, lazy word. Then make the adjective big and loud.","lines":[{"t":"It's much longer than the others.","m":"it's MUCH LONGer than the OTHers↘."},{"t":"It's the funniest film ever!","m":"it's the FUNniest FILM‿EVer↘!"},{"t":"Is it more exciting than the cartoon?","m":"is it more exCITing than the carTOON↗?"}]},"acts":[{"type":"guess","cat":"Films and TV shows","items":["a cartoon","a documentary","a comedy","a superhero film","a cooking show","a quiz show","a musical","a talent show","the news","a mystery series"],"frames":["Is it funny / scary / exciting?","Has it got real people or drawn characters in it?","Is it usually longer than an hour?","Do lots of kids / adults watch it?","Is it a …?"]},{"type":"podcast","title":"The Kids' Film Club Podcast","segments":["Hello and welcome! Introduce yourselves and say what kind of films you like.","Review time: talk about a film or cartoon you've seen. What's it about? Is it worth watching?","Top three: say the funniest, the most exciting and the saddest film you've ever seen.","Snack of the week: tell listeners about the best and the worst cinema snacks.","A question from a listener: Are cartoons only for little kids? Give your answers and say goodbye."]},{"type":"wyr","items":[["be a famous actor","be a famous director"],["watch a scary film on your own","watch a boring film with your friends"],["live inside your favourite cartoon for a day","meet your favourite actor for an hour"],["watch only cartoons for a year","watch only documentaries for a year"],["write the story for a new film","write the songs for its soundtrack"],["see a film at the cinema","see a film at home in your pyjamas"],["be a couch potato for a week","never watch TV for a week"]]}],"rec":{"prompt":"Record a short review of a film or cartoon you've seen. Say what it's about, what you liked best, one thing you didn't like and how many stars you'd give it.","model":"I've just watched Ocean Friends, a documentary about a baby dolphin. It follows the dolphin for one year, and you find out how it learns to swim and catch fish. The best thing is the music. It's really beautiful! There isn't much action at the start, but don't worry, it has a happy ending. It's definitely worth watching. I'd give it four stars out of five.","use":["find out","a happy ending","It's worth watching."]},"tips":[{"who":"teacher","t":"For the podcast, give each pair a pretend microphone (a marker pen works well!) and, if possible, let them record on a phone. Play one or two recordings to the class."},{"who":"student","t":"In the guessing game, ask big questions first, like Is it funny? or Has it got real people in it? Then guess the exact type."}]},{"id":"comet-4-teen","lv":"comet","n":4,"age":"teen","title":"Critics' Corner","goals":["recommend a series or film and explain what makes it good or bad","use quantifiers and comparatives to compare films, series and actors","argue for and against opinions about films and TV"],"warm":["What series are you watching at the moment? What's it about?","Do you prefer watching films at the cinema or at home? Why?","Have you ever watched a whole series in one weekend?","Do you read reviews or watch trailers before you choose something to watch?"],"model":{"kind":"dialogue","title":"Which Series Next?","intro":"Vale and Sam are trying to choose a new series to watch together at the weekend.","lines":[{"sp":"Vale","t":"So, what are we watching this weekend? I've finished everything on my list."},{"sp":"Sam","t":"Have you seen Cerro Alegre Detectives? The second season [[comes out]] on Friday."},{"sp":"Vale","t":"A detective series? Mystery series [[aren't really my cup of tea]]."},{"sp":"Sam","t":"Trust me, this one's different. It has [[a gripping plot]], and the actors are brilliant."},{"sp":"Vale","t":"How many episodes are there?"},{"sp":"Sam","t":"Only eight, and they're quite short. We could finish the first season in a day."},{"sp":"Vale","t":"Hmm. I tried a detective series last year, but I [[gave up on]] it after one episode. There wasn't much action."},{"sp":"Sam","t":"This one is much faster. The last episode kept me [[on the edge of my seat]]!"},{"sp":"Vale","t":"Wait, you've already seen it? Then you'll [[spoil the ending]]!"},{"sp":"Sam","t":"No spoilers, I promise. I'll just watch your face."},{"sp":"Vale","t":"OK, but I need to [[catch up on]] my drawing homework first. How about Saturday afternoon?"},{"sp":"Sam","t":"Perfect. I'll bring some popcorn, and Tomás might come too."},{"sp":"Vale","t":"Fine. But if it's boring, I'm choosing next time!"},{"sp":"Sam","t":"Deal. But I'm sure you'll love it. It's [[worth watching]], honestly."}],"questions":[{"q":"Why isn't Vale sure about the series at first?","opts":["She doesn't usually like mystery series","She has already seen it","It has too many episodes"],"a":0},{"q":"Why is Vale worried when she hears that Sam has seen it?","opts":["He might fall asleep","He might spoil the ending","He might forget the popcorn"],"a":1},{"q":"What does Vale have to do first?","opts":["Buy some popcorn","Watch the first season","Catch up on her drawing homework"],"a":2}]},"lang":[{"e":"come out","t":"PV","d":"become available for people to see or buy","x":"The second season comes out next Friday.","s":"come OUT"},{"e":"catch up on","t":"PV","d":"do or watch something that you missed earlier","x":"I need to catch up on the episodes I missed last week.","s":"catch UP on"},{"e":"give up on","t":"PV","d":"stop watching or trying because you've lost interest","x":"I gave up on that series after two boring episodes.","s":"give UP on"},{"e":"a gripping plot","t":"COL","d":"a story so exciting that you can't stop watching or reading","x":"The book has a gripping plot. I read it in two days.","s":"a GRIPping PLOT"},{"e":"spoil the ending","t":"COL","d":"tell someone what happens at the end before they see it","x":"Don't spoil the ending! I haven't finished it yet.","s":"SPOIL the ENDing"},{"e":"on the edge of your seat","t":"ID","d":"very excited and nervous about what will happen next","x":"The final match kept everyone on the edge of their seats.","s":"on the EDGE of your SEAT"},{"e":"not my cup of tea","t":"ID","d":"not the kind of thing I like","x":"Horror films aren't really my cup of tea.","s":"NOT my CUP of TEA"},{"e":"It's worth watching.","t":"PHR","d":"it's good enough that you should spend time on it","x":"It's a bit slow at the start, but it's worth watching.","s":"it's WORTH WATCHing"}],"pron":{"focus":"Linking in phrasal verbs","explain":"When a phrasal verb ends in a consonant and the next word starts with a vowel, we link them: catch‿up‿on, give‿up‿on, comes‿out. The particle (up, out) usually carries the stress.","tip":"Read each line slowly with the links, then faster and faster, until it sounds like one smooth chunk.","lines":[{"t":"I gave up on it after one episode.","m":"I gave‿UP‿on‿it | after ONE‿EPisode↘."},{"t":"The second season comes out on Friday.","m":"the SECond SEAson comes‿OUT‿on FRIday↘."},{"t":"I need to catch up on my homework.","m":"I NEED to catch‿UP‿on my HOMEwork↘."}]},"acts":[{"type":"picture","prompts":["What is this object, and who uses it when they make a film?","Why do you think film makers use it at the start of every scene?","Imagine you're the director of a new film. What's the title, and what's it about?","Which job on a film would you like most: director, actor, writer or special effects artist? Why?","Can young people make good films with just a phone? Why or why not?"]},{"type":"taboo","cards":[{"w":"director","taboo":["film","actors","tell"]},{"w":"soundtrack","taboo":["music","songs","film"]},{"w":"episode","taboo":["series","part","TV"]},{"w":"audience","taboo":["people","watch","clap"]},{"w":"review","taboo":["opinion","stars","article"]},{"w":"documentary","taboo":["real","facts","film"]},{"w":"spoiler","taboo":["ending","tell","surprise"]},{"w":"popcorn","taboo":["cinema","eat","salty"]},{"w":"script","taboo":["words","actors","write"]},{"w":"special effects","taboo":["computer","real","impossible"]}]},{"type":"devil","motions":["The book is always better than the film.","Watching a series alone is more fun than watching it with friends.","Cinemas will disappear because everybody watches films at home now.","Old films are more interesting than new ones.","Cartoons are only for little children.","Teenagers should watch every film in English with English subtitles."]}],"rec":{"prompt":"Record a voice note recommending a series or film to a friend. Say what it's about, what's good about it and one problem, and explain why they should watch it. No spoilers!","model":"You have to watch Cerro Alegre Detectives! It's about three teenagers in Valparaíso who start a detective club. It has a gripping plot, and every episode ends with a surprise. The actors are much better than in most teen series. There aren't many scenes with the main character's family, which is a bit strange, but it doesn't matter. The last episode kept me on the edge of my seat. The second season comes out on Friday, so you've still got time to catch up!","use":["a gripping plot","on the edge of your seat","come out"]},"tips":[{"who":"teacher","t":"In the devil's advocate game, students must argue against the motion, even if they agree with it. Give them thirty seconds to think, and remind them to use comparatives such as much better than and the most."},{"who":"student","t":"When you recommend something, give one reason and one example: It's really funny. For example, in episode two…"}]},{"id":"comet-5-kid","lv":"comet","n":5,"age":"kid","title":"Ready, Steady, Go!","goals":["talk about your plans for sports and competitions","make predictions about who will win","give quick opinions with reasons in a friendly debate"],"warm":["What's your favourite sport? Do you play it or watch it?","Have you ever won a medal or a prize? What for?","How do you feel before a race or a match?","Which sport would you like to try one day?"],"model":{"kind":"dialogue","title":"The Day Before Sports Day","intro":"Leo and Benja are running in the school race tomorrow, and Ms Rojas is giving them some advice.","lines":[{"sp":"Ms Rojas","t":"So, boys, are you ready for sports day tomorrow?"},{"sp":"Leo","t":"I think so! Benja and I are [[taking part in]] the 100-metre race."},{"sp":"Benja","t":"I'm a bit nervous. Last year I fell over at the start."},{"sp":"Ms Rojas","t":"Don't worry. You've trained every week this year, and [[practice makes perfect]]."},{"sp":"Leo","t":"Will we win, Ms Rojas?"},{"sp":"Ms Rojas","t":"Maybe! But Martina is very fast, and she's running in your race too."},{"sp":"Benja","t":"Martina? Oh no! She'll [[win a medal]] for sure."},{"sp":"Ms Rojas","t":"Remember, you won't run well unless you [[warm up]] first. Five minutes of stretching, OK?"},{"sp":"Leo","t":"OK. What else do we need to do?"},{"sp":"Ms Rojas","t":"Look straight ahead, and don't [[give up]], even if you're tired."},{"sp":"Benja","t":"My grandparents are coming to [[cheer us on]]. They're bringing a big sign."},{"sp":"Leo","t":"And Sofi is going to bring Pipo! He's the loudest fan in Santiago."},{"sp":"Ms Rojas","t":"Wonderful. Just [[do your best]] and have fun. [[Good luck]], both of you!"},{"sp":"Leo and Benja","t":"Thanks, Ms Rojas!"}],"questions":[{"q":"Why is Benja nervous?","opts":["He fell over in last year's race","He hasn't trained this year","Martina is his coach"],"a":0},{"q":"What must the boys do before the race?","opts":["Eat a big breakfast","Warm up for five minutes","Make a big sign"],"a":1},{"q":"Who is going to bring Pipo?","opts":["Benja's grandparents","Ms Rojas","Sofi"],"a":2}]},"lang":[{"e":"warm up","t":"PV","d":"do gentle exercises to get your body ready for sport","x":"Always warm up for five minutes before you run.","s":"warm UP"},{"e":"give up","t":"PV","d":"stop trying to do something","x":"The race was hard, but I didn't give up.","s":"give UP"},{"e":"cheer on","t":"PV","d":"shout to help and encourage someone in a competition","x":"My whole family came to cheer me on.","s":"cheer ON"},{"e":"take part in","t":"COL","d":"join an activity or a competition","x":"Twenty kids are taking part in the swimming race.","s":"take PART in"},{"e":"do your best","t":"COL","d":"try as hard as you can","x":"It doesn't matter if you lose. Just do your best!","s":"do your BEST"},{"e":"win a medal","t":"COL","d":"get a prize for finishing first, second or third","x":"Kai won a medal at the table tennis competition.","s":"win a MEDal"},{"e":"Practice makes perfect.","t":"ID","d":"if you do something again and again, you'll get really good at it","x":"I'm not very good at skipping yet, but practice makes perfect!","s":"PRACtice makes PERfect"},{"e":"Good luck!","t":"PHR","d":"something you say to someone before a test or a race","x":"Good luck in your match tomorrow!","s":"good LUCK"}],"pron":{"focus":"Short forms of will: I'll, you'll, she'll, won't","explain":"When we make predictions or quick decisions, we usually say I'll, you'll, she'll and won't. They are short and quick. Be careful: won't sounds different from want. Won't rhymes with don't.","tip":"Practise won't and want in pairs: I won't go and I want to go. Make won't long and round, like don't.","lines":[{"t":"I think you'll do really well.","m":"I THINK‿you'll do REALly WELL↘."},{"t":"She'll win a medal for sure!","m":"she'll WIN‿a MEDal for SURE↘!"},{"t":"You won't win unless you train.","m":"you WON'T WIN | unLESS you TRAIN↘."}]},"acts":[{"type":"picture","prompts":["What are the runners doing? How do you think they feel right now?","Who do you think will win the race? Why?","What do you think the runners are going to do after the race?","Have you ever taken part in a race? What happened?","Would you like to run in a big competition one day? Why or why not?"]},{"type":"findsomeone","items":[{"p":"is going to try a new sport this year","q":"Are you going to try a new sport this year?"},{"p":"has won a medal or a trophy","q":"Have you ever won a medal or a trophy?"},{"p":"is playing a match or a game this weekend","q":"Are you playing a match or a game this weekend?"},{"p":"always warms up before sport","q":"Do you always warm up before sport?"},{"p":"thinks they'll be a famous athlete one day","q":"Do you think you'll be a famous athlete one day?"},{"p":"has been rock climbing","q":"Have you ever been rock climbing?"},{"p":"wears a helmet when they ride a bike","q":"Do you wear a helmet when you ride a bike?"},{"p":"has got a sports coach","q":"Have you got a sports coach?"}],"follow":["Which one?","When?","How did you feel?"]},{"type":"speed","motions":["Football is the best sport in the world.","Winning is more important than having fun.","Every child should learn to swim.","Video games are a real sport.","Sports day should happen every month.","It's better to play in a team than on your own."]}],"rec":{"prompt":"Record a message about a sports event you're going to take part in or watch soon. Say what it is, how you're going to get ready and who you think will win.","model":"Next Saturday, I'm taking part in a swimming race at my school. There are twelve kids in my group, and some of them are really fast. I'm going to practise three times this week, and I'll warm up before the race. I don't think I'll win, but I'm going to do my best. My mum and my sister are coming to cheer me on. Wish me luck!","use":["warm up","do your best","cheer on"]},"tips":[{"who":"teacher","t":"For speed debating, put students in two lines facing each other. They have one minute to give their opinion on a motion. Then one line moves along one seat for the next motion. Ring a bell to change."},{"who":"student","t":"Use I think … will … for predictions and I'm going to … for plans. Always try to add a reason with because."}]},{"id":"comet-5-teen","lv":"comet","n":5,"age":"teen","title":"Go for Gold","goals":["talk about plans, arrangements and predictions for a competition","interview an athlete and answer interview questions in detail","discuss how risky different sports are"],"warm":["Do you prefer team sports or individual sports? Why?","What's the most exciting competition you've ever watched or taken part in?","Would you ever try skydiving or rock climbing? Why or why not?","What are you going to do to stay fit this year?"],"model":{"kind":"dialogue","title":"Three Days to the Final","intro":"Jose's volleyball team is playing in the regional final on Saturday, and Sam is interviewing her for the school's social media page.","lines":[{"sp":"Sam","t":"Thanks for doing this, Jose. The final is on Saturday. How are you feeling?"},{"sp":"Jose","t":"Honestly? I [[have butterflies in my stomach]] already, and it's only Wednesday!"},{"sp":"Sam","t":"Who are you playing against?"},{"sp":"Jose","t":"A team from Santiago. They're [[a tough opponent]]. They haven't lost a match all year."},{"sp":"Sam","t":"Wow. Do you think you'll win?"},{"sp":"Jose","t":"I think we'll win unless they serve much better than us."},{"sp":"Sam","t":"What's the plan for the next three days?"},{"sp":"Jose","t":"We're training every afternoon, and on Thursday we're watching videos of their matches with our coach."},{"sp":"Sam","t":"I heard your captain hurt her ankle. Is that true?"},{"sp":"Jose","t":"Yes, she had to [[pull out of]] the final. That was hard, but we're going to play for her."},{"sp":"Sam","t":"How do you [[stay fit]] during the season?"},{"sp":"Jose","t":"I [[work out]] at the school gym twice a week, and this week I'm going to bed early. No phone after ten!"},{"sp":"Sam","t":"Any message for the fans?"},{"sp":"Jose","t":"Come and support us! The match starts at five, and we're going to [[go for gold]]!"},{"sp":"Sam","t":"Great. I'll post this tonight. [[Fingers crossed]] for Saturday!"}],"questions":[{"q":"Why is the Santiago team a tough opponent?","opts":["They haven't lost a match all year","Their captain is very tall","They train every morning"],"a":0},{"q":"What is Jose's team doing on Thursday?","opts":["Playing a friendly match","Watching videos with their coach","Resting at home"],"a":1},{"q":"Why did the captain pull out of the final?","opts":["She's moving to Santiago","She was too nervous","She hurt her ankle"],"a":2}]},"lang":[{"e":"work out","t":"PV","d":"do exercise to make your body stronger","x":"I work out at the gym three times a week.","s":"work OUT"},{"e":"pull out of","t":"PV","d":"decide not to take part in something you planned to do","x":"She pulled out of the race because she hurt her knee.","s":"pull OUT of"},{"e":"keep up with","t":"PV","d":"go as fast as someone else","x":"He runs so fast that nobody can keep up with him.","s":"keep UP with"},{"e":"a tough opponent","t":"COL","d":"a team or player who is very difficult to beat","x":"Concepción are a tough opponent, but we can beat them.","s":"a TOUGH opPOnent"},{"e":"stay fit","t":"COL","d":"keep your body healthy and strong","x":"Swimming is a great way to stay fit.","s":"stay FIT"},{"e":"have butterflies in your stomach","t":"ID","d":"feel nervous before something important","x":"I always have butterflies in my stomach before a match.","s":"have BUTterflies in your STOMach"},{"e":"go for gold","t":"ID","d":"try very hard to win first place","x":"This is our last chance, so let's go for gold!","s":"go for GOLD"},{"e":"Fingers crossed!","t":"PHR","d":"something you say when you hope something good will happen","x":"The results come out tomorrow. Fingers crossed!","s":"FINgers CROSSED"}],"pron":{"focus":"Weak going to and stress on the main verb","explain":"In fast speech, going to is weak and quick. It often sounds like gonna. The stress goes on the main verb, not on going to. With the present continuous for arrangements, we stress the activity and the time.","tip":"Don't stress going to. Say it quickly and softly, and save your energy for the verb: going to GO, going to WIN.","lines":[{"t":"We're going to go for gold!","m":"we're going to GO for GOLD↘!"},{"t":"We're training every afternoon.","m":"we're TRAINing EVery afterNOON↘."},{"t":"Do you think you'll win?","m":"do you THINK you'll WIN↗?"}]},"acts":[{"type":"ranking","task":"Rank these sports from the most risky (1) to the least risky (7). Then compare with a partner and agree on one list. Use: I think … is riskier than … because … / You won't be safe unless you …","items":["skydiving","surfing","rock climbing","skateboarding","mountain biking","horse riding","football"]},{"type":"expert","topic":"A young athlete before a big competition","expert":"You are a young athlete (choose your sport) who is competing in a national final next month. Decide on your training plan, your toughest opponent, your goal and your plans for after the competition.","journalists":"You are sports journalists from a school podcast. Prepare questions about the athlete's plans, predictions and feelings, and ask follow-up questions.","questions":["When and where are you competing?","What are you going to do to get ready?","Who is your toughest opponent, and why?","Do you think you'll win? Why or why not?","What wil
