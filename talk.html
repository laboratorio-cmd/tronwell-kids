our notebook.","s":"HERE you are!","es":"¡Aquí tienes!"}],"pron":{"focus":"Linking an: an‿orange, an‿apple","explain":"We say an before a vowel sound (a, e, i, o, u) and we join it to the next word: an‿orange, an‿apple. It sounds like one word!","explain_es":"Decimos an antes de un sonido vocal (a, e, i, o, u) y lo unimos a la palabra siguiente: an‿orange, an‿apple. ¡Suena como una sola palabra!","tip":"Say it slowly first and then fast: it's an apple, it's‿an‿apple, itsanapple!","tip_es":"Dilo primero lento y luego rápido: it's an apple, it's‿an‿apple, itsanapple!","lines":[{"t":"What's this?","m":"what's THIS↘?"},{"t":"It's an orange crayon.","m":"it's‿an‿ORange CRAYon↘."},{"t":"It's an apple and a ruler.","m":"it's‿an‿APple‿and‿a RUler↘."}]},"acts":[{"type":"guess","cat":"Things in the classroom","items":["book","pen","pencil","bag","ruler","scissors","computer","chair","clock","notebook","crayon","paper"],"frames":["Is it a …?","Is it an …?","Is it big or small?","Is it for writing?"]},{"type":"picture","prompts":["What can you see in the photo? I can see …","Can you find the letters of your name? Spell your name!","What colour is the letter A? It's …","Find a letter for a classroom thing: B is for book. C is for …","Is there an alphabet in our classroom? Where is it?"]},{"type":"roulette","items":["How do you spell your name?","How do you spell pen?","What's in your school bag?","What colour is your ruler?","Have you got an orange crayon?","Is there a clock in our classroom?","What's your teacher's name? Can you spell it?","What's your favourite letter?","What's this? (Point to a thing.)","Can you say the alphabet from A to J?"]}],"rec":{"prompt":"Show three things from your school bag. Say what they are and spell one of them.","prompt_es":"Muestra tres cosas de tu mochila. Di qué son y deletrea una de ellas.","model":"Hello! My name is Benja. B-E-N-J-A. This is my school bag. What's this? It's a green ruler. This is my notebook, and this is an orange crayon. How do you spell crayon? C-R-A-Y-O-N!","use":["What's this?","ruler","How do you spell …?"]},"tips":[{"who":"teacher","t":"Play Spelling Race: say a classroom word, and the first team to spell it out loud correctly wins a point.","es":"Juega con la clase a la Carrera de Deletreo: di una palabra de la sala de clases, y el primer equipo que la deletree bien en voz alta gana un punto."},{"who":"student","t":"Practise spelling your full name and your teacher's name out loud, slowly and clearly.","es":"Practica deletrear en voz alta tu nombre completo y el nombre de tu profesor o profesora, lento y claro."}]},{"id":"moon-0-teen","lv":"moon","n":0,"age":"teen","title":"Spell It Out","goals":["spell names and surnames clearly","ask for things in class with Have you got a / an …?","say what things are with a and an"],"goals_es":["deletrear nombres y apellidos con claridad","pedir cosas en clases con Have you got a / an …?","decir qué son las cosas con a y an"],"warm":["How do you spell your surname?","What's in your bag today?","Do you write in a notebook or on a computer?","What's your favourite app?"],"warm_es":["¿Cómo se deletrea tu apellido?","¿Qué hay hoy en tu mochila?","¿Escribes en un cuaderno o en un computador?","¿Cuál es tu aplicación favorita?"],"model":{"kind":"dialogue","title":"First Day in Class","intro":"It's Sam's first day at Jose's school in Valparaíso, and Mr Díaz is writing the class list.","intro_es":"Es el primer día de Sam en el colegio de Jose en Valparaíso, y el profesor Díaz está escribiendo la lista del curso.","lines":[{"sp":"Mr Díaz","t":"Welcome to the class! [[What's your surname]], please?","es":"¡Bienvenido a la clase! ¿Cuál es tu apellido, por favor?"},{"sp":"Sam","t":"It's Walker.","es":"Es Walker."},{"sp":"Mr Díaz","t":"[[How do you spell it]]?","es":"¿Cómo se deletrea?"},{"sp":"Sam","t":"W-A-L-K-E-R.","es":"W-A-L-K-E-R."},{"sp":"Mr Díaz","t":"Thanks, Sam. Sit next to Jose, please.","es":"Gracias, Sam. Siéntate al lado de Jose, por favor."},{"sp":"Sam","t":"Jose, sorry, [[have you got a]] [[pencil]]?","es":"Jose, perdón, ¿tienes un lápiz?"},{"sp":"Jose","t":"Sure. [[Here you are]]. Do you need a [[ruler]] too?","es":"Claro. Aquí tienes. ¿Necesitas una regla también?"},{"sp":"Sam","t":"No, thanks. But what's this?","es":"No, gracias. Pero, ¿qué es esto?"},{"sp":"Jose","t":"It's a tiny [[computer]] for my coding club!","es":"¡Es un computador pequeñito para mi taller de programación!"},{"sp":"Sam","t":"Cool! Can I see it after class?","es":"¡Genial! ¿Puedo verlo después de clases?"},{"sp":"Jose","t":"Of course!","es":"¡Claro que sí!"}],"questions":[{"q":"How do you spell Sam's surname?","opts":["W-A-L-K-A","W-A-L-K-E-R","W-O-K-E-R"],"a":1},{"q":"What does Sam need?","opts":["A pencil","A ruler","A computer"],"a":0},{"q":"What is the tiny computer for?","opts":["Photos","Music","Jose's coding club"],"a":2}]},"lang":[{"e":"surname","t":"VOC","d":"your family name, for example Walker or Muñoz","x":"My name is Vale and my surname is Fuentes.","s":"SURname","es":"apellido"},{"e":"ruler","t":"VOC","d":"a flat stick for measuring and drawing straight lines","x":"I need a ruler for my maths homework.","s":"RUler","es":"regla"},{"e":"computer","t":"VOC","d":"a machine for writing, coding and the internet","x":"We use a computer in the coding club.","s":"comPUter","es":"computador"},{"e":"pencil","t":"VOC","d":"a thin wooden thing for writing and drawing in grey","x":"Can I borrow a pencil for the test?","s":"PENcil","es":"lápiz"},{"e":"What's your surname?","t":"PHR","d":"a question to ask for someone's family name","x":"What's your surname, please? — It's Soto.","s":"what's your SURname?","es":"¿Cuál es tu apellido?"},{"e":"How do you spell it?","t":"PHR","d":"a question to ask for the letters of a word","x":"Walker? How do you spell it?","s":"how do you SPELL it?","es":"¿Cómo se deletrea?"},{"e":"Have you got a …?","t":"PHR","d":"a question to ask if someone has a thing","x":"Have you got a pen I can use?","s":"have you GOT a …?","es":"¿Tienes un / una …?"},{"e":"Here you are.","t":"PHR","d":"you say this when you give something to someone","x":"Can I have a pencil? — Sure, here you are.","s":"HERE you are.","es":"Aquí tienes."}],"pron":{"focus":"Question intonation: Wh- questions ↘, yes/no questions ↗","explain":"Wh- questions (What …? How …?) go down at the end ↘. Yes/no questions (Have you got …?) go up at the end ↗.","explain_es":"Las preguntas con Wh- (What …? How …?) bajan al final ↘. Las preguntas de sí o no (Have you got …?) suben al final ↗.","tip":"Ask a friend three questions: two Wh- questions and one yes/no question. Can they hear the difference?","tip_es":"Hazle tres preguntas a un compañero: dos con Wh- y una de sí o no. ¿Nota la diferencia?","lines":[{"t":"What's your surname?","m":"what's your SURname↘?"},{"t":"How do you spell it?","m":"how do you SPELL‿it↘?"},{"t":"Have you got a pencil?","m":"have you GOT‿a PENcil↗?"}]},"acts":[{"type":"findsomeone","items":[{"p":"has got a long surname","q":"Have you got a long surname?"},{"p":"has got an apple or an orange in their bag","q":"Have you got an apple or an orange in your bag?"},{"p":"uses a computer for homework","q":"Do you use a computer for homework?"},{"p":"has got a blue pen","q":"Have you got a blue pen?"},{"p":"can spell their full name in five seconds","q":"Can you spell your full name in five seconds?"},{"p":"writes in a notebook every day","q":"Do you write in a notebook every day?"},{"p":"has got an umbrella in their bag","q":"Have you got an umbrella in your bag?"},{"p":"draws with a pencil","q":"Do you draw with a pencil?"}],"follow":["Can you spell it?","What colour is it?","Can I see it?"]},{"type":"roleplay","cards":[{"sit":"Joining a school club","a":"You are new and you want to join the volleyball club. Say: Hi! I want to join the club. Answer the questions and spell your name and surname.","b":"You are the club captain. Ask: What's your name? What's your surname? How do you spell it? Say the letters back to check."},{"sit":"Before a test","a":"You haven't got a pencil or a ruler. Ask your friend: Have you got a pencil? Have you got a ruler?","b":"You've got a pencil, but you haven't got a ruler. Say: Sure, here you are. / Sorry, I haven't got a ruler."},{"sit":"A new contact on your phone","a":"Your friend wants your name and surname for their phone. Say them and spell them slowly.","b":"Ask: How do you spell your name? And your surname? Write the letters, then read them back to check."}]},{"type":"ranking","task":"You've got a big test tomorrow. Put these things in order, from most useful to least useful. Say: For me, a … is very useful because …","items":["a pencil","a pen","a ruler","a notebook","a computer","a phone","an apple for a snack"]}],"rec":{"prompt":"Record a short message for a new classmate: say your name, spell your surname and say what's in your school bag.","prompt_es":"Graba un mensaje corto para un compañero nuevo: di tu nombre, deletrea tu apellido y di qué hay en tu mochila.","model":"Hi! I'm Tomás. My surname is Soto. How do you spell it? S-O-T-O. In my bag I've got a notebook, a pencil and an old computer for my film projects. Welcome to the class!","use":["surname","How do you spell it?","computer"]},"tips":[{"who":"teacher","t":"Ask students to spell real Chilean surnames like González, Fuentes or Jiménez: the letters G, J, E and I are great practice.","es":"Pide a los estudiantes que deletreen apellidos chilenos reales como González, Fuentes o Jiménez: las letras G, J, E e I son una gran práctica."},{"who":"student","t":"Spell the names of your favourite singers and footballers in English to a friend.","es":"Deletréale a un compañero, en inglés, los nombres de tus cantantes y futbolistas favoritos."}]},{"id":"moon-1-kid","lv":"moon","n":1,"age":"kid","title":"Family Photo Fun","goals":["introduce your family","say who people are and how old they are","ask about a friend's family"],"goals_es":["presentar a tu familia","decir quiénes son las personas y cuántos años tienen","preguntar por la familia de un amigo"],"warm":["Who is in your family?","Have you got a brother or a sister?","Have you got a pet? What's its name?","Is your family big or small?"],"warm_es":["¿Quiénes forman tu familia?","¿Tienes un hermano o una hermana?","¿Tienes una mascota? ¿Cómo se llama?","¿Tu familia es grande o pequeña?"],"model":{"kind":"dialogue","title":"Who's This?","intro":"Benja is at Leo's house. They look at a big family photo on the wall.","intro_es":"Benja está en la casa de Leo. Miran una foto grande de la familia en la pared.","lines":[{"sp":"Benja","t":"Is this your family, Leo?","es":"¿Esta es tu familia, Leo?"},{"sp":"Leo","t":"Yes! [[This is my]] [[mum]] and this is my dad.","es":"¡Sí! Esta es mi mamá y este es mi papá."},{"sp":"Benja","t":"And [[who's this]]?","es":"¿Y quién es?"},{"sp":"Leo","t":"It's my sister, Sofi. She's a [[baby]] in this photo!","es":"Es mi hermana, Sofi. ¡En esta foto es bebé!"},{"sp":"Benja","t":"Ha ha! She's very small. Is this your [[grandma]]?","es":"¡Ja, ja! Es muy chiquitita. ¿Esta es tu abuela?"},{"sp":"Leo","t":"Yes, it's Grandma Ana. She's seventy.","es":"Sí, es la abuela Ana. Tiene setenta años."},{"sp":"Benja","t":"And the girl with the guitar? Is she your sister too?","es":"¿Y la niña de la guitarra? ¿También es tu hermana?"},{"sp":"Leo","t":"No, she isn't. She's my [[cousin]], Kai. She's from Sydney.","es":"No. Es mi prima, Kai. Es de Sídney."},{"sp":"Benja","t":"Cool! And this dog? Is he your [[pet]]?","es":"¡Genial! ¿Y este perro? ¿Es tu mascota?"},{"sp":"Leo","t":"Yes! That's Pipo. He's [[part of the family]] too!","es":"¡Sí! Es Pipo. ¡También es parte de la familia!"}],"questions":[{"q":"Who is the baby in the photo?","opts":["Sofi","Kai","Benja"],"a":0},{"q":"How old is Grandma Ana?","opts":["Seven","Seventeen","Seventy"],"a":2},{"q":"Who is Kai?","opts":["Leo's sister","Leo's cousin","Leo's mum"],"a":1}]},"lang":[{"e":"mum","t":"VOC","d":"your mother","x":"My mum is a teacher.","s":"MUM","es":"mamá"},{"e":"grandma","t":"VOC","d":"the mother of your mum or dad","x":"My grandma makes great empanadas.","s":"GRANDma","es":"abuela"},{"e":"baby","t":"VOC","d":"a very young child","x":"My baby brother is one year old.","s":"BAby","es":"bebé / guagua"},{"e":"cousin","t":"VOC","d":"the child of your aunt or uncle","x":"Kai is my cousin from Sydney.","s":"COUsin","es":"primo / prima"},{"e":"pet","t":"VOC","d":"an animal that lives in your home","x":"Our pet is a big brown dog.","s":"PET","es":"mascota"},{"e":"Who's this?","t":"PHR","d":"a question to ask about a person in a photo","x":"Who's this in the photo? — It's my dad.","s":"who's THIS?","es":"¿Quién es?"},{"e":"This is my …","t":"PHR","d":"you say this to show or introduce a person","x":"This is my brother, Leo.","s":"THIS is my …","es":"Este es mi … / Esta es mi …"},{"e":"part of the family","t":"PHR","d":"like a family member, but maybe not a person","x":"Our dog is part of the family.","s":"PART of the FAMily","es":"parte de la familia"}],"pron":{"focus":"Short forms: I'm, he's, she's","explain":"When we speak, we join words: I am → I'm, he is → he's, she is → she's. It sounds friendly and natural.","explain_es":"Cuando hablamos, unimos palabras: I am → I'm, he is → he's, she is → she's. Suena amigable y natural.","tip":"Clap once for I'm and once for she's: each one is one short sound, not two words.","tip_es":"Aplaude una vez por I'm y una vez por she's: cada uno es un solo sonido corto, no dos palabras.","lines":[{"t":"This is my mum.","m":"this‿is my MUM↘."},{"t":"She's my cousin. She isn't my sister.","m":"she's my COUsin↘ | she ISn't my SISter↘."},{"t":"He's ten and I'm eight.","m":"he's TEN↗ | and‿I'm EIGHT↘."}]},"acts":[{"type":"findsomeone","items":[{"p":"has got a sister","q":"Have you got a sister?"},{"p":"has got a baby in the family","q":"Is there a baby in your family?"},{"p":"has got a dog","q":"Have you got a dog?"},{"p":"has got a cat","q":"Have you got a cat?"},{"p":"has got a cousin in another city","q":"Have you got a cousin in another city?"},{"p":"has got a big family","q":"Is your family big?"},{"p":"has got a grandma who makes empanadas","q":"Does your grandma make empanadas?"},{"p":"has got a best friend in this class","q":"Is your best friend in this class?"}],"follow":["What's his or her name?","How old is he or she?"]},{"type":"picture","prompts":["How many people are in the photo? There are …","Point to the mum and the dad. Are they happy?","Give the two girls names. How old are they? I think they're …","Where are they? They're on a …","Is your family like this family? My family is …"]},{"type":"minute","sec":45,"items":["Me: I'm … I'm … years old.","My mum or dad: This is my … He's / She's very …","My brother or sister: I've got … / I haven't got …","My grandma or grandpa: My grandma is … She's …","My pet (or the pet I want): My pet is a … / I want a …","My best friend: My best friend is … He's / She's …","My cousins: I've got … cousins. They're …"]}],"rec":{"prompt":"Show a photo or a drawing of your family. Say who they are and how old they are.","prompt_es":"Muestra una foto o un dibujo de tu familia. Di quiénes son y cuántos años tienen.","model":"This is my family. This is my mum, and this is my dad. Sofi is my sister. She's eight. I'm ten. Kai isn't my sister. She's my cousin. And this is Pipo. He's our pet, and he's part of the family too!","use":["This is my …","cousin","part of the family"]},"tips":[{"who":"teacher","t":"Ask students to bring a family photo or to draw their family. Welcome every kind of family: with grandparents, one parent, cousins or pets.","es":"Pide a los estudiantes que traigan una foto familiar o que dibujen a su familia. Acepta todo tipo de familia: con abuelos, con un solo papá o mamá, con primos o con mascotas."},{"who":"student","t":"Make a family tree in your notebook and say one sentence about each person.","es":"Haz un árbol genealógico en tu cuaderno y di una oración sobre cada persona."}]},{"id":"moon-1-teen","lv":"moon","n":1,"age":"teen","title":"My People","goals":["introduce your family and friends","ask and answer questions about someone's family","give short answers like Yes, I am. / No, he isn't."],"goals_es":["presentar a tu familia y a tus amigos","hacer y responder preguntas sobre la familia de alguien","dar respuestas cortas como Yes, I am. / No, he isn't."],"warm":["How many people are in your family?","Have you got brothers or sisters?","Who is very funny in your family?","Is your best friend in this class?"],"warm_es":["¿Cuántas personas hay en tu familia?","¿Tienes hermanos o hermanas?","¿Quién es muy divertido en tu familia?","¿Tu mejor amigo o amiga está en esta clase?"],"model":{"kind":"dialogue","title":"Photos on My Phone","intro":"At lunch, Vale shows Sam some photos on her phone.","intro_es":"A la hora de almuerzo, Vale le muestra a Sam unas fotos en su celular.","lines":[{"sp":"Sam","t":"Nice photo! [[Who's this]]?","es":"¡Linda foto! ¿Quién es?"},{"sp":"Vale","t":"[[This is my]] [[brother]], Martín. He's eighteen [[years old]].","es":"Este es mi hermano, Martín. Tiene dieciocho años."},{"sp":"Sam","t":"Is he at our school?","es":"¿Está en nuestro colegio?"},{"sp":"Vale","t":"No, he isn't. He's at university in Valparaíso.","es":"No. Está en la universidad, en Valparaíso."},{"sp":"Sam","t":"Cool! And who's the man with the dog?","es":"¡Genial! ¿Y quién es el señor del perro?"},{"sp":"Vale","t":"That's my [[grandpa]], and Toby is his [[pet]]. They're always together!","es":"Es mi abuelo, y Toby es su mascota. ¡Siempre están juntos!"},{"sp":"Sam","t":"Ha ha! Have you got a sister?","es":"¡Ja, ja! ¿Tienes una hermana?"},{"sp":"Vale","t":"No, I haven't. What about you? Are you an [[only child]]?","es":"No. ¿Y tú? ¿Eres hijo único?"},{"sp":"Sam","t":"Yes, I am. My family is in Sydney, so my friends are my family here.","es":"Sí. Mi familia está en Sídney, así que mis amigos son mi familia aquí."},{"sp":"Vale","t":"That's so nice! Now we're your [[best friends]] in Chile!","es":"¡Qué lindo! ¡Ahora somos tus mejores amigos en Chile!"}],"questions":[{"q":"How old is Martín?","opts":["Sixteen","Eighteen","Fifteen"],"a":1},{"q":"What is Toby?","opts":["A dog","A cat","A brother"],"a":0},{"q":"Where is Sam's family?","opts":["In Valparaíso","In Santiago","In Sydney"],"a":2}]},"lang":[{"e":"brother","t":"VOC","d":"a boy or man with the same parents as you","x":"My brother is eighteen and he loves football.","s":"BROther","es":"hermano"},{"e":"grandpa","t":"VOC","d":"the father of your mum or dad","x":"My grandpa lives in Valparaíso.","s":"GRANDpa","es":"abuelo / tata"},{"e":"pet","t":"VOC","d":"an animal you keep at home","x":"Our pet is a lazy cat called Luna.","s":"PET","es":"mascota"},{"e":"best friend","t":"COL","d":"the friend you like most","x":"Jose is my best friend. We talk every day.","s":"BEST FRIEND","es":"mejor amigo / mejor amiga"},{"e":"only child","t":"COL","d":"a person with no brothers or sisters","x":"I'm an only child, but I've got lots of cousins.","s":"ONly CHILD","es":"hijo único / hija única"},{"e":"Who's this?","t":"PHR","d":"a question to ask about a person in a photo or video","x":"Who's this on your phone? — It's my cousin.","s":"who's THIS?","es":"¿Quién es?"},{"e":"This is my …","t":"PHR","d":"you use this to introduce a person to someone","x":"This is my friend Tomás. He's from Concepción.","s":"THIS is my …","es":"Este es mi … / Esta es mi …"},{"e":"… years old","t":"PHR","d":"we use this to say how old a person is","x":"My sister is twelve years old.","s":"… YEARS OLD","es":"tiene … años"}],"pron":{"focus":"Short answers: Yes, I am. / No, he isn't.","explain":"In short answers, we stress the verb: Yes, I AM. No, he ISn't. Don't say just yes or no: add the short answer!","explain_es":"En las respuestas cortas acentuamos el verbo: Yes, I AM. No, he ISn't. No digas solo yes o no: ¡agrega la respuesta corta!","tip":"Ask your friend five yes/no questions about their family. Answer only with short answers.","tip_es":"Hazle a tu compañero cinco preguntas de sí o no sobre su familia. Respondan solo con respuestas cortas.","lines":[{"t":"Are you an only child? Yes, I am.","m":"are you‿an ONly CHILD↗ | YES↘ | I AM↘."},{"t":"Is he at your school? No, he isn't.","m":"is he‿at your SCHOOL↗ | NO↘ | he ISn't↘."},{"t":"This is my brother. He's eighteen.","m":"this‿is my BROther↘ | he's eighTEEN↘."}]},"acts":[{"type":"findsomeone","items":[{"p":"is an only child","q":"Are you an only child?"},{"p":"has got a brother or sister at university","q":"Have you got a brother or sister at university?"},{"p":"has got cousins in another city","q":"Have you got cousins in another city?"},{"p":"has got a pet with a funny name","q":"Have you got a pet with a funny name?"},{"p":"has got a baby in the family","q":"Is there a baby in your family?"},{"p":"lives with a grandma or grandpa","q":"Does your grandma or grandpa live with you?"},{"p":"has got a best friend from primary school","q":"Is your best friend from primary school?"},{"p":"has got family in another country","q":"Have you got family in another country?"}],"follow":["Who?","Where?","What's his or her name?"]},{"type":"agree","items":["Big families are more fun than small families.","Brothers and sisters are your first friends.","Pets are part of the family.","A best friend is like a brother or sister.","Grandmas are the best cooks in the world.","An only child is a lucky child.","Family photos on social media are a bad idea."]},{"type":"picture","prompts":["Who is in the photo? There's a mum, a dad and …","How old are the two girls? I think they're …","Are the girls sisters or friends? I think they're …","Where are they? Are they happy? Why?","Is this family like your family? How is it different?"]}],"rec":{"prompt":"Choose a photo of family or friends on your phone and describe it: who are they, how old are they and what are they like?","prompt_es":"Elige una foto de tu familia o de tus amigos en tu celular y descríbela: quiénes son, cuántos años tienen y cómo son.","model":"This is my favourite photo. This is my brother, Diego. He's sixteen years old and he's very funny. The girl with the camera is Antonia, my best friend. We aren't sisters, but we are like family!","use":["This is my …","… years old","best friend"]},"tips":[{"who":"teacher","t":"Let students show photos of friends, pets or a family from a film or series if they prefer not to talk about their own family.","es":"Deja que los estudiantes muestren fotos de amigos, de mascotas o de una familia de una película o serie si prefieren no hablar de su propia familia."},{"who":"student","t":"Write five sentences about your family with am, is and are, then say them without looking.","es":"Escribe cinco oraciones sobre tu familia con am, is y are, y luego dilas sin mirar."}]},{"id":"moon-2-kid","lv":"moon","n":2,"age":"kid","title":"Clothes Detectives","goals":["name clothes and say what you are wearing","ask about things with this, that, these and those","find the owner of lost clothes"],"goals_es":["nombrar prendas de ropa y decir qué llevas puesto","preguntar por cosas con this, that, these y those","encontrar al dueño de la ropa perdida"],"warm":["What are you wearing today?","What colour are your shoes?","Have you got a favourite cap?","What do you wear on a cold day?"],"warm_es":["¿Qué llevas puesto hoy?","¿De qué color son tus zapatos?","¿Tienes una gorra favorita?","¿Qué te pones en un día frío?"],"model":{"kind":"dialogue","title":"The Lost Property Box","intro":"It's a cold day at school, and Ms Rojas has a big box of lost clothes.","intro_es":"Es un día frío en el colegio y la profesora Rojas tiene una caja grande con ropa perdida.","lines":[{"sp":"Ms Rojas","t":"Leo, [[is this yours]]? It's a blue [[scarf]].","es":"Leo, ¿esto es tuyo? Es una bufanda azul."},{"sp":"Leo","t":"No, it isn't. My scarf is red.","es":"No, no es mía. Mi bufanda es roja."},{"sp":"Ms Rojas","t":"OK. And these [[gloves]]? Are they yours?","es":"Bueno. ¿Y estos guantes? ¿Son tuyos?"},{"sp":"Leo","t":"Yes, they are! Thank you, Ms Rojas.","es":"¡Sí, son míos! Gracias, profesora Rojas."},{"sp":"Ms Rojas","t":"[[Here you are]]. Now [[put on]] your gloves. It's cold!","es":"Aquí tienes. Ahora ponte los guantes. ¡Hace frío!"},{"sp":"Martina","t":"Ms Rojas, are those my [[trainers]] [[over there]]?","es":"Profesora Rojas, ¿esas de allá son mis zapatillas?"},{"sp":"Ms Rojas","t":"These green trainers? Yes, they are. Your name is on them.","es":"¿Estas zapatillas verdes? Sí, son tuyas. Tienen tu nombre."},{"sp":"Martina","t":"Great! Leo, [[I like your]] gloves. They're cool!","es":"¡Qué bien! Leo, me gustan tus guantes. ¡Son geniales!"},{"sp":"Leo","t":"Thanks! They're from Grandma Ana.","es":"¡Gracias! Me los regaló la abuela Ana."}],"questions":[{"q":"What colour is Leo's scarf?","opts":["Blue","Red","Green"],"a":1},{"q":"Whose are the green trainers?","opts":["Martina's","Leo's","Ms Rojas's"],"a":0},{"q":"Who are Leo's gloves from?","opts":["Ms Rojas","Martina","Grandma Ana"],"a":2}]},"lang":[{"e":"scarf","t":"VOC","d":"a long piece of clothing that you wear round your neck","x":"My scarf is red and very warm.","s":"SCARF","es":"bufanda"},{"e":"gloves","t":"VOC","d":"you wear them on your hands on cold days","x":"Put your gloves in your bag.","s":"GLOVES","es":"guantes"},{"e":"trainers","t":"VOC","d":"comfortable shoes for sport","x":"These trainers are new.","s":"TRAIners","es":"zapatillas"},{"e":"Is this yours?","t":"PHR","d":"a question to find out who a thing belongs to","x":"Is this yours? It's a green cap.","s":"is THIS YOURS","es":"¿Esto es tuyo?"},{"e":"Here you are.","t":"PHR","d":"you say this when you give something to someone","x":"Here you are. This is your coat.","s":"HERE you ARE","es":"Aquí tienes."},{"e":"I like your…","t":"PHR","d":"a nice thing to say about someone's clothes or things","x":"I like your cap! It's cool.","s":"i LIKE your","es":"Me gusta tu… / Me gustan tus…"},{"e":"put on","t":"PV","d":"start to wear a piece of clothing","x":"Put on your coat. It's cold!","s":"put ON","es":"ponerse (ropa)"},{"e":"over there","t":"PREP","d":"in that place, not near you","x":"Your shoes are over there, next to the door.","s":"over THERE","es":"allá / por allá"}],"pron":{"focus":"this or these? Short and long sounds","explain":"In this, the i is short. In these, the ee is long. For th, put your tongue between your teeth.","explain_es":"En this, la i es corta. En these, la ee es larga. Para th, pon la lengua entre los dientes.","tip":"Smile when you say these and make the sound long: theeese!","tip_es":"Sonríe cuando digas these y alarga el sonido: ¡theeese!","lines":[{"t":"Is this your scarf?","m":"is THIS your SCARF↗?"},{"t":"Are these your gloves?","m":"are THESE your GLOVES↗?"},{"t":"Those trainers are cool!","m":"THOSE TRAIners are COOL↘!"}]},"acts":[{"type":"guess","cat":"Clothes","items":["T-shirt","jeans","dress","trainers","shoes","cap","socks","coat","scarf","gloves","shorts","glasses"],"frames":["Do you wear it on your head?","Are they for your feet?","Is it for cold days?","Is it a…? / Are they…?"]},{"type":"findsomeone","items":[{"p":"is wearing trainers today","q":"Are you wearing trainers today?"},{"p":"has got a favourite cap","q":"Have you got a favourite cap?"},{"p":"wears glasses","q":"Do you wear glasses?"},{"p":"has got funny socks","q":"Have you got funny socks?"},{"p":"wears shorts in summer","q":"Do you wear shorts in summer?"},{"p":"has got a red T-shirt","q":"Have you got a red T-shirt?"},{"p":"wears gloves in winter","q":"Do you wear gloves in winter?"},{"p":"likes yellow clothes","q":"Do you like yellow clothes?"}],"follow":["What colour is it?","Is it new?"]},{"type":"picture","prompts":["How many children are there in this photo?","Look at the red dress. Do you like it?","Who is wearing yellow? Who is wearing red?","Are the children happy or sad?","Which clothes do you like? Say: I like that… / I like those…"]}],"rec":{"prompt":"Record yourself. Talk about your clothes today or your favourite clothes. Use this, these, that and those.","prompt_es":"Grábate. Habla de la ropa que llevas hoy o de tu ropa favorita. Usa this, these, that y those.","model":"Hello! This is my favourite T-shirt. It's blue and white. These are my new trainers. They're red and very cool. And that is my cap over there. I like my clothes!","use":["trainers","over there"]},"tips":[{"who":"teacher","t":"Bring a bag of real clothes. Hold some near you (this, these) and put some far away (that, those). Then ask: Is this your scarf? Are those your gloves?","es":"Trae una bolsa con ropa de verdad. Ten algunas prendas cerca (this, these) y deja otras lejos (that, those). Luego pregunta: Is this your scarf? Are those your gloves?"},{"who":"student","t":"Point when you speak: this and these for things near you, that and those for things far away.","es":"Apunta con el dedo cuando hables: this y these para cosas cerca de ti, that y those para cosas lejos."}]},{"id":"moon-2-teen","lv":"moon","n":2,"age":"teen","title":"Swap Shop","goals":["describe clothes and say what you like wearing","ask who things belong to with this, that, these and those","give your opinion about clothes"],"goals_es":["describir ropa y decir qué te gusta usar","preguntar de quién son las cosas con this, that, these y those","dar tu opinión sobre la ropa"],"warm":["What are your favourite clothes?","Do you wear a cap? When?","What do you wear for sport?","Have you got any clothes that are too small for you now?"],"warm_es":["¿Cuál es tu ropa favorita?","¿Usas gorra? ¿Cuándo?","¿Qué te pones para hacer deporte?","¿Tienes ropa que ahora te queda chica?"],"model":{"kind":"dialogue","title":"At the Clothes Swap","intro":"There's a clothes swap at school. Vale and Jose look at the tables, and then Sam arrives.","intro_es":"Hay un intercambio de ropa en el colegio. Vale y Jose miran las mesas y luego llega Sam.","lines":[{"sp":"Jose","t":"Vale, look at those [[jeans]] over there! Are they yours?","es":"Vale, ¡mira esos jeans de allá! ¿Son tuyos?"},{"sp":"Vale","t":"Yes, they are. They're [[too small for me]] now.","es":"Sí, son míos. Ahora me quedan chicos."},{"sp":"Jose","t":"Cool! Can I [[try them on]]?","es":"¡Genial! ¿Me los puedo probar?"},{"sp":"Vale","t":"Sure! Wow, they [[look great on you]]!","es":"¡Claro! ¡Guau, te quedan muy bien!"},{"sp":"Jose","t":"Thanks! Hey, is that Tomás's black [[cap]]?","es":"¡Gracias! Oye, ¿esa es la gorra negra de Tomás?"},{"sp":"Vale","t":"Yes, it is. He's got a new one now.","es":"Sí, es suya. Ahora tiene una nueva."},{"sp":"Sam","t":"Hi, Jose! [[Are these yours]]? These white [[trainers]]?","es":"¡Hola, Jose! ¿Son tuyas? ¿Estas zapatillas blancas?"},{"sp":"Jose","t":"No, they aren't. But they're really nice!","es":"No, no son mías. ¡Pero son muy bonitas!"},{"sp":"Sam","t":"They're my old ones. Do you want them?","es":"Son mis zapatillas viejas. ¿Las quieres?"},{"sp":"Jose","t":"Yes, please! I love [[second-hand clothes]].","es":"¡Sí, por favor! Me encanta la ropa de segunda mano."}],"questions":[{"q":"What is the problem with Vale's jeans?","opts":["They're too big for her","They're too small for her","They're dirty"],"a":1},{"q":"Whose is the black cap?","opts":["Tomás's","Sam's","Vale's"],"a":0},{"q":"What does Sam want to give Jose?","opts":["A black cap","Some jeans","His old white trainers"],"a":2}]},"lang":[{"e":"jeans","t":"VOC","d":"trousers made of strong cotton, often blue","x":"These jeans are my favourites.","s":"JEANS","es":"jeans"},{"e":"trainers","t":"VOC","d":"comfortable shoes for sport or every day","x":"Are those your new trainers?","s":"TRAIners","es":"zapatillas"},{"e":"cap","t":"VOC","d":"a soft hat with a hard part at the front","x":"I wear my cap on sunny days.","s":"CAP","es":"gorra"},{"e":"Are these yours?","t":"PHR","d":"a question to find out who some things belong to","x":"Are these yours? They're on my desk.","s":"are THESE YOURS","es":"¿Son tuyos? / ¿Son tuyas?"},{"e":"too small for me","t":"PHR","d":"not big enough for my body","x":"This coat is too small for me now.","s":"TOO SMALL for me","es":"me queda chico / me queda pequeño"},{"e":"look great on you","t":"PHR","d":"you say this when clothes are perfect for someone","x":"That scarf looks great on you!","s":"look GREAT on YOU","es":"te queda muy bien"},{"e":"try on","t":"PV","d":"put on clothes to see if they are the right size","x":"Can I try on these trainers?","s":"try ON","es":"probarse (ropa)"},{"e":"second-hand clothes","t":"COL","d":"clothes that another person wore before you","x":"I often buy second-hand clothes. They're cheap and cool.","s":"SECond-hand CLOTHES","es":"ropa de segunda mano"}],"pron":{"focus":"Linking words: look‿at, them‿on","explain":"When a word ends in a consonant sound and the next word starts with a vowel sound, we join them: look‿at, them‿on, great‿on.","explain_es":"Cuando una palabra termina en sonido consonante y la siguiente empieza con sonido vocal, las unimos: look‿at, them‿on, great‿on.","tip":"Say the two words like one word: lookat, greaton. You sound faster and more natural.","tip_es":"Di las dos palabras como si fueran una sola: lookat, greaton. Así suenas más rápido y más natural.","lines":[{"t":"Look at those jeans!","m":"LOOK‿at THOSE JEANS↘!"},{"t":"Can I try them on?","m":"can‿I TRY them‿ON↗?"},{"t":"They look great on you.","m":"they LOOK GREAT‿on YOU↘."}]},"acts":[{"type":"findsomeone","items":[{"p":"has got a favourite cap","q":"Have you got a favourite cap?"},{"p":"wears trainers every day","q":"Do you wear trainers every day?"},{"p":"likes second-hand clothes","q":"Do you like second-hand clothes?"},{"p":"has got jeans that are too small","q":"Have you got jeans that are too small for you?"},{"p":"wears glasses","q":"Do you wear glasses?"},{"p":"wears a scarf in winter","q":"Do you wear a scarf in winter?"},{"p":"buys clothes online","q":"Do you buy clothes online?"},{"p":"wears shorts for sport","q":"Do you wear shorts for sport?"}],"follow":["Why?","What colour?"]},{"type":"roleplay","cards":[{"sit":"A clothes swap at school","a":"You have old clothes on your table: jeans, a cap and a coat. Show them to B: This is… / These are… Then ask: Do you want…?","b":"You want trainers and a cap. Ask A: Is that cap…? Can I try it on? Then say: It's too small for me. / It looks great!"},{"sit":"Lost things after volleyball practice","a":"You find a scarf and some gloves in your bag. Ask B: Is this your scarf? Are these your gloves?","b":"The gloves are yours, but the scarf isn't. Answer: Yes, they are! / No, it isn't. Then say thank you."},{"sit":"Getting ready for a birthday party","a":"You can't choose your clothes. Show B two T-shirts and ask: This one or that one? Do these jeans look OK?","b":"Give your opinion: That one looks great on you! I like those jeans. Wear your white trainers!"}]},{"type":"wyr","items":[["wear jeans every day","wear shorts every day"],["have ten caps","have ten pairs of trainers"],["wear a big coat in summer","wear shorts in winter"],["buy new clothes","get second-hand clothes"],["wear funny socks to school","wear funny glasses to school"],["choose your clothes for school","wear a school uniform"]]}],"rec":{"prompt":"Record a 30-second outfit check: describe what you are wearing today and your favourite clothes. Use this, these, that and those.","prompt_es":"Graba un outfit check de 30 segundos: describe lo que llevas puesto hoy y tu ropa favorita. Usa this, these, that y those.","model":"Hi! This is my outfit for today. These are my favourite jeans, and this is my old grey T-shirt. Those trainers over there are for sport. My jeans are a bit too small for me now, but I love them!","use":["too small for me","jeans","trainers"]},"tips":[{"who":"teacher","t":"Ask students to bring one piece of clothing or a photo of it on their phone. Run a quick swap: to take something, they must ask a question with this, that, these or those.","es":"Pide a los estudiantes que traigan una prenda de ropa o una foto de ella en el celular. Hagan un intercambio rápido: para llevarse algo, deben hacer una pregunta con this, that, these o those."},{"who":"student","t":"Jeans, shorts, trainers and glasses are always plural, so use these and those: These jeans are new.","es":"Jeans, shorts, trainers y glasses siempre van en plural, así que usa these y those: These jeans are new."}]},{"id":"moon-3-kid","lv":"moon","n":3,"age":"kid","title":"Welcome to My House!","goals":["say what there is in your house","ask about a friend's house with Is there…? and Are there…?","describe your dream house"],"goals_es":["decir qué hay en tu casa","preguntar por la casa de un amigo con Is there…? y Are there…?","describir la casa de tus sueños"],"warm":["Is your house big or small?","Is there a garden at your house?","How many beds are there in your bedroom?","Where is your TV?"],"warm_es":["¿Tu casa es grande o pequeña?","¿Hay un jardín en tu casa?","¿Cuántas camas hay en tu dormitorio?","¿Dónde está tu tele?"],"model":{"kind":"dialogue","title":"A Visit to Leo's House","intro":"Benja visits Leo's house for the first time.","intro_es":"Benja visita la casa de Leo por primera vez.","lines":[{"sp":"Leo","t":"[[Come in]], Benja! [[Let me show you]] my house.","es":"¡Pasa, Benja! Déjame mostrarte mi casa."},{"sp":"Benja","t":"Thanks! Wow, that's a big [[sofa]]!","es":"¡Gracias! ¡Guau, qué sofá tan grande!"},{"sp":"Leo","t":"Yes, it's Pipo's favourite place. He sleeps on it!","es":"Sí, es el lugar favorito de Pipo. ¡Duerme ahí!"},{"sp":"Benja","t":"Ha ha! [[Is there a]] garden?","es":"¡Ja, ja! ¿Hay un jardín?"},{"sp":"Leo","t":"Yes, there is. It's small, but there are two trees.","es":"Sí, hay uno. Es pequeño, pero hay dos árboles."},{"sp":"Benja","t":"Cool! Where's your [[bedroom]]?","es":"¡Genial! ¿Dónde está tu dormitorio?"},{"sp":"Leo","t":"Here. There are two beds, one for me and one for Sofi.","es":"Aquí. Hay dos camas, una para mí y otra para Sofi."},{"sp":"Benja","t":"And what's that [[on the wall]]?","es":"¿Y qué es eso en la pared?"},{"sp":"Leo","t":"It's Sofi's picture of Pipo.","es":"Es el dibujo de Pipo que hizo Sofi."},{"sp":"Benja","t":"It's great! Is there a TV?","es":"¡Está genial! ¿Hay tele?"},{"sp":"Leo","t":"Yes, there is. It's [[next to]] the window. Let's play a game!","es":"Sí, hay una. Está al lado de la ventana. ¡Vamos a jugar!"}],"questions":[{"q":"Where does Pipo sleep?","opts":["In the garden","On the sofa","In Leo's bed"],"a":1},{"q":"How many trees are there in the garden?","opts":["Two","One","Three"],"a":0},{"q":"What is on the wall?","opts":["A clock","A photo of Leo","Sofi's picture of Pipo"],"a":2}]},"lang":[{"e":"sofa","t":"VOC","d":"a long, soft seat for two or more people","x":"There is a big sofa in the living room.","s":"SOfa","es":"sofá"},{"e":"garden","t":"VOC","d":"a place with grass, trees or flowers next to a house","x":"There are flowers in our garden.","s":"GARden","es":"jardín"},{"e":"bedroom","t":"VOC","d":"the room where you sleep","x":"There are two beds in my bedroom.","s":"BEDroom","es":"dormitorio"},{"e":"Come in!","t":"PHR","d":"you say this when you open the door to a visitor","x":"Hi, Martina! Come in!","s":"come IN","es":"¡Pasa! / ¡Adelante!"},{"e":"Let me show you…","t":"PHR","d":"you say this before you take someone to see something","x":"Let me show you my bedroom.","s":"let me SHOW you","es":"Déjame mostrarte…"},{"e":"Is there a…?","t":"PHR","d":"a question to find out if a thing is in a place","x":"Is there a bath in your house?","s":"IS there a","es":"¿Hay un…? / ¿Hay una…?"},{"e":"on the wall","t":"PREP","d":"on the side of a room, where you can hang pictures","x":"There is a clock on the wall.","s":"on the WALL","es":"en la pared"},{"e":"next to","t":"PREP","d":"very near, at the side of something","x":"The TV is next to the window.","s":"NEXT to","es":"al lado de"}],"pron":{"focus":"there's and there are","explain":"We often say there's for there is. For th, put your tongue between your teeth. In there are, join the two words: there‿are.","explain_es":"Muchas veces decimos there's en vez de there is. Para th, pon la lengua entre los dientes. En there are, une las dos palabras: there‿are.","tip":"Put your finger in front of your lips. When you say th, your tongue touches your finger!","tip_es":"Pon un dedo delante de los labios. Cuando digas th, ¡la lengua toca tu dedo!","lines":[{"t":"There's a big sofa.","m":"there's a BIG SOfa↘."},{"t":"There are two beds.","m":"there‿are TWO BEDS↘."},{"t":"Is there a garden?","m":"is there‿a GARden↗?"}]},"acts":[{"type":"guess","cat":"Things in a house","items":["bed","sofa","bath","shower","toilet","TV","door","garden","key","picture","radio"],"frames":["Is it in the bathroom?","Can you sit on it?","Is it big or small?","Is it a…?"]},{"type":"ranking","task":"Plan your dream house! Put these things in order from 1 (I really want it!) to 7 (I don't want it). Then tell your partner: Number one is… In my dream house there is…","items":["a big garden","a TV in every room","a very long sofa","a big bath","a bed for my pet","a games room","a tree house"]},{"type":"picture","prompts":["Is this house big or small?","What is there in the garden?","Are there any trees? How many can you see?","Is it sunny or rainy in the photo?","Is your home like this house? Say: In my home there is… / There isn't…"]}],"rec":{"prompt":"Record yourself. Talk about your home: what is there in your bedroom and in the living room?","prompt_es":"Grábate. Habla de tu casa: ¿qué hay en tu dormitorio y en la sala de estar?","model":"My house is in Santiago. It's small and pretty. There is a big sofa in the living room, and there is a picture on the wall. In my bedroom there are two beds. There isn't a garden, but there are lots of plants.","use":["sofa","on the wall","bedroom"]},"tips":[{"who":"teacher","t":"Play Is there a…? Think of a room in your house. Students ask Is there a…? and Are there any…? and guess the room.","es":"Jueguen a Is there a…? Piensa en una habitación de tu casa. Los estudiantes preguntan Is there a…? y Are there any…? y adivinan qué habitación es."},{"who":"student","t":"Use there is for one thing and there are for two or more. When you speak fast, say there's.","es":"Usa there is para una cosa y there are para dos o más. Cuando hables rápido, di there's."}]},{"id":"moon-3-teen","lv":"moon","n":3,"age":"teen","title":"Room Tour","goals":["describe your room and your home with there is and there are","ask a friend about their home","give a short room tour"],"goals_es":["describir tu habitación y tu casa con there is y there are","preguntarle a un amigo sobre su casa","hacer un breve tour por tu habitación"],"warm":["What is your favourite room at home? Why?","Is there a TV in your bedroom?","Where do you do your homework?","Do you share your room with a brother or sister?"],"warm_es":["¿Cuál es tu lugar favorito de la casa? ¿Por qué?","¿Hay una tele en tu habitación?","¿Dónde haces tus tareas?","¿Compartes tu habitación con un hermano o una hermana?"],"model":{"kind":"dialogue","title":"Vale's Room Tour","intro":"Vale makes a room tour video for a school project, and Jose watches on a video call.","intro_es":"Vale graba un video de su habitación para un proyecto del colegio, y Jose lo ve por videollamada.","lines":[{"sp":"Vale","t":"Hi, Jose! [[Welcome to my]] room!","es":"¡Hola, Jose! ¡Bienvenida a mi habitación!"},{"sp":"Jose","t":"Hi! Wow, there are lots of [[pictures]] [[on the wall]].","es":"¡Hola! Guau, hay muchos cuadros en la pared."},{"sp":"Vale","t":"Yes, they're my drawings. And this is my [[desk]] for homework.","es":"Sí, son mis dibujos. Y este es mi escritorio para hacer las tareas."},{"sp":"Jose","t":"Nice! [[Is there a]] TV in your room?","es":"¡Qué bonito! ¿Hay una tele en tu habitación?"},{"sp":"Vale","t":"No, there isn't. There's a TV in the living room.","es":"No, no hay. Hay una tele en la sala de estar."},{"sp":"Jose","t":"Are there any plants?","es":"¿Hay plantas?"},{"sp":"Vale","t":"Yes, there are two, next to the window.","es":"Sí, hay dos, al lado de la ventana."},{"sp":"Jose","t":"Is your room always this clean?","es":"¿Tu habitación siempre está así de ordenada?"},{"sp":"Vale","t":"No! [[It's a bit messy]] on Fridays. I [[tidy up]] on Saturdays.","es":"¡No! Los viernes está un poco desordenada. Ordeno los sábados."},{"sp":"Jose","t":"Ha ha! My room is always messy! Can I show you my [[flat]] tomorrow?","es":"¡Ja, ja! ¡Mi habitación siempre está desordenada! ¿Te muestro mi departamento mañana?"},{"sp":"Vale","t":"Sure!","es":"¡Claro!"}],"questions":[{"q":"What is on Vale's wall?","opts":["Photos of Sam","Her drawings","A TV"],"a":1},{"q":"Where is the TV?","opts":["In the living room","In Vale's room","In the kitchen"],"a":0},{"q":"When does Vale tidy up?","opts":["On Fridays","Every day","On Saturdays"],"a":2}]},"lang":[{"e":"desk","t":"VOC","d":"a table where you study or work","x":"There's a lamp on my desk.","s":"DESK","es":"escritorio"},{"e":"flat","t":"VOC","d":"a home with all its rooms on one floor of a big building","x":"We live in a flat in Valparaíso.","s":"FLAT","es":"departamento"},{"e":"picture","t":"VOC","d":"a painting, drawing or photo","x":"There are three pictures on my wall.","s":"PICture","es":"cuadro / imagen"},{"e":"Welcome to my…","t":"PHR","d":"a friendly way to start showing your place to someone","x":"Welcome to my home!","s":"WELcome to my","es":"Bienvenido a mi… / Bienvenida a mi…"},{"e":"Is there a…?","t":"PHR","d":"a question to ask if one thing is in a place","x":"Is there a shower in the bathroom?","s":"IS there a","es":"¿Hay un…? / ¿Hay una…?"},{"e":"It's a bit messy.","t":"PHR","d":"it isn't very tidy; things are not in their places","x":"Sorry, my room is a bit messy today!","s":"it's a bit MESSy","es":"Está un poco desordenado."},{"e":"tidy up","t":"PV","d":"put things back in the right place","x":"I tidy up my room on Saturdays.","s":"TIdy UP","es":"ordenar"},{"e":"on the wall","t":"PREP","d":"on the side of a room, where you can hang things","x":"There's a poster on the wall.","s":"on the WALL","es":"en la pared"}],"pron":{"focus":"Yes/no questions: voice up, short answers: voice down","explain":"In yes/no questions like Is there…? and Are there any…?, your voice goes up at the end ↗. In short answers, it goes down ↘.","explain_es":"En preguntas de sí o no como Is there…? y Are there any…?, la voz sube al final ↗. En las respuestas cortas, baja ↘.","tip":"Ask your partner like a real question, with your voice going up. If your voice goes down, you sound bored!","tip_es":"Pregúntale a tu compañero como una pregunta real, con la voz hacia arriba. Si la voz baja, ¡suenas aburrido!","lines":[{"t":"Is there a TV in your room?","m":"is there‿a TV in your ROOM↗?"},{"t":"Are there any plants?","m":"are there‿any PLANTS↗?"},{"t":"No, there isn't.","m":"NO | there ISn't↘."}]},"acts":[{"type":"findsomeone","items":[{"p":"has a desk in their bedroom","q":"Is there a desk in your bedroom?"},{"p":"has pictures or posters on their wall","q":"Are there any pictures on your wall?"},{"p":"has a garden at home","q":"Is there a garden at your home?"},{"p":"shares a bedroom","q":"Do you share your bedroom?"},{"p":"has a TV in their bedroom","q":"Is there a TV in your bedroom?"},{"p":"lives in a flat","q":"Do you live in a flat?"},{"p":"has two bathrooms at home","q":"Are there two bathrooms in your home?"},{"p":"tidies up their room every week","q":"Do you tidy up your room every week?"}],"follow":["Where is it?","Is it big or small?"]},{"type":"wyr","items":[["live in a big house in the country","live in a small flat in the city centre"],["have a TV in your bedroom","have a big desk in your bedroom"],["share a big bedroom with your best friend","have a small bedroom just for you"],["have a garden with a swimming pool","have a games room"],["live next to the beach in Valparaíso","live next to the mountains in Santiago"],["tidy up your room every day","tidy up your room once a month"]]},{"type":"minute","items":["your bedroom (There is… / There are…)","your favourite room at home","your dream house","the kitchen in your home","your perfect desk","a friend's house","your dream garden"],"sec":45}],"rec":{"prompt":"Record a short room tour: describe your room or your dream room with there is and there are.","prompt_es":"Graba un breve tour por tu habitación: describe tu habitación o la habitación de tus sueños con there is y there are.","model":"Welcome to my room! It's small, but I love it. There is a bed next to the window, and there's a desk for my homework. There are three pictures on the wall. There isn't a TV, but there is a speaker for my music. It's a bit messy today!","use":["Welcome to my…","on the wall","It's a bit messy."]},"tips":[{"who":"teacher","t":"Students can show a photo of their room on their phone (only if they want) or draw a quick plan. Before they show it, their partner asks five questions: Is there…? Are there any…?","es":"Los estudiantes pueden mostrar una foto de su habitación en el celular (solo si quieren) o dibujar un plano rápido. Antes de mostrarla, su compañero hace cinco preguntas: Is there…? Are there any…?"},{"who":"student","t":"Use any in questions and negatives with plurals: Are there any plants? There aren't any posters.","es":"Usa any en preguntas y oraciones negativas con plurales: Are there any plants? There aren't any posters."}]},{"id":"moon-4-kid","lv":"moon","n":4,"age":"kid","title":"Who Is It?","goals":["say how you feel","describe people with words like kind, funny and shy","talk about what people like and don't like"],"goals_es":["decir cómo te sientes","describir a personas con palabras como kind, funny y shy","hablar de lo que a las personas les gusta y no les gusta"],"warm":["How do you feel today?","What makes you happy?","Who is funny in your family?","Are you scared of the dark?"],"warm_es":["¿Cómo te sientes hoy?","¿Qué te pone feliz?","¿Quién es divertido en tu familia?","¿Te da miedo la oscuridad?"],"model":{"kind":"dialogue","title":"The Who Is It? Game","intro":"Leo and Benja play a guessing game at break time.","intro_es":"Leo y Benja juegan a adivinar en el recreo.","lines":[{"sp":"Benja","t":"OK, Leo. She's [[kind]] and [[clever]]. She likes animals.","es":"Bueno, Leo. Ella es amable e inteligente. Le gustan los animales."},{"sp":"Leo","t":"Hmm. [[Does she like]] painting?","es":"Mmm. ¿Le gusta pintar?"},{"sp":"Benja","t":"Yes, she does. She paints every day.","es":"Sí. Pinta todos los días."},{"sp":"Leo","t":"Is it my sister, Sofi?","es":"¿Es mi hermana Sofi?"},{"sp":"Benja","t":"Yes! [[Your turn]].","es":"¡Sí! Te toca a ti."},{"sp":"Leo","t":"OK. He's very [[funny]], and he's [[strong]]. He plays football with me.","es":"Bueno. Él es muy divertido y es fuerte. Juega fútbol conmigo."},{"sp":"Benja","t":"Does he like science?","es":"¿Le gustan las ciencias?"},{"sp":"Leo","t":"No, he doesn't. He likes pizza and cartoons.","es":"No. Le gustan la pizza y los dibujos animados."},{"sp":"Benja","t":"Wait! Is it me?","es":"¡Espera! ¿Soy yo?"},{"sp":"Leo","t":"Yes! You're my best friend. [[I feel happy]] with you!","es":"¡Sí! Eres mi mejor amigo. ¡Me siento feliz contigo!"},{"sp":"Benja","t":"[[Me too]]!","es":"¡Yo también!"}],"questions":[{"q":"What does Sofi like?","opts":["Football and science","Animals and painting","Pizza and cartoons"],"a":1},{"q":"What does Benja play with Leo?","opts":["Football","The piano","Table tennis"],"a":0},{"q":"How does Leo feel with Benja?","opts":["Sad","Tired","Happy"],"a":2}]},"lang":[{"e":"kind","t":"VOC","d":"nice and good to other people","x":"My grandma is very kind.","s":"KIND","es":"amable"},{"e":"clever","t":"VOC","d":"quick at learning and thinking","x":"Sofi is clever. She knows lots of animals.","s":"CLEVer","es":"inteligente"},{"e":"funny","t":"VOC","d":"makes you laugh","x":"Benja is funny. His jokes are great!","s":"FUNny","es":"divertido / chistoso"},{"e":"strong","t":"VOC","d":"has big muscles and can carry heavy things","x":"My dad is strong. He can carry me!","s":"STRONG","es":"fuerte"},{"e":"Does she like…?","t":"PHR","d":"a question about the things a girl or a woman likes","x":"Does she like cats?","s":"does she LIKE","es":"¿A ella le gusta…?"},{"e":"Your turn!","t":"PHR","d":"you say this when it is the next person's time to play","x":"Good guess! Now it's your turn!","s":"YOUR TURN","es":"¡Te toca!"},{"e":"I feel…","t":"PHR","d":"words to say how you are inside, for example happy or sad","x":"I feel tired today.","s":"i FEEL","es":"Me siento…"},{"e":"Me too!","t":"PHR","d":"you say this when the same is true for you","x":"I'm hungry. — Me too!","s":"me TOO","es":"¡Yo también!"}],"pron":{"focus":"The s at the end: likes, plays, paints","explain":"With he, she and it, we add s to the verb: she likes, he plays, she paints. Say the s clearly at the end!","explain_es":"Con he, she e it, agregamos una s al verbo: she likes, he plays, she paints. ¡Pronuncia bien la s del final!","tip":"Make a snake sound for the s: she likesss, he playsss!","tip_es":"Haz el sonido de una serpiente para la s: ¡she likesss, he playsss!","lines":[{"t":"She likes animals.","m":"she LIKES‿Animals↘."},{"t":"He plays football with me.","m":"he PLAYS FOOTball with ME↘."},{"t":"Does she like painting?","m":"does she LIKE PAINting↗?"}]},"acts":[{"type":"guess","cat":"Feelings and people","items":["happy","sad","angry","tired","scared","funny","shy","strong","clever","kind","tall","small"],"frames":["Are you…?","Do you feel…?","Is it a feeling?","Is it a good thing?"]},{"type":"picture","prompts":["How many children are there in the photo?","How do they feel? Are they happy, angry or sad?","Look at their hats. Do you like them?","Make a face like them! Your partner guesses: You are angry! / You are sad!","Who makes funny faces in your family?"]},{"type":"roulette","items":["What makes you happy?","When do you feel tired?","What are you scared of?","Who is kind in your class?","Who is funny in your family?","Is your best friend tall or small?","What does your best friend like?","What food don't you like?","When do you feel angry?","Are you shy with new friends?"]}],"rec":{"prompt":"Record yourself. Describe a person in your family: What is he or she like? What does he or she like?","prompt_es":"Grábate. Describe a una persona de tu familia: ¿Cómo es? ¿Qué le gusta?","model":"This is my grandma. She is kind and very funny. She lives in Valparaíso. She likes music, and she plays the piano every day. She doesn't like rain. I feel happy with my grandma!","use":["kind","funny","I feel…"]},"tips":[{"who":"teacher","t":"For the Guess game, students mime a feeling or a person word without speaking. The class uses the frames: Are you…? Do you feel…?","es":"Para el juego de adivinar, los estudiantes actúan un sentimiento o una palabra para describir personas, sin hablar. El curso usa las frases: Are you…? Do you feel…?"},{"who":"student","t":"Remember the s: I like, but he likes and she likes. In questions, use does: Does she like cats?","es":"Recuerda la s: I like, pero he likes y she likes. En las preguntas, usa does: Does she like cats?"}]},{"id":"moon-4-teen","lv":"moon","n":4,"age":"teen","title":"The Real Me","goals":["describe your personality and feelings","talk about likes and dislikes with the present simple","ask questions to get to know a new friend"],"goals_es":["describir tu personalidad y tus sentimientos","hablar de lo que te gusta y lo que no te gusta con el presente simple","hacer preguntas para conocer a un nuevo amigo"],"warm":["How do you feel today: happy, tired or something else?","Are you shy with new people?","What do you love doing at the weekend?","Which three words describe you?"],"warm_es":["¿Cómo te sientes hoy: feliz, cansado u otra cosa?","¿Eres tímido con la gente nueva?","¿Qué te encanta hacer el fin de semana?","¿Qué tres palabras te describen?"],"model":{"kind":"dialogue","title":"Meet Sam!","intro":"Jose interviews Sam, the new exchange student, for the school's online magazine.","intro_es":"Jose entrevista a Sam, el nuevo estudiante de intercambio, para la revista digital del colegio.","lines":[{"sp":"Jose","t":"Hi, Sam! First question: [[what are you like]]?","es":"¡Hola, Sam! Primera pregunta: ¿cómo eres?"},{"sp":"Sam","t":"Well, I'm friendly, but I'm [[a bit shy]] with new people.","es":"Bueno, soy simpático, pero soy un poco tímido con la gente nueva."},{"sp":"Jose","t":"What do you like doing?","es":"¿Qué te gusta hacer?"},{"sp":"Sam","t":"I love sport, and I [[take photos]] every weekend.","es":"Me encanta el deporte y tomo fotos todos los fines de semana."},{"sp":"Jose","t":"Cool! Do you like Chilean food?","es":"¡Genial! ¿Te gusta la comida chilena?"},{"sp":"Sam","t":"Yes, I do! I love empanadas. But I don't like early mornings.","es":"¡Sí! Me encantan las empanadas. Pero no me gusta madrugar."},{"sp":"Jose","t":"[[Me neither]]! Are you happy at school here?","es":"¡A mí tampoco! ¿Estás feliz en el colegio aquí?"},{"sp":"Sam","t":"Yes, I am. Everyone is really [[kind]], and football [[makes me happy]].","es":"Sí. Todos son muy amables, y el fútbol me hace feliz."},{"sp":"Jose","t":"Who's your best friend here?","es":"¿Quién es tu mejor amigo aquí?"},{"sp":"Sam","t":"Tomás. He's funny and [[clever]], but he's always late!","es":"Tomás. Es divertido e inteligente, ¡pero siempre llega tarde!"},{"sp":"Jose","t":"Ha ha! That's true. Thanks, Sam!","es":"¡Ja, ja! Es verdad. ¡Gracias, Sam!"}],"questions":[{"q":"What is Sam like with new people?","opts":["Angry","A bit shy","Very funny"],"a":1},{"q":"What doesn't Sam like?","opts":["Early mornings","Empanadas","Sport"],"a":0},{"q":"What is Tomás like?","opts":["Tall and strong","Shy and tired","Funny and clever"],"a":2}]},"lang":[{"e":"shy","t":"VOC","d":"a little nervous when you meet new people","x":"I'm shy on the first day of school.","s":"SHY","es":"tímido / tímida"},{"e":"kind","t":"VOC","d":"good and friendly to other people","x":"My best friend is really kind. She always helps me.","s":"KIND","es":"amable"},{"e":"clever","t":"VOC","d":"good at learning and thinking fast","x":"Jose is clever. She can write code.","s":"CLEVer","es":"inteligente"},{"e":"What are you like?","t":"PHR","d":"a question about someone's personality","x":"What are you like? — I'm friendly and a bit shy.","s":"WHAT are you LIKE","es":"¿Cómo eres?"},{"e":"a bit…","t":"PHR","d":"a little; not very","x":"I'm a bit tired today.","s":"a BIT","es":"un poco…"},{"e":"Me neither!","t":"PHR","d":"you say this when you also don't like or don't do something","x":"I don't like rainy days. — Me neither!","s":"me NEIther","es":"¡Yo tampoco! / ¡A mí tampoco!"},{"e":"makes me happy","t":"COL","d":"gives me a good feeling","x":"Music makes me happy.","s":"MAKES me HAPpy","es":"me hace feliz"},{"e":"take photos","t":"COL","d":"use a camera or a phone to make pictures","x":"I take photos of my friends at the park.","s":"TAKE PHOtos","es":"tomar fotos / sacar fotos"}],"pron":{"focus":"Sentence stress: say the important words strongly","explain":"In English, we say the important words louder and longer: I LOVE SPORT. Small words like I, a, the and are are short and quick.","explain_es":"En inglés, decimos las palabras importantes más fuerte y más largas: I LOVE SPORT. Las palabras pequeñas como I, a, the y are son cortas y rápidas.","tip":"Clap on the stressed words as you say the sentence. Then say it again without clapping, with the same rhythm.","tip_es":"Aplaude en las palabras acentuadas mientras dices la oración. Luego dila otra vez sin aplaudir, con el mismo ritmo.","lines":[{"t":"I'm a bit shy with new people.","m":"i'm a BIT SHY with NEW PEOple↘."},{"t":"What are you like?","m":"WHAT are you LIKE↘?"},{"t":"Football makes me happy.","m":"FOOTball MAKES me HAPpy↘."}]},"acts":[{"type":"findsomeone","items":[{"p":"is a bit shy with new people","q":"Are you a bit shy with new people?"},{"p":"feels tired on Monday mornings","q":"Do you feel tired on Monday mornings?"},{"p":"watches funny videos every day","q":"Do you watch funny videos every day?"},{"p":"doesn't like early mornings","q":"Do you like early mornings?"},{"p":"is scared of spiders","q":"Are you scared of spiders?"},{"p":"plays a musical instrument","q":"Do you play a musical instrument?"},{"p":"takes photos every weekend","q":"Do you take photos every weekend?"},{"p":"gets angry when people are late","q":"Do you get angry when people are late?"}],"follow":["Why?","How often?"]},{"type":"agree","items":["Shy people are often very kind.","Funny friends are the best friends.","Everyone feels tired on Monday mornings.","Clever people don't need to study.","Music makes everyone happy.","Teenagers are always tired.","It's OK to feel sad sometimes."]},{"type":"roulette","items":["What makes you happy?","What makes you angry?","When do you feel tired?","What are you scared of?","What is your best friend like?","Who is a funny person in your family?","What do you do when you feel sad?","Does your best friend like the same music as you?","What are you like at school?","Which three words describe you?"]}],"rec":{"prompt":"Record a short profile for a new friend: say what you are like, what you like and what you don't like.","prompt_es":"Graba un perfil breve para un nuevo amigo: di cómo eres, qué te gusta y qué no te gusta.","model":"Hi, I'm Vale. I'm thirteen and I live in Santiago. I'm a bit shy with new people, but I'm funny with my friends. I love music and drawing. Music makes me happy. I don't like early mornings. What are you like?","use":["a bit…","makes me happy","What are you like?"]},"tips":[{"who":"teacher","t":"Before the Agree activity, write these frames on the board: I agree because… / I don't agree because… / It depends. Students must give one reason.","es":"Antes de la actividad Agree, escribe estas frases en la pizarra: I agree because… / I don't agree because… / It depends. Los estudiantes deben dar una razón."},{"who":"student","t":"Don't forget the s with he and she: he likes, she plays, it makes. But with doesn't, there is no s: she doesn't like.","es":"No olvides la s con he y she: he likes, she plays, it makes. Pero con doesn't no hay s: she doesn't like."}]},{"id":"moon-5-kid","lv":"moon","n":5,"age":"kid","title":"Show Your Skills!","goals":["say what you can and can't do","ask friends about their skills","suggest a game with Let's"],"goals_es":["decir qué sabes y qué no sabes hacer","preguntar a tus amigos qué saben hacer","proponer un juego con Let's"],"warm":["Can you swim?","Can you ride a bike?","What can your best friend do?","Can your pet do any tricks?"],"warm_es":["¿Sabes nadar?","¿Sabes andar en bicicleta?","¿Qué sabe hacer tu mejor amigo o amiga?","¿Tu mascota sabe hacer trucos?"],"model":{"kind":"dialogue","title":"Ready for the Talent Show","intro":"Leo and Martina plan an act for the school talent show.","intro_es":"Leo y Martina preparan un número para el show de talentos del colegio.","lines":[{"sp":"Martina","t":"The [[talent show]] is on Friday! What can you do, Leo?","es":"¡El show de talentos es el viernes! ¿Qué sabes hacer, Leo?"},{"sp":"Leo","t":"I can do football [[tricks]]. Look!","es":"Sé hacer trucos de fútbol. ¡Mira!"},{"sp":"Martina","t":"Wow, you're really good at that!","es":"¡Wow, eres muy bueno para eso!"},{"sp":"Leo","t":"Thanks! Can you sing?","es":"¡Gracias! ¿Sabes cantar?"},{"sp":"Martina","t":"[[No, I can't]]. But I can [[dance]] and [[skate]].","es":"No, no sé. Pero sé bailar y patinar."},{"sp":"Leo","t":"Cool! [[Why don't we]] do a show together?","es":"¡Genial! ¿Por qué no hacemos un número juntos?"},{"sp":"Martina","t":"Great idea! I can dance and you can do tricks.","es":"¡Buena idea! Yo puedo bailar y tú puedes hacer trucos."},{"sp":"Leo","t":"And Kai can [[play the guitar]]!","es":"¡Y Kai puede tocar la guitarra!"},{"sp":"Martina","t":"Perfect. [[Let's]] practise after school!","es":"Perfecto. ¡Practiquemos después de clases!"},{"sp":"Leo","t":"OK. See you at the park!","es":"Bueno. ¡Nos vemos en el parque!"}],"questions":[{"q":"When is the talent show?","opts":["On Friday","On Saturday","After school"],"a":0},{"q":"What can Martina do?","opts":["Sing and skate","Dance and skate","Football tricks"],"a":1},{"q":"Who can play the guitar?","opts":["Leo","Martina","Kai"],"a":2}]},"lang":[{"e":"talent show","t":"VOC","d":"a show where people sing, dance or do tricks","x":"Our school talent show is on Friday.","s":"TAlent show","es":"show de talentos"},{"e":"trick","t":"VOC","d":"a clever thing you do to surprise people","x":"Leo can do ten football tricks.","s":"TRICK","es":"truco"},{"e":"dance","t":"VOC","d":"move your body to music","x":"Martina can dance really well.","s":"DANCE","es":"bailar"},{"e":"skate","t":"VOC","d":"move on skates or a skateboard","x":"I can skate in the park.","s":"SKATE","es":"patinar"},{"e":"play the guitar","t":"COL","d":"make music with a guitar","x":"Kai can play the guitar and sing.","s":"PLAY the guiTAR","es":"tocar la guitarra"},{"e":"No, I can't.","t":"PHR","d":"a short answer when you are not able to do something","x":"Can you cook? — No, I can't.","s":"NO, I CAN'T.","es":"No, no sé. / No, no puedo."},{"e":"Why don't we…?","t":"PHR","d":"a friendly way to suggest an idea","x":"Why don't we paint a picture?","s":"why DON'T we…?","es":"¿Por qué no…? (para proponer algo)"},{"e":"Let's…","t":"PHR","d":"a way to say: we can do this together now","x":"Let's play football after school!","s":"LET'S…","es":"¡Vamos a…! / ¡Hagamos…!"}],"pron":{"focus":"can and can't","explain":"In a sentence, can is short and quiet, but can't is long and strong. Listen: I can SWIM. / I CAN'T swim.","explain_es":"En una oración, can se dice corto y suave, pero can't se dice largo y fuerte. Escucha: I can SWIM. / I CAN'T swim.","tip":"Say can't loud and clear, or y ":"student","t":"Give a full short answer: Yes, I can. or No, I can't. Don't just say yes or no!","es":"Da una respuesta corta completa: Yes, I can. o No, I can't. ¡No digas solo yes o no!"}]},{"id":"moon-5-teen","lv":"moon","n":5,"age":"teen","title":"Hidden Talents","goals":["talk about your skills and talents","ask classmates what they can and can't do","make plans with Let's and Why don't we"],"goals_es":["hablar de tus habilidades y talentos","preguntar a tus compañeros qué saben y qué no saben hacer","hacer planes con Let's y Why don't we"],"warm":["What can you do really well?","Can you cook anything?","Can you play an instrument?","What skill do you want to learn?"],"warm_es":["¿Qué sabes hacer muy bien?","¿Sabes cocinar algo?","¿Sabes tocar algún instrumento?","¿Qué habilidad quieres aprender?"],"model":{"kind":"dialogue","title":"The Festival Video","intro":"Vale and Tomás are planning a music video for the school festival.","intro_es":"Vale y Tomás están planeando un video musical para el festival del colegio.","lines":[{"sp":"Vale","t":"The school festival is in two weeks. [[Why don't we]] make a [[music video]]?","es":"El festival del colegio es en dos semanas. ¿Por qué no hacemos un video musical?"},{"sp":"Tomás","t":"Cool! But I [[can't sing at all]].","es":"¡Genial! Pero no sé cantar para nada."},{"sp":"Vale","t":"No problem. I can sing and [[play the guitar]].","es":"No hay problema. Yo sé cantar y tocar la guitarra."},{"sp":"Tomás","t":"And I can [[skate]]. I can do tricks in the video!","es":"Y yo sé andar en skate. ¡Puedo hacer trucos en el video!"},{"sp":"Vale","t":"Perfect! Can Sam take the photos?","es":"¡Perfecto! ¿Sam puede sacar las fotos?"},{"sp":"Tomás","t":"Yes, he can. He's really [[good at]] photography.","es":"Sí, puede. Es muy bueno para la fotografía."},{"sp":"Vale","t":"What about Jose? Can she dance?","es":"¿Y Jose? ¿Sabe bailar?"},{"sp":"Tomás","t":"No, she can't. But she can put the video online.","es":"No, no sabe. Pero puede subir el video a internet."},{"sp":"Vale","t":"Great. [[Let's]] practise on Saturday!","es":"Genial. ¡Practiquemos el sábado!"},{"sp":"Tomás","t":"OK, see you at the skate park!","es":"Bueno, ¡nos vemos en la pista de skate!"}],"questions":[{"q":"What can Vale do?","opts":["Sing and play the guitar","Skate and do tricks","Take photos"],"a":0},{"q":"Can Jose dance?","opts":["Yes, she can","No, she can't","We don't know"],"a":1},{"q":"When do they practise?","opts":["On Friday","On Sunday","On Saturday"],"a":2}]},"lang":[{"e":"skate","t":"VOC","d":"move on a skateboard","x":"Tomás can skate really fast.","s":"SKATE","es":"andar en skate / patinar"},{"e":"talent","t":"VOC","d":"something you are naturally very good at","x":"Singing is Vale's big talent.","s":"TAlent","es":"talento"},{"e":"music video","t":"VOC","d":"a short film for a song","x":"Let's make a music video for our song.","s":"MUsic VIdeo","es":"video musical"},{"e":"play the guitar","t":"COL","d":"make music with a guitar","x":"Vale can play the guitar and sing at the same time.","s":"PLAY the guiTAR","es":"tocar la guitarra"},{"e":"be good at","t":"PREP","d":"be able to do something well","x":"Sam is really good at photography.","s":"be GOOD at","es":"ser bueno/a para…"},{"e":"can't … at all","t":"PHR","d":"not able to do something, not even a little","x":"I can't cook at all!","s":"CAN'T … at ALL","es":"no sé… para nada"},{"e":"Why don't we…?","t":"PHR","d":"a friendly way to suggest a plan","x":"Why don't we start a band?","s":"why DON'T we…?","es":"¿Por qué no…? (para sugerir)"},{"e":"Let's…","t":"PHR","d":"a short way to say: we do this together","x":"Let's practise after school.","s":"LET'S…","es":"¡Vamos a…! / ¡Hagamos…!"}],"pron":{"focus":"can and can't","explain":"In a sentence, can is weak and short, and the main verb is stressed: I can SKATE. Can't is always strong: I CAN'T sing. That's how people hear the difference.","explain_es":"En una oración, can es débil y corto, y el acento va en el verbo principal: I can SKATE. Can't siempre es fuerte: I CAN'T sing. Así se nota la diferencia.","tip":"Practise in pairs: say I can or I can't plus an action, and your partner guesses which one you said.","tip_es":"Practica en parejas: di I can o I can't más una acción, y tu compañero o compañera adivina cuál dijiste.","lines":[{"t":"I can skate.","m":"I can SKATE↘."},{"t":"I can't sing at all.","m":"I CAN'T sing‿at ALL↘."},{"t":"Can you play the guitar?","m":"can‿you PLAY the guiTAR↗?"}]},"acts":[{"type":"findsomeone","items":[{"p":"can cook pasta","q":"Can you cook pasta?"},{"p":"can play an instrument","q":"Can you play an instrument?"},{"p":"can skate","q":"Can you skate?"},{"p":"can swim really fast","q":"Can you swim really fast?"},{"p":"can draw cartoons","q":"Can you draw cartoons?"},{"p":"can sing in English","q":"Can you sing in English?"},{"p":"can climb a rock wall","q":"Can you climb a rock wall?"},{"p":"can write with both hands","q":"Can you write with both hands?"}],"follow":["Really? Can you show us?","How often do you practise?"]},{"type":"ranking","task":"Which skill is the most useful in life? Put these skills in order from 1 (the most useful) to 7. Then explain: Number one is cooking, because you can make your own food.","items":["cooking","swimming","riding a bike","playing the guitar","dancing","writing","skating"]},{"type":"roleplay","cards":[{"sit":"Planning a video for the school festival","a":"You want to make a video for the school festival. Ask your partner: Can you sing? Can you dance? Then suggest: Why don't we…?","b":"You can skate and take photos, but you can't sing at all. Answer: Yes, I can. / No, I can't. Then say: Let's…!"},{"sit":"Making plans for Saturday","a":"You want to do something fun on Saturday. Ask: Can you swim? Can you ride a bike? Then suggest a plan: Let's…!","b":"You can ride a bike and swim, but you can't skate. Answer the questions, then say: Great idea! or Sorry, I can't…"},{"sit":"Joining the music club","a":"You :"Leo y Benja conversan sobre su día camino al colegio.","lines":[{"sp":"Benja","t":"What time do you [[get up]], Leo?","es":"¿A qué hora te levantas, Leo?"},{"sp":"Leo","t":"At [[seven o'clock]]. Pipo [[always]] wakes me up!","es":"A las siete en punto. ¡Pipo siempre me despierta!"},{"sp":"Benja","t":"I get up at [[half past]] seven. Then I have breakfast.","es":"Yo me levanto a las siete y media. Después tomo desayuno."},{"sp":"Leo","t":"Me too. What do you do after school?","es":"Yo también. ¿Qué haces después del colegio?"},{"sp":"Benja","t":"I do my [[homework]]. Then I play games.","es":"Hago mis tareas. Después juego."},{"sp":"Leo","t":"I usually [[walk the dog]] with Sofi.","es":"Yo normalmente saco a pasear al perro con Sofi."},{"sp":"Benja","t":"Do you watch TV?","es":"¿Ves televisión?"},{"sp":"Leo","t":"Sometimes. But I [[never]] watch TV in the morning.","es":"A veces. Pero nunca veo televisión en la mañana."},{"sp":"Benja","t":"[[What time is it]] now?","es":"¿Qué hora es ahora?"},{"sp":"Leo","t":"It's half past eight. Quick, let's run!","es":"Son las ocho y media. ¡Rápido, corramos!"}],"questions":[{"q":"What time does Leo get up?","opts":["At half past seven","At seven o'clock","At half past eight"],"a":1},{"q":"What does Leo usually do after school?","opts":["He walks the dog","He watches TV","He plays games"],"a":0},{"q":"What time is it at the end?","opts":["Seven o'clock","Half past seven","Half past eight"],"a":2}]},"lang":[{"e":"get up","t":"PV","d":"get out of bed in the morning","x":"I get up at seven o'clock.","s":"get UP","es":"levantarse"},{"e":"homework","t":"VOC","d":"school work that you do at home","x":"Sofi does her homework after lunch.","s":"HOMEwork","es":"tarea"},{"e":"always","t":"VOC","d":"every time (100%)","x":"I always brush my teeth before bed.","s":"ALways","es":"siempre"},{"e":"never","t":"VOC","d":"not at any time (0%)","x":"Pipo never does homework!","s":"NEver","es":"nunca"},{"e":"walk the dog","t":"COL","d":"take a dog turdays?"],"warm_es":["¿A qué hora suena tu alarma los días de colegio?","¿Te gustan más las mañanas o las tardes?","¿Qué haces normalmente después del colegio?","¿A qué hora te acuestas los sábados?"],"model":{"kind":"dialogue","title":"Different Days","intro":"Jose asks Sam, the exchange student from Sydney, about his routine in Chile.","intro_es":"Jose le pregunta a Sam, el estudiante de intercambio de Sídney, por su rutina en Chile.","lines":[{"sp":"Jose","t":"Sam, what time do you [[get up]] on school days?","es":"Sam, ¿a qué hora te levantas los días de colegio?"},{"sp":"Sam","t":"My alarm rings at seven o'clock, but I usually get up at [[half past]].","es":"Mi alarma suena a las siete en punto, pero normalmente me levanto a las siete y media."},{"sp":"Jose","t":"Do you [[have breakfast]] at home?","es":"¿Tomas desayuno en casa?"},{"sp":"Sam","t":"Yes, I [[always]] have toast and fruit. [[What about you]]?","es":"Sí, siempre como pan tostado y fruta. ¿Y tú?"},{"sp":"Jose","t":"[[Sometimes]]. I'm usually late!","es":"A veces. ¡Normalmente llego tarde!"},{"sp":"Sam","t":"What do you do after school?","es":"¿Qué haces después del colegio?"},{"sp":"Jose","t":"I play volleyball, then I do my homework.","es":"Juego vóleibol y después hago mis tareas."},{"sp":"Sam","t":"I usually walk the dog with my host family.","es":"Yo normalmente saco a pasear al perro con mi familia anfitriona."},{"sp":"Jose","t":"[[What time do you]] go to bed?","es":"¿A qué hora te acuestas?"},{"sp":"Sam","t":"At half past ten. And you?","es":"A las diez y media. ¿Y tú?"},{"sp":"Jose","t":"Eleven o'clock. I [[never]] go to bed early!","es":"A las once. ¡Nunca me acuesto temprano!"}],"questions":[{"q":"What time does Sam usually get up?","opts":["At seven o'clock","At half past seven","At half past ten"],"a":1},{"q":"What does Jose do after school?","opts":["She walks the dog","She takes photos","She plays volleyball"],"a":2},{"q":"Who goes to bed at eleven o'clock?","opts":["Jose","Sam","Sam' gree, because… / I don't agree, because… Ask students to give one reason from their own routine.","es":"Para Agree or disagree, escribe dos frases modelo en la pizarra: I agree, because… / I don't agree, because… Pide a los estudiantes que den una razón de su propia rutina."},{"who":"student","t":"When your partner answers, ask one more question: What time? Every day? Who with?","es":"Cuando tu compañero o compañera responda, haz una pregunta más: What time? Every day? Who with?"}]},{"id":"moon-7-kid","lv":"moon","n":7,"age":"kid","title":"Zoo Detectives","goals":["describe wild animals","ask and answer questions with Does it…?","talk about your favourite animal"],"goals_es":["describir animales salvajes","hacer y responder preguntas con Does it…?","hablar de tu animal favorito"],"warm":["What's your favourite wild animal?","Can you make a lion sound?","Do you like going to the zoo?","Which animal is very, very big?"],"warm_es":["¿Cuál es tu animal salvaje favorito?","¿Puedes hacer el sonido de un león?","¿Te gusta ir al zoológico?","¿Qué animal es muy, muy grande?"],"model":{"kind":"dialogue","title":"Questions for the Zookeeper","intro":"Sofi is at the zoo with Grandma Ana, and she has lots of questions for the zookeeper.","intro_es":"Sofi está en el zoológico con la abuela Ana y tiene muchas preguntas para el cuidador.","lines":[{"sp":"Sofi","t":"Excuse me, [[does the giraffe eat]] meat?","es":"Disculpe, ¿la jirafa come carne?"},{"sp":"Zookeeper","t":"[[No, it doesn't]]. It eats [[leaves]] from tall trees.","es":"No. Come hojas de los árboles altos."},{"sp":"Sofi","t":"Wow! [[Where does it live]]?","es":"¡Wow! ¿Dónde vive?"},{"sp":"Zookeeper","t":"It lives in Africa, with zebras and lions.","es":"Vive en África, con las cebras y los leones."},{"sp":"Sofi","t":"And what does the [[penguin]] eat?","es":"¿Y qué come el pingüino?"},{"sp":"Zookeeper","t":"It eats fish. It can't fly, but it swims very fast.","es":"Come peces. No puede volar, pero nada muy rápido."},{"s ","es":"¿Qué come?"},{"e":"I'm not sure.","t":"PHR","d":"a way to say you don't know the answer for certain","x":"Does a bear eat fish? — I'm not sure. I think so!","s":"I'm NOT SURE.","es":"No estoy seguro/a."},{"e":"fun fact","t":"COL","d":"a surprising and interesting piece of information","x":"Here's a fun fact: elephants can't jump!","s":"FUN FACT","es":"dato curioso"},{"e":"in the wild","t":"PREP","d":"in nature, not in a zoo","x":"In the wild, lions sleep a lot during the day.","s":"in the WILD","es":"en la naturaleza / en estado salvaje"}],"pron":{"focus":"question intonation","explain":"Yes or no questions with Does…? usually go up at the end. Questions with What or Where usually go down.","explain_es":"Las preguntas de sí o no con Does…? normalmente suben al final. Las preguntas con What o Where normalmente bajan.","tip":"Say does quickly and softly. Put the strong stress on the animal and the main verb.","tip_es":"Di does rápido y suave. Pon el acento fuerte en el animal y en el verbo principal.","lines":[{"t":"Does a penguin fly?","m":"does‿a PENguin FLY↗?"},{"t":"Where does a kangaroo live?","m":"WHERE does‿a kangaROO LIVE↘?"},{"t":"What does a crocodile eat?","m":"WHAT does‿a CROcodile EAT↘?"}]},"acts":[{"type":"guess","cat":"Mystery animal","items":["lion","tiger","elephant","giraffe","monkey","zebra","crocodile","snake","bear","kangaroo","penguin","parrot"],"frames":["Does it live in Africa?","Does it eat meat?","Can it swim?","Is it dangerous?","Is it a crocodile?"]},{"type":"ranking","task":"Which animal is the most amazing? Put these animals in order from 1 (the most amazing) to 7. Then explain: Number one is the elephant, because it…","items":["elephant","giraffe","penguin","crocodile","kangaroo","parrot","snake"]},{"type":"picture","prompts":["How many giraffes can you see? What colour are they?","What does a giraffe eat? Can you see its food in the photo?","Where do giraffes live in the wild?","Is this a zoo or the wild? Why do you think so?","
