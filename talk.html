opts":["Still ready to quit","Angry with her coach","More positive about the future"],"a":2}]},"lang":[{"e":"give up","t":"PV","d":"stop doing or trying something","x":"I almost gave up the guitar, but I'm glad I didn't.","s":"give UP"},{"e":"bounce back","t":"PV","d":"recover quickly after a failure or a problem","x":"After losing the first set, the team bounced back and won the match.","s":"bounce BACK"},{"e":"learn the hard way","t":"ID","d":"learn something from a bad experience","x":"I learnt the hard way that you can't revise for an exam in one night.","s":"LEARN the HARD WAY"},{"e":"a blessing in disguise","t":"ID","d":"something that seems bad at first but turns out to be good","x":"Missing the bus was a blessing in disguise: I met my best friend at the bus stop.","s":"a BLESSing in disGUISE"},{"e":"boost your confidence","t":"COL","d":"make you feel more sure of yourself","x":"Performing for my family really boosted my confidence.","s":"BOOST your CONfidence"},{"e":"make a mistake","t":"COL","d":"do something wrong by accident","x":"Everyone makes mistakes when they're learning.","s":"make a misTAKE"},{"e":"If I were you, I'd…","t":"PHR","d":"a phrase for giving advice by imagining you are the other person","x":"If I were you, I'd talk to your coach.","s":"if I were YOU, I'd"},{"e":"under pressure","t":"PREP","d":"feeling stressed because you must do well","x":"I play worse when I'm under pressure.","s":"UNder PRESsure"}],"pron":{"focus":"Sentence stress and pausing in advice","explain":"In advice, we stress the words that carry the meaning, while small words like I'd, to and your stay weak. A short pause after the if part makes advice sound calm and friendly, not bossy.","tip":"Say each line three times: slowly with clear pauses, then at normal speed, then as if you were really comforting a friend.","lines":[{"t":"If I were you, I'd talk to your coach.","m":"if I were YOU↗ | I'd TALK to your COACH↘."},{"t":"Why don't you watch the video of the match?","m":"WHY don't‿you WATCH the VIDeo‿of the MATCH↘?"},{"t":"Don't give up now. You're so close!","m":"DON'T give‿UP now↘ | you're SO CLOSE↘!"}]},"acts":[{"type":"picture","prompts":["Describe the boy's body language. What does it tell you about how he's feeling?","Why do you think people play chess outdoors? Have you ever seen a game like this?","Imagine he's about to make the winning move. What happened earlier in the game?","What qualities do you need to be good at chess? Do you have them?","Which do you find harder: staying calm under pressure or bouncing back after a mistake?"]},{"type":"roleplay","cards":[{"sit":"Exam stress","a":"You've got three exams next week and you can't sleep because of the pressure. You think you're going to fail maths. Explain how you feel and ask for advice.","b":"Your friend is stressed about exams. Ask questions to understand the problem, then give at least three pieces of advice: You should… / Why don't you…? / If I were you, I'd…"},{"sit":"The band audition","a":"You didn't get into the school band. You played badly because you were nervous, and now you want to give up the guitar. Tell your friend.","b":"Persuade your friend not to give up. Share a setback you bounced back from (real or invented) and suggest a plan for the next audition."},{"sit":"The coding competition","a":"Your team made a big mistake in a coding competition and finished last. Your teammates blame you. Ask your friend what to do.","b":"Help your friend see the setback as a learning experience. Suggest how to talk to the team and how to prepare for next year."}]},{"type":"fishbowl","questions":["Is it more important to win or to do your best? Why?","Can failing at something teach you more than succeeding? Give an example.","Do young people today feel too much pressure to be perfect? Where does it come from?","Should schools give rewards for effort, not just for good marks?","Is talent or practice more important if you want to achieve something big?","How can social media make people feel like failures? What can we do about it?"]}],"rec":{"prompt":"Record a short story about a setback you've had (real or invented). Explain what happened and how you bounced back, then give one piece of advice to someone in the same situation.","model":"Last year I was playing in a volleyball final when I missed three serves in a row, and we lost. I felt terrible, and I almost gave up. Then my coach told me I needed to practise under pressure, so I started serving while my teammates shouted at me. It was embarrassing at first, but it really boosted my confidence. Looking back, losing that final was a blessing in disguise. If I were you, I'd see every mistake as a lesson.","use":["give up","boost your confidence","a blessing in disguise"]},"tips":[{"who":"teacher","t":"Before the fishbowl, give the outer circle a job: one student listens for strong arguments, one notes advice phrases and one counts phrasal verbs. They report back at the end."},{"who":"student","t":"In the fishbowl, build on what others say: I agree with Sam, and I'd add that… / That's a good point, but…"}]},{"id":"galaxy-2-kid","lv":"galaxy","n":2,"age":"kid","title":"Litter Busters","goals":["describe how a place used to be and how it has changed","explain what had happened before something else in the past","agree and disagree politely about ways to protect nature"],"warm":["Have you ever picked up litter in a park or on a beach? What did you find?","What do you and your family recycle at home?","Which wild animal would you most like to protect? Why?","What did your town use to be like when your grandparents were children?"],"model":{"kind":"dialogue","title":"After the Beach Clean-Up","intro":"Leo, Sofi and their cousin Kai have spent the morning at a beach clean-up with Ms Rojas and lots of other volunteers.","lines":[{"sp":"Kai","t":"Phew! I've never [[picked up]] so much rubbish in my life!"},{"sp":"Leo","t":"Me neither. By the time we stopped for lunch, we'd already filled twenty-five bags."},{"sp":"Sofi","t":"Ms Rojas says this beach used to be really clean. Families used to come here to watch the sea lions."},{"sp":"Kai","t":"Really? So what had happened to it before we arrived this morning?"},{"sp":"Leo","t":"People had [[dropped litter]] here for years, and nobody had cleaned it up."},{"sp":"Sofi","t":"I found a tiny crab inside a plastic cup! I put it back in the sea."},{"sp":"Kai","t":"Well done, Sofi! You really [[made a difference]] today."},{"sp":"Leo","t":"But honestly, twenty-five bags is just [[a drop in the ocean]]. The waves will bring more rubbish tomorrow."},{"sp":"Kai","t":"[[I see your point, but]] we can't just do nothing."},{"sp":"Sofi","t":"[[You're absolutely right]], Kai. We can tell everyone at school about it, too."},{"sp":"Leo","t":"OK, OK. Next time I'll bring Benja. He always wants to [[lend a hand]]."},{"sp":"Kai","t":"Great! And let's stop buying drinks in single-use bottles. We can bring our own."},{"sp":"Sofi","t":"Look! The volunteers are sorting the cans so they can be recycled."},{"sp":"Leo","t":"Come on, let's go and help them. And don't [[throw away]] your gloves, Sofi. We can use them again next time!"}],"questions":[{"q":"How many bags had they filled by lunchtime?","opts":["Fifteen","Twenty-five","Forty"],"a":1},{"q":"Why does Leo think the clean-up isn't enough?","opts":["The waves will bring more rubbish","The volunteers went home early","Nobody wants to recycle the cans"],"a":0},{"q":"What does Kai suggest?","opts":["Going home for lunch","Leaving the bottles on the beach","Bringing their own bottles"],"a":2}]},"lang":[{"e":"pick up","t":"PV","d":"lift something from the ground with your hands","x":"We picked up twenty bottles on the beach.","s":"pick UP"},{"e":"throw away","t":"PV","d":"put something you don't want in the bin","x":"Don't throw away that jar. We can use it again.","s":"throw aWAY"},{"e":"make a difference","t":"COL","d":"change something in a good way","x":"Planting one tree can make a difference.","s":"make a DIFFerence"},{"e":"drop litter","t":"COL","d":"let rubbish fall on the ground carelessly","x":"Please don't drop litter in the playground.","s":"drop LITter"},{"e":"lend a hand","t":"ID","d":"help someone who is doing something","x":"Can you lend me a hand with these heavy bags?","s":"LEND a HAND"},{"e":"a drop in the ocean","t":"ID","d":"a very small amount compared with what is needed","x":"One bag of rubbish is a drop in the ocean, but it's a good start.","s":"a DROP in the Ocean"},{"e":"I see your point, but…","t":"PHR","d":"a polite way to disagree with someone","x":"I see your point, but we can still help the animals.","s":"i SEE your POINT but"},{"e":"You're absolutely right.","t":"PHR","d":"a strong way to say that you agree","x":"You're absolutely right. We use far too much plastic.","s":"you're absoLUTEly RIGHT"}],"pron":{"focus":"Weak had and short 'd in the past perfect","explain":"In the past perfect, had is usually weak and quick. After I, we, they, she or he, it often becomes 'd: we'd, they'd. Don't stress had. Stress the past participle and the important information instead.","tip":"Say each line twice: first slowly with had, then fast with 'd. Clap only on the strong words.","lines":[{"t":"We'd already filled twenty-five bags.","m":"we'd alREADy FILLED | TWENty-five BAGS↘."},{"t":"What had happened to the beach?","m":"WHAT had HAPpened to the BEACH↘?"},{"t":"Nobody had cleaned it up.","m":"NObody had CLEANED it‿UP↘."}]},"acts":[{"type":"taboo","cards":[{"w":"recycle","taboo":["bin","plastic","again"]},{"w":"litter","taboo":["rubbish","street","drop"]},{"w":"pollution","taboo":["dirty","air","smoke"]},{"w":"volunteer","taboo":["help","pay","free"]},{"w":"habitat","taboo":["home","animal","live"]},{"w":"endangered","taboo":["animal","disappear","danger"]},{"w":"single-use","taboo":["once","plastic","throw"]},{"w":"renewable energy","taboo":["sun","wind","power"]},{"w":"protect","taboo":["safe","help","save"]},{"w":"climate change","taboo":["hot","weather","temperature"]}]},{"type":"picture","prompts":["Where are these people, and what are they doing?","What kind of rubbish do you think they have found? How did it get there?","How do you think the beach looked before they arrived? And after?","Would you like to join a clean-up like this? Who would you bring?","What could people do so that the beach stays clean?"]},{"type":"balloon","sit":"A hot-air balloon full of Chilean animals is too heavy and it's going down! Each student is one animal. Explain why YOU are important and should stay in the balloon. After each round, the class votes and one animal must jump out (don't worry, everyone has a parachute!).","roles":[{"name":"Humboldt penguin","why":"I live on the coast of Chile and Peru, and plastic in the sea is a big danger for me and my chicks."},{"name":"Andean condor","why":"I'm one of the biggest flying birds in the world, and I'm a symbol of Chile."},{"name":"huemul","why":"I'm a shy deer from the south of Chile. I'm a national symbol too, but there aren't many of us left."},{"name":"Darwin's frog","why":"I'm a tiny frog from the forests in the south, and when I was a baby, my dad carried me in his mouth!"},{"name":"bee","why":"I help plants to make fruit and vegetables. Without me, there would be no apples or avocados!"},{"name":"blue whale","why":"I'm the biggest animal on Earth, and I visit the sea near Chiloé every summer."}]}],"rec":{"prompt":"Record yourself describing a place you know that has changed. What did it use to be like? What had happened to it? What can people do to protect it now?","model":"There's a small park near my school. It used to be full of trees and birds, and my mum used to play there when she was a girl. When I first visited it, I was surprised. People had dropped litter everywhere, and most of the birds had gone. Last month, my class picked up all the rubbish and planted ten new trees. It was only a small thing, but I think we made a difference. Now I want everyone to stop using single-use bottles!","use":["pick up","drop litter","make a difference"]},"tips":[{"who":"teacher","t":"Before the taboo game, write some defining frames on the board (It's a thing that… / It's when people… / It's the opposite of…). In the balloon game, give each animal 30 seconds to speak and let the class vote with their hands."},{"who":"student","t":"Use had + past participle for the action that happened first: When we arrived, the birds had gone. Use used to for things that were true in the past but aren't true now."}]},{"id":"galaxy-2-teen","lv":"galaxy","n":2,"age":"teen","title":"Zero-Waste Challenge","goals":["describe environmental problems and how places have changed","talk about the past using the past perfect and used to","agree and disagree politely in a discussion about the environment"],"warm":["What single-use things did you use yesterday? Could you have avoided any of them?","How has your neighbourhood changed since you were little?","Which worries you most: plastic in the sea, air pollution or climate change? Why?","Have you ever volunteered for a clean-up or another green project?"],"model":{"kind":"dialogue","title":"The Canteen Survey","intro":"Vale and Sam have spent a week counting the rubbish in their school canteen, and now they're telling Mr Díaz what they found.","lines":[{"sp":"Mr Díaz","t":"So, what did you find out?"},{"sp":"Vale","t":"Honestly, we were shocked. By Friday, we'd counted over six hundred single-use cups."},{"sp":"Sam","t":"And that's just [[the tip of the iceberg]]. We hadn't even started on the plastic forks!"},{"sp":"Mr Díaz","t":"Wow. When I was a student here, the canteen used to sell drinks in glass bottles."},{"sp":"Vale","t":"Exactly! So we think the canteen should stop using plastic cups completely."},{"sp":"Mr Díaz","t":"[[I see your point, but]] some students won't bother to bring their own bottles."},{"sp":"Sam","t":"[[That's a fair point]]. That's why we want a water fountain next to the gym."},{"sp":"Vale","t":"We could also make a short video to [[raise awareness]]. Loads of students follow the school account."},{"sp":"Mr Díaz","t":"Good idea. But are you two [[cutting down on]] plastic at home?"},{"sp":"Sam","t":"Well, I'd never really thought about it before this project. But now I take a lunch box every day."},{"sp":"Vale","t":"And my family has stopped buying bottled water. If we want people to change, we have to [[practise what we preach]]."},{"sp":"Mr Díaz","t":"Brilliant. If you [[take action]] like this, other schools might copy you."},{"sp":"Sam","t":"That's the plan! We want to show that teenagers can really make a difference."},{"sp":"Mr Díaz","t":"Then let's present your results at Monday's assembly."}],"questions":[{"q":"What had Vale and Sam counted by Friday?","opts":["Six hundred plastic forks","Over six hundred single-use cups","Sixty glass bottles"],"a":1},{"q":"What is Mr Díaz worried about?","opts":["Some students won't bring their own bottles","The video will be too long","The water fountain will be too expensive"],"a":0},{"q":"What has Vale's family stopped doing?","opts":["Taking lunch boxes to school","Following the school account","Buying bottled water"],"a":2}]},"lang":[{"e":"cut down on","t":"PV","d":"use or do less of something","x":"My family is trying to cut down on plastic bags.","s":"cut DOWN on"},{"e":"run out of","t":"PV","d":"use all of something so that there is none left","x":"One day, the world will run out of oil.","s":"run OUT of"},{"e":"raise awareness","t":"COL","d":"make more people know about a problem","x":"We made a video to raise awareness about plastic in the sea.","s":"RAISE aWAREness"},{"e":"take action","t":"COL","d":"start doing something to solve a problem","x":"If we don't take action now, it'll be too late.","s":"TAKE ACtion"},{"e":"the tip of the iceberg","t":"ID","d":"a small part of a much bigger problem","x":"The litter on the beach is just the tip of the iceberg.","s":"the TIP of the ICEberg"},{"e":"practise what you preach","t":"ID","d":"do the things that you tell other people to do","x":"If you want others to recycle, you have to practise what you preach.","s":"PRACtise what you PREACH"},{"e":"I see your point, but…","t":"PHR","d":"a polite way to disagree with someone's idea","x":"I see your point, but recycling alone won't solve the problem.","s":"i SEE your POINT but"},{"e":"That's a fair point.","t":"PHR","d":"a way to accept that someone's idea is reasonable","x":"That's a fair point. Solar panels are expensive at first.","s":"that's a FAIR POINT"}],"pron":{"focus":"The sound of used to /ˈjuːstə/","explain":"Used to sounds like one word, /ˈjuːstə/: the d disappears and to is weak. Didn't use to sounds the same, so listen carefully for didn't. Don't confuse it with the normal verb use in the past (I used a bottle), which sounds like /juːzd/.","tip":"Say used to quickly, like one word. Then put it in a sentence and stress the verb that comes after it.","lines":[{"t":"We used to bring our own bottles.","m":"we USED‿to BRING our‿OWN BOTtles↘."},{"t":"Did you use to recycle at home?","m":"did you USE‿to reCYcle at HOME↗?"},{"t":"Our town didn't use to have a recycling bin.","m":"our TOWN DIDn't use‿to HAVE a reCYcling BIN↘."}]},"acts":[{"type":"devil","motions":["Recycling is a waste of time.","Schools should ban all single-use plastic from tomorrow.","Every new house in Chile should have solar panels.","Zoos are the best way to protect endangered animals.","Teenagers can't really do anything about climate change.","Cafés should give a discount to customers who bring their own cups."]},{"type":"picture","prompts":["Describe the scene. Who are these people, and what are they doing?","What do you think had happened to the beach before the volunteers arrived?","Do you think events like this really make a difference, or are they just the tip of the iceberg?","Would you rather join a beach clean-up or plant trees in your city? Why?","How could you persuade more teenagers to join an event like this?"]},{"type":"ranking","task":"Rank these actions from the most useful to the least useful for the environment. Then compare with a partner and agree on a top three.","items":["Taking shorter showers","Bringing your own bottle and lunch box to school","Buying second-hand clothes","Walking, cycling or taking the bus instead of going by car","Eating less meat","Joining a beach or park clean-up","Turning off lights and devices you aren't using"]}],"rec":{"prompt":"Record a short report about a place you know that has changed, for better or worse. Say what it used to be like, what had happened to it, and what people should do now.","model":"When I was little, there was a river near my grandparents' house where people used to swim every summer. Last year I went back and couldn't believe my eyes. Someone had thrown old tyres into the water, and most of the fish had disappeared. The tyres were just the tip of the iceberg, because the water had become so dirty that nobody swam in it any more. I think the town needs to take action now. Volunteers could clean the river, and everyone could cut down on single-use plastic.","use":["the tip of the iceberg","take action","cut down on"]},"tips":[{"who":"teacher","t":"In the devil's advocate debate, students defend the opposite of what they really think. Give them one minute to prepare, and ask the class to listen for polite disagreement: I see your point, but… / That's a fair point."},{"who":"student","t":"When you tell a story about the past, use the past perfect to go back further in time: By the time we arrived, someone had already cleaned the beach."}]},{"id":"galaxy-3-kid","lv":"galaxy","n":3,"age":"kid","title":"Swap Shop Stars","goals":["talk about clothes, outfits and styles you like","ask and answer about experiences with Have you ever…?","give your opinion about clothes politely"],"warm":["What's your favourite outfit? When do you wear it?","Have you ever worn a costume? What were you?","Who chooses your clothes: you or someone in your family?","Do you prefer baggy clothes or tight clothes? Why?"],"model":{"kind":"dialogue","title":"Swap Day at School","intro":"It's Clothes Swap Day at school. Everyone has brought clothes that they don't wear any more, and Kai and Martina are looking for something new.","lines":[{"sp":"Martina","t":"Look at all these clothes! Have you ever been to a swap before?"},{"sp":"Kai","t":"Never! In Sydney, I always gave my old clothes to my little cousins."},{"sp":"Martina","t":"I've brought my red coat. I've [[grown out of]] it, and the sleeves are too short now."},{"sp":"Kai","t":"Oh, it's lovely! Can I [[try it on]]?"},{"sp":"Martina","t":"Of course. Here you are."},{"sp":"Kai","t":"How does it look? Is it too tight?"},{"sp":"Martina","t":"No, it [[fits like a glove]]! Red really suits you."},{"sp":"Kai","t":"Thanks! I love these baggy yellow trousers too. [[What do you think of]] them?"},{"sp":"Martina","t":"Hmm, they're a bit long for you."},{"sp":"Kai","t":"But baggy trousers are [[all the rage]] at the moment! Everyone in my music class wears them."},{"sp":"Martina","t":"[[I see what you mean, but]] you might trip over them on the stairs!"},{"sp":"Kai","t":"Fair enough. I'll just take the coat, then. Now it's your turn. What have you found?"},{"sp":"Martina","t":"This old-fashioned straw hat with flowers on it. My mum says hats like this are [[the latest fashion]] again!"},{"sp":"Kai","t":"She's right! I love the [[bright colours]] of the flowers. You look really stylish!"}],"questions":[{"q":"Why has Martina brought her red coat?","opts":["It's too expensive","She has grown out of it","She doesn't like the colour"],"a":1},{"q":"Why does Martina think Kai shouldn't take the yellow trousers?","opts":["They're too long for her","They're old-fashioned","They're too tight"],"a":0},{"q":"What does Martina find?","opts":["A red coat","Some baggy trousers","A straw hat with flowers"],"a":2}]},"lang":[{"e":"try on","t":"PV","d":"put on clothes to see if they fit and look good","x":"Can I try on these trainers in a bigger size?","s":"try ON"},{"e":"grow out of","t":"PV","d":"become too big for your clothes or shoes","x":"My little brother grows out of his shoes every year.","s":"grow OUT of"},{"e":"fit like a glove","t":"ID","d":"fit you perfectly","x":"My new football shirt fits like a glove.","s":"FIT like a GLOVE"},{"e":"all the rage","t":"ID","d":"very popular and fashionable for a short time","x":"Rainbow socks are all the rage at my school.","s":"ALL the RAGE"},{"e":"bright colours","t":"COL","d":"strong, happy colours like red, yellow and orange","x":"I always wear bright colours in summer.","s":"BRIGHT COLours"},{"e":"the latest fashion","t":"COL","d":"the newest style that people are wearing","x":"My cousin always knows the latest fashion.","s":"the LATest FASHion"},{"e":"What do you think of…?","t":"PHR","d":"a question to ask someone's opinion","x":"What do you think of my new haircut?","s":"what do you THINK of"},{"e":"I see what you mean, but…","t":"PHR","d":"a polite way to say that you have a different idea","x":"I see what you mean, but I prefer my blue jacket.","s":"i SEE what you MEAN but"}],"pron":{"focus":"Linking in Have you ever…? questions","explain":"In Have you ever…? questions, have is weak and quick, and you joins ever with a small w sound: you‿ever. The strong words are ever and the past participle. Your voice goes up at the end of yes/no questions.","tip":"Work with a partner. Ask fast Have you ever…? questions and answer with Yes, I have! or No, never!","lines":[{"t":"Have you ever worn a costume?","m":"have you‿EVer WORN a COStume↗?"},{"t":"I've never tried it on.","m":"i've NEVer TRIED it‿ON↘."},{"t":"What do you think of my outfit?","m":"what do you THINK of my OUTfit↘?"}]},"acts":[{"type":"findsomeone","items":[{"p":"has worn a costume to school","q":"Have you ever worn a costume to school?"},{"p":"has grown out of their shoes this year","q":"Have you grown out of your shoes this year?"},{"p":"has made something from old clothes","q":"Have you ever made something from old clothes?"},{"p":"has worn odd socks by mistake","q":"Have you ever worn odd socks by mistake?"},{"p":"has bought clothes with their own money","q":"Have you ever bought clothes with your own money?"},{"p":"has worn something that belonged to a grandparent","q":"Have you ever worn something that belonged to your grandma or grandpa?"},{"p":"has dressed up as an animal","q":"Have you ever dressed up as an animal?"},{"p":"has painted or drawn on a T-shirt","q":"Have you ever painted or drawn on a T-shirt?"}],"follow":["When did you do it?","What was it like?","Who were you with?"]},{"type":"picture","prompts":["What can you see in the photo? Describe three of the jackets or coats.","Which jacket would you choose for yourself? Why?","Which one do you think is the oldest? Who do you think wore it before?","Have you ever been to a shop like this? What did you find there?","What do you think of second-hand clothes? Would you wear them?"]},{"type":"pitch","brief":"Your team is designing a new outfit for your school's sports day. Choose the colours, the fabric and one fun accessory. Then present your design to the class in one minute and answer their questions.","ideas":["A rainbow T-shirt made from recycled fabric","Baggy shorts with big pockets for snacks","A cap that changes colour in the sun","Trainers with lights that flash when you run","A team scarf with everyone's names on it"],"questions":["What colours have you chosen, and why?","Is it comfortable for running and jumping?","How much do you think it will cost?","Have you ever seen anything like it before?","Would the teachers like to wear it too?"]}],"rec":{"prompt":"Record yourself describing your favourite outfit. When did you first wear it? Have you ever worn it to a special event? What do people think of it?","model":"My favourite outfit is my orange tracksuit with white stripes. My aunt gave it to me for my birthday last year, and I wore it to my cousin's party the same day. I've worn it hundreds of times since then! It fits like a glove, and I love bright colours. My dad thinks it's a bit too orange, and I see what he means: you can see me from the other side of the park! I've almost grown out of it now, so I'm going to give it to my little brother.","use":["fit like a glove","bright colours","grow out of"]},"tips":[{"who":"teacher","t":"In Find someone who, every Yes, I have! answer must get a follow-up question in the past simple (When did you…? Where did you…?). This practises the present perfect and the past simple together in a natural way."},{"who":"student","t":"Use the present perfect when you don't say when: I've worn a costume. Use the past simple when you say when: I wore it at my birthday party last year."}]},{"id":"galaxy-3-teen","lv":"galaxy","n":3,"age":"teen","title":"Vintage Finds","goals":["describe clothes, styles and fashion trends","talk about fashion experiences using the present perfect and the past simple","ask for, give and react to opinions about fashion"],"warm":["Have you ever bought anything second-hand? What was it?","What trend have you seen everywhere this year? Do you like it?","Is there anything you used to wear that you'd never wear now?","Does your school have a dress code? What do you think of it?"],"model":{"kind":"dialogue","title":"Treasure Hunting in a Vintage Shop","intro":"Vale needs a jacket to paint for her art project, so she and Sam are searching a second-hand shop in Santiago.","lines":[{"sp":"Sam","t":"Wow, look at all these jackets! Have you been here before?"},{"sp":"Vale","t":"Loads of times. I bought my favourite coat here last winter."},{"sp":"Sam","t":"Seriously? It looks brand new. I've never bought anything second-hand."},{"sp":"Vale","t":"Well, it's perfect if you're shopping [[on a shoestring]]. New jackets [[cost a fortune]]."},{"sp":"Sam","t":"What do you think of this orange leather one?"},{"sp":"Vale","t":"Hmm, it's [[not really my cup of tea]]. Besides, leather is really hard to paint on."},{"sp":"Sam","t":"OK, what about this denim jacket? It'd [[go with]] your black jeans."},{"sp":"Vale","t":"Oh, that's perfect! I can paint a huge guitar on the back."},{"sp":"Sam","t":"You're going to [[show it off]] at the concert on Saturday, aren't you?"},{"sp":"Vale","t":"Of course! Everyone in our class [[follows the latest trends]]. I want something different."},{"sp":"Sam","t":"[[I see what you mean, but]] trends aren't always bad. Baggy jeans are really comfortable!"},{"sp":"Vale","t":"[[Fair enough]]. So, how much is it?"},{"sp":"Sam","t":"Only 4,000 pesos. Can I take some photos of you in it for my photography class?"},{"sp":"Vale","t":"Sure, but only after I've painted it!"}],"questions":[{"q":"When did Vale buy her favourite coat?","opts":["Last week","Last winter","Two years ago"],"a":1},{"q":"Why doesn't Vale choose the orange jacket?","opts":["She doesn't like it, and leather is hard to paint on","It's too expensive","It doesn't go with her jeans"],"a":0},{"q":"What does Sam want to do with the denim jacket?","opts":["Buy it for himself","Paint his name on it","Take photos of Vale in it"],"a":2}]},"lang":[{"e":"show off","t":"PV","d":"try to make people notice something you're proud of","x":"He wore his new trainers to school to show them off.","s":"show OFF"},{"e":"go with","t":"PV","d":"look good together with another piece of clothing","x":"Do you think this belt goes with my jeans?","s":"GO with"},{"e":"not my cup of tea","t":"ID","d":"not something that I like or enjoy","x":"Bright pink looks nice on you, but it's not my cup of tea.","s":"NOT my CUP of TEA"},{"e":"on a shoestring","t":"ID","d":"with very little money","x":"We made all our costumes for the school play on a shoestring.","s":"on a SHOEstring"},{"e":"follow the latest trends","t":"COL","d":"wear what is fashionable right now","x":"My sister follows the latest trends on social media.","s":"FOLlow the LATest TRENDS"},{"e":"cost a fortune","t":"COL","d":"be very expensive","x":"Designer trainers cost a fortune.","s":"COST a FORtune"},{"e":"I see what you mean, but…","t":"PHR","d":"a polite way to show you understand but have a different opinion","x":"I see what you mean, but I think uniforms are fair.","s":"i SEE what you MEAN but"},{"e":"Fair enough.","t":"PHR","d":"a way to accept that someone has a good reason","x":"You don't like orange? Fair enough.","s":"FAIR eNOUGH"}],"pron":{"focus":"Hearing the present perfect and the past simple","explain":"In the present perfect, have often becomes 've and is very quick: I've, we've, they've. It can be hard to hear, so the past participle and the time words carry the meaning. In the past simple, the verb and the finished time are stressed: I BOUGHT it LAST WINter.","tip":"Listen for 've. If you can't hear it, listen for the time words: ever, never and yet usually go with the present perfect; last winter or two years ago go with the past simple.","lines":[{"t":"Have you ever bought anything second-hand?","m":"have you‿EVer BOUGHT anything SECond-HAND↗?"},{"t":"I've never worn anything like that.","m":"i've NEVer WORN‿anything LIKE that↘."},{"t":"I bought it here last winter.","m":"i BOUGHT it‿HERE | LAST WINter↘."}]},"acts":[{"type":"expert","topic":"Upcycling: turning old clothes into new fashion","expert":"You are a young Chilean designer who turns old clothes into new designs. Before the interview, decide how you started, the best thing you've ever made, where you sold it and what you think of fast fashion.","journalists":"You work for a teen fashion podcast. Find out about the designer's experiences (Have you ever…?) and the details (When…? Where…? How much…?). Take notes and report the most surprising answer to the class.","questions":["How did you get started, and how old were you?","What's the best thing you've ever made? When did you make it?","Have you ever had a design that went completely wrong?","What do you think of fast fashion?","Where have you sold your designs?","What advice would you give to teenagers who want to start?"]},{"type":"picture","prompts":["Describe the jackets and coats. Which colours and fabrics can you see?","Which one would you buy, and what would it go with in your wardrobe?","Who do you think owned these coats before? Where did they wear them?","Have you ever found something great in a second-hand shop? Tell the story.","Why do you think vintage shops have become so popular with teenagers?"]},{"type":"wyr","items":[["wear only second-hand clothes for a year","wear only one colour for a year"],["have one designer jacket","have ten cheap T-shirts"],["design your own trainers","meet your favourite designer"],["wear something very old-fashioned to a party","wear your pyjamas to school for a day"],["always be the most stylish person in the room","always be the most comfortable person in the room"],["swap wardrobes with your best friend for a month","swap wardrobes with a parent for a week"],["stop buying new clothes for a year","stop using your phone for a week"]]}],"rec":{"prompt":"Record a short review of a piece of clothing you love. Where and when did you get it? What have you worn it with? What do you think of the trends at your school?","model":"The best thing I've ever bought is a green bomber jacket. I found it in a second-hand shop in Valparaíso two years ago, and it only cost 5,000 pesos. New jackets like that cost a fortune! I've worn it with almost everything: black jeans, baggy trousers and even my school uniform. It goes with everything. At my school, everyone follows the latest trends, and right now that means huge trainers. Honestly, they're not my cup of tea, but people should wear what makes them happy.","use":["cost a fortune","go with","not my cup of tea"]},"tips":[{"who":"teacher","t":"In the expert interview, give the designers two minutes to invent their story first. Journalists must ask at least two Have you ever…? questions and follow every Yes with a past simple question."},{"who":"student","t":"Never use the present perfect with a finished time. Say I bought it last year, not I've bought it last year."}]},{"id":"galaxy-4-kid","lv":"galaxy","n":4,"age":"kid","title":"Dream Job Radio","goals":["talk about jobs you might do in the future","describe what you will be doing at a time in the future","give friendly warnings and advice"],"warm":["What did you want to be when you were little? Has it changed?","What jobs do people in your family do?","Which job would you never want to do? Why?","What do you think you'll be doing this time next year?"],"model":{"kind":"dialogue","title":"On the Bus Home","intro":"Leo and Kai are on the school bus after Jobs Day, and they're talking about the future.","lines":[{"sp":"Kai","t":"That was the best school day ever! What do you want to be when you [[grow up]], Leo?"},{"sp":"Leo","t":"I'm not sure. I might be a scientist, or I might be a data analyst for a football team."},{"sp":"Kai","t":"A data analyst? That sounds really difficult."},{"sp":"Leo","t":"It isn't [[a piece of cake]], but I love numbers. What about you?"},{"sp":"Kai","t":"My [[dream job]] is to be a music teacher, like my mum."},{"sp":"Leo","t":"So you're going to [[follow in her footsteps]]!"},{"sp":"Kai","t":"Exactly. And this time next year, I'll be playing the piano in the school concert."},{"sp":"Leo","t":"Cool! But [[you'd better]] practise every day."},{"sp":"Kai","t":"I know. I already practise for an hour after school. Are you going to [[work hard]] at maths?"},{"sp":"Leo","t":"Yes! And Martina's dad says I should learn to code. He's an app developer."},{"sp":"Kai","t":"He works from home, doesn't he? He [[looks after]] Martina's baby brother and makes games at the same time!"},{"sp":"Leo","t":"That's amazing. Oh, this is our stop! [[Don't forget to]] take your bag."},{"sp":"Kai","t":"Thanks! See you tomorrow, future scientist!"}],"questions":[{"q":"What might Leo be in the future?","opts":["A music teacher","A data analyst","A bus driver"],"a":1},{"q":"What will Kai be doing this time next year?","opts":["Playing the piano in the school concert","Learning to code with Leo","Teaching music at a school"],"a":0},{"q":"What is Martina's dad's job?","opts":["He's a music teacher","He's a scientist","He's an app developer"],"a":2}]},"lang":[{"e":"grow up","t":"PV","d":"become an adult","x":"When I grow up, I want to be a vet.","s":"grow UP"},{"e":"look after","t":"PV","d":"take care of someone or something","x":"Vets look after sick animals.","s":"look AFter"},{"e":"follow in someone's footsteps","t":"ID","d":"do the same job or activity as someone in your family","x":"My grandpa was a baker, and my dad followed in his footsteps.","s":"FOLlow in someone's FOOTsteps"},{"e":"a piece of cake","t":"ID","d":"something that is very easy","x":"The maths test was a piece of cake!","s":"a PIECE of CAKE"},{"e":"dream job","t":"COL","d":"the job you would love to do most","x":"My dream job is to design video games.","s":"DREAM JOB"},{"e":"work hard","t":"COL","d":"put a lot of effort into what you do","x":"You need to work hard to become a doctor.","s":"WORK HARD"},{"e":"You'd better…","t":"PHR","d":"a way to give strong advice or a warning","x":"You'd better hurry, or you'll miss the bus.","s":"you'd BETter"},{"e":"Don't forget to…","t":"PHR","d":"a way to remind someone to do something","x":"Don't forget to bring your swimming things tomorrow.","s":"DON'T forGET to"}],"pron":{"focus":"Short 'll in the future continuous","explain":"In fast speech, will becomes 'll and joins the word before it: I'll, you'll, we'll. Be is weak and quick. The stress goes on the -ing verb and the other important words.","tip":"Say I'll be very quickly, almost like one word. Then say the -ing verb loudly and clearly.","lines":[{"t":"I'll be playing in the concert.","m":"i'll be PLAYing in the CONcert↘."},{"t":"What will you be doing at ten?","m":"WHAT will you be DOing at TEN↘?"},{"t":"You'd better practise every day.","m":"you'd BETter PRACtise | EVery DAY↘."}]},"acts":[{"type":"guess","cat":"Jobs","items":["vet","app developer","firefighter","chef","content creator","pilot","teacher","data analyst","farmer","football coach","nurse","musician"],"frames":["Do you work with animals / people / computers?","Do you work inside or outside?","Do you need a uniform?","Will you be working at night?"]},{"type":"minute","items":["My dream job and why I want it","A day in my life when I'm twenty-five","A job I would never want to do","The most interesting job in my family","What I'll be doing this time next year","A new job that people will do in the future","Advice for a friend who wants to be a vet"],"sec":60},{"type":"podcast","title":"Future Jobs Radio","segments":["Welcome! Introduce yourselves and say what you want to be when you grow up.","Job of the week: describe a job and say what the worker will be doing at ten o'clock on a normal day.","Interview: one host asks a future vet, chef or game designer three questions.","Top tips: give listeners some advice using You'd better… and Don't forget to…","Goodbye: predict one thing that will happen in your class next year."]}],"rec":{"prompt":"Record yourself describing your dream job. What will you be doing on a normal day? What do you need to learn? Give one piece of advice to a friend who wants the same job.","model":"My dream job is to be a vet. My aunt is a vet in Concepción, so I'm going to follow in her footsteps. On a normal day, I'll be looking after cats, dogs and maybe even horses. I'll be working in a clinic in the morning and visiting farms in the afternoon. It isn't a piece of cake, because vets have to study for many years. If you want to be a vet too, you'd better work hard at science. And don't forget to be kind to every animal!","use":["dream job","follow in someone's footsteps","You'd better…"]},"tips":[{"who":"teacher","t":"In the guessing game, the student who is thinking of a job can only answer Yes, No or Sometimes. After each round, the class makes one sentence about the job with will be + -ing: A vet will be looking after animals."},{"who":"student","t":"Use will be + -ing for something that will be in progress at a time in the future: At ten tomorrow, I'll be doing my maths test."}]},{"id":"galaxy-4-teen","lv":"galaxy","n":4,"age":"teen","title":"Interview Ready","goals":["discuss careers, skills and qualifications","talk about plans, predictions and future arrangements using different future forms","give advice and warnings about job interviews"],"warm":["What job do you think you'll be doing in fifteen years?","Would you like to work from home? Why or why not?","Which skills do you think will be most important for jobs in the future?","Have you ever had a part-time job or helped out in a family business?"],"model":{"kind":"dialogue","title":"The Night Before the Interview","intro":"Sam has an interview tomorrow for a part-time job at a summer sports camp, and Jose is helping him prepare.","lines":[{"sp":"Jose","t":"So, what time is your interview tomorrow?"},{"sp":"Sam","t":"At ten. This time tomorrow, I'll be sitting in front of the camp manager. I'm so nervous!"},{"sp":"Jose","t":"Don't worry. Have you [[filled in]] the application form?"},{"sp":"Sam","t":"Yes, I sent it last week. I just hope I [[make a good impression]]."},{"sp":"Jose","t":"You will. But [[you'd better]] wear something smart. Not your football shorts!"},{"sp":"Sam","t":"Ha! OK. What if they ask about my qualifications? I haven't really got any."},{"sp":"Jose","t":"You've done a first aid course, and you've coached the under-tens at your club. That's real experience."},{"sp":"Sam","t":"True. What else should I do?"},{"sp":"Jose","t":"[[Brush up on]] your Spanish. Most of the kids at the camp won't speak English."},{"sp":"Sam","t":"Good point. I'll practise with my host family tonight."},{"sp":"Jose","t":"And [[don't forget to]] ask them a question at the end. It shows you're interested."},{"sp":"Sam","t":"Like what?"},{"sp":"Jose","t":"Like, what will I be doing on a normal day?"},{"sp":"Sam","t":"Perfect. Honestly, I don't care much about the salary. I just want to [[gain experience]]."},{"sp":"Jose","t":"Exactly. A job like this could help you [[get your foot in the door]] in sports coaching. In two weeks, you'll be [[learning the ropes]]!"},{"sp":"Sam","t":"Thanks, Jose. You'd make a brilliant careers adviser!"}],"questions":[{"q":"What time is Sam's interview?","opts":["At nine","At two","At ten"],"a":2},{"q":"Why should Sam brush up on his Spanish?","opts":["Most of the kids won't speak English","The manager doesn't speak English","He has a Spanish exam tomorrow"],"a":0},{"q":"What is more important to Sam than the salary?","opts":["Wearing smart clothes","Gaining experience","Playing football at the weekend"],"a":1}]},"lang":[{"e":"fill in","t":"PV","d":"write the information that a form asks for","x":"Fill in the form and send it by Friday.","s":"fill IN"},{"e":"brush up on","t":"PV","d":"practise and improve a skill you haven't used for a while","x":"I need to brush up on my French before the trip.","s":"brush UP on"},{"e":"get your foot in the door","t":"ID","d":"get a first chance to start in a company or a career","x":"A summer job is a great way to get your foot in the door.","s":"get your FOOT in the DOOR"},{"e":"learn the ropes","t":"ID","d":"learn how to do a new job or activity","x":"It took me a week to learn the ropes at the café.","s":"LEARN the ROPES"},{"e":"make a good impression","t":"COL","d":"make people think good things about you when they meet you","x":"Arrive early if you want to make a good impression.","s":"make a GOOD imPRESSion"},{"e":"gain experience","t":"COL","d":"learn skills by doing a job or an activity","x":"Volunteering is a good way to gain experience.","s":"GAIN exPERience"},{"e":"You'd better…","t":"PHR","d":"a way to give strong advice or a warning","x":"You'd better switch off your phone before the interview.","s":"you'd BETter"},{"e":"Don't forget to…","t":"PHR","d":"a way to remind someone to do something important","x":"Don't forget to thank the interviewer at the end.","s":"DON'T forGET to"}],"pron":{"focus":"Stress and falling intonation in advice and warnings","explain":"When we give advice or warnings, we stress the key words strongly, and the voice falls at the end so we sound clear and sure. Small words like you'd, to and a are weak; better, forget and the main verb are strong.","tip":"Imagine you're a coach giving instructions. Say each line firmly, with a clear fall at the end, and don't rush the stressed words.","lines":[{"t":"You'd better wear something smart.","m":"you'd BETter WEAR something SMART↘."},{"t":"Don't forget to ask a question.","m":"DON'T forGET to ASK a QUEStion↘."},{"t":"This time tomorrow, I'll be sitting in the interview.","m":"this TIME toMORrow↗ | i'll be SITting in the INterview↘."}]},"acts":[{"type":"negotiation","sit":"A summer sports camp in Viña del Mar needs a teenage assistant for January. The camp manager and the applicant must agree on the days, the hours, the pay and the tasks.","a":{"role":"Camp manager","goal":"You need an assistant from Monday to Saturday, 9 a.m. to 3 p.m., to help with football and beach games.","limits":"You can pay up to 15,000 pesos a day. You can give one day off a week, but never Saturday, because it's the busiest day."},"b":{"role":"Applicant (a teenager)","goal":"You want the job to gain experience, but you also want to save money for a new camera.","limits":"You can't work on Fridays because you've got volleyball practice. You'd like at least 12,000 pesos a day and free lunch at the camp."}},{"type":"picture","prompts":["Describe the photo. What do you think the teens are building?","What skills do you think they're using? Which of these skills have you got?","What might these teens be doing ten years from now?","Would you like to work in a workshop like this, or would you rather work from home? Why?","What safety advice would you give someone who is using these tools for the first time?"]},{"type":"roulette","items":["What will you be doing at eight o'clock on Saturday morning?","What are you going to do next summer?","Which jobs do you think robots will do in 2040?","What do you think you'll be doing this time next year?","Would you rather have a high salary or a job you love? Why?","What's one skill you're going to learn this year?","What might you study after you finish school?","Who will you be spending your next birthday with?","What's the best piece of career advice you've ever heard?","Which job might not exist when you're thirty?"]}],"rec":{"prompt":"Record a short voice message to a friend who has a job interview tomorrow. Give advice and warnings, and say what they'll be doing this time next week if they get the job.","model":"Hi Tomás! Good luck with your interview tomorrow. You'd better arrive ten minutes early, because the first few minutes really matter. If you want to make a good impression, look the manager in the eye and smile. Don't forget to take a copy of your CV, and be careful not to talk too fast when you're nervous. Remember, this job is a great way to get your foot in the door. And just imagine: this time next week, you'll be learning the ropes at the skate shop!","use":["You'd better…","make a good impression","get your foot in the door"]},"tips":[{"who":"teacher","t":"Before the negotiation, write some polite phrases on the board: How about if…? / Would you be happy with…? / I'm afraid I can't… / That sounds fair. Pairs must reach a deal in five minutes and then report it to the class."},{"who":"student","t":"Choose the right future form: will for predictions, be going to for plans, might for things that are possible, and will be + -ing for actions in progress at a time in the future."}]},{"id":"galaxy-5-kid","lv":"galaxy","n":5,"age":"kid","title":"Night Sky Detectives","goals":["describe what you can see in the night sky","imagine life as an astronaut using if-sentences","give a friend clear instructions for a night of stargazing"],"warm":["Have you ever looked at the stars far away from the city? Where were you?","What can you see in the sky on a clear night?","Would you like to be an astronaut one day? Why or why not?","What would you take with you for a night of stargazing?"],"model":{"kind":"dialogue","title":"Grandma's Old Telescope","intro":"Leo and his cousin Kai are spending the night at Grandma Ana's house in the Elqui Valley, and they want to use her old telescope.","lines":[{"sp":"Kai","t":"Leo, can you help me [[set up]] Grandma's telescope? I don't know where this part goes."},{"sp":"Leo","t":"Sure. First, put the legs on flat ground. Then fix the telescope on top. Make sure it doesn't wobble."},{"sp":"Kai","t":"Wow, look at that [[clear sky]]! If it stays like this, we'll see thousands of stars."},{"sp":"Leo","t":"Let's point it at the Moon first. Can you see anything?"},{"sp":"Kai","t":"Yes! I can just [[make out]] some craters. They look like round holes."},{"sp":"Leo","t":"Rocks made them a very long time ago. If a big rock hits the Moon, it leaves a crater."},{"sp":"Kai","t":"Hey, what's that bright dot? It's moving really fast."},{"sp":"Leo","t":"That's the International Space Station! It orbits the Earth about every ninety minutes."},{"sp":"Kai","t":"So there are astronauts up there right now? [[What would you do if]] you were one of them?"},{"sp":"Leo","t":"If I were an astronaut, I'd float around all day and take photos of Chile!"},{"sp":"Kai","t":"I'd play table tennis, but the ball would float away. Oh, look, a [[shooting star]]! Quick, [[make a wish]]!"},{"sp":"Leo","t":"Done! But I can't tell you what it is, or it won't come true."},{"sp":"Kai","t":"I bet it's about becoming an astronaut. Ms Rojas always tells us to [[reach for the stars]]!"},{"sp":"Grandma Ana","t":"Bedtime, you two! If you stay up any later, you'll be too tired tomorrow."},{"sp":"Leo","t":"Five more minutes, Grandma, please! Tonight I'm [[over the moon]]!"}],"questions":[{"q":"What does Kai see through the telescope?","opts":["Craters on the Moon","A shooting star","The International Space Station"],"a":0},{"q":"What is the bright dot that is moving fast?","opts":["A plane","A shooting star","The International Space Station"],"a":2},{"q":"What would Leo do if he were an astronaut?","opts":["Play table tennis","Float around and take photos of Chile","Make a wish every night"],"a":1}]},"lang":[{"e":"set up","t":"PV","d":"put the parts of something together so it is ready to use","x":"Dad helped us set up the tent in the garden.","s":"set UP"},{"e":"make out","t":"PV","d":"manage to see something that is not easy to see","x":"In the dark, I could just make out Pipo's tail.","s":"make OUT"},{"e":"over the moon","t":"ID","d":"extremely happy","x":"Sofi was over the moon when Grandma gave her a new paint set.","s":"OVer the MOON"},{"e":"reach for the stars","t":"ID","d":"try to achieve something very big and difficult","x":"If you want to play football for Chile one day, reach for the stars!","s":"REACH for the STARS"},{"e":"clear sky","t":"COL","d":"a sky with no clouds","x":"There was a clear sky, so we could see the Moon perfectly.","s":"CLEAR SKY"},{"e":"shooting star","t":"COL","d":"a quick line of light in the night sky, made by a tiny burning rock","x":"I saw a shooting star last night and made a wish.","s":"SHOOTing STAR"},{"e":"make a wish","t":"COL","d":"silently ask for something that you hope will happen","x":"Close your eyes and make a wish before you blow out the candles.","s":"make a WISH"},{"e":"What would you do if…?","t":"PHR","d":"a question about an imaginary situation","x":"What would you do if you found a dinosaur bone in the garden?","s":"WHAT would you DO if"}],"pron":{"focus":"Contractions in if-sentences: I'd, we'll, you'd","explain":"In natural speech, we don't usually say 'I would' or 'we will' in full. We say 'I'd' and 'we'll', very quickly and softly. The strong stress goes on the important words, like ASTronaut, PHOtos and STARS.","tip":"Clap on the stressed words and say the small words softly between the claps.","lines":[{"t":"If I were an astronaut, I'd take photos of Chile.","m":"if I were‿an ASTronaut | I'd take PHOtos of CHIle↘."},{"t":"If it's clear tonight, we'll see thousands of stars.","m":"if‿it's CLEAR toNIGHT | we'll see THOUsands of STARS↘."},{"t":"What would you do if you were up there?","m":"WHAT would‿you DO | if you were UP there↘?"}]},"acts":[{"type":"picture","prompts":["What can you see in the photo? Describe the building and the sky.","What do you think is inside the white dome? What is it used for?","Why do you think scientists build observatories in places like the Atacama Desert?","If you could spend one night in this observatory, what would you like to look at?","What would happen if clouds covered the sky tonight?"]},{"type":"wyr","items":[["spend a week on the space station","spend a week at an observatory in the desert"],["have a telescope in your bedroom","have a camera that can take photos of the Moon's craters"],["be weightless for a whole day","be able to see in the dark for a whole day"],["eat astronaut food for a week","sleep in a sleeping bag on the wall for a week"],["have a new star named after you","have a new crater named after your pet"],["talk to an astronaut on a video call","visit a real observatory in the Atacama"],["stay up all night watching shooting stars","get up at five in the morning to see the Moon"],["jump on the Moon, where gravity is much weaker","swim with dolphins in the sea"]]},{"type":"taboo","cards":[{"w":"telescope","taboo":["stars","look","far"]},{"w":"astronaut","taboo":["space","job","float"]},{"w":"crater","taboo":["hole","Moon","rock"]},{"w":"gravity","taboo":["fall","pull","down"]},{"w":"satellite","taboo":["signal","phone","circle"]},{"w":"shooting star","taboo":["wish","fast","sky"]},{"w":"weightless","taboo":["heavy","float","kilos"]},{"w":"observatory","taboo":["building","dome","telescope"]},{"w":"galaxy","taboo":["Milky Way","stars","billions"]},{"w":"desert","taboo":["dry","sand","Atacama"]}]}],"rec":{"prompt":"Record instructions for a friend who is going stargazing for the first time. Use First…, Then…, Make sure you… and Finally…, and say what they will see if the sky is clear.","model":"Are you going stargazing this weekend? Here's what to do. First, find a dark place far away from the city lights. Then lie down on a blanket and wait about twenty minutes, so your eyes can get used to the dark. Make sure you take a warm jacket, because nights in the desert are really cold. If you've got a telescope, ask an adult to help you set it up. If there's a clear sky, you'll see thousands of stars, and you might even make out some craters on the Moon. Finally, look out for a shooting star and make a wish!","use":["set up","clear sky","make out"]},"tips":[{"who":"teacher","t":"Show the photo of the observatory first and pre-teach dome, telescope and observatory. Tell students that Chile's Atacama Desert has some of the biggest telescopes in the world."},{"who":"student","t":"When you answer a 'Would you rather…?' question, give a reason with an if-sentence: I'd rather…, because if I…, I'd…"}]},{"id":"galaxy-5-teen","lv":"galaxy","n":5,"age":"teen","title":"Dark Skies, Big Questions","goals":["talk about real and imaginary situations in space science using conditionals","explain why Chile is one of the best places in the world to study the sky","give and defend your opinion on space exploration and light pollution"],"warm":["Have you ever seen the Milky Way with your own eyes? Where were you?","If you could ask an astronaut one question, what would it be?","Would you take a job at a desert observatory, far from your friends? Why or why not?","Do you think stargazing apps are as good as looking at the real sky?"],"model":{"kind":"dialogue","title":"A Night at the Observatory","intro":"Sam and Jose are on a school trip to an observatory in the Atacama Desert, where Dr Rosa Díaz works as an astronomer.","lines":[{"sp":"Sam","t":"This place is amazing. We're literally [[in the middle of nowhere]]."},{"sp":"Dr Díaz","t":"That's the whole point. If you build an observatory near a city, [[light pollution]] hides the faintest stars."},{"sp":"Jose","t":"So that's why there are so many telescopes in northern Chile?"},{"sp":"Dr Díaz","t":"Exactly. The air is dry, and at night it's [[pitch black]]."},{"sp":"Sam","t":"I'd love to photograph the Milky Way tonight. Any tips?"},{"sp":"Dr Díaz","t":"First, put your camera on a tripod. Then use a long exposure, about twenty seconds. And make sure you switch off the flash, or you'll annoy everyone!"},{"sp":"Jose","t":"What's that huge dish over there?"},{"sp":"Dr Díaz","t":"It's a radio telescope. It [[picks up]] signals from galaxies billions of light years away."},{"sp":"Jose","t":"How do you [[figure out]] what the signals mean?"},{"sp":"Dr Díaz","t":"With computers, mostly. If I couldn't code, I wouldn't be able to do my job."},{"sp":"Jose","t":"OK, I'm definitely studying computer science."},{"sp":"Sam","t":"Did you ever want to be an astronaut, Dr Díaz?"},{"sp":"Dr Díaz","t":"When I was your age, yes. But if I'd gone into space, I would have missed nights like this."},{"sp":"Sam","t":"[[What if]] a satellite crosses my photo?"},{"sp":"Dr Díaz","t":"Then you'll get a bright line across it. It happens more and more."},{"sp":"Jose","t":"Look, a shooting star! Did you get it?"},{"sp":"Sam","t":"Yes! That only happens [[once in a blue moon]]."},{"sp":"Dr Díaz","t":"Not here. We see them every night. But I agree, the view is [[out of this world]]."}],"questions":[{"q":"Why are there so many observatories in northern Chile?","opts":["Astronomers prefer hot weather","The air is dry and the nights are very dark","It's easier to build big domes there"],"a":1},{"q":"What does the radio telescope do?","opts":["It picks up signals from distant galaxies","It takes photos of satellites","It shows the weather forecast"],"a":0},{"q":"What does Dr Díaz say about becoming an astronaut?","opts":["She was never interested in space","She failed the training","She would have missed nights at the observatory"],"a":2}]},"lang":[{"e":"in the middle of nowhere","t":"PREP","d":"in a place that is very far from towns and cities","x":"My grandparents live in a tiny village in the middle of nowhere.","s":"in the MIDdle of NOwhere"},{"e":"light pollution","t":"COL","d":"artificial light from towns and cities that makes it hard to see the stars","x":"Because of light pollution, you can only see a few stars in Santiago.","s":"LIGHT polLUtion"},{"e":"pitch black","t":"COL","d":"completely dark","x":"When the power went off, the whole house was pitch black.","s":"PITCH BLACK"},{"e":"pick up","t":"PV","d":"receive a signal or a sound with a machine","x":"My radio can't pick up any stations in the mountains.","s":"pick UP"},{"e":"figure out","t":"PV","d":"finally understand something or find the answer to it","x":"It took me ages to figure out how my new camera works.","s":"figure OUT"},{"e":"once in a blue moon","t":"ID","d":"very rarely","x":"My brother tidies his room once in a blue moon.","s":"ONCE in a BLUE MOON"},{"e":"out of this world","t":"ID","d":"extremely good or impressive","x":"The empanadas at that café are out of this world.","s":"OUT of this WORLD"},{"e":"What if…?","t":"PHR","d":"a way to ask about a possible situation and what would happen","x":"What if it rains on the day of the match?","s":"WHAT IF"}],"pron":{"focus":"Weak forms in conditionals: I'd, would have","explain":"In fast, natural speech, 'would have' is very weak and sounds like /wʊdəv/, and 'I would' or 'I had' become 'I'd'. The stress goes on the main verbs and the new information, not on the small grammar words.","tip":"First say only the stressed words (GONE, SPACE, MISSED, NIGHTS, THIS). Then add the weak words quickly between them, keeping the same rhythm.","lines":[{"t":"If I'd gone into space, I would have missed nights like this.","m":"if I'd GONE‿into SPACE | I would‿have MISSED NIGHTS like THIS↘."},{"t":"If I were you, I'd use a tripod.","m":"if I were YOU | I'd USE‿a TRIpod↘."},{"t":"If you build it near a city, you won't see the faintest stars.","m":"if you BUILD‿it near‿a CIty | you WON'T see the FAINTest STARS↘."}]},"acts":[{"type":"picture","prompts":["Describe the photo. What kind of building is this, and what do you think happens inside it?","Why do you think observatories often have round domes that can open and turn?","This photo was taken during the day. How do you imagine this place at night?","Would you like to work in a place like this? What would be the best and the worst parts of the job?","If you could choose the location for a new observatory in Chile, where would you put it and why?"]},{"type":"roulette","items":["If you could spend a month at an observatory or on the space station, which would you choose and why?","What would you miss most if you lived on the space station for six months?","If you could photograph one thing in the night sky, what would it be?","What would happen to everyday life if all satellites stopped working tomorrow?","If people hadn't invented the telescope, what do you think we wouldn't know today?","Would you take your dream job if it was in the middle of nowhere? Why or why not?","If you were weightless for a day, what's the first thing you'd try?","If an astronaut visited your school, what would you ask them?","What will you do if there's a clear, starry sky this weekend?"]},{"type":"devil","motions":["Cities should switch off most street lights after midnight so that people can see the stars.","Countries should spend more money on telescopes than on sending astronauts into space.","Companies shouldn't be allowed to send thousands of new satellites into orbit.","Stargazing apps are better than real telescopes for learning about the sky.","Every school in Chile should organise a trip to an observatory.","Living on the space station would be more boring than exciting."]}],"rec":{"prompt":"Record a voice message for a friend who is planning a stargazing trip. Explain why the Atacama is a good place for it, give instructions with First…, Then… and Make sure you…, and say what would happen if they tried it in a big city.","model":"Hey! So you're going stargazing in the Atacama. Lucky you! It's one of the best places on Earth for it, because the air is dry and there's almost no light pollution. First, drive somewhere in the middle of nowhere, far from any towns. Then switch off your phone and give your eyes twenty minutes to adjust. Make sure you take a warm jacket, because it gets freezing at night. If the sky is clear, you'll see the Milky Way. Honestly, if you tried this in Santiago, you'd only see a few stars. Send me some photos. I bet the view will be out of this world!","use":["light pollution","in the middle of nowhere","out of this world"]},"tips":[{"who":"teacher","t":"In the devil's advocate activity, give each student a motion they disagree with and ask them to use at least two conditionals in their argument: If we did…, we would… / If we don't…, we'll…"},{"who":"student","t":"Choose the conditional that matches your meaning: a real future plan (If it's clear, we'll…), an imaginary situation (If I lived there, I'd…) or a past regret (If I'd known, I would have…)."}]},{"id":"galaxy-6-kid","lv":"galaxy","n":6,"age":"kid","title":"Happy Body, Happy Mind","goals":["talk about healthy habits for your body and your mind","report what other people said, asked or told you to do","give a friend advice about sleep, food and stress"],"warm":["What time is your bedtime on school nights?","What do you do to relax after school?","What's your favourite healthy snack?","How do you feel when you don't get enough sleep?"],"model":{"kind":"dialogue","title":"Before the Big Match","intro":"It's Saturday morning, and Kai finds her cousin Leo yawning before his football match.","lines":[{"sp":"Kai","t":"Morning, Leo! You look exhausted. Are you feeling [[under the weather]]?"},{"sp":"Leo","t":"Not really. I just didn't [[get enough sleep]]. I played a game on my tablet until ten o'clock."},{"sp":"Kai","t":"Ten o'clock? Your mum told you to switch it off at eight!"},{"sp":"Leo","t":"I know. And now I've got a match at eleven. The coach asked me if I was ready, and I said yes, but I'm really nervous."},{"sp":"Kai","t":"[[Take a deep breath]]. Nurse Paula told us to breathe in slowly and count to four. It helps you [[calm down]]."},{"sp":"Leo","t":"Oh yes! Then she asked us how we felt, and everyone said that they felt better."},{"sp":"Kai","t":"She also told us to [[drink plenty of water]]. Have you got your water bottle?"},{"sp":"Leo","t":"Yes, it's in my bag. What else did she say? I can't remember."},{"sp":"Kai","t":"She said that we should [[wind down]] before bed. No screens, just a book or some quiet music."},{"sp":"Leo","t":"OK, I'll try that tonight. [[Why don't you]] remind me after dinner?"},{"sp":"Kai","t":"Deal! Now let's go and warm up. Look at Pipo. He's [[full of beans]] this morning!"},{"sp":"Leo","t":"Of course he is. He had three naps yesterday!"}],"questions":[{"q":"Why is Leo so tired?","opts":["He played a game on his tablet until late","He had a football match last night","He went to bed at eight"],"a":0},{"q":"What did Nurse Paula tell the children to do?","opts":["Count to ten very fast","Breathe in slowly and count to four","Drink juice before matches"],"a":1},{"q":"Why is Pipo full of energy?","opts":["He drank lots of water","He played football with Leo","He had three naps yesterday"],"a":2}]},"lang":[{"e":"calm down","t":"PV","d":"stop feeling nervous, angry or too excited","x":"When I'm nervous before a test, I count to ten to calm down.","s":"calm DOWN"},{"e":"wind down","t":"PV","d":"relax slowly after a busy day, before going to sleep","x":"I read a comic in bed to wind down.","s":"wind DOWN"},{"e":"under the weather","t":"ID","d":"a little bit ill","x":"Sofi stayed at home because she was feeling under the weather.","s":"UNder the WEAther"},{"e":"full of beans","t":"ID","d":"full of energy and very lively","x":"After a good night's sleep, I'm always full of beans.","s":"FULL of BEANS"},{"e":"get enough sleep","t":"COL","d":"sleep for as many hours as your body needs","x":"If you don't get enough sleep, it's hard to concentrate at school.","s":"get eNOUGH SLEEP"},{"e":"take a deep breath","t":"COL","d":"slowly fill your lungs with lots of air","x":"Take a deep breath before you start your presentation.","s":"take a DEEP BREATH"},{"e":"drink plenty of water","t":"COL","d":"drink a lot of water","x":"It's hot today, so remember to drink plenty of water.","s":"DRINK PLENty of WAter"},{"e":"Why don't you…?","t":"PHR","d":"a friendly way to make a suggestion","x":"Why don't you go to bed a bit earlier tonight?","s":"WHY DON'T you"}],"pron":{"focus":"Intonation: direct questions and reported questions","explain":"A direct yes/no question goes up at the end: Are you READy↗? But a reported question is not a real question, so your voice goes down at the end: She asked me if I was READy↘.","tip":"Say the direct question with your voice going up like a hill. Then report it with your voice going down like a slide.","lines":[{"t":"Are you ready for the match?","m":"are you READy for the MATCH↗?"},{"t":"The coach asked me if I was ready for the match.","m":"the COACH asked me‿if I was READy for the MATCH↘."},{"t":"She told us to drink plenty of water.","m":"she TOLD‿us to DRINK PLENty of WAter↘."}]},"acts":[{"type":"picture","prompts":["What are the people in the photo doing? How do you think they feel?","Why do you think they're exercising in a park and not inside?","Imagine their teacher is talking to them. What do you think she told them to do? Start with: She told them to…","Do you ever stretch or do yoga? When and where?","What helps you feel calm: sport, music, reading or something else?"]},{"type":"findsomeone","items":[{"p":"goes to bed before nine o'clock","q":"Do you go to bed before nine o'clock?"},{"p":"drinks more than five glasses of water a day","q":"Do you drink more than five glasses of water a day?"},{"p":"had a nap last weekend","q":"Did you have a nap last weekend?"},{"p":"eats fruit for breakfast","q":"Do you eat fruit for breakfast?"},{"p":"does a sport after school","q":"Do you do a sport after school?"},{"p":"reads a book before bedtime","q":"Do you read a book before bedtime?"},{"p":"knows a good way to calm down","q":"Do you know a good way to calm down?"},{"p":"felt stressed about a test this month","q":"Did you feel stressed about a test this month?"}],"follow":["What do you do?","How does it make you feel?","Who told you about it?"]},{"type":"pitch","brief":"Your team is inventing a new game, club or challenge to help the children at your school feel healthier and happier. Plan it together, then present it to the class in two minutes.","ideas":["a breathing game to play before tests","a water bottle challenge with a sticker for every full bottle","a bedtime story club with no screens after eight","a ten-minute dance workout at break time","a healthy snack recipe book made by your class"],"questions":["What is your idea called, and who is it for?","How does it help children's bodies or minds?","What did the people in your team say about it? Start with: My friend said that…","How will you get other children to try it?","What would happen if every school in Chile tried your idea?"]}],"rec":{"prompt":"Tell a friend about someone who gave you good advice about sleep, food or stress. Report what they said, what they asked you and what they told you to do.","model":"Last week the school nurse visited our class. First, she asked us how many glasses of water we drank every day. I said that I drank about three, and she told me to drink plenty of water to stay hydrated. Then she asked if we felt stressed before tests. I put my hand up! She told us to take a deep breath and count to four, and it really helped me calm down. She also recommended reading before bed instead of playing on a tablet. Now I sleep much better!","use":["drink plenty of water","take a deep breath","calm down"]},"tips":[{"who":"teacher","t":"After Find Someone Who, ask students to report back using reported speech. Write the frames on the board: She told me that… / He said that… / I asked her if…"},{"who":"student","t":"In reported speech, take one step back in time: 'I am tired' becomes 'She said she was tired', and 'I like it' becomes 'He said he liked it'."}]},{"id":"galaxy-6-teen","lv":"galaxy","n":6,"age":"teen","title":"Stress Less, Sleep Better","goals":["discuss healthy routines for sleep, stress and screen time","report advice and questions from other people accurately","persuade others to try a wellbeing habit"],"warm":["Roughly how many hours of screen time do you have a day? Check your phone if you dare!","What's the first thing you do when you wake up?","What stresses you out most at school?","Do you have a routine that helps you relax before an exam?"],"model":{"kind":"dialogue","title":"The Digital Detox Challenge","intro":"Tomás bumps into Vale outside the school library during exam week.","lines":[{"sp":"Tomás","t":"Hey, Vale. You look really relaxed for exam week. What's your secret?"},{"sp":"Vale","t":"Mr Díaz's digital detox challenge! Last Monday he asked us how much screen time we had a day. Mine was seven hours!"},{"sp":"Tomás","t":"Seven? That's a lot, even for you."},{"sp":"Vale","t":"I know. So he told us to [[cut down on]] our screen time for a week and write down our mood every evening."},{"sp":"Tomás","t":"And did it work? I've been so [[stressed out]] that I've been [[burning the midnight oil]] all week."},{"sp":"Vale","t":"That's exactly what he warned us about. He said that studying late at night makes it harder to remember things."},{"sp":"Tomás","t":"Seriously? So what did he recommend?"},{"sp":"Vale","t":"He recommended switching off all screens an hour before bed so your brain can [[wind down]]. I've been drawing instead, and I've had [[a good night's sleep]] every night."},{"sp":"Tomás","t":"But what about music? I can't relax without it."},{"sp":"Vale","t":"I asked him if music was OK, and he said it was fine, as long as you don't scroll at the same time."},{"sp":"Tomás","t":"Fair enough. Maybe I should [[take a break]] from my phone this weekend."},{"sp":"Vale","t":"You definitely should. Go skating, see some friends and [[recharge your batteries]]."},{"sp":"Tomás","t":"All right, I'll give it a go. [[It's worth a try]]."}],"questions":[{"q":"What did Mr Díaz ask the class to do for a week?","opts":["Study until late every night","Use their phones less and write down their mood","Stop listening to music"],"a":1},{"q":"Why has Tomás been staying up late?","opts":["He's been studying for his exams","He's been watching films","He's been drawing"],"a":0},{"q":"What did Mr Díaz say about music?","opts":["It was never a good idea at night","It was better than drawing","It was fine if you didn't scroll at the same time"],"a":2}]},"lang":[{"e":"cut down on","t":"PV","d":"do or use less of something","x":"I'm trying to cut down on sugar during the week.","s":"cut DOWN on"},{"e":"wind down","t":"PV","d":"relax gradually after a busy or stressful time","x":"I listen to a podcast to wind down after training.","s":"wind DOWN"},{"e":"stress out","t":"PV","d":"make someone feel very worried and tense","x":"Group projects always stress me out.","s":"stress OUT"},{"e":"burn the midnight oil","t":"ID","d":"stay up very late working or studying","x":"Jose burnt the midnight oil to finish her coding project.","s":"BURN the MIDnight OIL"},{"e":"recharge your batteries","t":"ID","d":"rest so that you get your energy back","x":"A weekend at the beach is the perfect way to recharge your batteries.","s":"reCHARGE your BATteries"},{"e":"a good night's sleep","t":"COL","d":"a long, deep sleep without waking up","x":"You'll feel much better after a good night's sleep.","s":"a GOOD night's SLEEP"},{"e":"take a break","t":"COL","d":"stop doing something for a short time to rest","x":"Let's take a break and have a snack.","s":"TAKE a BREAK"},{"e":"It's worth a try.","t":"PHR","d":"it might not work, but you should try it","x":"I'm not sure yoga will help, but it's worth a try.","s":"it's WORTH a TRY"}],"pron":{"focus":"Weak 'to', 'that' and 'if' in reported speech","explain":"In reported speech, we stress the reporting verb and the key information: he TOLD us to cut DOWN. Small words like 'to', 'that', 'if', 'us' and 'him' are weak and quick: 'to' sounds like /tə/ and 'that' like /ðət/.","tip":"Say only the stressed words first, like a text message. Then add the little words without slowing down.","lines":[{"t":"He told us to cut down on screen time.","m":"he TOLD‿us to cut DOWN‿on SCREEN time↘."},{"t":"I asked him if music was OK.","m":"I ASKED‿him‿if MUsic was‿OK↘."},{"t":"He said that studying late makes it harder to remember things.","m":"he SAID that STUDying LATE | makes‿it HARDer to reMEMber things↘."}]},"acts":[{"type":"ranking","task":"Exam week is coming! In groups, rank these habits from the most useful to the least useful for a teenager's body and mind. Then report your group's decision: We agreed that…, but one person said that…","items":["getting eight to ten hours of sleep","doing a 30-minute workout every day","a phone-free hour before bedtime","eating a balanced diet with less sugar","ten minutes of mindfulness or breathing exercises","a 20-minute nap after school","meeting friends at the weekend to switch off"]},{"type":"speed","motions":["Schools should collect students' phones at the start of every day.","Secondary school should start an hour later.","Naps are a waste of time.","Social media is bad for our mood.","Mindfulness should be a school subject.","Weekends should be completely homework-free."]},{"type":"roleplay","cards":[{"sit":"After a wellbeing talk","a":"You went to a talk by a sleep scientist, but your friend missed it. Tell them what she said, what she asked the audience and what she told everyone to do. Use: She said that… / She asked us if… / She told us (not) to…","b":"You missed the talk. Ask your friend questions: What did she say about naps? Did she mention phones? What did she recommend? React, and say whether you agree."},{"sit":"A message from the coach","a":"Your volleyball coach, Carolina, left this voice message for the team: 'Training is cancelled tomorrow. Please stretch at home and drink lots of water. Are you all coming to the match on Saturday?' Report it to your teammate.","b":"You're a teammate who didn't hear the message. Ask for details and check that you've understood: So she said that…? Did she ask if…?"},{"sit":"Worried about a friend","a":"Your friend looks tired and stressed. Ask about their sleep, screen time and exams, and give advice: Why don't you…? Have you tried…?","b":"You've been burning the midnight oil before your exams. Explain how you feel. Then report the advice your mum gave you yesterday: My mum told me to… / She asked me if…"}]}],"rec":{"prompt":"Record a voice note for a friend about a piece of wellbeing advice someone gave you (a parent, a coach, a teacher or a video). Report what they said and asked, and say whether you've tried it.","model":"So, last week my mum noticed that I was really stressed out about my exams. She asked me how many hours I was sleeping, and I admitted it was about six. She told me that I needed at least eight, and she recommended leaving my phone in the kitchen at night. At first I thought it was a terrible idea, but I tried it. Now I read for twenty minutes to wind down, and I feel much more awake in class. Honestly, it's worth a try!","use":["stressed out","wind down","It's worth a try."]},"tips":[{"who":"teacher","t":"In speed debating, give pairs 60 seconds per motion, then ask a few students to report their partner's best argument: My partner said that… / She argued that…"},{"who":"student","t":"Remember that 'tell' needs a person (He told me that…), but 'say' doesn't (He said that…). Don't forget to change the tense and the pronouns."}]},{"id":"galaxy-7-kid","lv":"galaxy","n":7,"age":"kid","title":"Talk Without Talking","goals":["describe gestures, facial expressions and body language","say how things are done using the passive","check that you've understood someone correctly"],"warm":["How do you show that you're happy without saying a word?","What gestures do you use with your friends or family?","Do you know any signs in sign language?","Have you ever had a funny misunderstanding with a friend? What happened?"],"model":{"kind":"dialogue","title":"The Mime Show","intro":"Leo and Kai are practising a mime act for the school talent show, where no words are allowed.","lines":[{"sp":"Kai","t":"Right, Leo, it's your turn. You have to [[act out]] an animal, and remember: no words!"},{"sp":"Leo","t":"Easy! Watch this."},{"sp":"Kai","t":"You're jumping up and down and scratching your head. [[Do you mean]] a monkey?"},{"sp":"Leo","t":"Yes! You [[worked it out]] in five seconds!"},{"sp":"Kai","t":"That's because your facial expression was so funny. I couldn't [[keep a straight face]]!"},{"sp":"Leo","t":"Now it's your turn. Ms Rojas says the winners will be chosen by the whole school, so we need to practise."},{"sp":"Kai","t":"OK. I'm going to [[raise my eyebrows]] and shrug. What am I saying?"},{"sp":"Leo","t":"That you don't know something?"},{"sp":"Kai","t":"Exactly! A shrug is understood in lots of countries."},{"sp":"Leo","t":"Isidora told me that in sign language, your face is used a lot too. It's part of the language!"},{"sp":"Kai","t":"Really? Could you show me the sign for friend?"},{"sp":"Leo","t":"Sure. Loo
