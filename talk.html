and found a little nest…","Yesterday our class visited the zoo, and a monkey took…","Last weekend, Grandma Ana and I walked in the forest. We heard a strange noise…","On our holiday in the desert, we didn't see any animals at first. Then…"]}],"rec":{"prompt":"Record yourself: tell a short story about a day when you saw some animals. Say where you went, what you saw and how you felt.","model":"Last summer I went to La Serena with my family. One day we went on a boat trip, and we saw penguins and two big dolphins! The penguins were on a small island. I took a lot of photos. I was very happy, but my little brother was scared of the waves. It was the best day of the holiday!","use":["go on a boat trip","take photos"]},"tips":[{"who":"teacher","t":"Before the story activity, write five irregular verbs on the board (went, saw, found, ran, took) and ask each group to use all of them in their story."},{"who":"student","t":"When you tell a story, use time words to help your listener: first, then, after that, in the end."}]},{"id":"planet-3-teen","lv":"planet","n":3,"age":"teen","title":"Into the Wild","goals":["describe animals, habitats and why some animals are in danger","tell a friend about a past trip in nature","apologise and respond to an apology naturally"],"warm":["What's the wildest place you know in Chile?","Did you see any interesting animals on your last holiday?","Which animals do you think are endangered?","What do you and your friends do to help the environment?"],"model":{"kind":"dialogue","title":"Back from Chiloé","intro":"Sam is back from a trip to the south of Chile with his host family, and he's chatting with Vale.","lines":[{"sp":"Vale","t":"Hey, Sam! You're back! [[How was your trip]] to Chiloé?"},{"sp":"Sam","t":"Amazing! We stayed in a cabin near the rainforest. It rained every single day!"},{"sp":"Vale","t":"Ha! Did you see any wild animals?"},{"sp":"Sam","t":"Yes! We [[went for a walk]] with a guide one evening, and we saw a pudú. It's a tiny deer."},{"sp":"Vale","t":"No way! Did you [[take photos]]?"},{"sp":"Sam","t":"Loads. On the last day I found a Darwin's frog. The guide said it's [[endangered]], so we didn't touch it."},{"sp":"Vale","t":"Wow. Why is it endangered?"},{"sp":"Sam","t":"People cut down a lot of trees, so the frogs lost their [[habitat]]."},{"sp":"Vale","t":"That's so sad. Oh, and [[sorry I didn't]] answer your messages. My phone broke."},{"sp":"Sam","t":"[[Don't worry about it]]. There wasn't any signal there anyway!"},{"sp":"Vale","t":"Can you send me the frog photo? I want to draw it for our science project."},{"sp":"Sam","t":"Sure! And next month, let's help Jose [[clean up]] the beach in Valparaíso."},{"sp":"Vale","t":"Deal!"}],"questions":[{"q":"What was the weather like in Chiloé?","opts":["Sunny and hot","Rainy every day","Cold and snowy"],"a":1},{"q":"Why didn't Sam touch the frog?","opts":["It's endangered","It was very fast","It was asleep"],"a":0},{"q":"Why didn't Vale answer Sam's messages?","opts":["She was angry with him","She was on a trip too","Her phone broke"],"a":2}]},"lang":[{"e":"How was your trip?","t":"PHR","d":"a question to ask someone about their journey or holiday","x":"How was your trip to the north? — Great, thanks!","s":"HOW was your TRIP"},{"e":"Sorry I didn't…","t":"PHR","d":"a way to apologise for something you forgot or failed to do","x":"Sorry I didn't call you yesterday.","s":"SOrry I DIDn't"},{"e":"Don't worry about it.","t":"PHR","d":"a relaxed answer when someone says sorry","x":"Sorry I'm late! — Don't worry about it.","s":"DON'T WORry about it"},{"e":"go for a walk","t":"COL","d":"walk somewhere for pleasure, not to get to a place","x":"We went for a walk along the beach after dinner.","s":"go for a WALK"},{"e":"take photos","t":"COL","d":"make pictures with a camera or a phone","x":"Sam takes photos of birds for his project.","s":"take PHOtos"},{"e":"clean up","t":"PV","d":"make a place tidy and take away the rubbish","x":"We cleaned up the park after the concert.","s":"clean UP"},{"e":"endangered","t":"VOC","d":"at risk of disappearing forever","x":"The huemul is an endangered deer from the south of Chile.","s":"enDANgered"},{"e":"habitat","t":"VOC","d":"the natural home of an animal or plant","x":"The rainforest is the habitat of many frogs.","s":"HAbitat"}],"pron":{"focus":"Did you…? in fast speech","explain":"In fast speech, did you sounds like one short word: /dɪdʒə/. The main verb is strong: Did you SEE…? Did you TAKE…? Yes/no questions go up at the end, and wh- questions go down.","tip":"Practise did you as one quick sound first, then add the verb and the rest of the question.","lines":[{"t":"Did you see any wild animals?","m":"did‿you SEE any WILD ANimals↗?"},{"t":"Did you take any photos?","m":"did‿you TAKE any PHOtos↗?"},{"t":"Where did you stay?","m":"WHERE did‿you STAY↘?"}]},"acts":[{"type":"taboo","cards":[{"w":"rainforest","taboo":["trees","rain","jungle"]},{"w":"desert","taboo":["sand","dry","hot"]},{"w":"ocean","taboo":["sea","water","salty"]},{"w":"endangered","taboo":["danger","disappear","few"]},{"w":"extinct","taboo":["dinosaur","dead","any more"]},{"w":"nest","taboo":["bird","home","eggs"]},{"w":"feathers","taboo":["bird","soft","fly"]},{"w":"migrate","taboo":["travel","winter","far"]},{"w":"fur","taboo":["hair","soft","cat"]},{"w":"habitat","taboo":["home","natural","live"]}]},{"type":"ranking","task":"Your class has money for ONE nature project. Rank these projects from most to least important and explain your top choice.","items":["Clean up plastic from beaches in the north","Protect forests in the south for Darwin's frogs","Build a centre for injured birds","Teach children about endangered animals","Plant trees in your city","Stop people from buying wild animals as pets"]},{"type":"roleplay","cards":[{"sit":"The broken camera","a":"You borrowed your friend's camera for a nature trip, but you dropped it in a river and it broke. Apologise, explain what happened and offer to help.","b":"Your friend borrowed your camera. Listen, ask questions (Where did it happen? What did you do?) and answer the apology."},{"sit":"Back from a school trip","a":"Last week you went on a school trip to a national park. Tell your friend what you saw and did. Use: We went… / We saw… / We didn't…","b":"You were ill and didn't go on the trip. Ask lots of questions: Did you see…? What was the weather like? Where did you sleep?"},{"sit":"Late for the beach clean-up","a":"You arrived an hour late for a beach clean-up. Apologise to the organiser and give a reason.","b":"You're the organiser. Accept the apology, then tell them what the group did and found this morning."}]}],"rec":{"prompt":"Record yourself telling a friend about a trip to a beach, forest, desert or park. Say what you saw, what you did and one problem for the animals there.","model":"Last summer I went to the Atacama Desert with my family. It was very hot and dry during the day. We went for a walk near a salt lake and saw hundreds of pink flamingos. I took photos of a little fox too. The guide said there wasn't much water for the animals there. I didn't know that. It was an amazing trip!","use":["go for a walk","take photos"]},"tips":[{"who":"teacher","t":"During Taboo, keep the score on the board and let students use gestures only after they've tried two clues in words."},{"who":"student","t":"When someone apologises, don't just say OK. Use Don't worry about it or It's fine, really, and smile!"}]},{"id":"planet-4-kid","lv":"planet","n":4,"age":"kid","title":"Grandma's Gadgets","goals":["talk about the gadgets people used to have","compare old and new technology","say what you enjoy doing online and offline"],"warm":["Which gadget do you use the most at home?","What did you use to play with when you were five?","How much screen time do you have on a school day?","Do your grandparents use a smartphone?"],"model":{"kind":"dialogue","title":"Grandma's Old Phone","intro":"Sofi finds a pink phone with a long cable in Grandma Ana's cupboard.","lines":[{"sp":"Sofi","t":"Grandma, what's this? It looks like a big, pink banana!"},{"sp":"Grandma Ana","t":"Ha! That's my old phone. [[I used to]] call my friends with it."},{"sp":"Sofi","t":"Where's the screen? How did you [[take a selfie]]?"},{"sp":"Grandma Ana","t":"There was no screen, Sofi! We didn't use to take selfies. We took photos with a camera."},{"sp":"Sofi","t":"[[Did you use to]] play games on it?"},{"sp":"Grandma Ana","t":"No, never. We used to play outside until dinner time."},{"sp":"Sofi","t":"Wow! And how did you [[go online]]?"},{"sp":"Grandma Ana","t":"We didn't have the internet at home. [[In the past]], life was very different."},{"sp":"Sofi","t":"I enjoy watching cartoons on my tablet. Can I show you?"},{"sp":"Grandma Ana","t":"Yes, please! But after that, let's [[turn off]] the tablet and go to the park with Pipo."}],"questions":[{"q":"What does Sofi find in the cupboard?","opts":["A new tablet","Grandma's old phone","A camera"],"a":1},{"q":"What did Grandma and her friends use to do?","opts":["Play outside until dinner time","Watch cartoons","Take selfies"],"a":0},{"q":"What does Grandma want to do at the end?","opts":["Watch more cartoons","Buy a new phone","Go to the park with Pipo"],"a":2}]},"lang":[{"e":"I used to…","t":"PHR","d":"you say this about something you often did in the past but don't do now","x":"I used to play with toy cars every day.","s":"i USED to"},{"e":"Did you use to…?","t":"PHR","d":"a question about what someone often did in the past","x":"Did you use to have a computer, Grandma?","s":"did you USE to"},{"e":"take a selfie","t":"COL","d":"take a photo of yourself with a phone","x":"Let's take a selfie with Pipo!","s":"take a SELfie"},{"e":"go online","t":"COL","d":"connect to the internet","x":"I go online to watch funny animal videos.","s":"go onLINE"},{"e":"charge your phone","t":"COL","d":"fill your phone with power again","x":"Don't forget to charge your phone tonight.","s":"CHARGE your PHONE"},{"e":"turn off","t":"PV","d":"stop a machine, a screen or a light from working","x":"Please turn off the TV before dinner.","s":"turn OFF"},{"e":"screen time","t":"VOC","d":"the hours you spend looking at phones, tablets or TV","x":"I have one hour of screen time after school.","s":"SCREEN time"},{"e":"in the past","t":"PREP","d":"at a time before now","x":"In the past, phones had long cables.","s":"in the PAST"}],"pron":{"focus":"used to sounds like YOOS-tuh","explain":"In used to, we don't say the d, and the two words join together: YOOS-tuh. Did you use to…? sounds the same. The s sounds like the s in bus, not like z.","tip":"Say YOOS-tuh five times quickly. Then add an idea: I used to… play outside!","lines":[{"t":"I used to have a big pink phone.","m":"i USED‿to have a BIG pink PHONE↘."},{"t":"Did you use to play outside?","m":"did you USE‿to play OUTside↗?"},{"t":"We didn't use to have the internet.","m":"we DIDn't USE‿to have the INternet↘."}]},"acts":[{"type":"findsomeone","items":[{"p":"used to have a favourite toy","q":"Did you use to have a favourite toy?"},{"p":"enjoys taking selfies","q":"Do you enjoy taking selfies?"},{"p":"has got a tablet at home","q":"Have you got a tablet at home?"},{"p":"used to watch cartoons every morning","q":"Did you use to watch cartoons every morning?"},{"p":"wants to learn to make computer games","q":"Do you want to learn to make computer games?"},{"p":"turns off the TV before bed","q":"Do you turn off the TV before bed?"},{"p":"has got a grandparent who uses a smartphone","q":"Does your grandma or grandpa use a smartphone?"},{"p":"has less than one hour of screen time on school days","q":"Do you have less than one hour of screen time on school days?"}],"follow":["Which one?","When did you stop?","Why?"]},{"type":"picture","prompts":["What can you see in the picture?","Which phone is older? How do you know?","What can you do with the smartphone that you can't do with the pink phone?","Who in your family used to have a phone like the pink one?","Which phone do you want to use for one day? Why?"]},{"type":"wyr","items":[["play a video game","play football in the park"],["have no TV for a week","have no sweets for a week"],["take a selfie with a lion","take a selfie with a famous footballer"],["use Grandma's old pink phone for a week","use a tablet with no games for a week"],["write a story on a keyboard","write a story with a pencil"],["have a robot that does your homework","have a robot that tidies your room"],["listen to music with headphones","listen to music with your whole family"]]}],"rec":{"prompt":"Tell us about a toy or gadget you used to love when you were little. What did you use to do with it? Do you still use it now?","model":"When I was five, I used to love my red toy car. It had a small battery and a light. I used to play with it every day after school, and I took it to Grandma's house at the weekend. Now I have one hour of screen time after school, and I enjoy playing games on my tablet. But I want to give my car to my little cousin.","use":["I used to…","screen time"]},"tips":[{"who":"teacher","t":"Bring an old object or a photo of one (a cassette, a camera, an old phone) and let the class guess what people used to do with it."},{"who":"student","t":"When you say used to, think YOOS-tuh. It's quick and soft, and you don't say the d."}]},{"id":"planet-4-teen","lv":"planet","n":4,"age":"teen","title":"The Screen-Time Shock","goals":["talk about habits you used to have and how they changed","discuss screen time and phone habits","give your opinion about old and new technology"],"warm":["How many hours a day do you spend on your phone?","Which app do you use the most?","What did you use to do after school when you were eight?","Could you live without your phone for a weekend?"],"model":{"kind":"dialogue","title":"On the Bus","intro":"Tomás and Jose are checking their screen time on the bus to school.","lines":[{"sp":"Jose","t":"Look at this! My [[screen time]] was five hours yesterday."},{"sp":"Tomás","t":"That's nothing. Mine was seven! [[I used to]] spend that time at the skate park."},{"sp":"Jose","t":"Really? So what happened?"},{"sp":"Tomás","t":"I started watching film reviews online, and now I always [[end up]] watching videos until midnight."},{"sp":"Jose","t":"[[Same here]]. I used to read before bed, but now I just scroll."},{"sp":"Tomás","t":"Maybe we need a challenge. No phones after nine o'clock?"},{"sp":"Jose","t":"Good idea. We can [[turn off notifications]] and leave our chargers in the kitchen."},{"sp":"Tomás","t":"My mum will love that. She hates it when I'm [[glued to my phone]]."},{"sp":"Jose","t":"And on Saturday, [[why don't we]] [[go offline]] all day? Volleyball, skateboarding, real life!"},{"sp":"Tomás","t":"Deal! But I'm keeping my phone in my bag for one thing: photos of my tricks."}],"questions":[{"q":"What was Tomás's screen time yesterday?","opts":["Five hours","Nine hours","Seven hours"],"a":2},{"q":"What did Jose use to do before bed?","opts":["Read","Play volleyball","Watch film reviews"],"a":0},{"q":"What do they plan to do on Saturday?","opts":["Watch films all day","Go offline all day","Buy new chargers"],"a":1}]},"lang":[{"e":"screen time","t":"VOC","d":"the hours you spend looking at a phone, tablet or computer","x":"My screen time always goes up at the weekend.","s":"SCREEN time"},{"e":"I used to…","t":"PHR","d":"you use this for a past habit that has stopped","x":"I used to read every night, but now I scroll.","s":"i USED to"},{"e":"end up","t":"PV","d":"finally do something that you didn't plan to do","x":"We always end up watching the same films.","s":"end UP"},{"e":"turn off notifications","t":"COL","d":"stop your phone from showing messages and alerts","x":"I turn off notifications when I do my homework.","s":"turn OFF notifiCAtions"},{"e":"go offline","t":"COL","d":"stop using the internet for a time","x":"Let's go offline for the whole weekend.","s":"go offLINE"},{"e":"be glued to your phone","t":"ID","d":"look at your phone all the time and not notice other things","x":"My brother is always glued to his phone at dinner.","s":"be GLUED to your PHONE"},{"e":"Same here.","t":"PHR","d":"a quick way to say that the same is true for you","x":"I'm so tired today. — Same here.","s":"SAME HERE"},{"e":"Why don't we…?","t":"PHR","d":"a friendly way to suggest doing something together","x":"Why don't we go to the beach on Saturday?","s":"why DON'T we"}],"pron":{"focus":"Linking in phrasal verbs","explain":"When a word ends in a consonant sound and the next word starts with a vowel sound, we join them: turn‿off, end‿up, plug‿it‿in. In phrasal verbs, the stress usually goes on the small word at the end: turn OFF, end UP.","tip":"Say the phrasal verb as one word first (tur-noff, en-dup). Then put it in a full sentence and say it fast.","lines":[{"t":"I always end up watching videos.","m":"i ALways end‿UP WATCHing VIdeos↘."},{"t":"Let's turn off notifications.","m":"let's turn‿OFF notifiCAtions↘."},{"t":"Plug it in and charge it.","m":"plug‿it‿IN and CHARGE‿it↘."}]},"acts":[{"type":"taboo","cards":[{"w":"charger","taboo":["phone","cable","battery"]},{"w":"password","taboo":["secret","word","account"]},{"w":"selfie","taboo":["photo","yourself","camera"]},{"w":"headphones","taboo":["ears","music","listen"]},{"w":"keyboard","taboo":["keys","type","computer"]},{"w":"laptop","taboo":["computer","carry","small"]},{"w":"download","taboo":["internet","copy","app"]},{"w":"screen time","taboo":["hours","phone","look"]},{"w":"floppy disk","taboo":["old","save","square"]},{"w":"app","taboo":["phone","program","download"]}]},{"type":"agree","items":["Teenagers spend too much time on their phones.","Phones should stay in our bags during lessons.","Life used to be better before smartphones.","Everybody should go offline for one day every week.","Taking selfies is a waste of time.","Old gadgets like cassettes and floppy disks are cool.","Video games can help you learn new things.","Parents spend too much time on their phones too."]},{"type":"roleplay","cards":[{"sit":"A parent and a teenager talk about screen time at the weekend.","a":"You are 14. You want two more hours of screen time on Saturdays. Explain why and promise something: I'd like to… because… / I promise to…","b":"You are the parent. You think your child is glued to the phone. Ask: How much…? What do you…? Say yes only if they promise to turn off the phone at dinner."},{"sit":"Two friends talk about a phone problem.","a":"Your phone battery is always dead by lunchtime. You want a new phone, but you have only 150,000 pesos. Ask your friend for advice.","b":"You know a lot about phones. Ask: What do you use your phone for? How many apps have you got? Suggest a new battery or turning off some apps, not a new phone."},{"sit":"An interview for the school blog.","a":"You are a reporter. Ask a grandparent about technology when they were young: Did you use to…? What did you use to…? How did you…?","b":"You are a grandparent. Answer with used to and didn't use to: no mobile phones, one phone in the hall, music on cassettes, letters by post."}]}],"rec":{"prompt":"Record a short message for the school blog. How did your tech habits change? What did you use to do, and what do you do now? Is it better or worse?","model":"When I was ten, I didn't use to have a phone. I used to play volleyball in the street with my neighbours and read comics in bed. Now I'm glued to my phone, and my screen time is about four hours a day. I enjoy chatting with friends online, but I want to change one thing: no phone after ten o'clock. Why don't we all try it?","use":["I used to…","be glued to your phone","Why don't we…?"]},"tips":[{"who":"teacher","t":"If your school allows phones, let students check their real screen time before the agree or disagree activity. The numbers start great conversations."},{"who":"student","t":"For the past, say I used to. In questions and negatives, write use to without d: Did you use to…? I didn't use to…"}]},{"id":"planet-5-kid","lv":"planet","n":5,"age":"kid","title":"The Messy Room","goals":["describe your bedroom and your dream room","talk about house rules with must, mustn't and have to","give a friend advice about a messy room"],"warm":["What can you see from your bedroom window?","What is your favourite thing in your room?","Do you have to make your bed every morning?","Who tidies your room: you or someone in your family?"],"model":{"kind":"dialogue","title":"Where's the Floor?","intro":"Martina comes to Leo's house, but his bedroom is a big mess.","lines":[{"sp":"Martina","t":"Wow, Leo! Your room is a mess! Where's the floor?"},{"sp":"Leo","t":"Under my football clothes, I think. Mum says [[I have to]] tidy it before dinner."},{"sp":"Martina","t":"[[Why don't you]] start with the clothes? Hang them in the [[wardrobe]]."},{"sp":"Leo","t":"Good idea. Can you [[pick up]] those books, please? They go in the bookcase."},{"sp":"Martina","t":"Sure. Is this the lamp that changes colour?"},{"sp":"Leo","t":"Yes! It's the present that Grandma Ana gave me. Be careful. [[You mustn't]] drop it!"},{"sp":"Martina","t":"Don't worry. Do you have to [[make your bed]] every day?"},{"sp":"Leo","t":"Yes, every morning. And on Sundays I have to [[do the washing-up]] too."},{"sp":"Martina","t":"Look! Your room is [[tidy]] now. What's under the bed?"},{"sp":"Leo","t":"Oh no… it's Pipo! He's sleeping on my old socks!"}],"questions":[{"q":"When does Leo have to tidy his room?","opts":["Before school","Before dinner","On Sunday"],"a":1},{"q":"Who gave Leo the lamp?","opts":["Grandma Ana","Martina","His dad"],"a":0},{"q":"What does Leo have to do on Sundays?","opts":["Make dinner","Walk Pipo","Do the washing-up"],"a":2}]},"lang":[{"e":"I have to…","t":"PHR","d":"you say this about something that is necessary for you","x":"I have to feed the cat every morning.","s":"i HAVE to"},{"e":"You mustn't…","t":"PHR","d":"you say this when something is not allowed","x":"You mustn't jump on the sofa.","s":"you MUSTn't"},{"e":"Why don't you…?","t":"PHR","d":"a friendly way to give someone an idea","x":"Why don't you put your books on the shelf?","s":"why DON'T you"},{"e":"make your bed","t":"COL","d":"put the sheets and covers straight after you get up","x":"I make my bed before breakfast.","s":"MAKE your BED"},{"e":"do the washing-up","t":"COL","d":"clean the plates, cups and forks after a meal","x":"My dad and I do the washing-up after dinner.","s":"do the WASHing-up"},{"e":"pick up","t":"PV","d":"take something from the floor with your hand","x":"Please pick up your toys.","s":"pick UP"},{"e":"wardrobe","t":"VOC","d":"a tall cupboard where you hang your clothes","x":"My school uniform is in the wardrobe.","s":"WARDrobe"},{"e":"tidy","t":"VOC","d":"neat, with everything in the right place","x":"My sister's room is always tidy.","s":"TIdy"}],"pron":{"focus":"Strong words in rules: mustn't and have to","explain":"When we say a rule, the important words are strong: MUSTn't, HAVE to, DON'T have to. In mustn't, we don't say the first t: MUSS-nt. Have to sounds like HAF-tuh.","tip":"Say each rule like a strict teacher, then like a kind grandma. Keep the strong words strong!","lines":[{"t":"You mustn't jump on the sofa.","m":"you MUSTn't JUMP‿on the SOfa↘."},{"t":"I have to make my bed.","m":"i HAVE‿to MAKE my BED↘."},{"t":"You don't have to get up early.","m":"you DON'T HAVE‿to get‿UP EARly↘."}]},"acts":[{"type":"guess","cat":"Things at home","items":["wardrobe","bookcase","cushion","lamp","mirror","carpet","fridge","curtains","sofa","attic"],"frames":["Is it a thing that…?","Is it in the kitchen?","Can you sit on it?","Is it a place where…?"]},{"type":"picture","prompts":["What can you see in this bedroom?","Is this room tidy or messy? How do you know?","What is the thing that you like best in this room?","How is this room different from your bedroom?","What do you think the person who sleeps here likes?"]},{"type":"ranking","task":"Which jobs at home are the most boring? Put them in order from 1 (the most boring) to 7 (the least boring). Then compare with a partner: I think… is more boring than… because…","items":["make your bed","do the washing-up","tidy your room","take out the rubbish","feed the pet","hang up your clothes","lay the table"]}],"rec":{"prompt":"Describe your dream bedroom. What is in it? What are the rules in your dream room?","model":"My dream room is in the attic. It's the room where I can paint and play with my dog. There's a big bookcase that is full of comics, and a lamp that changes colour. There are soft cushions on the floor. In my dream room, you mustn't shout, and you don't have to make your bed!","use":["You mustn't…","make your bed"]},"tips":[{"who":"teacher","t":"In the guessing game, ask students to give a clue with which, that or where first: It's a thing which keeps food cold. Then the class can ask yes/no questions."},{"who":"student","t":"Use who for people, which or that for things, and where for places."}]},{"id":"planet-5-teen","lv":"planet","n":5,"age":"teen","title":"Room Tour","goals":["give a room tour using who, which, that and where","talk about rules at home and say if they are fair","give a friend advice about a new look for a room"],"warm":["What is one thing you want to change in your bedroom?","Where do you usually study at home?","What jobs do you have to do at home?","Which house rule do you think is unfair?"],"model":{"kind":"dialogue","title":"Lights, Camera, Bedroom!","intro":"Vale is filming a room tour for her art account, and Sam is helping her.","lines":[{"sp":"Sam","t":"Ready? Three, two, one… action!"},{"sp":"Vale","t":"Hi, everyone! Welcome to my room. Last month, my friends helped me [[give it a makeover]]."},{"sp":"Sam","t":"Show them the wall, Vale!"},{"sp":"Vale","t":"OK! We [[put up]] these posters, and this is a drawing that I did in art class."},{"sp":"Sam","t":"And tell them about the lamp."},{"sp":"Vale","t":"This is the lamp which Tomás found at a market. It changes colour!"},{"sp":"Sam","t":"What about the rules? Can you paint the walls?"},{"sp":"Vale","t":"No, [[I'm not allowed to]]. My mum says I mustn't paint them, but I can choose the curtains."},{"sp":"Sam","t":"And do you have to [[make your bed]] every day?"},{"sp":"Vale","t":"Yes, I do. And I have to [[tidy up]] before I film. That's why it looks so good today!"},{"sp":"Sam","t":"Any advice for people who want a new room?"},{"sp":"Vale","t":"Start small. [[Why don't you]] change your cushions or move your desk? [[It's up to you]]!"}],"questions":[{"q":"Who found the lamp?","opts":["Sam","Tomás","Vale's mum"],"a":1},{"q":"What is Vale not allowed to do?","opts":["Paint the walls","Choose the curtains","Put up posters"],"a":0},{"q":"What advice does Vale give?","opts":["Buy a new bed","Paint everything at once","Start small with cushions or your desk"],"a":2}]},"lang":[{"e":"give your room a makeover","t":"COL","d":"change a room so it looks new and better","x":"We gave my room a makeover last summer.","s":"GIVE your ROOM a MAKEover"},{"e":"put up","t":"PV","d":"fix something on a wall so people can see it","x":"I put up some posters above my bed.","s":"put UP"},{"e":"tidy up","t":"PV","d":"put everything back in the right place","x":"I have to tidy up before my friends come.","s":"tidy UP"},{"e":"make your bed","t":"COL","d":"straighten the sheets and covers after you get up","x":"I never make my bed on Saturdays.","s":"MAKE your BED"},{"e":"do the washing-up","t":"COL","d":"wash the plates and glasses after a meal","x":"My brother and I take turns to do the washing-up.","s":"do the WASHing-up"},{"e":"I'm not allowed to…","t":"PHR","d":"you say this about something your parents or school say you mustn't do","x":"I'm not allowed to eat in my bedroom.","s":"i'm NOT alLOWED to"},{"e":"It's up to you.","t":"PHR","d":"you say this when the other person can decide","x":"Blue or green curtains? It's up to you.","s":"it's UP to YOU"},{"e":"Why don't you…?","t":"PHR","d":"a friendly way to give someone advice","x":"Why don't you move your desk near the window?","s":"why DON'T you"}],"pron":{"focus":"Relative clauses: say them in one breath","explain":"When you describe something with who, which, that or where, say the whole idea as one group of words. Don't stop before that or who. The word that is weak and quick (it sounds like thut), and the stress goes on the important words.","tip":"Move your hand in one smooth line from the start to the end of the sentence. No stops!","lines":[{"t":"This is the lamp that Tomás found.","m":"this‿is the LAMP that toMÁS FOUND↘."},{"t":"She's the girl who painted it.","m":"she's the GIRL who PAINTed‿it↘."},{"t":"This is the place where I draw.","m":"this‿is the PLACE where i DRAW↘."}]},"acts":[{"type":"findsomeone","items":[{"p":"has to make their bed every morning","q":"Do you have to make your bed every morning?"},{"p":"isn't allowed to eat in their bedroom","q":"Are you allowed to eat in your bedroom?"},{"p":"does the washing-up after dinner","q":"Do you do the washing-up after dinner?"},{"p":"has got posters on their bedroom wall","q":"Have you got posters on your bedroom wall?"},{"p":"shares a bedroom with a brother or sister","q":"Do you share a bedroom with a brother or sister?"},{"p":"doesn't have to do any jobs at the weekend","q":"Do you have to do any jobs at the weekend?"},{"p":"has a special place where they study","q":"Is there a special place at home where you study?"},{"p":"wants to give their room a makeover","q":"Do you want to give your room a makeover?"}],"follow":["Who decides that?","Is that fair?","What does it look like?"]},{"type":"picture","prompts":["Give a short room tour of this bedroom: This is the bed where… / These are the posters that…","What kind of person do you think lives here? Why?","What three things do you want to change in this room?","Is this room similar to yours? How is it different?","What rules do you think the person who lives here has to follow?"]},{"type":"roleplay","cards":[{"sit":"A teenager wants to change their bedroom.","a":"You want to paint your bedroom walls dark purple and put up lots of posters. Ask your parent: Can I…? I promise to… I'll pay for…","b":"You are the parent. You think dark purple is a bad idea. Say what they mustn't do and what they have to do. Then find an idea that you both like."},{"sit":"Two brothers or sisters share a bedroom.","a":"You are the older one. Your younger brother or sister never tidies up. Explain the problem and suggest three new rules: You have to… You mustn't…","b":"You are the younger one. You think the rules are unfair. Say what you don't want to do and suggest your own rules."},{"sit":"Your friends are coming in one hour, and your room is a mess.","a":"Describe the mess to your friend: clothes on the floor, plates on the desk, an unmade bed. Ask for help.","b":"Give advice: First, you have to… Why don't you…? You should… You don't have to…"}]}],"rec":{"prompt":"Give a short tour of your bedroom (real or dream). Use who, which, that and where, and say one rule you have to follow.","model":"Welcome to my room! This is the desk where I do my homework and draw. Those are the posters that I put up last year. They show my favourite bands. This cushion is a present from my cousin, who lives in Concepción. The rules? I have to tidy up every Sunday, and I'm not allowed to eat in here.","use":["put up","tidy up","I'm not allowed to…"]},"tips":[{"who":"teacher","t":"Before the role-play, give students two minutes to draw a quick plan of their dream room. It gives them lots of things to talk about in the room tour."},{"who":"student","t":"Don't worry about perfect grammar in your room tour. Keep talking and use This is the… where / that…"}]},{"id":"planet-6-kid","lv":"planet","n":6,"age":"kid","title":"At the School Nurse","goals":["say what is wrong when you feel ill","tell a short story about an accident with was or were + -ing","give simple advice to a friend who is ill"],"warm":["How do you feel today?","What do you do when you have a cold?","How much water do you drink every day?","What healthy food do you like?"],"model":{"kind":"dialogue","title":"Football in the Rain","intro":"Benja feels ill at school, so he goes to see the school nurse.","lines":[{"sp":"Nurse","t":"Hello, Benja. Come in. [[What's the matter]]?"},{"sp":"Benja","t":"[[I don't feel well]]. I've got a [[headache]] and a [[sore throat]]."},{"sp":"Nurse","t":"Oh dear. What were you doing yesterday?"},{"sp":"Benja","t":"I was playing football in the rain, and I [[fell over]] in the mud. I got really wet!"},{"sp":"Nurse","t":"I see. Let me [[take your temperature]]… Hmm, it's a bit high."},{"sp":"Benja","t":"And I was sneezing all morning in maths!"},{"sp":"Nurse","t":"How much water did you drink today?"},{"sp":"Benja","t":"Not much. Only half a glass."},{"sp":"Nurse","t":"[[You should]] drink a lot of water and rest. I'm calling your mum now."},{"sp":"Benja","t":"Can I play football on Saturday?"},{"sp":"Nurse","t":"Not this week, sorry. You have to [[stay in bed]] for two days. Then you'll feel much better."},{"sp":"Benja","t":"OK. And no more football in the rain!"}],"questions":[{"q":"What's wrong with Benja?","opts":["He's got a stomach ache","He's got a headache and a sore throat","He hurt his arm"],"a":1},{"q":"What was Benja doing yesterday?","opts":["Playing football in the rain","Swimming in the sea","Sleeping all day"],"a":0},{"q":"What does the nurse say Benja should do?","opts":["Play football on Saturday","Go back to his maths lesson","Drink a lot of water and rest"],"a":2}]},"lang":[{"e":"What's the matter?","t":"PHR","d":"a kind question to ask someone what is wrong","x":"You look sad. What's the matter?","s":"what's the MATter"},{"e":"I don't feel well.","t":"PHR","d":"you say this when you feel a bit ill","x":"I don't feel well. Can I sit down?","s":"i DON'T feel WELL"},{"e":"You should…","t":"PHR","d":"you use this to give someone advice","x":"You should go to bed early tonight.","s":"you SHOULD"},{"e":"headache","t":"VOC","d":"a pain inside your head","x":"Loud music gives me a headache.","s":"HEADache"},{"e":"sore throat","t":"VOC","d":"a pain in your neck when you swallow or talk","x":"I can't sing today. I've got a sore throat.","s":"sore THROAT"},{"e":"take your temperature","t":"COL","d":"check how hot your body is","x":"The nurse took my temperature.","s":"TAKE your TEMperature"},{"e":"stay in bed","t":"COL","d":"not get up because you are ill or tired","x":"I had a cold, so I stayed in bed all day.","s":"stay in BED"},{"e":"fall over","t":"PV","d":"fall to the ground when you are walking or running","x":"Leo fell over in the playground.","s":"fall Over"}],"pron":{"focus":"Quick, soft was and were","explain":"In past continuous sentences, was and were are usually quick and soft (wuz, wuh). The strong words are the action and the important information: I was PLAYing FOOTball.","tip":"Tap the table on the strong words only. Say was and were very quickly.","lines":[{"t":"I was playing football.","m":"i was PLAYing FOOTball↘."},{"t":"What were you doing?","m":"WHAT were you DOing↘?"},{"t":"You should drink a lot of water.","m":"you should DRINK‿a LOT‿of WAter↘."}]},"acts":[{"type":"guess","cat":"What's the matter?","items":["headache","cold","sore throat","stomach ache","temperature","cough","runny nose","toothache","earache","cut finger"],"frames":["Have you got a…?","Does your… hurt?","Do you need a plaster or some medicine?"]},{"type":"story","starters":["I was riding my bike in the park when…","We were having a picnic on the beach when suddenly…","While Pipo was sleeping on the sofa, …","Ms Rojas was reading us a story when…","It was raining, and I was walking home from school when…"]},{"type":"roleplay","cards":[{"sit":"At the doctor's","a":"You are ill. Choose a problem: a cold, a stomach ache or a headache. Tell the doctor how you feel and what you were doing when it started: I was… when…","b":"You are the doctor. Ask: What's the matter? What were you doing when it started? How much water do you drink? Then give advice: You should…"},{"sit":"In the playground","a":"You fell over and hurt your knee. Tell your friend what happened: I was running when…","b":"You are a friend. Ask questions and help: Does it hurt? Have you got a plaster? Let's tell the teacher."}]}],"rec":{"prompt":"Tell a story about a time you were ill or hurt. What were you doing when it happened? What did you do to get better?","model":"Last winter, I was playing in the garden with my brother when I started to sneeze. The next day, I had a terrible cold and a sore throat. I didn't go to school. My mum gave me hot soup and some medicine, and I stayed in bed for three days. I drank a lot of water. Now I always wear a jacket in winter!","use":["sore throat","stay in bed"]},"tips":[{"who":"teacher","t":"In the guessing game, let students mime the problem first (holding their head, coughing). It's fun, and it helps shy students to start."},{"who":"student","t":"Remember: was for I, he, she and it; were for you, we and they."}]},{"id":"planet-6-teen","lv":"planet","n":6,"age":"teen","title":"Skate Park Accident","goals":["describe health problems and sports injuries","tell the story of an accident with the past continuous","give and discuss advice for a healthy lifestyle"],"warm":["What do you do to stay healthy?","Have you ever had a sports injury?","How many hours do you sleep on a school night?","What's the best thing to eat before a match or a test?"],"model":{"kind":"dialogue","title":"What Happened to Your Arm?","intro":"Tomás comes to school with a bandage on his arm, and Vale asks him what happened.","lines":[{"sp":"Vale","t":"Tomás! What happened to your arm?"},{"sp":"Tomás","t":"Don't laugh. I was practising a new trick at the skate park, and I [[fell off]] my board."},{"sp":"Vale","t":"Ouch! [[Does it hurt]]?"},{"sp":"Tomás","t":"A bit. I [[hurt my wrist]], but it isn't broken. Luckily, I was wearing a helmet."},{"sp":"Vale","t":"[[Poor you]]! What was Sam doing? Was he with you?"},{"sp":"Tomás","t":"Yes. While I was lying on the ground, he was filming everything!"},{"sp":"Vale","t":"Typical Sam! What did the doctor say?"},{"sp":"Tomás","t":"I have to [[take it easy]] for two weeks. No skating and no PE."},{"sp":"Vale","t":"You should [[get some rest]] and [[drink plenty of water]]. And how many hours do you sleep?"},{"sp":"Tomás","t":"Not many. I was watching skate videos until two o'clock last night."},{"sp":"Vale","t":"Well, there's your problem! Go to bed early tonight."},{"sp":"Tomás","t":"OK, Doctor Vale. Thanks!"},{"sp":"Vale","t":"[[Get well soon]]!"}],"questions":[{"q":"How did Tomás hurt his wrist?","opts":["He fell off his skateboard","He was playing volleyball","He fell down the stairs"],"a":0},{"q":"What was Sam doing while Tomás was lying on the ground?","opts":["Calling the doctor","Filming everything","Practising a trick"],"a":1},{"q":"What was Tomás doing until two o'clock last night?","opts":["Doing his homework","Skating in the park","Watching skate videos"],"a":2}]},"lang":[{"e":"fall off","t":"PV","d":"drop to the ground from something like a bike, a horse or a board","x":"I fell off my bike when I was eight.","s":"fall OFF"},{"e":"take it easy","t":"ID","d":"relax and don't do too much","x":"The doctor told me to take it easy this week.","s":"take it EAsy"},{"e":"hurt your wrist","t":"COL","d":"get an injury in the part between your hand and your arm","x":"She hurt her wrist in the volleyball final.","s":"HURT your WRIST"},{"e":"get some rest","t":"COL","d":"relax or sleep so your body can get better","x":"You look tired. Go home and get some rest.","s":"get some REST"},{"e":"drink plenty of water","t":"COL","d":"drink a lot of water, more than usual","x":"On hot days you should drink plenty of water.","s":"DRINK PLENty of WAter"},{"e":"Poor you!","t":"PHR","d":"a kind thing to say when something bad happens to a friend","x":"You've got a cold? Poor you!","s":"POOR YOU"},{"e":"Get well soon!","t":"PHR","d":"you say or write this to someone who is ill or hurt","x":"We made Tomás a card that said Get well soon!","s":"get WELL SOON"},{"e":"Does it hurt?","t":"PHR","d":"a question to find out if something is painful","x":"Your knee looks red. Does it hurt?","s":"does it HURT"}],"pron":{"focus":"Weak was and were, strong short answers","explain":"In the past continuous, was and were are normally weak and quick (wuz, wuh). But in short answers and negatives they are strong: Yes, I WAS. No, they WEREN'T.","tip":"Tell it like a story: weak was, strong verb. Then answer a friend with a strong short answer: Yes, I WAS!","lines":[{"t":"I was practising a new trick.","m":"i was PRACtising a NEW TRICK↘."},{"t":"What were you doing at nine?","m":"WHAT were you DOing at NINE↘?"},{"t":"Were you wearing a helmet? Yes, I was.","m":"were you WEARing a HELmet↗? | YES, i WAS↘."}]},"acts":[{"type":"fluency","topics":["A time you were ill or hurt: what were you doing when it happened?","Your perfect healthy day: food, sport and sleep","The best way to stay calm before an exam","A sport you love and how you stay safe when you do it","Advice for a friend who is always tired"],"mins":[3,2,1]},{"type":"ranking","task":"You are making a Healthy Teens poster for your school. Put these tips in order from the most important to the least important, and explain why.","items":["Sleep eight to ten hours a night","Drink plenty of water","Do sport three times a week","Eat fruit and vegetables every day","Don't use your phone after ten o'clock","Spend time with friends offline","Have a good breakfast"]},{"type":"picture","prompts":["Describe the two girls. What are they wearing, and what are they doing?","What do you think they were doing before this photo? How do you know?","Why is it important to drink water when you do sport? How much water do you drink?","What were you doing the last time you felt really tired after sport?","Invent a caption for this photo for the school sports team's account and say it to your partner."]}],"rec":{"prompt":"Tell the story of an accident or an illness you had (or invent one). What were you doing when it happened? What advice did you get?","model":"Two years ago, I was playing volleyball on the beach in Viña when I fell and hurt my ankle. While my friends were helping me, a lifeguard came and put some ice on it. The doctor told me to take it easy and rest for a week. It was boring, but I watched lots of films and drank plenty of water. Now I always warm up before I play.","use":["take it easy","drink plenty of water"]},"tips":[{"who":"teacher","t":"In the fluency activity, students tell the same story three times to three partners in 3, 2 and 1 minutes. Tell them to keep the details but speak faster each time."},{"who":"student","t":"Use while for the long action and when for the short one: While I was running, I fell. I was running when I fell."}]},{"id":"planet-7-kid","lv":"planet","n":7,"age":"kid","title":"Pocket Money Plans","goals":["compare prices and say which things are cheaper or more expensive","ask for prices and sizes in a shop","talk about your plans for your pocket money"],"warm":["Do you get pocket money? What do you do with it?","What's your favourite shop in your town? Why?","Do you like going to the shopping centre with your family?","What is the best thing you bought with your own money?"],"model":{"kind":"dialogue","title":"At the Sports Shop","intro":"Kai wants a new table tennis bat, so she goes to the sports shop with her cousin Leo.","lines":[{"sp":"Assistant","t":"Hello! Can I help you?"},{"sp":"Kai","t":"Yes, please. [[How much is]] this red bat?"},{"sp":"Assistant","t":"It's 12,000 pesos. It's the best bat in the shop."},{"sp":"Kai","t":"Oh no, that's too expensive! I've only got 8,000 pesos of [[pocket money]]."},{"sp":"Leo","t":"Look, Kai! This blue bat is [[on sale]]. It's much cheaper."},{"sp":"Assistant","t":"Yes, it's only 5,500 pesos today. And it's lighter than the red one."},{"sp":"Kai","t":"Great, I'll take it! Here's 6,000 pesos. Leo, what are you looking at?"},{"sp":"Leo","t":"These football boots! Can I [[try on]] a pair, please?"},{"sp":"Assistant","t":"Of course. What size are you?"},{"sp":"Leo","t":"Size 36. Oh, they're [[the right size]], and they're really comfortable!"},{"sp":"Kai","t":"Leo! You can't buy boots today. You're [[saving up for]] a new bike!"},{"sp":"Leo","t":"Oh yes, you're right. I'm going to buy my bike next month."},{"sp":"Assistant","t":"No problem! Here's your bat, Kai, and [[here's your change]]."}],"questions":[{"q":"Why doesn't Kai buy the red bat?","opts":["It's too expensive","It's too heavy","She doesn't like red"],"a":0},{"q":"How much is the blue bat today?","opts":["12,000 pesos","5,500 pesos","8,000 pesos"],"a":1},{"q":"Why can't Leo buy the football boots today?","opts":["They're too small","The shop is closing","He's saving up for a bike"],"a":2}]},"lang":[{"e":"pocket money","t":"VOC","d":"money your parents give you every week","x":"I get 3,000 pesos of pocket money every week.","s":"POCKet MONey"},{"e":"on sale","t":"PREP","d":"cheaper than usual for a short time","x":"These trainers are on sale this week.","s":"on SALE"},{"e":"the right size","t":"COL","d":"not too big and not too small for you","x":"Are these jeans the right size?","s":"the RIGHT SIZE"},{"e":"go shopping","t":"COL","d":"go to the shops to buy things","x":"We go shopping with Mum on Saturday mornings.","s":"go SHOPping"},{"e":"try on","t":"PV","d":"put on clothes or shoes in a shop to see if they fit","x":"Can I try on this jacket, please?","s":"try ON"},{"e":"save up for","t":"PV","d":"keep your money so you can buy something later","x":"I'm saving up for a new skateboard.","s":"save UP for"},{"e":"How much is it?","t":"PHR","d":"a question to ask the price of something","x":"I like this cap. How much is it?","s":"how MUCH is it"},{"e":"Here's your change.","t":"PHR","d":"what a shop assistant says when they give you money back","x":"That's 4,000 pesos, please. Thank you. Here's your change.","s":"HERE'S your CHANGE"}],"pron":{"focus":"Weak 'than' in comparisons","explain":"When we compare things, 'than' is weak and very quick. The strong words are the comparative and the thing we compare: CHEAPer than the RED one.","tip":"Tap the table on the strong words. Say 'than' fast and soft.","lines":[{"t":"It's cheaper than the red one.","m":"it's CHEAPer than the RED one↘."},{"t":"How much is it?","m":"how MUCH‿is it↘?"},{"t":"Can I try them on, please?","m":"can I TRY them‿ON | PLEASE↗?"}]},"acts":[{"type":"findsomeone","items":[{"p":"gets pocket money every week","q":"Do you get pocket money every week?"},{"p":"is saving up for something special","q":"Are you saving up for something special?"},{"p":"likes going to the shopping centre","q":"Do you like going to the shopping centre?"},{"p":"is going to buy a present this month","q":"Are you going to buy a present this month?"},{"p":"has got a favourite bookshop","q":"Have you got a favourite bookshop?"},{"p":"thinks shopping is boring","q":"Do you think shopping is boring?"},{"p":"is better at saving money than their brother or sister","q":"Are you better at saving money than your brother or sister?"},{"p":"buys bread at a bakery near their house","q":"Do you buy bread at a bakery near your house?"}],"follow":["Why?","What do you buy there?","When are you going to buy it?"]},{"type":"picture","prompts":["Where are the boy and his mum? What are they doing?","What clothes can you see on the rack?","Do you think the boy is going to try something on? What?","Who chooses your clothes: you or your family?","Which is more fun: shopping for clothes or shopping for toys? Why?"]},{"type":"roleplay","cards":[{"sit":"At the bookshop","a":"You are the customer. You've got 5,000 pesos. Ask: How much is this comic? How much is this animal book? Which one is cheaper? Buy one.","b":"You are the shop assistant. The comic costs 4,000 pesos and the animal book costs 7,000 pesos. Say: The comic is cheaper. Then give the customer the receipt and the change."},{"sit":"At the clothes shop","a":"You are the customer. You need a T-shirt for a birthday party on Saturday. Ask: Can I try it on? Have you got a bigger size?","b":"You are the shop assistant. You've got T-shirts in small, medium and large. Say: Sure! The changing rooms are over there. Here's a bigger size."},{"sit":"At the bakery","a":"You are the customer. You're having a picnic with your family tomorrow. Buy some bread and a cake. Ask: How much is it? Which cake is the best?","b":"You are the baker. The bread costs 1,500 pesos. The chocolate cake costs 6,000 pesos, and the lemon cake is cheaper: 4,500 pesos. Say which cake you think is the best."}]}],"rec":{"prompt":"Record yourself: what are you going to do with your pocket money? Compare two things you want and say which one is better.","model":"I get 3,000 pesos of pocket money every week. I'm saving up for a new football. The football at the sports shop is cheaper than the one at the shopping centre, but the one at the shopping centre is better. I'm going to buy it next month. Then I'm going to try on some football boots too!","use":["pocket money","save up for","try on"]},"tips":[{"who":"teacher","t":"Before the role-play, write some prices on the board and practise big numbers (3,000 = three thousand pesos). Students swap roles after each card."},{"who":"student","t":"Short adjectives take -er (cheap → cheaper, big → bigger). Long adjectives take more (more expensive). Don't forget than!"}]},{"id":"planet-7-teen","lv":"planet","n":7,"age":"teen","title":"Bargain Hunters","goals":["compare prices, shops and products","ask for help, sizes and prices in a shop","talk about how you spend and save money"],"warm":["What do you usually spend your money on?","Do you prefer shopping online or in real shops? Why?","What's the best shop in your town for teenagers?","Are you saving up for something at the moment?"],"model":{"kind":"dialogue","title":"Saturday at the Shopping Centre","intro":"Sam is from Sydney, and he needs a warm jacket for his first winter in Chile, so Vale goes shopping with him.","lines":[{"sp":"Assistant","t":"Hi! Can I help you?"},{"sp":"Sam","t":"[[I'm just looking, thanks]]. Well, actually, I need a warm jacket."},{"sp":"Vale","t":"What about this black one? It looks really warm."},{"sp":"Sam","t":"It's nice, but it's 80,000 pesos! It [[costs an arm and a leg]]."},{"sp":"Vale","t":"OK, this green one is much cheaper. It's on sale for 35,000."},{"sp":"Sam","t":"What a [[bargain]]! Can I [[try it on]]?"},{"sp":"Assistant","t":"Sure. The changing rooms are over there."},{"sp":"Sam","t":"Hmm, it's a bit small. [[Do you have this in a bigger size]]?"},{"sp":"Assistant","t":"Yes, here's a large. It's the last one!"},{"sp":"Sam","t":"Perfect! It's much warmer than my old jacket. That's [[a good deal]]."},{"sp":"Vale","t":"Great! So, how much money have you got left?"},{"sp":"Sam","t":"About 15,000. I'm [[saving up for]] a new camera, so I'm not going to [[spend money on]] anything else today."},{"sp":"Vale","t":"Good plan. Come on, we're meeting Tomás at the bakery at four!"}],"questions":[{"q":"Why doesn't Sam buy the black jacket?","opts":["It's too small","It's too expensive","He doesn't like black"],"a":1},{"q":"What's the problem with the first green jacket?","opts":["It's a bit small","It isn't warm","It isn't on sale"],"a":0},{"q":"Why isn't Sam going to spend more money today?","opts":["The shops are closing","Vale wants to go home","He's saving up for a camera"],"a":2}]},"lang":[{"e":"I'm just looking, thanks.","t":"PHR","d":"a polite answer when a shop assistant offers help and you don't need it yet","x":"Can I help you? — No, I'm just looking, thanks.","s":"I'm JUST LOOKing THANKS"},{"e":"Do you have this in a bigger size?","t":"PHR","d":"a question to ask for the same item but larger","x":"These jeans are too tight. Do you have them in a bigger size?","s":"do you HAVE this in a BIGger SIZE"},{"e":"a good deal","t":"COL","d":"a price that is good for the person who buys","x":"Two T-shirts for 10,000 pesos is a good deal.","s":"a GOOD DEAL"},{"e":"spend money on","t":"COL","d":"use your money to buy something","x":"I spend most of my money on music and snacks.","s":"SPEND MONey on"},{"e":"try on","t":"PV","d":"put on clothes in a shop to see if they fit","x":"I always try on jeans before I buy them.","s":"try ON"},{"e":"save up for","t":"PV","d":"keep money for some time so you can buy something","x":"Jose is saving up for a new laptop.","s":"save UP for"},{"e":"cost an arm and a leg","t":"ID","d":"be very, very expensive","x":"Concert tickets cost an arm and a leg these days.","s":"cost an ARM and a LEG"},{"e":"bargain","t":"VOC","d":"something you buy for much less money than usual","x":"This hoodie was only 9,000 pesos. What a bargain!","s":"BARgain"}],"pron":{"focus":"Weak 'than' and stress in comparatives and superlatives","explain":"In comparisons, the important words are strong and 'than' is weak and fast. In superlatives, we stress 'most' and the adjective: the MOST exPENsive, the CHEAPest.","tip":"Don't say 'than' slowly and clearly. Make it short and join it to the next words, so the strong words stand out.","lines":[{"t":"It's much warmer than my old jacket.","m":"it's MUCH WARMer than my OLD JACKet↘."},{"t":"That's the most expensive shop in town.","m":"that's the MOST exPENsive SHOP‿in TOWN↘."},{"t":"Do you have this in a bigger size?","m":"do you HAVE this‿in a BIGger SIZE↗?"}]},"acts":[{"type":"taboo","cards":[{"w":"receipt","taboo":["paper","pay","shop"]},{"w":"change","taboo":["money","back","coins"]},{"w":"bakery","taboo":["bread","cake","buy"]},{"w":"chemist's","taboo":["medicine","ill","doctor"]},{"w":"shopping centre","taboo":["shops","big","building"]},{"w":"pocket money","taboo":["parents","week","pesos"]},{"w":"try on","taboo":["clothes","fit","changing room"]},{"w":"bargain","taboo":["cheap","price","sale"]},{"w":"bookshop","taboo":["books","novels","comics"]},{"w":"size","taboo":["big","small","shoes"]}]},{"type":"picture","prompts":["Where are the boy and his mum? What are they looking for?","Do you think the boy likes the clothes on the rack? Why or why not?","Who usually chooses your clothes: you, your family or both?","Is shopping with your family better or worse than shopping with your friends? Why?","Are you going to buy any new clothes this month? What are you going to buy?"]},{"type":"ranking","task":"Imagine you've got 50,000 pesos. Rank these from the best to the worst way to use it. Then compare your list with a partner: I think … is better than … because …","items":["new trainers","a concert ticket","a video game","clothes for a party","a present for a friend","a meal with friends","saving it for later"]}],"rec":{"prompt":"Record yourself: describe your perfect shopping day. Where are you going to go, what are you going to buy, and how are you going to find the best prices?","model":"My perfect shopping day is at the biggest shopping centre in Santiago. First, I'm going to try on some new trainers. Good trainers usually cost an arm and a leg, so I'm going to look for a good deal. Then I'm going to visit the bookshop, because it's more fun than buying books online. I'm saving up for a camera, so I won't spend all my money!","use":["try on","cost an arm and a leg","a good deal"]},"tips":[{"who":"teacher","t":"In Taboo, give each team 60 seconds per turn and one point for every word they guess. Then ask each team to make a comparative sentence with two of the words."},{"who":"student","t":"Use much to make a comparison stronger: much cheaper, much more expensive. Don't say more cheaper!"}]},{"id":"planet-8-kid","lv":"planet","n":8,"age":"kid","title":"When I Grow Up","goals":["talk about jobs and what people do","make predictions with will and won't","say what will happen if you do something"],"warm":["What does your mum or dad do?","What job would you like to do in the future?","Do you think robots will do our homework one day?","Which job is the most exciting? Why?"],"model":{"kind":"dialogue","title":"After Jobs Day","intro":"It's break time after Jobs Day at school, and Leo and Benja are talking about the visitors.","lines":[{"sp":"Benja","t":"That firefighter was amazing! Now I want to be a [[firefighter]] too."},{"sp":"Leo","t":"Really? Last week you wanted to be a chef!"},{"sp":"Benja","t":"I know, I love cooking. But firefighters [[rescue people]]. That's so cool!"},{"sp":"Leo","t":"[[I'd like to be]] an [[engineer]]. I'll design robots."},{"sp":"Benja","t":"Robots? Will they do our homework?"},{"sp":"Leo","t":"Ha! [[I don't think]] they'll do our homework, but they'll help doctors and nurses."},{"sp":"Martina","t":"Hi, you two! What are you talking about?"},{"sp":"Leo","t":"Jobs! What do you want to be when you [[grow up]], Martina?"},{"sp":"Martina","t":"A vet! If I [[study hard]], I'll work with animals every day."},{"sp":"Benja","t":"Will you [[look after]] Pipo when he's ill?"},{"sp":"Martina","t":"Yes, I will! And I won't ask for any money!"},{"sp":"Leo","t":"Great! Pipo will be your first patient!"}],"questions":[{"q":"What does Benja want to be now?","opts":["A chef","A firefighter","An engineer"],"a":1},{"q":"What does Leo think robots will do?","opts":["Help doctors and nurses","Do their homework","Cook their dinner"],"a":0},{"q":"What will Martina do if she studies hard?","opts":["Become a firefighter","Design robots","Work with animals every day"],"a":2}]},"lang":[{"e":"firefighter","t":"VOC","d":"a person who stops fires and rescues people","x":"The firefighters arrived in a big red fire engine.","s":"FIREfighter"},{"e":"engineer","t":"VOC","d":"a person who designs machines, roads or bridges","x":"My aunt is an engineer. She builds bridges.","s":"enginEER"},{"e":"grow up","t":"PV","d":"get older and become an adult","x":"I want to be a pilot when I grow up.","s":"grow UP"},{"e":"look after","t":"PV","d":"take care of someone or something","x":"Nurses look after people in hospital.","s":"LOOK after"},{"e":"rescue people","t":"COL","d":"save people from danger","x":"Firefighters rescue people from fires.","s":"RESCue PEOple"},{"e":"study hard","t":"COL","d":"spend a lot of time learning and try your best","x":"If you study hard, you'll pass the test.","s":"STUDy HARD"},{"e":"I'd like to be…","t":"PHR","d":"a polite way to say the job you want in the future","x":"I'd like to be a scientist.","s":"I'd LIKE to be"},{"e":"I don't think…","t":"PHR","d":"you say this before something you believe will not happen","x":"I don't think it'll rain today.","s":"I DON'T THINK"}],"pron":{"focus":"Short forms of will: I'll, you'll, they'll","explain":"In everyday English we join will to the word before it: I will → I'll, you will → you'll, they will → they'll. Won't has a long 'oh' sound, so it sounds different from want.","tip":"Practise the chain: I'll – you'll – he'll – she'll – we'll – they'll. Then say: I want to go. / I won't go.","lines":[{"t":"If I study hard, I'll be a vet.","m":"if I STUDy HARD | I'll be a VET↘."},{"t":"I don't think they'll do our homework.","m":"I DON'T THINK they'll do our HOMEwork↘."},{"t":"Will you be a chef?","m":"WILL you be a CHEF↗?"}]},"acts":[{"type":"guess","cat":"Jobs","items":["vet","engineer","scientist","chef","pilot","firefighter","nurse","journalist","game designer","teacher"],"frames":["Do you work outside?","Do you wear a uniform?","Do you work with animals?","Do you use a computer?","Are you a…?"]},{"type":"wyr","items":[["be a vet","be a chef"],["be a pilot","be a firefighter"],["work in a hospital","work in a restaurant"],["design video games","design bridges"],["work outside","work in an office"],["write news for TV","do experiments in a lab"]]},{"type":"picture","prompts":["Who is in the photo? What is he doing?","What is he wearing? What colour is it?","What do you think he's cooking?","Do you think he'll be a chef one day? Why?","Can you cook? What will you cook for your family this weekend?"]}],"rec":{"prompt":"Record yourself: what would you like to be when you grow up? Say why, and say what you'll do if you get that job.","model":"When I grow up, I'd like to be a vet because I love animals. I've got a cat called Luna, and I look after her every day. If I study hard, I'll go to university. If I become a vet, I'll help sick dogs and cats. I don't think I'll be a pilot because I don't like planes!","use":["grow up","look after","study hard"]},"tips":[{"who":"teacher","t":"In the guessing game, the student with the secret job can only answer Yes, I do or No, I don't. Write the job words on the board for support."},{"who":"student","t":"After if, use the present: If I study hard… Put will in the other part: …I'll be a vet. Don't say If I will study."}]},{"id":"planet-8-teen","lv":"planet","n":8,"age":"teen","title":"My Future, My Career","goals":["talk about jobs, careers and what they are like","make predictions about the future with will and won't","discuss plans and possibilities with the first conditional"],"warm":["What job do you think you'll have in ten years?","Which jobs will robots do in the future?","Would you prefer a job with a big salary or a job you love?","What's a job you'd never like to do? Why?"],"model":{"kind":"dialogue","title":"Careers Day Chat","intro":"After Careers Day at school, Jose and Tomás are talking about their future on the way home.","lines":[{"sp":"Tomás","t":"So, what did you think of Careers Day?"},{"sp":"Jose","t":"I loved it! [[I'm thinking of becoming]] a game designer."},{"sp":"Tomás","t":"You'll be great at it. You're the best at coding in our class."},{"sp":"Jose","t":"Thanks! If I get good marks, I'll study engineering first. What about you?"},{"sp":"Tomás","t":"Maybe I'll be a sports journalist. Or a firefighter. [[Who knows]]?"},{"sp":"Jose","t":"Firefighters do an amazing job, but it isn't [[a piece of cake]]."},{"sp":"Tomás","t":"True. And journalists don't always [[earn a good salary]]."},{"sp":"Jose","t":"Is money the most important thing in a [[career]]?"},{"sp":"Tomás","t":"No. I'd like a job I love. But I'll need money for skateboards!"},{"sp":"Jose","t":"Ha! Did you know Sam wants to [[set up]] his own restaurant one day?"},{"sp":"Tomás","t":"Yes! If he opens a restaurant in Sydney, I'll visit him."},{"sp":"Jose","t":"He says it's hard to [[get a job]] as a chef, but he won't [[give up]]."},{"sp":"Tomás","t":"I'm sure he'll do it. His empanadas are the best!"}],"questions":[{"q":"What is Jose thinking of becoming?","opts":["A sports journalist","A firefighter","A game designer"],"a":2},{"q":"What will Jose do if she gets good marks?","opts":["Study engineering","Open a restaurant","Become a chef"],"a":0},{"q":"What will Tomás do if Sam opens a restaurant in Sydney?","opts":["Work there as a chef","Visit him","Write about it for TV"],"a":1}]},"lang":[{"e":"career","t":"VOC","d":"the jobs you do during your working life","x":"She had a long career as a nurse.","s":"caREER"},{"e":"get a job","t":"COL","d":"start working for a company or a person","x":"My brother got a job at a café last summer.","s":"get a JOB"},{"e":"earn a good salary","t":"COL","d":"get a lot of money every month for your work","x":"Engineers usually earn a good salary.","s":"EARN a GOOD SALary"},{"e":"set up","t":"PV","d":"start a new business or organisation","x":"If I save enough money, I'll set up my own café.","s":"set UP"},{"e":"give up","t":"PV","d":"stop trying to do something","x":"Don't give up if your first job is difficult.","s":"give UP"},{"e":"I'm thinking of becoming…","t":"PHR","d":"you say this about a job you might choose","x":"I'm thinking of becoming a journalist.","s":"I'm THINKing of beCOMing"},{"e":"Who knows?","t":"PHR","d":"you say this when nobody can be sure about something","x":"Will I live in another country? Who knows?","s":"WHO KNOWS"},{"e":"a piece of cake","t":"ID","d":"something very easy","x":"Being a chef isn't a piece of cake. You work very long hours.","s":"a PIECE of CAKE"}],"pron":{"focus":"'ll and won't in predictions","explain":"In fast speech, will is usually short: I'll, you'll, he'll, it'll. Won't has a long 'oh' sound, like in 'phone', so it sounds different from want.","tip":"Record yourself saying: I want to be a pilot. / I won't be a pilot. Can a friend hear the difference?","lines":[{"t":"I think I'll be a game designer.","m":"I THINK I'll be a GAME deSIGNer↘."},{"t":"If he opens a restaurant, I'll visit him.","m":"if he OPens a RESTaurant | I'll VISit him↘."},{"t":"I won't be a pilot.","m":"I WON'T be a PIlot↘."}]},"acts":[{"type":"fluency","topics":["The job you'd like to have in ten years, and why","How you think schools will be different in 2050","A job you would never like to do, and why","The most important things in a good job: salary, free time, nice people…","What you'll do if you get some money for your next birthday"],"mins":[3,2,1]},{"type":"agree","items":["In 2050, robots will do most jobs.","People won't use cash in ten years.","A big salary is more important than a job you love.","Game designer is the best job in the world.","In the future, students will study at home, not at school.","If you work hard, you'll always get a good job.","Most people will have more than one career."]},{"type":"roulette","items":["What will you do if it rains this weekend?","What will you do if you get a bad mark in a test?","What will you buy if you get 50,000 pesos for your birthday?","Where will you live if you go to university?","What will you cook if your friends come for dinner?","What job will you choose if you can't get your dream job?","Do you think you'll live in Chile or in another country?","Do you think you'll be famous one day? Why?","What will you do this evening if you finish your homework early?"]}],"rec":{"prompt":"Record yourself: describe your future career. What will you do, where will you work, and what will happen if you follow your plan?","model":"I'm thinking of becoming a journalist because I love writing and talking to people. I think I'll study at university in Santiago. If I get a job at a TV channel, I'll report on music and sport. It isn't a piece of cake, and journalists don't always earn a good salary, but I won't give up. Who knows? Maybe you'll see me on TV one day!","use":["I'm thinking of becoming…","a piece of cake","give up"]},"tips":[{"who":"teacher","t":"For Agree or Disagree, put an AGREE sign on one side of the room and DISAGREE on the other. Students move, then explain with I think… will… because…"},{"who":"student","t":"Don't use will after if. Say If I get good marks, I'll…, not If I will get good marks…"}]},{"id":"planet-9-kid","lv":"planet","n":9,"age":"kid","title":"Have You Ever…?","goals":["talk about nature and amazing places in Chile","ask and answer Have you ever…? questions","say how long with for and since"],"warm":["What's your favourite place in nature?","Do you like the beach or the mountains more? Why?","Have you ever seen snow?","What do you do with old bottles and paper at home?"],"model":{"kind":"dialogue","title":"Planning a Family Trip","intro":"Leo and Sofi are talking to Grandma Ana about their family holiday in the south of Chile.","lines":[{"sp":"Sofi","t":"Grandma, we're going to Puerto Varas in the holidays! [[Have you ever]] been there?"},{"sp":"Grandma Ana","t":"Yes, I have! I've been there three times. It's beautiful."},{"sp":"Leo","t":"Is there a [[volcano]] near Puerto Varas?"},{"sp":"Grandma Ana","t":"Yes, the Osorno volcano. There's snow [[at the top of]] it all year."},{"sp":"Sofi","t":"Have you ever climbed it?"},{"sp":"Grandma Ana","t":"No, [[I've never]] climbed a volcano. But I've [[been hiking]] in the [[national park]] near there."},{"sp":"Leo","t":"Have you seen the waterfalls there?"},{"sp":"Grandma Ana","t":"Yes, I have. The water is a beautiful green colour!"},{"sp":"Sofi","t":"Can Pipo come too? He's never seen a lake!"},{"sp":"Grandma Ana","t":"Yes, he can. But remember, in the park we always [[take our rubbish home]]."},{"sp":"Leo","t":"Of course! And we'll [[pick up]] any rubbish we see on the path."},{"sp":"Grandma Ana","t":"Good! When you love nature, you protect it."}],"questions":[{"q":"How many times has Grandma been to Puerto Varas?","opts":["Once","Three times","Never"],"a":1},{"q":"What has Grandma never done?","opts":["Climbed a volcano","Seen the waterfalls","Been hiking"],"a":0},{"q":"What will Leo do with rubbish on the path?","opts":["Leave it there","Throw it in the lake","Pick it up"],"a":2}]},"lang":[{"e":"volcano","t":"VOC","d":"a mountain where hot lava can come out","x":"Villarrica is a famous volcano in Chile.","s":"volCAno"},{"e":"national park","t":"VOC","d":"a big natural area that is protected by law","x":"We saw condors in the national park.","s":"NATional PARK"},{"e":"Have you ever…?","t":"PHR","d":"a question to ask if something happened at any time in your life","x":"Have you ever seen a waterfall?","s":"have you EVer"},{"e":"I've never…","t":"PHR","d":"you say this about something that has not happened in your life","x":"I've never swum in a lake.","s":"I've NEVer"},{"e":"go hiking","t":"COL","d":"go for a long walk in the mountains or the countryside","x":"We go hiking with our cousins every summer.","s":"go HIKing"},{"e":"take your rubbish home","t":"COL","d":"carry the things you don't need back to your house","x":"There are no bins on the beach, so take your rubbish home.","s":"TAKE your RUBbish HOME"},{"e":"pick up","t":"PV","d":"take something from the ground with your hand","x":"Please pick up that bottle and put it in the bin.","s":"pick UP"},{"e":"at the top of","t":"PREP","d":"in the highest part of something","x":"There's a small lake at the top of the mountain.","s":"at the TOP of"}],"pron":{"focus":"Have you ever…? questions","explain":"In Have you ever…? questions, have and you are weak and quick, and we link you and ever. The big stress is on EVer and the main verb. In short answers, have is strong: Yes, I HAVE.","tip":"Say the start like one long word: haveyouEVer… Then answer with a strong HAVE or HAVEn't.","lines":[{"t":"Have you ever seen a volcano?","m":"have you‿EVer SEEN‿a volCAno↗?"},{"t":"Yes, I have.","m":"YES | I HAVE↘."},{"t":"I've never climbed a mountain.","m":"I've NEVer CLIMBED‿a MOUNtain↘."}]},"acts":[{"type":"findsomeone","items":[{"p":"has seen a volcano","q":"Have you ever seen a volcano?"},{"p":"has swum in a lake","q":"Have you ever swum in a lake?"},{"p":"has climbed a mountain","q":"Have you ever climbed a mountain?"},{"p":"has visited a national park","q":"Have you ever visited a national park?"},{"p":"has seen a waterfall","q":"Have you ever seen a waterfall?"},{"p":"has played in the snow","q":"Have you ever played in the snow?"},{"p":"has been to an island","q":"Have you ever been to an island?"},{"p":"has picked up rubbish in a park or on a beach","q":"Have you ever picked up rubbish in a park or on a beach?"}],"follow":["Where was it?","Who were you with?","Did you like it?"]},{"type":"picture","prompts":["Where are the teenagers? What are they doing?","What can you see around them?","Do you think they're having fun? Why?","Have you ever walked in a forest like this? Where?","What should people do with their rubbish on a forest path?"]},{"type":"ranking","task":"Rank these places from the most exciting to the least exciting to visit. Then tell a partner: I've never seen a …, but I'd love to! / I've seen a … . It was amazing!","items":["a volcano","a glacier","a waterfall","an island","a forest","a lake","a very high mountain"]}],"rec":{"prompt":"Record yourself: talk about a place in nature you've visited and one you've never seen. Say what you do to help nature.","model":"I've been to the beach in Viña del Mar many times. I've swum in the sea, and I've seen lots of birds there. I've never seen a glacier, but I'd love to go to the south of Chile one day. To help nature, I always take my rubbish home, and I pick up plastic when I see it.","use":["I've never…","take your rubbish home","pick up"]},"tips":[{"who":"teacher","t":"Before Find Someone Who, practise the short answers Yes, I have and No, I haven't as a class. Students write a classmate's name next to each Yes answer."},{"who":"student","t":"After have or has, use the past participle: seen, swum, been, climbed. Don't say Have you ever saw…?"}]},{"id":"planet-9-teen","lv":"planet","n":9,"age":"teen","title":"Trail Talk","goals":["describe natural places and your experiences in nature","ask and answer about experiences with Have you ever…? and How long…?","give your opinion on protecting the environment"],"warm":["What's the most beautiful natural place you've ever visited?","Have you ever been camping? Where?","How long have you lived in your town?","What does your school do to reduce rubbish?"],"model":{"kind":"dialogue","title":"The Beach Clean-Up","intro":"Jose's volleyball team is planning a beach clean-up in Valparaíso, and she's telling Sam about it.","lines":[{"sp":"Jose","t":"Sam, [[have you ever]] been to a beach clean-up?"},{"sp":"Sam","t":"Yes, I have. I've done three in Sydney. Why?"},{"sp":"Jose","t":"My volleyball team is organising one in Valparaíso on Saturday. We've played on that beach for three years, and it's getting dirtier and dirtier."},{"sp":"Sam","t":"That's terrible. Is it mostly [[single-use plastic]]?"},{"sp":"Jose","t":"Yes, bottles, bags and straws. People use them once and [[throw them away]], and lots of them end up on the beach."},{"sp":"Sam","t":"Plastic is the worst kind of [[pollution]] for the ocean. Birds and fish eat it."},{"sp":"Jose","t":"Exactly. We want to [[clean up]] the whole beach before the summer."},{"sp":"Sam","t":"Great idea. Have you invited people from school?"},{"sp":"Jose","t":"Yes, I have! About twenty people are coming. Vale and Tomás are coming too."},{"sp":"Sam","t":"[[Count me in]]! I'll bring my camera and post some photos online. Maybe more people will join next time."},{"sp":"Jose","t":"Perfect! Small actions really [[make a difference]]."},{"sp":"Sam","t":"True. If we all [[protect the environment]], the beach will be beautiful again."}],"questions":[{"q":"Where is the clean-up?","opts":["On a beach in Valparaíso","On a beach in Sydney","In a forest near Concepción"],"a":0},{"q":"How long has Jose's team played on that beach?","opts":["Since Saturday","For three years","For twenty years"],"a":1},{"q":"What will Sam do at the clean-up?","opts":["Play volleyball","Bring some food","Take photos and post them online"],"a":2}]},"lang":[{"e":"pollution","t":"VOC","d":"dirty air, water or land caused by people","x":"Pollution from cars is a big problem in Santiago.","s":"polLUtion"},{"e":"throw away","t":"PV","d":"get rid of something because you don't want it any more","x":"Don't throw away that box. We can recycle it.","s":"throw aWAY"},{"e":"clean up","t":"PV","d":"make a place clean and tidy again","x":"After the party, we cleaned up the garden.","s":"clean UP"},{"e":"make a difference","t":"COL","d":"do something that helps or changes a situation","x":"Recycling at home can make a difference.","s":"make a DIFFerence"},{"e":"protect the environment","t":"COL","d":"keep nature safe from harm","x":"We can protect the environment by using less plastic.","s":"proTECT the enVIronment"},{"e":"single-use plastic","t":"COL","d":"plastic things that you use only once, like straws and bags","x":"Our school café has stopped using single-use plastic.","s":"SINGle-use PLAStic"},{"e":"Have you ever…?","t":"PHR","d":"a question about experiences at any time in your life","x":"Have you ever slept in a tent?","s":"have you EVer"},{"e":"Count me in!","t":"PHR","d":"yes, I want to join you","x":"A picnic in the park on Sunday? Count me in!","s":"COUNT me IN"}],"pron":{"focus":"Weak have and has in the present perfect","explain":"In present perfect sentences, have and has are usually short and weak: I've, she's, we've. In questions, have is weak too. But in short answers it's strong: Yes, I HAVE.","tip":"Listen for the small 've and 's. They are easy to miss, but they change the meaning: I've seen is not the same as I see.","lines":[{"t":"Have you ever been to a beach clean-up?","m":"have you‿EVer BEEN to a BEACH CLEAN-up↗?"},{"t":"We've played on that beach for three years.","m":"we've PLAYED‿on that BEACH | for THREE YEARS↘."},{"t":"She's never seen a glacier.","m":"she's NEVer SEEN‿a GLAcier↘."}]},"acts":[{"type":"roulette","items":["Have you ever slept in a tent? Where?","Have you ever seen a volcano? Which one?","Have you ever swum in a lake or a river? Was the water cold?","How long have you known your best friend?","Have you ever recycled something in a creative way?","Have you ever been to a national park? What did you see?","How long have you lived in your town?","What's the most beautiful place you've ever visited?","Have you ever picked up rubbish that wasn't yours? Why?","What's something in nature you've never seen but want to see?"]},{"type":"taboo","cards":[{"w":"glacier","taboo":["ice","cold","mountain"]},{"w":"volcano","taboo":["lava","hot","mountain"]},{"w":"waterfall","taboo":["water","river","drop"]},{"w":"island","taboo":["sea","land","beach"]},{"w":"recycle","taboo":["bottles","again","bin"]},{"w":"pollution","taboo":["dirty","air","factory"]},{"w":"forest","taboo":["trees","green","wood"]},{"w":"climate change","taboo":["weather","hot","Earth"]},{"w":"national park","taboo":["nature","protected","animals"]},{"w":"rubbish","taboo":["bin","throw","dirty"]}]},{"type":"picture","prompts":["Where are the teenagers? Describe the place.","Do you think they've walked a long way? Why?","How do you think they feel? Why?","Have you ever walked on a trail like this? Where was it?","What rules should hikers follow to protect a forest like this?"]}],"rec":{"prompt":"Record yourself: describe an amazing place in nature that you've visited (or want to visit), and say what young people can do to protect it.","model":"I've visited Conguillío National Park twice with my family. It has a volcano, beautiful lakes and very old forests. I've never climbed the volcano, but I'd love to. Sadly, people throw away lots of plastic, and some of it ends up in the lakes. I think young people can make a difference: we can clean up the paths, use less single-use plastic and protect the environment.","use":["throw away","make a difference","single-use plastic"]},"tips":[{"who":"teacher","t":"In Taboo, after each card the team that guessed the word makes a Have you ever…? question with it and asks another team."},{"who":"student","t":"Use since with a starting point (since 2020, since I was ten) and for with a period of time (for two years, for a long time)."}]},{"id":"comet-0-kid","lv":"comet","n":0,"age":"kid","title":"Hello Again, School!","goals":["talk about your summer holidays and your first days back at school","ask and answer questions to get to know a new classmate","say what your goals are for this term"],"warm":["What was the best thing you did in the summer holidays?","How did you feel on your first day back at school?","What's your favourite lesson on your new timetable?","Is there anyone new in your class this year?"],"model":{"kind":"dialogue","title":"First Day Back","intro":"Leo meets his best friend Benja at the school gate on the first day of term.","lines":[{"sp":"Benja","t":"Leo! Over here! [[How was your summer]]?"},{"sp":"Leo","t":"Brilliant, thanks! We stayed with Grandma Ana by the sea for two weeks. What about you?"},{"sp":"Benja","t":"I went to my cousins' farm in the south. I learnt to ride a horse!"},{"sp":"Leo","t":"No way! We need to [[catch up]] properly. Are you nervous about the new timetable?"},{"sp":"Benja","t":"A bit. I [[had butterflies in my stomach]] this morning, beca
