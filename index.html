he problem with single-use cups.","I don't agree that recycling is a waste of time.","When I got home, my brother had already posted our video online."],"grammar":[{"q":"When we reached the beach, the volunteers ___ most of the litter.","o":["have already collected","had already collected","already collect"],"a":1},{"q":"The bin was full because nobody ___ it for two weeks.","o":["had emptied","has emptied","empties"],"a":0},{"q":"My grandparents ___ use plastic bags. They carried baskets instead.","o":["don't use to","weren't used to","didn't use to"],"a":2},{"q":"___ you use to walk to school when you were younger?","o":["Were","Did","Had"],"a":1},{"q":"People ___ to think that the oceans were too big to pollute.","o":["used","use","were used"],"a":0},{"q":"A: We should ban single-use plastic. B: I ___ agree! It's a great idea.","o":["not","hardly","totally"],"a":2},{"q":"Many animals become ___ when people destroy their habitats.","o":["endangered","renewable","recycled"],"a":0},{"q":"Solar and wind power are types of ___ energy.","o":["endangered","renewable","single-use"],"a":1}]}},"galaxy-3":{"key":"galaxy-3","kid":{"story":{"title":"Grandma's Magic Box","pic":"👗🧵✂️🎨","text":["Last month, Ms Rojas announced the school's first fashion show. 'There's only one rule,' she said. 'You can't buy anything new. Every outfit must be second-hand or homemade.'","Sofi and Martina went to Grandma Ana's house to look for ideas. Grandma opened a big wooden box. 'I've kept these clothes since I was a girl,' she said. Inside there were baggy trousers, a yellow raincoat and a long dress with orange flowers. 'I wore this dress to my brother's wedding in 1975!'","'It's a bit old-fashioned,' said Martina. 'I see what you mean,' Sofi answered, 'but the fabric is beautiful.' Grandma has made clothes all her life, so she helped the girls turn the dress into two colourful skirts. Then Sofi painted flowers on an old white T-shirt, and Martina found a belt and a necklace to go with her o e,' he said. 'But first, give your eyes twenty minutes to get used to the dark. Then look up slowly. And make sure you never point a telescope at the Sun!'","Through the telescope, the Moon looked enormous, and Sofi could see lots of craters. 'They were made by rocks that crashed into the Moon a very long time ago,' Pablo explained. Then he pointed at a bright light moving quickly across the sky. 'That's the International Space Station. Astronauts live and work up there, and it orbits the Earth about every ninety minutes.'","'If I were an astronaut, I would wave at you from the window!' said Leo. Grandma laughed. 'And if you lived up there, you'd be weightless. You'd have to sleep in a sleeping bag on the wall!'","Finally, Pablo showed them the Milky Way, our own galaxy, which looked like a river of light. Later, Dad said, 'If we had come on a cloudy night, we would have missed all this.' Leo smiled. He knew he would never forget that sky."],"qs":[{"q":"What is the story mainly about?","o":["A family's night of stargazing in the desert","How to build a telescope at home","A holiday at the beach with Grandma"],"a":0},{"q":"Why is the Atacama a good place for looking at the stars?","o":["The nights are longer there","The air is dry and there are no city lights","There are lots of tall buildings"],"a":1},{"q":"What was the bright light that was moving across the sky?","o":["A plane","A shooting star","The International Space Station"],"a":2},{"q":"What did Dad mean at the end of the story?","o":["They should come back on a cloudy night","They were lucky to have a clear night","They had arrived at the observatory too late"],"a":1}]},"sentences":["If you drop a ball, gravity pulls it down to the ground.","If the sky is clear tonight, we will see lots of stars.","If I could visit the space station, I would take photos of Chile.","If we had brought the telescope, we would have seen the craters.","Turn off your torch and look up at the sky.","If you jumped on the Moon, you : the Milky Way stretched from one side of the sky to the other.","Sam, who takes his camera everywhere, tried to photograph it. 'If I had brought my tripod, I would have got a much sharper picture,' he complained. Tomás just lay on the ground and stared. 'If I were an astronaut on the space station, I'd spend all day looking out of the window,' he said.","Our teacher says that if enough of us are interested, the school will organise another trip next year. If it does, I'm definitely going."],"qs":[{"q":"What is the text mainly about?","o":["How to become an astronomer","A school trip to an observatory in the desert","A camping holiday with friends"],"a":1},{"q":"Why is northern Chile a good place for telescopes?","o":["The air is dry and there are no city lights","It has the longest nights in the world","Telescopes are cheaper to build there"],"a":0},{"q":"What problem can satellites cause, according to Dr Díaz?","o":["They make the desert hotter","They break the telescopes","They leave bright lines on photos"],"a":2},{"q":"Why was Sam disappointed?","o":["He couldn't see the Milky Way","He couldn't take a sharp photo without his tripod","His phone battery died"],"a":1}]},"sentences":["If the air is dry, telescopes take much clearer images.","If it's cloudy on Friday, the observatory will cancel our tour.","If I could work anywhere, I would choose an observatory in the Atacama.","If Sam had brought his tripod, he would have taken a sharper photo.","Switch off your phone and let your eyes adjust to the dark.","If you lived on the space station, you would see sixteen sunrises a day."],"grammar":[{"q":"If you ___ water to 100°C, it boils.","o":["will heat","heat","heated"],"a":1},{"q":"If it ___ cloudy tomorrow night, the observatory will cancel the tour.","o":["will be","is","was"],"a":1},{"q":"If I ___ an astronomer, I would spend every night looking at distant stars.","o":["am","will be","were"],"a":2},{"q":"We ___ a better photo of the Moon if we had used a tripod.","o":["would take","would have taken","will take"],"a":1},{"q":"If I ___ my alarm, I wouldn't have missed the eclipse.","o":["hadn't forgotten","didn't forget","haven't forgotten"],"a":0},{"q":"Make ___ you switch off your phone screen before the night tour starts.","o":["surely","secure","sure"],"a":2},{"q":"The Moon's surface is covered in ___ made by rocks from space.","o":["craters","orbits","galaxies"],"a":0},{"q":"The Earth takes about 365 days to ___ the Sun.","o":["launch","orbit","float"],"a":1}]},"odd":[{"items":["Mars","Venus","Moon","Jupiter"],"a":2,"why":"The Moon isn't a planet; the others are planets."},{"items":["🚲","🔭","📡","🛰️"],"a":0,"why":"A bike can't help you study the sky; the others can."},{"items":["if","unless","but","provided"],"a":2,"why":"But shows contrast; the others introduce a condition."},{"items":["because","first","then","finally"],"a":0,"why":"Because gives a reason; the others show the order of steps."}]},"galaxy-6":{"key":"galaxy-6","kid":{"story":{"title":"Healthy Habits Week","pic":"💧🥗😴🧘","text":["Last week was Healthy Habits Week at Leo's school. On Monday, Nurse Paula visited Leo's class, and she started with a funny question. She asked the children how many glasses of water they drank every day. Benja said that he only drank juice! Nurse Paula smiled and told him that water was much better for staying hydrated.","Next, she talked about food. She explained that a balanced diet gives our bodies the energy they need, and she asked Martina what she usually had for breakfast. Martina said that she ate cereal with fruit. 'Perfect!' said Nurse Paula.","Then she asked if anyone felt stressed before tests. Lots of hands went up, including Leo's. Nurse Paula told everyone to close their eyes and breathe slowly for one minute. 'This is called mindfulness,' she said. 'It helps you relax, and it can put you in a better mood.'","Finally, she gave them some advice about sleep. She told them that children their age needed between nine and twelve hours of sleep a night, and she recommended switching off all screens an hour before bedtime. She said that a short nap could help if they felt tired after school.","That evening, Leo told Mum what he had learnt. He asked her if they could start a new bedtime routine: no tablet after eight o'clock, and a story instead. Mum agreed. Now Leo goes to bed earlier, and Sofi says that he is much less grumpy in the mornings!"],"qs":[{"q":"What is the story mainly about?","o":["A nurse's advice about healthy habits","How to become a school nurse","A football match at Leo's school"],"a":0},{"q":"How much sleep do children Leo's age need, according to Nurse Paula?","o":["About six hours","Between nine and twelve hours","Twenty minutes"],"a":1},{"q":"What did Nurse Paula tell the children to do for one minute?","o":["Drink a glass of water","Run around the classroom","Close their eyes and breathe slowly"],"a":2},{"q":"Why is Leo probably less grumpy in the mornings now?","o":["He eats more cereal","He is getting more sleep","He plays on his tablet at night"],"a":1}]},"sentences":["The nurse told us that water was the best drink.","Ms Rojas asked me what I usually ate for breakfast.","Mum asked if I was feeling stressed about the spelling test.","Our teacher asked us to close our eyes and breathe slowly.","The nurse recommended eating fruit at break time.","Dad told me not to play video games before bedtime."],"grammar":[{"q":"Yesterday Pía said that she ___ tired after the race.","o":["feel","felt","has felt"],"a":1},{"q":"'Do you do any sport?' → He asked me ___ any sport.","o":["if I did","did I do","do I do"],"a":0},{"q":"The new doctor asked me where ___.","o":["did I live","do I live","I lived"],"a":2},{"q":"The swimming teacher told us ___ in the pool area.","o":["to not running","not to run","don't run"],"a":1},{"q":"My mum asked me ___ the lights off before going to bed.","o":["to turn","turning","turn"],"a":0},{"q":"The doctor recommended ___ more fruit and vegetables.","o":["eat","to eat","eating"],"a":2},{"q":"I felt sleepy after lunch, so I had a short ___.","o":["mood","nap","routine"],"a":1},{"q":"Drink water regularly to stay ___ during the match.","o":["hydrated","anxious","balanced"],"a":0}]},"teen":{"story":{"title":"Calm Before the Final","pic":"🏐😰🧘💧","text":["Two weeks before the regional volleyball final, our coach invited a sports psychologist to talk to the team. Her name was Dr Inés Molina, and she started by asking us what we usually did when we felt nervous before a match. Most of us admitted that we just scrolled through our phones.","Dr Molina told us that a little stress can actually help athletes, but too much can ruin your mood and your performance. She explained that social media keeps our brains busy, so lots of screen time before a match makes it harder to relax.","Then she taught us a breathing exercise. She asked us to breathe in for four seconds, hold our breath for four and breathe out for four. 'This is a simple kind of mindfulness,' she said. 'You can do it anywhere, even on the court.'","Our captain, Florencia, asked whether energy drinks were a good idea before a big game. Dr Molina said that they weren't, and she told us to stay hydrated with water instead. She also recommended a match-day routine: a balanced breakfast, a short nap after lunch if we felt tired, a light workout to warm up and no screens for an hour before the game.","We tried everything she suggested, and on the day of the final I felt calmer than ever. We didn't win, but we came second — and for once, I enjoyed every minute of the match."],"qs":[{"q":"What is the text mainly about?","o":["A psychologist's advice on dealing with stress before a match","How to become a professional volleyball player","Why phones are dangerous for teenagers"],"a":0},{"q":"What did most of the players do when they felt nervous?","o":["They had a short nap","They scrolled through their phones","They did a breathing exercise"],"a":1},{"q":"Wha hole day. He explained that Chilean Sign Language is used by thousands of people and that many countries have their own sign language. 'Signs are made with your hands,' he said, 'but your facial expression matters too. It shows if you're asking a question, or if you're happy or sad.'","Then the children were taught some easy signs: hello, thank you, friend and football. Leo practised the sign for football all afternoon!","There was one small misunderstanding. While Isidora was working on a difficult maths problem, she frowned, and Benja thought she was angry with him. He asked Felipe to help him clarify. Felipe signed the question, and Isidora laughed and shook her head. 'No! Maths is just really hard!' she signed back.","Now the class has a new tradition: every Friday, a new sign is chosen by one of the children and taught to everyone. Isidora is never alone at break time, and she has taught Leo's team some brilliant signs for the football pitch."],"qs":[{"q":"What is the story mainly about?","o":["A class that learns to communicate with a deaf classmate","A football match between two schools","A girl who doesn't like maths"],"a":0},{"q":"What did Felipe say about facial expressions?","o":["They aren't used in sign language","They matter in sign language too","They're only used in Chile"],"a":1},{"q":"Why did Benja think Isidora was angry?","o":["She shook her head at him","She didn't say hello to him","She frowned while she was working"],"a":2},{"q":"How does Isidora probably feel at school now?","o":["Happy and included","Shy and lonely","Bored and tired"],"a":0}]},"sentences":["Chilean Sign Language is used by thousands of people.","Isidora's frown was misunderstood by one of her classmates.","A new sign will be taught to the class every Friday.","Sorry, could you show me that sign again?","So you're saying that this sign means friend?","A thumbs-up is usually seen as a friendly gesture."],"grammar":[{"q":"English ___ in many countries as a second language.","o" y a famous painter from the 1920s and asked for 300,000 pesos. Sam took a picture and sent it to the group chat. 'This could be a lost masterpiece!' he wrote.","Vale, who spends hours drawing, zoomed in on the photo. 'I'm not so sure,' she replied. 'Look at the brushstrokes. They're all exactly the same size, and real paintings are never that perfect. It might be a printed copy.'","A few minutes later, Jose joined the chat. She had searched online for the painter. 'It can't be one of his,' she typed. 'Look at the harbour. There's a huge container ship in it, and ships like that didn't exist in the 1920s.'","'So someone must have painted it recently and copied his signature,' wrote Tomás. 'It's a forgery. Don't buy it!' But Sam didn't want to accuse anyone. 'The seller might not know,' he replied. 'He could have bought it from someone else.'","Sam went back to the stall and politely showed the man the clues. The seller stared at the ship for a long time, then laughed. 'You're right. I must have been blind!' He dropped the price to 5,000 pesos, and Sam bought it anyway because he liked the colours. Now it hangs in his bedroom, and the four friends are writing a report for Mr Díaz's class: How to Spot a Fake."],"qs":[{"q":"What is the story mainly about?","o":["A boy who sells his photos at a market","Friends who work out that a painting isn't what the seller says","The history of the port of Valparaíso"],"a":1},{"q":"Why did Vale think the painting might be a copy?","o":["The brushstrokes were too perfect","The frame was broken","The colours were too dark"],"a":0},{"q":"Which clue showed that the old painter couldn't have painted it?","o":["The signature was missing","The price was too low","It showed a modern container ship"],"a":2},{"q":"Why did Sam probably buy the painting in the end?","o":["He still thought it was a masterpiece","It was cheap and he liked it","The seller wouldn't let him leave without it"],"a":1}]},"sentences":["This photo must be really old beca ery year. It was a real feast: empanadas, grilled meat and sweet, sticky desserts. Grandma's neighbour, whose garden is enormous, invited all the children to fly kites. Sofi's kite, which had a picture of Pipo on it, flew higher than everyone else's!","Later, there was a drink on the table that I had never seen before. I asked a guest politely, 'Excuse me, could you tell me what this drink is made of?' He smiled and explained that it was mote con huesillo, a sweet drink made from dried peaches, with wheat and a whole peach inside. It was delicious!","In Sydney, the celebration that I love most is New Year's Eve, when there are huge fireworks over the harbour. But now I've got a new favourite tradition, and I can't wait for next September!"],"qs":[{"q":"What is Kai's text mainly about?","o":["Her first Fiestas Patrias in Chile","How to make a kite","New Year's Eve in Sydney"],"a":0},{"q":"Who danced the cueca with Kai?","o":["Leo","Benja","A boy from Sydney"],"a":1},{"q":"Whose kite flew the highest?","o":["Kai's","The neighbour's","Sofi's"],"a":2},{"q":"How does Kai probably feel about Fiestas Patrias now?","o":["She would love to celebrate it again","She thinks it's too noisy","She prefers to stay at home in September"],"a":0}]},"sentences":["The boy who won the kite contest is my best friend.","Santiago, which is the capital of Chile, gets very busy in September.","Grandma's neighbour, whose garden is enormous, invited us to fly kites.","Would you mind telling me where the cueca contest is?","Ms Rojas told us that the lanterns were made by the younger children.","I was wondering if we could decorate the classroom for the party."],"grammar":[{"q":"The man ___ organises the parade is my uncle.","o":["which","who","where"],"a":1},{"q":"This is the square ___ the festival takes place every year.","o":["where","which","who"],"a":0},{"q":"Chile's Independence celebrations, ___ take place in September, are known as Fiestas Patrias.","o":["that","who","which"],"a":2},{"q" LEVELS.forEach(l=>{l.kidName=l.name;l.kidEmoji=l.emoji;l.teenName=TEEN[l.id];});

function applyVersions(){const teen=isTeen();LEVELS.forEach(l=>l.missions.forEach(m=>{const v=VER[l.id+"-"+m.n];if(!v)return;if(v.name)m.name=v.name;if(v.odd)m.odd=v.odd;if(v.vocabFix&&m.vocab)m.vocab=m.vocab.map(w=>v.vocabFix[w.w]||w);const x=teen?v.teen:v.kid;if(x){m.story=x.story;m.sentences=x.sentences;m.grammar=x.grammar;}}));}
function applyProfile(){
  const teen=isTeen(),b=document.body;applyVersions();
  b.classList.toggle("ag-teen",teen);b.classList.toggle("ag-kid",!teen);b.classList.toggle("teacher",isTeacher());
  ["6","9","12","15"].forEach(a=>b.classList.toggle("ag-"+a,!!PROFILE&&PROFILE.age===a));
  LEVELS.forEach(l=>{l.name=teen?l.teenName:l.kidName;l.emoji="";});
  BADGES.splice(0,BADGES.length,...(teen?BADGES_TEEN:BADGES_KID).map(x=>Object.assign({},x)));

    '<p style="margin:10px 0 18px"><span class="blocktag" style="background:'+LVCOL[Lv.id][1]+';color:'+LVCOL[Lv.id][0]+';font-size:15px">Next: Part '+(TS.b+1)+' · '+esc(Lv.name)+'</span></p>'+
    '<div class="row"><button class="btn" onclick="testQuestion()">Continue →</button><button class="btn alt" onclick="testResult(TS.b)">Finish here</button></div></div>';
}
function testResult(idx){
  const T=TS,Lv=LEVELS[idx];
  MYLEVEL=Lv.id;save("twk2_level",Lv.id);
  if(PROFILE){PROFILE.level=Lv.id;save("twk3_profile",PROFILE);renderNav();}
  const bars=TEST.map((_,k)=>{const P=LEVELS[k];return '<div><span>'+(k+1)+' · '+esc(P.name)+'</span><b>'+(T.played[k]?T.scores[k]+' / '+TEST[k].length:'—')+'</b><small class="hint">'+(T.played[k]?("⭐".repeat(T.scores[k])||"·"):"not needed")+'</small></div>';}).join("");
  $("app").innerHTML='<div class="result" style="background:linear-gradient(180deg,'+LVCOL[Lv.id][1]+',#fff)"><div style="font-size:72px">🏆</div>'+
    '<p style="font-weight:900;color:'+LVCOL[Lv.id][0]+'">'+(KIDNAME?esc(KIDNAME)+', your':'Your')+' level is</p><h1>'+esc(Lv.name)+'</h1>'+
    '<p style="font-weight:800">Level '+(idx+1)+' · '+Lv.cefr+'</p><p style="max-width:520px;margin:10px auto 0">'+CAN[Lv.id]+'</p>'+
    '<div class="bars">'+bars+'</div>'+
    '<div class="row"><button class="btn or" onclick="goLevel(\''+Lv.id+'\')">Go to '+esc(Lv.name)+' →</button><button class="btn alt" onclick="go(\'test\')">🔄 Take it again</button></div>'+
    '<p class="hint" style="margin-top:14px">This is a practice result. Your teacher will confirm your level in class.</p></div>';
  award("test|done",3);
}

/* ---------- TEACHER BAR: timer · answer · text size · class view ---------- */
const TCLK={left:300,total:300,iv:null};
function tbarSync(){
  let b=$("tbar");
  if(!isTeacher()){if(b)b.remove();document.body.classList.remove("classview");return;}
  if(!b){b=document.createElement("div");b.id="tbar";b.className="tbar";document.body.appendChild(b);}
  b.innerHTML='<span class="ttl">👩‍🏫 Teacher</span>'+
    '<span class="clk" id="tclk">'+fmtT(TCLK.left)+'</span><button onclick="tSet(300)">5′</button><button onclick="tSet(600)">10′</button><button onclick="tSet(900)">15′</button>'+
    '<button id="tplay" onclick="TCLK.iv?tPause():tStart()">▶</button><button onclick="tSet(TCLK.total)" title="Reset">↺</button>'+
    '<button onclick="revealAnswer()" title="Show the answer">👁 Answer</button><button onclick="tZoom(-1)">A−</button><button onclick="tZoom(1)">A+</button>'+
    '<button id="tcv" onclick="tClass()" class="'+(document.body.classList.contains("classview")?"on":"")+'">🖥 Class view</button><button class="tmin" onclick="this.parentNode.classList.toggle(\'min\')" title="Hide / show">–</button>';
}
function fmtT(s){s=Math.max(0,s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function tPaint(){const c=$("tclk");if(!c)return;c.textContent=fmtT(TCLK.left);c.className="clk"+(TCLK.iv?" run":"")+(TCLK.left<=0?" end":"");const p=$("tplay");if(p)p.textContent=TCLK.iv?"⏸":"▶";}
function tSet(s){tPause();TCLK.left=s;TCLK.total=s;tPaint();}
function tStart(){if(TCLK.iv)return;if(TCLK.left<=0)TCLK.left=TCLK.total;TCLK.iv=setInterval(()=>{TCLK.left--;if(TCLK.left<=0){tPause();TCLK.left=0;tBell();toast("⏰ Time's up!");}tPaint();},1000);tPaint();}
function tPause(){if(TCLK.iv)clearInterval(TCLK.iv);TCLK.iv=null;tPaint();}
function tBell(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=0;g.gain.linearRampToValueAtTime(.2,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.9);o.start();o.stop(c.currentTime+1);}catch(e){}}
let TZ=0;
function tZoom(d){TZ=Math.max(-1,Math.min(4,TZ+d));document.documentElement.style.zoom=TZ?String(1+TZ*.12):"";}
function tClass(){const on=document.body.classList.toggle("classview");const b=$("tcv");if(b)b.classList.toggle("on",on);toast(on?"🖥 Class view on":"Class view off");}
function revealAnswer(){
  const ops=[...document.querySelectorAll("#stage .op,.stage .op")],mark=i=>{if(ops[i])ops[i].classList.add("tans");};
  try{
    if(CUR.view==="test"&&TS){mark(TS.cur.a);return;}
    switch(CUR.act){
      case "listen":mark(LIS.opts.findIndex(o=>o.w===LIS.rounds[LIS.i].w));return;
      case "grammar":mark(GQ.cur.a);return;
      case "odd":mark(OD.cur.a);return;
      case "story":STY.qs.forEach((q,i)=>{const b=$("sq"+i+"_"+q.a);if(b)b.classList.add("tans");});return;
      case "spell":toast("👁 "+SP.word.toUpperCase());return;
      case "balloon":toast("👁 "+BL.word.toUpperCase());return;
      case "builder":toast("👁 "+BD.items[BD.i].s);return;
      case "memory":document.querySelectorAll(".mc:not(.done)").forEach(c=>{c.classList.add("open");setTimeout(()=>c.classList.remove("open"),2500);});return;
      case "flash":document.querySelectorAll(".fc").forEach(c=>c.classList.add("flip"));return;
      default:if(SPK&&SPK.items&&SPK.items[SPK.i]){toast("👁 "+SPK.items[SPK.i].text);return;}
    }
  }catch(e){}
  toast("👁 Open an activity to show its answer");
}

/* Direct links: ?level=moon · ?level=moon&mission=3 · ?go=test (placement test) */
(()=>{
  const q=new URLSearchParams(location.search),lv=q.get("level"),mi=parseInt(q.get("mission"),10);
  if(lv&&L(lv)){
    if(!isNaN(mi)&&hasContent(L(lv).missions.find(m=>m.n===mi)))goMission(lv,mi);else goLevel(lv);
  }else if(["test","levels","talk","stars","welcome"].indexOf(q.get("go"))>=0)go(q.get("go"));
  else go(PROFILE?"home":"welcome");
})();
