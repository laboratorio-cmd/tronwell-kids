<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRONWELL KIDS · Practice Zone</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- Twemoji: the same emoji pictures on every computer, tablet and phone -->
<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js" crossorigin="anonymous" defer></script>
<style>
:root{
  --bg:#fdfaf5; --card:#ffffff; --ink:#3a3f58; --soft-ink:#7a8099;
  --mint:#cdf2e3; --mint-d:#2f9e78;
  --lav:#e4dcff; --lav-d:#6c56d6;
  --peach:#ffe2cf; --peach-d:#e07a3c;
  --butter:#fff4c2; --butter-d:#c99a06;
  --sky:#d8ecff; --sky-d:#2e7ad1;
  --pink:#ffdce8; --pink-d:#d9537f;
  --blue:#0a62c4; --orange:#f7a600;
  --ok:#2f9e78; --no:#e0605c;
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;
  background-image:radial-gradient(circle at 8% 12%,#ffe9f1 0 90px,transparent 91px),radial-gradient(circle at 92% 30%,#e6f7ef 0 120px,transparent 121px),radial-gradient(circle at 15% 85%,#eee8ff 0 110px,transparent 111px);background-attachment:fixed}
h1,h2,h3,.baloo{font-family:'Baloo 2',cursive;line-height:1.1}
button{font-family:inherit;cursor:pointer;border:none}
img{display:block}
img.emoji{display:inline-block;height:1em;width:1em;margin:0 .04em;vertical-align:-.12em}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:3px dashed #f1e6d6}
.hwrap{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{cursor:pointer;display:flex;flex-direction:column;width:150px}
.logo .lw{font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:30px;color:var(--blue);letter-spacing:-1px;line-height:1}
.logo .lbar{position:relative;height:15px;margin-top:3px;background:linear-gradient(90deg,rgba(3,169,244,0) 0%,#6cc9f7 55%,#03a9f4 100%);display:flex;justify-content:flex-end;align-items:center;padding-right:9px}
.logo .lbar span{font-size:9.5px;font-weight:800;font-style:italic;color:#fff;letter-spacing:.2px}
.logo .lbar i{position:absolute;right:0;top:0;bottom:0;width:4px;background:var(--orange)}
.kidstag{background:linear-gradient(135deg,#ffd6e5,#e4dcff);color:#6c56d6;font-family:'Baloo 2';font-weight:800;font-size:18px;padding:4px 14px;border-radius:14px;transform:rotate(-4deg)}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav button{background:transparent;color:var(--ink);font-weight:800;font-size:14px;padding:8px 14px;border-radius:14px;transition:.15s}
nav button:hover{background:#f6efe4}
nav button.on{background:var(--sky);color:var(--sky-d)}
nav .star-pill{background:var(--butter);color:#8a6a00}

main{max-width:1180px;margin:0 auto;padding:26px 20px 60px}

/* ── HERO ── */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:26px;align-items:center;background:linear-gradient(135deg,#fff 0%,#fff7ee 100%);border-radius:32px;padding:34px;box-shadow:0 10px 30px rgba(120,100,60,.08);position:relative;overflow:hidden}
.hero h1{font-size:clamp(34px,5vw,54px);color:var(--ink)}
.hero h1 span{color:var(--lav-d)}
.hero p{font-size:17px;color:var(--soft-ink);margin:12px 0 20px;max-width:480px}
.hero .ph{border-radius:28px;overflow:hidden;height:300px;background:linear-gradient(135deg,var(--sky),var(--lav));position:relative;transform:rotate(2deg);box-shadow:0 12px 28px rgba(80,80,140,.18)}
.hero .ph img{width:100%;height:100%;object-fit:cover}
.float{position:absolute;font-size:34px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{background:var(--lav-d);color:#fff;font-weight:800;font-size:16px;padding:13px 24px;border-radius:18px;box-shadow:0 5px 0 #4f3bb0;transition:.12s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4f3bb0}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 5px 0 #e5dccd;border:2px solid #efe6d8}
.btn.mint{background:var(--mint-d);box-shadow:0 5px 0 #1f7a5b}
.btn.peach{background:var(--peach-d);box-shadow:0 5px 0 #b35a26}
.btn.sm{font-size:14px;padding:9px 16px;border-radius:14px}
.mylevel{margin-top:16px;display:inline-flex;align-items:center;gap:8px;background:var(--mint);color:var(--mint-d);font-weight:800;padding:7px 14px;border-radius:14px;font-size:14px;cursor:pointer}

/* ── SECTIONS ── */
.sec{margin-top:40px}
.sec h2{font-size:32px;margin-bottom:4px}
.sec .sub{color:var(--soft-ink);margin-bottom:18px}

/* LEVEL CARDS */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.lvcard{background:var(--card);border-radius:var(--r);overflow:hidden;cursor:pointer;box-shadow:0 8px 22px rgba(120,100,60,.08);transition:.2s;border:3px solid transparent;position:relative}
.lvcard:hover{transform:translateY(-6px) rotate(-.5deg)}
.lvcard .top{height:140px;position:relative;overflow:hidden}
.lvcard .step{position:absolute;bottom:10px;left:14px;z-index:1;background:rgba(255,255,255,.88);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:800}
.lvcard .bd{padding:16px 20px 20px}
.lvcard h3{font-size:28px}
.lvcard .tags{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:800;padding:3px 10px;border-radius:10px;background:#f6efe4}
.lvcard p{color:var(--soft-ink);font-size:14px}
.ribbon{position:absolute;top:12px;left:12px;z-index:1;background:#fff;color:#8a6a00;font-weight:800;font-size:12px;padding:4px 10px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.lvcard.soon .top{filter:saturate(.55)}

/* CREW */
.crew{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.mate{background:#fff;border-radius:20px;padding:16px 12px;text-align:center;box-shadow:0 5px 16px rgba(120,100,60,.07);cursor:pointer;transition:.15s}
.mate:hover{transform:translateY(-4px)}
.mate .av{font-size:52px;line-height:1.2}
.mate b{font-family:'Baloo 2';font-size:21px;display:block}
.mate span{font-size:13px;color:var(--soft-ink);display:block}

/* FEATURE TILES */
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ft{border-radius:20px;padding:18px;text-align:center}
.ft .ic{font-size:36px}
.ft b{display:block;font-family:'Baloo 2';font-size:19px;margin-top:4px}
.ft span{font-size:13px;color:var(--soft-ink)}

/* BADGES */
.badges{display:flex;gap:14px;flex-wrap:wrap}
.bdg{background:#fff;border-radius:20px;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 5px 16px rgba(120,100,60,.07);min-width:220px;flex:1}
.bdg .ic{font-size:34px;filter:grayscale(1);opacity:.4}
.bdg.got .ic{filter:none;opacity:1}
.bdg b{font-family:'Baloo 2';font-size:18px;display:block}
.bdg small{color:var(--soft-ink)}

/* ── BANNERS (level & mission) with space scenes ── */
.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene .tw{animation:tw 2.6s ease-in-out infinite}
.scene .tw2{animation:tw 3.4s ease-in-out .8s infinite}
@keyframes tw{50%{opacity:.15}}
.banner{position:relative;border-radius:30px;overflow:hidden;min-height:220px;display:flex;align-items:center;padding:30px 34px;color:#fff;box-shadow:0 10px 30px rgba(60,40,120,.18)}
.banner .txt{position:relative;z-index:1;max-width:58%}
.banner.dark .txt{text-shadow:0 2px 12px rgba(0,0,0,.35)}
.banner.light{color:var(--ink)}
.banner .kicker{font-weight:800;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;opacity:.92}
.banner h1{font-size:48px;margin:2px 0 4px}
.banner p{font-weight:700;font-size:16px;opacity:.92}
.zinfo{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.zinfo span{background:rgba(255,255,255,.88);color:var(--ink);text-shadow:none;border-radius:12px;padding:5px 12px;font-size:13px;font-weight:700}
.orbit{position:absolute;right:56px;top:50%;margin-top:-85px;width:170px;height:170px;z-index:1}
.orbit .core{position:absolute;inset:22px;border-radius:50%;background:rgba(255,255,255,.93);display:flex;align-items:center;justify-content:center;font-size:64px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.orbit .sat{position:absolute;width:54px;height:54px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 6px 16px rgba(0,0,0,.22);animation:bob 3s ease-in-out infinite}
.orbit .s1{top:-6px;left:-10px}
.orbit .s2{top:30px;right:-26px;animation-delay:.8s}
.orbit .s3{bottom:-8px;left:22px;animation-delay:1.6s}
.rscene{position:relative;height:150px;border-radius:22px;overflow:hidden;margin:0 0 16px}
.soonbox{margin-top:18px;background:#fff;border:3px dashed #f1e6d6;border-radius:20px;padding:14px 18px;font-weight:700}
.testtip{margin-top:16px;background:#fff;border:3px dashed #f1e6d6;border-radius:18px;padding:12px 16px;font-size:14px}
.testtip b{color:var(--peach-d)}

/* MISSIONS */
.missions{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
.mis{background:#fff;border-radius:22px;padding:16px;cursor:pointer;box-shadow:0 6px 18px rgba(120,100,60,.08);display:flex;gap:14px;align-items:center;border:3px solid transparent;transition:.18s}
.mis:hover{transform:translateY(-4px);border-color:#f1e6d6}
.mis .ic{font-size:38px;width:68px;height:68px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mis small{display:block;font-weight:800;color:var(--soft-ink);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.mis b{font-family:'Baloo 2';font-size:21px;display:block;line-height:1.1}
.mis span{font-size:13px;color:var(--soft-ink);display:block;line-height:1.3;margin-top:2px}
.mis .prog{font-size:12px;font-weight:800;color:#8a6a00;margin-top:5px}
.mis.soon{opacity:.6}

/* ACTIVITIES */
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
.act{background:#fff;border-radius:22px;padding:20px 16px;text-align:center;cursor:pointer;box-shadow:0 6px 18px rgba(120,100,60,.08);transition:.18s;border:3px solid transparent;position:relative}
.act:hover{transform:translateY(-5px);border-color:#f1e6d6}
.act .ic{font-size:44px;width:78px;height:78px;border-radius:24px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center}
.act b{font-family:'Baloo 2';font-size:20px;display:block}
.act span{font-size:13px;color:var(--soft-ink)}
.act .rate{position:absolute;top:10px;right:12px;font-size:14px;letter-spacing:1px}
.act.rec{border-color:var(--peach)}
.act .rtag{position:absolute;top:10px;left:10px;background:var(--peach);color:var(--peach-d);font-size:11px;font-weight:800;padding:2px 8px;border-radius:8px}
.back{background:#fff;color:var(--ink);font-weight:800;padding:8px 16px;border-radius:14px;margin-bottom:16px;box-shadow:0 3px 0 #efe6d8}

/* ── ACTIVITY STAGE ── */
.stage{background:#fff;border-radius:30px;padding:26px;box-shadow:0 10px 28px rgba(120,100,60,.09);margin-top:10px}
.stage-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stage-h h2{font-size:30px}
.stage-h .count{margin-left:auto;background:var(--butter);color:#8a6a00;font-weight:800;padding:6px 14px;border-radius:12px}
.hint{color:var(--soft-ink);font-size:14px;margin-bottom:14px}
.center{text-align:center}

/* Tronny (instructions) */
.tronny{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.tr-ava{font-size:46px;line-height:1}
.tr-bub{position:relative;flex:1;background:var(--sky);border-radius:18px;padding:10px 16px;font-size:15px}
.tr-bub::before{content:"";position:absolute;left:-8px;top:16px;border:8px solid transparent;border-right-color:var(--sky);border-left:0}
.tr-bub b{display:block}
.tr-bub span{display:block;color:var(--sky-d);font-weight:700;font-size:14px}
.tr-bub small{display:block;color:var(--soft-ink);margin-top:2px;font-weight:600}
.tr-say{width:52px;height:52px;border-radius:50%;background:#fff;font-size:24px;box-shadow:0 4px 0 #cfe1f5;border:2px solid var(--sky);flex-shrink:0}
.tr-say:active{transform:translateY(3px);box-shadow:0 1px 0 #cfe1f5}

/* flashcards */
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.fc{height:170px;perspective:800px;cursor:pointer}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;padding:10px;text-align:center}
.fc .f{font-size:64px}
.fc .b{transform:rotateY(180deg);font-family:'Baloo 2';font-size:26px;font-weight:800}
.fc .b small{font-family:'Nunito';font-size:13px;font-weight:700;color:var(--soft-ink);margin-top:4px;line-height:1.3}

/* memory */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:640px;margin:0 auto}
.mc{height:105px;border-radius:18px;background:linear-gradient(135deg,var(--lav),var(--sky));display:flex;align-items:center;justify-content:center;text-align:center;font-size:0;font-weight:800;cursor:pointer;transition:.2s;box-shadow:0 4px 0 #c9bff0;user-select:none;padding:4px}
.mc::after{content:"?";font-family:'Baloo 2';font-size:40px;color:#fff}
.mc.open,.mc.done{background:#fff;border:3px solid var(--lav);font-size:20px;box-shadow:none;line-height:1.1}
.mc.open::after,.mc.done::after{content:""}
.mc.emoji.open,.mc.emoji.done{font-size:46px}
.mc.done{border-color:var(--mint-d);background:var(--mint)}

/* option buttons */
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:620px;margin:18px auto 0}
.opts.four{grid-template-columns:repeat(4,1fr);max-width:720px}
.opts.text{grid-template-columns:1fr;max-width:560px}
.op{background:#fff;border:3px solid #efe6d8;border-radius:20px;padding:16px;font-size:52px;transition:.15s;box-shadow:0 4px 0 #efe6d8;color:var(--ink)}
.opts.text .op{font-size:18px;font-weight:700;text-align:left;padding:13px 18px}
.op:hover{border-color:var(--lav-d)}
.op.ok{background:var(--mint);border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.op.no{background:var(--pink);border-color:var(--no);box-shadow:0 4px 0 var(--no);animation:shake .4s}
.op.dis{pointer-events:none}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.speaker{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,var(--peach),var(--pink));font-size:52px;box-shadow:0 6px 0 #f1b89a;margin:6px auto;display:flex;align-items:center;justify-content:center}
.speaker:active{transform:translateY(3px)}
.fallback{display:inline-block;margin-top:8px;background:var(--butter);padding:4px 12px;border-radius:10px;font-weight:800}

/* spelling */
.bigemoji{font-size:90px;text-align:center;line-height:1.2}
.clue{text-align:center;color:var(--soft-ink);font-weight:700;font-size:14px}
.slots,.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.slot{width:48px;height:56px;border-radius:14px;border:3px dashed #d9cfbf;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-size:28px;font-weight:800;cursor:pointer;background:#fffdf8}
.slot.full{border-style:solid;border-color:var(--lav-d);background:var(--lav)}
.tile{width:48px;height:56px;border-radius:14px;background:var(--butter);font-family:'Baloo 2';font-size:28px;font-weight:800;color:#6b5200;box-shadow:0 4px 0 #e8d27a}
.tile.used{visibility:hidden}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}

/* balloons */
.balloons{font-size:40px;text-align:center;letter-spacing:4px;min-height:56px}
.masked{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.masked span{width:40px;height:50px;border-bottom:4px solid var(--lav-d);font-family:'Baloo 2';font-size:30px;font-weight:800;text-align:center;text-transform:uppercase}
.kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:620px;margin:14px auto 0}
.key{width:42px;height:46px;border-radius:12px;background:var(--sky);font-weight:800;font-size:18px;color:var(--sky-d);box-shadow:0 3px 0 #b3d4f5}
.key.ok{background:var(--mint);color:var(--ok);box-shadow:none;pointer-events:none}
.key.no{background:#eee;color:#bbb;box-shadow:none;pointer-events:none}

/* builder */
.line{min-height:62px;border:3px dashed #d9cfbf;border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;background:#fffdf8;margin-bottom:12px}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--peach);color:#8a4210;font-weight:800;font-size:17px;padding:10px 16px;border-radius:14px;box-shadow:0 4px 0 #f0bf9c}
.line .chip{background:var(--lav);color:var(--lav-d);box-shadow:0 4px 0 #c9bff0}

/* grammar */
.gtip{background:var(--butter);border-radius:18px;padding:12px 16px;margin-bottom:16px}
.gtip summary{font-weight:800;cursor:pointer;color:#6b5200}
.gtip ul{margin:8px 0 6px 20px}
.gtip li{margin:3px 0;font-weight:700}
.gtip p{font-size:14px;color:#6b5200}
.gq{font-family:'Baloo 2';font-size:30px;text-align:center;margin:10px 0}
.gq .gap{display:inline-block;min-width:90px;border-bottom:4px solid var(--lav-d);color:var(--lav-d)}

/* story */
.story{display:grid;grid-template-columns:1fr 1.3fr;gap:22px;align-items:start}
.story .pic{border-radius:24px;height:230px;background:linear-gradient(135deg,var(--mint),var(--sky));display:flex;align-items:center;justify-content:center;font-size:72px;letter-spacing:6px}
.story .txt{background:#fffaf0;border-radius:20px;padding:18px 20px;font-size:17px;line-height:1.75}
.q{margin-top:16px}
.q b{display:block;margin-bottom:6px}

.fb{min-height:28px;text-align:center;font-weight:800;margin-top:12px;font-size:17px}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)}
.done-box{text-align:center;padding:20px}
.done-box .big{font-size:80px}
.done-box h2{font-size:36px}
.done-box .rating{font-size:34px;letter-spacing:4px;margin:6px 0}
.progress{height:14px;background:#f3ecdf;border-radius:10px;overflow:hidden;margin:6px 0 20px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--pink-d),var(--lav-d));border-radius:10px;transition:width .4s}

/* ── PLACEMENT TEST ── */
.test-hero{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}
.test-hero .ph{height:260px;border-radius:26px;overflow:hidden;background:linear-gradient(135deg,var(--butter),var(--peach))}
.test-hero .ph img{width:100%;height:100%;object-fit:cover}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}
.steps div{background:#fff;border-radius:14px;padding:7px 12px;font-weight:700;font-size:13px;box-shadow:0 3px 10px rgba(0,0,0,.05)}
.blocktag{display:inline-block;font-weight:800;font-size:13px;padding:4px 12px;border-radius:10px;margin-bottom:8px}
.tq{font-family:'Baloo 2';font-size:28px;text-align:center;margin:6px 0}
.tshow{font-size:84px;text-align:center}
.reading{background:#fffaf0;border-radius:18px;padding:16px 20px;font-size:17px;max-width:640px;margin:0 auto}
.result{border-radius:30px;padding:30px;text-align:center}
.result .big{font-size:90px}
.result h1{font-size:48px}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:640px;margin:22px auto}
.bars div{background:#fff;border-radius:16px;padding:10px}
.bars b{font-family:'Baloo 2';font-size:20px;display:block}
.inp{border:3px solid #efe6d8;border-radius:14px;padding:10px 14px;font-size:16px;font-family:inherit;width:100%;max-width:260px;outline:none}
.inp:focus{border-color:var(--lav-d)}

/* toast + burst */

.burst{position:fixed;font-size:28px;pointer-events:none;z-index:98;animation:fly 1s ease-out forwards}

const $=id=>document.getElementById(id);
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);}
function mixOpts(o,a){const idx=shuffle(o.map((_,i)=>i));return {o:idx.map(i=>o[i]),a:idx.indexOf(a)};}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function gapHtml(q,fill){return esc(q).replace("___",'<span class="gap">'+(fill?esc(fill):"&nbsp;")+'</span>');}

/* ---- speech (English for the words, Spanish for Tronny's instructions) ---- */
function canSpeak(){return typeof window!=="undefined"&&"speechSynthesis" in window;}
function voiceFor(lang){
  let vs=[];try{vs=speechSynthesis.getVoices()||[];}catch(e){}
  if(lang==="es")return vs.find(v=>/^es[-_](CL|419|US|MX)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null;
  return vs.find(v=>/^en[-_]US/i.test(v.lang)&&/Google|Samantha|Aria|Jenny|Natural/i.test(v.name))||vs.find(v=>/^en[-_](US|GB)/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
}
function speak(t,lang){
  if(!canSpeak())return false;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t),v=voiceFor(lang||"en");
    u.lang=lang==="es"?(v?v.lang:"es-ES"):"en-US";u.rate=lang==="es"?1:.85;
    if(v)u.voice=v;
    speechSynthesis.speak(u);return true;
  }catch(e){return false;}
}
function speakWhenFree(t){let n=0;const tryIt=()=>{if(canSpeak()&&speechSynthesis.speaking&&n++<40)return setTimeout(tryIt,200);speak(t);};tryIt();}
function stopSpeech(){if(canSpeak())try{speechSynthesis.cancel();}catch(e){}}

/* ---- feedback ---- */
let toastT=null;
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1600);}
function burst(){
  const icons=["⭐","✨","🌟","💫"];
  for(let i=0;i<8;i++){
    const s=document.createElement("div");s.className="burst";
    s.textContent=icons[i%icons.length];
    s.style.left=(window.innerWidth/2)+"px";s.style.top=(window.innerHeight/2)+"px";
    s.style.setProperty("--dx",(Math.random()*300-150)+"px");
    s.style.setProperty("--dy",(Math.random()*-260-40)+"px");
    document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
  }
}
const PRAISE=["Great job!","Awesome!","Well done!","Super!","Fantastic!","You rock!","Excellent!"];
function praise(){return PRAISE[Math.floor(Math.random()*PRAISE.length)];}
function addStar(n){
  const before=STARS;STARS+=n;save("twk2_stars",STARS);$("starCount").textContent=STARS;
  burst();toast("⭐ +"+n+"  "+praise());
  const nb=BADGES.find(b=>before<b.n&&STARS>=b.n);
  if(nb)setTimeout(()=>toast(nb.ic+" New badge: "+nb.t+"!"),1700);
}
/* Stars only the first time an item is solved; later it's just praise */
function award(k,n){
  if(GOT[k]){burst();toast("✓ "+praise());return;}
  GOT[k]=1;save("twk2_got",GOT);addStar(n);
}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function dots(seed,n,maxY){
  const r=rng(seed);let s="";
  for(let i=0;i<n;i++){
    const x=r()*1000,y=r()*maxY,rad=.7+r()*1.9,op=.45+r()*.55;
    s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+rad.toFixed(2)+'" fill="#fff" opacity="'+op.toFixed(2)+'"'+(i%4===0?' class="tw"':i%7===0?' class="tw2"':'')+'/>';
  }
  return s;
}
function starPts(cx,cy,R,r){const p=[];for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,d=i%2?r:R;p.push((cx+Math.cos(a)*d).toFixed(1)+","+(cy+Math.sin(a)*d).toFixed(1));}return p.join(" ");}
function sky(id,stops){return '<linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+stops.map((c,i)=>'<stop offset="'+(i/(stops.length-1))+'" stop-color="'+c+'"/>').join("")+'</linearGradient>';}

let CUR={view:"home",lv:null,mi:null,act:null};
function L(id){return LEVELS.find(l=>l.id===id);}
function M(){return L(CUR.lv).missions.find(m=>m.n===CUR.mi);}
function key(act,item){return CUR.lv+"|"+CUR.mi+"|"+act+(item!==undefined?"|"+item:"");}
function hasContent(m){return !!(m&&m.vocab);}
function rating(score,total){const p=total?score/total:1;return p>=.9?3:p>=.6?2:1;}
function setBest(act,r){const k=key(act);if(!BEST[k]||r>BEST[k]){BEST[k]=r;save("twk2_best",BEST);}}
function missionStars(lv,n){return ACTS.reduce((s,a)=>s+(BEST[lv+"|"+n+"|"+a.id]||0),0);}
function starsTxt(r){return r?"⭐".repeat(r)+"☆".repeat(3-r):"";}

function go(v){
  stopSpeech();
  CUR={view:v,lv:null,mi:null,act:null};setNav(v);
  if(v==="home"||v==="levels"){renderHome();if(v==="levels")setTimeout(()=>{const s=$("lvsec");if(s)s.scrollIntoView({behavior:"smooth"});},60);else scrollTop();return;}
  if(v==="test")renderTestIntro();
  else if(v==="stars")renderStars();
  scrollTop();
}
function goLevel(id){stopSpeech();CUR={view:"level",lv:id,mi:null,act:null};setNav("levels");renderLevel();scrollTop();}
function goMission(id,n){
  const m=L(id).missions.find(x=>x.n===n);
  if(!hasContent(m)){toast("🚧 Coming soon! · ¡Muy pronto!");return;}
  stopSpeech();CUR={view:"mission",lv:id,mi:n,act:null};setNav("levels");renderMission();scrollTop();
}
function goAct(act){stopSpeech();CUR.view="act";CUR.act=act;renderAct(act);scrollTop();}
function nextAct(act){const i=ACTS.findIndex(a=>a.id===act);if(i<ACTS.length-1)goAct(ACTS[i+1].id);else goMission(CUR.lv,CUR.mi);}

function doneBox(act,score,total,r,msg){

  const face=r===3?"🏆":r===2?"🎉":"💪";
  const i=ACTS.findIndex(a=>a.id===act),next=ACTS[i+1];

    '<div class="row"><button class="btn alt" onclick="goAct(\''+act+'\')">🔄 Play again</button>'+
    (next?'<button class="btn" onclick="goAct(\''+next.id+'\')">'+next.icon+' '+next.name+' →</button>':'<button class="btn" onclick="goMission(CUR.lv,CUR.mi)">🏁 Mission menu</button>')+'</div></div>';
}
function renderAct(act){
  ({flash:actFlash,memory:actMemory,listen:actListen,spell:actSpell,balloon:actBalloon,builder:actBuilder,grammar:actGrammar,story:actStory,odd:actOdd})[act]();

}
function spellPool(){const m=M();return m.spell||m.vocab.filter(v=>/^[a-z]+$/i.test(v.w));}

/* ---------- 1. FLASHCARDS ---------- */
let FL=null;
function actFlash(){
  const V=M().vocab;FL={seen:new Set(),n:V.length,done:false};
  let h='<div class="fgrid">';
  V.forEach((v,i)=>{
    h+='<div class="fc" onclick="flipCard(this,'+i+')"><div class="in"><div class="f" style="background:'+COLS[i%6]+'">'+v.e+'</div><div class="b" style="background:#fff;border:3px solid #efe6d8">'+esc(v.w)+(v.es?'<small>'+esc(v.es)+'</small>':'')+'</div></div></div>';
  });
  h+='</div><div class="fb" id="ffb"></div>';
  $("app").innerHTML=shell("flash",h,"0 / "+V.length);
}
function flipCard(el,i){
  el.classList.toggle("flip");
  if(!el.classList.contains("flip"))return;
  speak(M().vocab[i].w);FL.seen.add(i);$("cnt").textContent=FL.seen.size+" / "+FL.n;
  if(FL.seen.size===FL.n&&!FL.done){
    FL.done=true;setBest("flash",3);award(key("flash","all"),2);
    $("ffb").className="fb ok";$("ffb").innerHTML='🎉 You saw all the cards!<br><button class="btn sm" style="margin-top:10px" onclick="nextAct(\'flash\')">Next activity →</button>';
  }
}

/* ---------- 2. MEMORY ---------- */
let MEM=null;
function actMemory(){
  const V=M().vocab,np=Math.min(6,V.length),pairs=shuffle(V).slice(0,np);
  const cards=shuffle(pairs.flatMap((p,i)=>[{k:i,t:p.e,emo:true,w:p.w},{k:i,t:p.w,emo:false,w:p.w}]));
  MEM={cards:cards,open:[],done:0,moves:0,lock:false,np:np};
  let h='<div class="mgrid">';
  cards.forEach((c,i)=>{h+='<div class="mc '+(c.emo?'emoji':'')+'" id="mc'+i+'" onclick="memClick('+i+')">'+esc(c.t)+'</div>';});
  h+='</div><div class="fb" id="mfb">Moves: 0</div>';
  $("app").innerHTML=shell("memory",h,"0 / "+np+" pairs");
}
function memClick(i){
  const G=MEM,el=$("mc"+i);
  if(G.lock||el.classList.contains("open")||el.classList.contains("done"))return;
  el.classList.add("open");G.open.push(i);
  if(!G.cards[i].emo)speak(G.cards[i].t);
  if(G.open.length===2){
    G.moves++;$("mfb").textContent="Moves: "+G.moves;
    const [a,b]=G.open;
    if(G.cards[a].k===G.cards[b].k){
      $("mc"+a).classList.add("done");$("mc"+b).classList.add("done");G.open=[];G.done++;
      $("cnt").textContent=G.done+" / "+G.np+" pairs";award(key("memory",G.cards[a].w),1);
      if(G.done===G.np){const r=G.moves<=G.np+3?3:G.moves<=G.np+7?2:1;setTimeout(()=>{$("stage").innerHTML=doneBox("memory",G.np,G.np,r,"All pairs found in "+G.moves+" moves!");},700);}
    }else{
      G.lock=true;
      setTimeout(()=>{$("mc"+a).classList.remove("open");$("mc"+b).classList.remove("open");G.open=[];G.lock=false;},850);
    }
  }
}

/* ---------- 3. LISTEN & PICK ---------- */
let LIS=null;
function actListen(){
  const V=M().vocab;
  LIS={rounds:shuffle(V).slice(0,Math.min(8,V.length)),i:0,score:0};
  $("app").innerHTML=shell("listen","","1 / "+LIS.rounds.length);
  listenRound();
}
function listenRound(){
  const G=LIS,V=M().vocab;
  if(G.i>=G.rounds.length){$("stage").innerHTML=doneBox("listen",G.score,G.rounds.length,rating(G.score,G.rounds.length));return;}
  const t=G.rounds[G.i];
  G.opts=shuffle([t].concat(shuffle(V.filter(v=>v.w!==t.w)).slice(0,2)));
  $("cnt").textContent=(G.i+1)+" / "+G.rounds.length;
  $("stage").innerHTML='<div class="progress"><i style="width:'+(G.i/G.rounds.length*100)+'%"></i></div>'+
    '<div class="center"><button class="speaker" onclick="speak(LIS.rounds[LIS.i].w)" aria-label="Listen">🔊</button>'+
    '<div class="hint">Tap the speaker and choose the picture.</div>'+(canSpeak()?'':'<div class="fallback">'+esc(t.w)+'</div>')+'</div>'+
    '<div class="opts">'+G.opts.map((o,j)=>'<button class="op" onclick="listenAns(this,'+j+')">'+o.e+'</button>').join('')+'</div><div class="fb" id="lfb"></div>';
  setTimeout(()=>speakWhenFree(t.w),350);
}
function listenAns(btn,j){
  const G=LIS,t=G.rounds[G.i];
  document.querySelectorAll("#stage .op").forEach(b=>b.classList.add("dis"));
  const good=G.opts[j].w===t.w;
  if(good){btn.classList.add("ok");G.score++;award(key("listen",t.w),1);$("lfb").className="fb ok";$("lfb").textContent="✓ "+t.w;}
  else{btn.classList.add("no");$("lfb").className="fb no";$("lfb").textContent="✗ It was: "+t.w+" "+t.e;
    document.querySelectorAll("#stage .op").forEach((b,k)=>{if(G.opts[k].w===t.w)b.classList.add("ok");});}
  G.i++;setTimeout(listenRound,good?1000:1700);
}

/* ---------- 4. SPELL IT ---------- */
let SP=null;
function actSpell(){
  const P=spellPool();
  SP={rounds:shuffle(P).slice(0,Math.min(6,P.length)),i:0,score:0};
  $("app").innerHTML=shell("spell","","1 / "+SP.rounds.length);
  spellRound();
}
function spellRound(){
  const S=SP;
  if(S.i>=S.rounds.length){$("stage").innerHTML=doneBox("spell",S.score,S.rounds.length,rating(S.score,S.rounds.length));return;}
  const t=S.rounds[S.i];
  S.word=t.w.toLowerCase();S.letters=shuffle(S.word.split(""));
  if(S.letters.join("")===S.word&&S.word.length>1)S.letters.reverse();
  S.slots=[];S.miss=false;
  $("cnt").textContent=(S.i+1)+" / "+S.rounds.length;
  $("stage").innerHTML='<div class="progress"><i style="width:'+(S.i/S.rounds.length*100)+'%"></i></div>'+
    '<div class="bigemoji">'+t.e+'</div>'+(t.es?'<p class="clue">Pista: '+esc(t.es)+'</p>':'')+
    '<div class="slots" id="slots"></div><div class="tiles" id="tiles"></div>'+
    '<div class="row"><button class="btn sm alt" onclick="speak(SP.word)">🔊 Hear it</button><button class="btn sm alt" onclick="spellClear()">↺ Clear</button><button class="btn sm alt" onclick="spellSkip()">Skip →</button></div><div class="fb" id="sfb"></div>';
  spellDraw();
}
function spellDraw(){
  const S=SP;
  let sh="";for(let k=0;k<S.word.length;k++){const f=S.slots[k];sh+='<div class="slot '+(f!==undefined?'full':'')+'" onclick="spellBack('+k+')">'+(f!==undefined?S.letters[f]:'')+'</div>';}
  $("slots").innerHTML=sh;
  $("tiles").innerHTML=S.letters.map((l,k)=>'<button class="tile '+(S.slots.includes(k)?'used':'')+'" onclick="spellPick('+k+')">'+l+'</button>').join('');
}
function spellPick(k){
  const S=SP;if(S.slots.includes(k)||S.slots.length>=S.word.length)return;
  S.slots.push(k);spellDraw();
  if(S.slots.length===S.word.length){
    const built=S.slots.map(x=>S.letters[x]).join("");
    if(built===S.word){if(!S.miss)S.score++;award(key("spell",S.word),1);$("sfb").className="fb ok";$("sfb").textContent="✓ "+S.word.toUpperCase()+"!";speak(S.word);S.i++;setTimeout(spellRound,1200);}
    else{S.miss=true;$("sfb").className="fb no";$("sfb").textContent="✗ Try again!";setTimeout(()=>{S.slots=[];spellDraw();$("sfb").textContent="";},900);}
  }
}
function spellBack(k){const S=SP;if(k<S.slots.length){S.slots=S.slots.slice(0,k);spellDraw();}}
function spellClear(){SP.slots=[];spellDraw();$("sfb").textContent="";}
function spellSkip(){const S=SP;$("sfb").className="fb no";$("sfb").textContent="The word was: "+S.word.toUpperCase();S.i++;setTimeout(spellRound,1400);}

/* ---------- 5. SAVE THE BALLOONS ---------- */
let BL=null;
function actBalloon(){
  const P=spellPool();
  BL={pool:shuffle(P),i:0,won:0,n:Math.min(5,P.length)};
  $("app").innerHTML=shell("balloon","","0 won");
  balloonRound();
}
function balloonRound(){
  const B=BL;
  if(B.i>=B.n){$("stage").innerHTML=doneBox("balloon",B.won,B.n,rating(B.won,B.n),"You saved "+B.won+" of "+B.n+" balloon sets!");return;}
  const t=B.pool[B.i];
  B.word=t.w.toLowerCase();B.guess=[];B.lives=6;B.over=false;
  $("stage").innerHTML='<p class="hint center">Guess the word before all the balloons pop! Clue: <span style="font-size:30px">'+t.e+'</span>'+(t.es?' · '+esc(t.es):'')+'</p>'+
    '<div class="balloons" id="bal"></div><div class="masked" id="mask"></div><div class="kb" id="kb"></div><div class="fb" id="bfb"></div>';
  let kb="";"abcdefghijklmnopqrstuvwxyz".split("").forEach(c=>{kb+='<button class="key" id="k_'+c+'" onclick="balloonKey(\''+c+'\')">'+c.toUpperCase()+'</button>';});
  $("kb").innerHTML=kb;balloonDraw();
}
function balloonDraw(){
  const B=BL;
  $("bal").textContent="🎈".repeat(B.lives)+"💥".repeat(6-B.lives);
  $("mask").innerHTML=B.word.split("").map(c=>'<span>'+(/[a-z]/.test(c)?(B.guess.includes(c)||B.over?c:""):c)+'</span>').join("");
}
function balloonKey(c){
  const B=BL;if(!B||B.over||B.guess.includes(c)||!$("k_"+c))return;
  B.guess.push(c);
  const k=$("k_"+c);
  if(B.word.includes(c)){k.classList.add("ok");}else{k.classList.add("no");B.lives--;}
  const win=B.word.split("").every(ch=>!/[a-z]/.test(ch)||B.guess.includes(ch));
  if(win){B.over=true;B.won++;award(key("balloon",B.word),2);$("cnt").textContent=B.won+" won";$("bfb").className="fb ok";$("bfb").innerHTML="✓ "+B.word.toUpperCase()+'!<br><button class="btn sm mint" style="margin-top:10px" onclick="BL.i++;balloonRound()">Next word →</button>';speak(B.word);}
  else if(B.lives<=0){B.over=true;$("bfb").className="fb no";$("bfb").innerHTML="Oh no! The word was "+B.word.toUpperCase()+'<br><button class="btn sm peach" style="margin-top:10px" onclick="BL.i++;balloonRound()">Next word →</button>';}
  balloonDraw();
}
document.addEventListener("keydown",e=>{if(CUR.act==="balloon"&&CUR.view==="act"&&/^[a-z]$/i.test(e.key)&&!e.ctrlKey&&!e.metaKey)balloonKey(e.key.toLowerCase());});

/* ---------- 6. SENTENCE BUILDER ---------- */
let BD=null;
function actBuilder(){
  BD={items:shuffle(M().sentences.map(s=>{const a=s.replace(/[.?!]+$/,"");return {s:s,answer:a,words:a.split(" ")};})),i:0,score:0};
  $("app").innerHTML=shell("builder","","1 / "+BD.items.length);
  builderRound();
}
function builderRound(){
  const D=BD;
  if(D.i>=D.items.length){$("stage").innerHTML=doneBox("builder",D.score,D.items.length,rating(D.score,D.items.length));return;}
  const it=D.items[D.i];
  D.pool=shuffle(it.words.map((w,k)=>({w:w,k:k})));D.line=[];D.tries=0;
  if(D.pool.map(x=>x.w).join(" ")===it.answer&&D.pool.length>1)D.pool.reverse();
  $("cnt").textContent=(D.i+1)+" / "+D.items.length;
  $("stage").innerHTML='<div class="progress"><i style="width:'+(D.i/D.items.length*100)+'%"></i></div>'+
    '<div class="line" id="bline"></div><div class="pool" id="bpool"></div>'+
    '<div class="row"><button class="btn sm alt" onclick="builderReset()">↺ Clear</button><button class="btn sm" onclick="builderCheck()">Check ✓</button></div><div class="fb" id="bdfb"></div>';
  builderDraw();
}
function builderDraw(){
  const D=BD;
  $("bline").innerHTML=D.line.map((x,j)=>'<button class="chip" onclick="builderOut('+j+')">'+esc(x.w)+'</button>').join("");
  $("bpool").innerHTML=D.pool.map((x,j)=>'<button class="chip" onclick="builderIn('+j+')">'+esc(x.w)+'</button>').join("");
}
function builderIn(j){const D=BD;D.line.push(D.pool.splice(j,1)[0]);builderDraw();}
function builderOut(j){const D=BD;D.pool.push(D.line.splice(j,1)[0]);builderDraw();}
function builderReset(){const D=BD;D.pool=D.pool.concat(D.line);D.line=[];builderDraw();$("bdfb").textContent="";}
function builderCheck(){
  const D=BD,it=D.items[D.i];
  if(D.pool.length){$("bdfb").className="fb no";$("bdfb").textContent="Use all the words!";return;}
  const s=D.line.map(x=>x.w).join(" ");
  if(s===it.answer){if(D.tries===0)D.score++;award(key("builder",it.s),1);$("bdfb").className="fb ok";$("bdfb").textContent="✓ "+it.s;speak(it.s);D.i++;setTimeout(builderRound,1500);}
  else{D.tries++;$("bdfb").className="fb no";
    if(D.tries>=2){$("bdfb").textContent="Answer: "+it.s;speak(it.s);D.i++;setTimeout(builderRound,2600);}
    else $("bdfb").textContent="✗ Not quite. Try again!";}
}

function oddAns(btn,j){
  const O=OD,it=O.items[O.i],good=j===O.cur.a;
  document.querySelectorAll("#stage .op").forEach((b,k)=>{b.classList.add("dis");if(k===O.cur.a)b.classList.add("ok");});
  if(good){O.score++;award(key("odd",it.i),1);$("ofb").className="fb ok";}else{btn.classList.add("no");$("ofb").className="fb no";}
  $("ofb").innerHTML=(good?"✓ ":"✗ ")+esc(it.why)+'<br><button class="btn sm" style="margin-top:10px" onclick="OD.i++;oddRound()">Next →</button>';
}

/* =========================================================
   PLACEMENT TEST
   ========================================================= */
let TS=null;
function renderTestIntro(){
  const my=MYLEVEL&&L(MYLEVEL);
  const prev=my?'<div class="mylevel" onclick="goLevel(\''+my.id+'\')">Last result: '+my.emoji+' '+my.name+'</div>':"";
  $("app").innerHTML='<div class="stage"><div class="test-hero"><div>'+
    '<h1 class="baloo" style="font-size:44px">🎯 Mide tu inglés ahora</h1>'+
    '<p style="font-size:17px;color:var(--soft-ink);margin:8px 0">Answer some fun questions and discover your level. The test gets harder step by step and stops when it finds your level. No stress — there are no bad results here, only a starting point! 😊</p>'+
    '<div class="steps">'+LEVELS.map(l=>'<div>'+l.emoji+' '+l.name+'</div>').join("")+'</div>'+
    '<p class="hint">Tip: use headphones for the listening questions 🎧</p>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px"><input class="inp" id="kname" placeholder="Your first name (optional)" value="'+esc(KIDNAME)+'"><button class="btn" onclick="startTest()">Start the test →</button></div>'+prev+
    '</div><div class="ph">'+imgTag(IMG.test,"Kids taking a test")+'</div></div></div>';
}
function startTest(){
  const n=($("kname").value||"").trim().slice(0,30);KIDNAME=n;save("twk2_name",n);
  TS={b:0,q:0,scores:TEST.map(()=>0),played:TEST.map(()=>false)};
  testQuestion();
}
function testQuestion(){
  const T=TS,Q=TEST[T.b][T.q],Lv=LEVELS[T.b];
  T.played[T.b]=true;T.cur=mixOpts(Q.o,Q.a);
  let body="";
  if(Q.type==="pic")body='<div class="tshow">'+Q.show+'</div><p class="tq">'+esc(Q.prompt)+'</p>';
  else if(Q.type==="listen")body='<p class="tq">'+esc(Q.prompt)+'</p><div class="center"><button class="speaker" onclick="speak(TEST[TS.b][TS.q].say)" aria-label="Listen">🔊</button>'+(canSpeak()?'':'<div class="fallback">'+esc(Q.say)+'</div>')+'</div>';
  else if(Q.type==="read")body='<div class="reading">📖 '+esc(Q.text)+'</div><p class="tq" style="font-size:24px;margin-top:14px">'+gapHtml(Q.prompt)+'</p>';
  else body='<p class="tq">'+gapHtml(Q.prompt)+'</p>';
  const n=TEST[T.b].length;
  $("app").innerHTML='<div class="stage">'+
    '<span class="blocktag" style="background:'+Lv.bg+';color:'+Lv.deep+'">Part '+(T.b+1)+' of '+TEST.length+' · '+Lv.emoji+' '+Lv.name+'</span>'+
    '<div class="stage-h" style="margin-bottom:6px"><h2>Question '+(T.q+1)+'</h2><span class="count">'+(T.q+1)+' / '+n+'</span></div>'+
    '<div class="progress"><i style="width:'+(T.q/n*100)+'%"></i></div>'+body+
    '<div class="'+(Q.big?"opts":"opts text")+'">'+T.cur.o.map((o,j)=>'<button class="op" onclick="testAns(this,'+j+')">'+esc(o)+'</button>').join("")+'</div></div>';
  if(Q.type==="listen")setTimeout(()=>speak(Q.say),400);
}
function testAns(btn,j){
  const T=TS;
  document.querySelectorAll(".stage .op").forEach(b=>b.classList.add("dis"));
  btn.style.borderColor="var(--lav-d)";btn.style.background="var(--lav)";
  if(j===T.cur.a)T.scores[T.b]++;
  setTimeout(()=>{
    T.q++;
    if(T.q<TEST[T.b].length)return testQuestion();
    const pass=T.scores[T.b]>=3;
    if(!pass||T.b===TEST.length-1)return testResult(T.b);
    T.b++;T.q=0;testBreak();
  },450);
}
function testBreak(){
  const Lv=LEVELS[TS.b],prev=LEVELS[TS.b-1];
  $("app").innerHTML='<div class="stage center"><div style="font-size:80px">🎉</div><h2 class="baloo" style="font-size:38px">Great job'+(KIDNAME?', '+esc(KIDNAME):'')+'!</h2>'+
    '<p class="hint" style="font-size:16px">You passed '+prev.emoji+' '+prev.name+'. Ready for a new challenge?</p>'+
    '<p style="margin:10px 0 18px"><span class="blocktag" style="background:'+Lv.bg+';color:'+Lv.deep+';font-size:15px">Next: Part '+(TS.b+1)+' · '+Lv.emoji+' '+Lv.name+'</span></p>'+
    '<div class="row"><button class="btn" onclick="testQuestion()">Continue →</button><button class="btn alt" onclick="testResult(TS.b)">Finish here</button></div></div>';
}
function testResult(idx){
  const T=TS,Lv=LEVELS[idx];
  MYLEVEL=Lv.id;save("twk2_level",Lv.id);
  const bars=TEST.map((_,k)=>{const P=LEVELS[k];return '<div><span>'+P.emoji+' '+P.name+'</span><b>'+(T.played[k]?T.scores[k]+' / '+TEST[k].length:'—')+'</b><small class="hint">'+(T.played[k]?("⭐".repeat(T.scores[k])||"·"):"not needed")+'</small></div>';}).join("");
  const soon=Lv.ready?'':'<p style="max-width:520px;margin:12px auto 0;font-weight:700">🚧 This level is coming soon! Meanwhile, practise in 🌙 Moon Walkers. · ¡Tu nivel viene muy pronto! Mientras tanto, practica en Moon Walkers.</p>';
  $("app").innerHTML='<div class="result" style="background:'+Lv.bg+'"><div class="rscene" style="background:'+Lv.sky+'">'+scene(Lv.id)+'</div>'+
    '<p style="font-weight:800;color:'+Lv.deep+'">'+(KIDNAME?esc(KIDNAME)+', your':'Your')+' level is</p><h1>'+Lv.name+'</h1>'+
    '<p style="font-weight:800">'+Lv.cefr+'</p><p style="max-width:520px;margin:10px auto 0">'+RESULT_MSG[Lv.id]+'</p>'+soon+
    '<div class="bars">'+bars+'</div>'+
    '<div class="row"><button class="btn" onclick="goLevel(\''+Lv.id+'\')">Go to '+Lv.name+' →</button>'+(Lv.ready?'':'<button class="btn mint" onclick="goLevel(\'moon\')">🌙 Moon Walkers</button>')+'<button class="btn alt" onclick="go(\'test\')">🔄 Take it again</button></div>'+
    '<p class="hint" style="margin-top:14px">This is a practice result. Your teacher will confirm your level in class.</p></div>';
  award("test|done",3);
}

/* =========================================================
   INIT
   ========================================================= */
$("starCount").textContent=STARS;
/* Direct links for homework: ?level=moon  or  ?level=moon&mission=3 */
(()=>{
  const q=new URLSearchParams(location.search),lv=q.get("level"),mi=parseInt(q.get("mission"),10);
  if(lv&&L(lv)){
    if(!isNaN(mi)&&hasContent(L(lv).missions.find(m=>m.n===mi)))goMission(lv,mi);else goLevel(lv);
  }else go("home");
})();
</script>
</body>
