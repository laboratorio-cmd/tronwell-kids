<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRONWELL KIDS · Practice Zone, Game Zone & Talk Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<meta name="description" content="TRONWELL KIDS: English practice for kids and teens — Practice Zone missions, Game Zone and Talk Club.">
<!-- Twemoji: the same emoji pictures on every computer, tablet and phone -->
<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js" crossorigin="anonymous" defer></script>
<style>
:root{
  --ink:#111827; --gray:#526173; --gray-2:#7b8797; --line:#dce7f2; --soft:#f7faff; --tint:#eef7ff; --bg:#ffffff;
  --blue:#0066cc; --blue-d:#004f9e; --orange:#f7a600; --orange-d:#d98a00; --orange-soft:#fff4dc;
  --mint:#dff5ec; --mint-d:#23825a; --lav:#ece7ff; --lav-d:#5b45c9; --peach:#ffe9db; --peach-d:#c9622a;
  --butter:#fff6d6; --butter-d:#a87e00; --sky:#e3f0ff; --sky-d:#2468b8; --pink:#ffe6ef; --pink-d:#c43f6d;
  --ok:#23825a; --no:#d14c4c; --r:18px; --fs:16px;
  /* legacy names used by the activities */
  --card:#fff; --soft-ink:#526173;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Roboto',Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:var(--fs);-webkit-font-smoothing:antialiased}
h1,h2,h3,.baloo{font-family:'Roboto',Arial,sans-serif;font-weight:900;letter-spacing:-.025em;line-height:1.12}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block}
img.emoji,main img.emoji,header img.emoji,.tbar img.emoji,.toast img.emoji{display:inline-block!important;position:static!important;width:1em!important;height:1em!important;margin:0 .04em!important;vertical-align:-.12em!important;object-fit:contain!important;transform:none!important;border-radius:0!important}
a{color:var(--blue)}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header::before{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--sky-d),var(--lav-d) 35%,var(--pink-d) 65%,var(--orange))}
.hwrap{max-width:1240px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{cursor:pointer;width:132px;display:flex;flex-direction:column}
.logo .lw{font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:26px;color:var(--blue);letter-spacing:-1px;line-height:1}
.logo .lbar{position:relative;height:12px;margin-top:3px;background:linear-gradient(90deg,rgba(3,169,244,0),#6cc9f7 55%,#03a9f4);display:flex;justify-content:flex-end;align-items:center;padding-right:8px}
.logo .lbar span{font-size:8px;font-weight:800;font-style:italic;color:#fff}
.logo .lbar i{position:absolute;right:0;top:0;bottom:0;width:4px;background:var(--orange)}
.kidstag{font-weight:900;font-size:15px;color:var(--orange-d);padding-left:14px;border-left:1px solid var(--line);letter-spacing:-.01em;cursor:pointer}
.kidstag small{display:block;font-size:10px;font-weight:700;color:var(--gray-2);letter-spacing:.12em;text-transform:uppercase}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;align-items:center}
nav button,nav a{font-weight:800;font-size:13.5px;padding:8px 12px;border-radius:10px;color:var(--gray);text-decoration:none;white-space:nowrap}
nav button:hover,nav a:hover{background:var(--soft);color:var(--ink)}
nav .on{background:var(--tint);color:var(--blue)}
nav .star-pill{background:var(--orange-soft);color:#7a5200}
nav .who{border:1px solid var(--line);background:#fff;color:var(--ink)}
nav .who:hover{border-color:var(--orange)}
main{max-width:1240px;margin:0 auto;padding:26px 22px 80px}
footer{border-top:1px solid var(--line);text-align:center;color:var(--gray);font-size:13px;padding:24px;background:var(--soft)}
footer b{color:var(--blue)}

/* ── COMMON ── */
.eyebrow{font-size:11.5px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--orange-d);display:flex;align-items:center;gap:9px}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--orange);border-radius:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;font-weight:800;font-size:15px;padding:12px 20px;border-radius:12px;transition:.15s;text-decoration:none;box-shadow:0 6px 16px rgba(0,102,204,.18)}
.btn:hover{background:var(--blue-d);transform:translateY(-1px)}
.btn.alt,.btn.soft{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.alt:hover,.btn.soft:hover{border-color:var(--blue);color:var(--blue);background:#fff}
.btn.or{background:var(--orange);color:#3b2700;box-shadow:0 6px 16px rgba(247,166,0,.28)}
.btn.or:hover{background:#ffb81f}
.btn.mint{background:var(--mint-d);box-shadow:none}
.btn.peach{background:var(--peach-d);box-shadow:none}
.btn.sm{font-size:13.5px;padding:8px 14px;border-radius:10px}
.sec{margin-top:46px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.sec h2{font-size:30px}
.sec .sub,.sec-h p{color:var(--gray);margin-top:4px}
.hint{color:var(--gray);font-size:14px;margin-bottom:14px}
.center{text-align:center}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--gray)}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--gray);padding:6px 0;margin-bottom:14px}
.back:hover{color:var(--blue)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}

/* ── TRONY (16-bit mascot) ── */
.trony{display:inline-block;background-size:contain;background-repeat:no-repeat;background-position:center bottom;image-rendering:pixelated;flex-shrink:0}
.trony.float{animation:tfloat 3.2s ease-in-out infinite}
@keyframes tfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.trony.pop{animation:tpop .5s ease-out}
@keyframes tpop{0%{transform:scale(.7) translateY(14px)}70%{transform:scale(1.06)}100%{transform:none}}
.tbub{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:700;box-shadow:0 10px 24px rgba(17,24,39,.08)}

/* ── HERO ── */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:34px;align-items:center;padding:10px 0 4px}
.hero h1{font-size:clamp(38px,5vw,58px);margin:12px 0 14px}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero h1 span{color:var(--orange-d)}
.hero p.lead{font-size:17px;color:var(--gray);max-width:540px}
.hero .ph{position:relative;border-radius:26px;overflow:hidden;height:380px;background:var(--tint);box-shadow:0 20px 50px rgba(0,102,204,.14)}
.hero .ph img{width:100%;height:100%;object-fit:cover}
.hero .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(36,104,184,.14),rgba(91,69,201,.08) 50%,rgba(247,166,0,.16))}
.hero .tr-hero{position:absolute;left:-26px;bottom:-22px;z-index:2;width:150px;height:190px}
.hero .tr-say{position:absolute;left:112px;bottom:118px;z-index:3;width:max-content;max-width:240px}
.hero .tr-say::before{content:"";position:absolute;left:-7px;bottom:16px;width:12px;height:12px;background:#fff;border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:26px}
.stats div b{display:block;font-size:28px;font-weight:900;line-height:1}
.stats div span{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gray-2)}
.mylevel{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:var(--orange-soft);color:#7a5200;font-weight:800;padding:7px 14px;border-radius:999px;font-size:14px;cursor:pointer}

/* ── DOORS (3 zones) ── */
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.door{position:relative;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#fff;cursor:pointer;text-align:left;transition:.2s;display:flex;flex-direction:column;text-decoration:none;color:var(--ink)}
.door:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(17,24,39,.10);border-color:var(--c)}
.door .im{height:170px;position:relative;background:var(--tint)}
.door .im img{width:100%;height:100%;object-fit:cover}
.door .im::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(17,24,39,.55),rgba(17,24,39,0) 60%)}
.door .im b{position:absolute;left:18px;bottom:12px;z-index:1;color:#fff;font-size:24px;font-weight:900;letter-spacing:-.02em}
.door .bd{padding:14px 18px 18px;border-top:4px solid var(--c);flex:1;display:flex;flex-direction:column;gap:8px}
.door p{color:var(--gray);font-size:14px}
.door .go{margin-top:auto;font-weight:900;color:var(--c);font-size:14px}
.door .soon{position:absolute;top:12px;right:12px;z-index:2;background:#fff;color:var(--ink);font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px}

/* ── LEVEL CARDS ── */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.lvcard{background:#fff;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:20px;overflow:hidden;cursor:pointer;transition:.2s;text-align:left;display:flex;flex-direction:column;position:relative}
.lvcard:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(17,24,39,.10)}
.lvcard.mine{box-shadow:0 0 0 3px var(--c)}
.lvcard .top{height:150px;position:relative;background:var(--tint);overflow:hidden}
.lvcard .top img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.lvcard:hover .top img{transform:scale(1.04)}
.lvcard .top::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(17,24,39,.55),rgba(17,24,39,0) 60%)}
.lvcard .num{position:absolute;left:14px;bottom:10px;z-index:1;color:#fff;font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.lvcard .ribbon{position:absolute;top:12px;right:12px;z-index:1;background:#fff;color:var(--c);font-weight:900;font-size:12px;padding:4px 10px;border-radius:999px}
.lvcard .bd{padding:14px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.lvcard h3{font-size:24px}
.lvcard .tags{display:flex;gap:6px;flex-wrap:wrap}
.lvcard .tags .tag:first-child{background:var(--cs);border-color:transparent;color:var(--c)}
.lvcard p{color:var(--gray);font-size:14px}
.lvbar{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.lvbar i{display:block;height:100%;background:var(--c);border-radius:999px}
.lvcard small{font-size:12px;font-weight:800;color:var(--gray-2)}

/* ── LEVEL HEAD ── */
.lvhead{border-radius:24px;padding:26px 30px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;background:linear-gradient(110deg,var(--cs),#fff);border:1px solid var(--line);border-top:5px solid var(--c)}
.lvhead .big{font-size:76px;font-weight:900;color:var(--c);line-height:1;letter-spacing:-.04em}
.lvhead h1{font-size:34px}
.lvhead p{color:var(--gray);font-weight:500;max-width:640px}
.lvhead .can{margin-left:auto;max-width:330px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;font-size:13px;color:var(--gray)}
.lvhead .can b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}

/* ── MISSIONS (photo cards) ── */
.missions{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
.mis{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:.18s;text-align:left;display:flex;flex-direction:column;position:relative}
.mis:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(17,24,39,.10);border-color:var(--c,var(--blue))}
.mis .im{height:140px;position:relative;background:var(--tint)}
.mis .im img{width:100%;height:100%;object-fit:cover}
.mis .im .ic{position:absolute;left:12px;bottom:-18px;width:44px;height:44px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 16px rgba(17,24,39,.14)}
.mis .done{position:absolute;top:10px;right:10px;background:var(--mint-d);color:#fff;font-size:12px;font-weight:900;padding:3px 9px;border-radius:999px}
.mis .bd{padding:24px 16px 16px;display:flex;flex-direction:column;gap:3px;flex:1}
.mis small{display:block;font-weight:900;color:var(--c,var(--orange-d));font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.mis b{font-size:19px;display:block;line-height:1.15;font-weight:900}
.mis span{font-size:13px;color:var(--gray);display:block;line-height:1.35}
.mis .prog{font-size:12px;font-weight:800;color:#7a5200;margin-top:auto;padding-top:8px}
.mis.soon{opacity:.6}
.mis .ttag{display:inline-block;margin-top:6px;font-size:11px;font-weight:900;color:var(--peach-d);background:var(--peach);padding:2px 8px;border-radius:999px;width:max-content}

/* ── MISSION HERO ── */
.mhero{position:relative;border-radius:26px;overflow:hidden;min-height:300px;display:flex;align-items:flex-end;background:var(--ink)}
.mhero > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mhero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(17,24,39,.82),rgba(17,24,39,.45) 55%,rgba(17,24,39,.1))}
.mhero .ov{position:relative;z-index:1;padding:28px 32px;color:#fff;max-width:720px}
.mhero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.mhero .meta span{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:800}
.mhero .meta .lvb{background:var(--c);border-color:var(--c)}
.mhero h1{font-size:clamp(32px,4.4vw,48px)}
.mhero .words{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.mhero .words span{background:#fff;color:var(--ink);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:800}
.mhero .tr-m{position:absolute;right:26px;bottom:14px;z-index:1;width:120px;height:150px}
.testtip{margin-top:16px;background:var(--peach);border:1px solid #ffd2b8;border-radius:16px;padding:12px 16px;font-size:14px}
.testtip b{color:var(--peach-d)}
.soonbox{margin-top:18px;background:var(--soft);border:1px dashed var(--line);border-radius:16px;padding:14px 18px;font-weight:700}

/* ── ACTIVITY CARDS ── */
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.act{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 16px;text-align:left;cursor:pointer;transition:.18s;position:relative;display:flex;gap:14px;align-items:center}
.act:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(17,24,39,.09);border-color:var(--blue)}
.act .ic{font-size:28px;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.act b{font-size:17px;display:block;font-weight:900}
.act span{font-size:13px;color:var(--gray)}
.act .rate{position:absolute;top:8px;right:12px;font-size:12px;letter-spacing:1px}
.act.rec{border-color:#ffc9a8}
.act .rtag{position:absolute;bottom:8px;right:10px;background:var(--peach);color:var(--peach-d);font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:999px}
.act.feature{grid-column:1/-1;background:linear-gradient(110deg,var(--pink),#fff 70%);border-color:#ffc9da}
.act.feature .ic{width:64px;height:64px;font-size:32px}
.newtag,.act .newtag{background:var(--pink-d);color:#fff;display:inline-block;font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}

/* Game Zone + Talk Club strips */
.gzone{margin-top:20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:linear-gradient(110deg,#141a3a,#25306b 60%,#3a2a7a);color:#f5f7ff;border-radius:20px;padding:16px 20px;text-decoration:none}
.gzone .gz-ic{font-size:36px;line-height:1}
.gzone b{display:block;font-size:20px;font-weight:900;color:#ffd166}
.gzone span{color:#c3cbea;font-weight:600;font-size:14px}
.tzone{background:linear-gradient(110deg,#c43f6d,#e0617f 60%,#f08a5d)}
.tzone b{color:#fff}
.tzone span{color:#ffe3ea}
.tzone .gz-go{background:#fff;color:#c43f6d}
.gzone .gz-go{margin-left:auto;background:#ffd166;color:#141a3a;font-weight:900;border-radius:10px;padding:9px 16px}

/* ── ACTIVITY STAGE ── */
.stage{background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px;margin-top:6px}
.stage-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stage-h h2{font-size:28px}
.stage-h .count{margin-left:auto;background:var(--orange-soft);color:#7a5200;font-weight:900;padding:6px 14px;border-radius:999px;font-size:14px}

/* instructions bubble */
.tronny{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.tr-ava{width:78px;height:96px}
.tr-bub{position:relative;flex:1;background:var(--sky);border-radius:18px;padding:11px 16px;font-size:15px}
.tr-bub b{display:block;font-weight:800}
.tr-bub span{display:block;color:var(--sky-d);font-weight:700;font-size:14px}
.tr-bub small{display:block;color:var(--gray);margin-top:2px;font-weight:600}
.tr-say{width:48px;height:48px;border-radius:50%;background:#fff;font-size:22px;border:1px solid var(--line);flex-shrink:0;align-self:center}
.tr-say:hover{border-color:var(--blue)}

/* flashcards */
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.fc{height:170px;perspective:800px;cursor:pointer}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;padding:10px;text-align:center;border:1px solid var(--line)}
.fc .f{font-size:64px}
.fc .b{transform:rotateY(180deg);font-size:26px;font-weight:900}
.fc .b small{font-size:13px;font-weight:700;color:var(--gray);margin-top:4px;line-height:1.3}
.fc .f.def{font-size:15px;font-weight:700;line-height:1.35;gap:6px}
.fc .f .fe{font-size:38px;line-height:1}
/* memory */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:640px;margin:0 auto}
.mc{height:105px;border-radius:16px;background:linear-gradient(135deg,var(--sky-d),var(--lav-d));display:flex;align-items:center;justify-content:center;text-align:center;font-size:0;font-weight:800;cursor:pointer;transition:.2s;user-select:none;padding:4px;color:var(--ink)}
.mc::after{content:"?";font-size:38px;font-weight:900;color:#fff}
.mc.open,.mc.done{background:#fff;border:2px solid var(--lav-d);font-size:20px;line-height:1.1}
.mc.open::after,.mc.done::after{content:""}
.mc.emoji.open,.mc.emoji.done{font-size:46px}
.mc.def.open,.mc.def.done{font-size:13px;line-height:1.25;font-weight:700}
.mc.done{border-color:var(--mint-d);background:var(--mint)}
/* options */
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:620px;margin:18px auto 0}
.opts.four{grid-template-columns:repeat(4,1fr);max-width:720px}
.opts.text{grid-template-columns:1fr;max-width:560px}
.op{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;font-size:52px;transition:.15s;color:var(--ink)}
.opts.text .op{font-size:17px;font-weight:700;text-align:left;padding:12px 18px}
.opts.four.words .op{font-size:18px;font-weight:800;padding:20px 10px}
.op:hover{border-color:var(--blue);background:var(--soft)}
.op.ok{background:var(--mint);border-color:var(--ok)}
.op.no{background:var(--pink);border-color:var(--no);animation:shake .4s}
.op.dis{pointer-events:none}
.op.tans{box-shadow:0 0 0 3px var(--orange)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.speaker{width:104px;height:104px;border-radius:50%;background:var(--blue);color:#fff;font-size:46px;margin:6px auto;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,102,204,.25)}
.speaker:active{transform:scale(.96)}
.fallback{display:inline-block;margin-top:8px;background:var(--butter);padding:4px 12px;border-radius:10px;font-weight:800}
/* spelling */
.bigemoji{font-size:90px;text-align:center;line-height:1.2}
.clue{text-align:center;color:var(--gray);font-weight:700;font-size:14px}
.defclue{max-width:540px;margin:6px auto 4px;background:var(--sky);border-radius:16px;padding:14px 18px;font-size:19px;font-weight:700;text-align:center;line-height:1.4}
.slots,.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.slot{width:48px;height:56px;border-radius:12px;border:2px dashed #c9d6e6;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;cursor:pointer;background:var(--soft)}
.slot.full{border-style:solid;border-color:var(--lav-d);background:var(--lav)}
.tile{width:48px;height:56px;border-radius:12px;background:var(--orange-soft);border:1px solid #f3d38a;font-size:28px;font-weight:900;color:#7a5200}
.tile.used{visibility:hidden}
/* balloons */
.balloons{font-size:40px;text-align:center;letter-spacing:4px;min-height:56px}
.masked{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.masked span{width:40px;height:50px;border-bottom:4px solid var(--lav-d);font-size:30px;font-weight:900;text-align:center;text-transform:uppercase}
.kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:620px;margin:14px auto 0}
.key{width:42px;height:46px;border-radius:10px;background:var(--sky);font-weight:900;font-size:18px;color:var(--sky-d);border:1px solid #c7dcf5}
.key.ok{background:var(--mint);color:var(--ok);pointer-events:none}
.key.no{background:#eef0f3;color:#b5bcc6;pointer-events:none}
/* builder */
.line{min-height:62px;border:2px dashed #c9d6e6;border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;background:var(--soft);margin-bottom:12px}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--peach);color:#7a3a12;font-weight:800;font-size:17px;padding:10px 16px;border-radius:12px;border:1px solid #ffd2b8}
.line .chip{background:var(--lav);color:var(--lav-d);border-color:#d6ccff}
/* grammar */
.gtip{background:var(--butter);border:1px solid #f3e2a0;border-radius:16px;padding:12px 16px;margin-bottom:16px}
.gtip summary{font-weight:800;cursor:pointer;color:#5c4500}
.gtip ul{margin:8px 0 6px 20px}
.gtip li{margin:3px 0;font-weight:700}
.gtip p{font-size:14px;color:#5c4500}
.gq{font-size:28px;font-weight:900;text-align:center;margin:10px 0}
.gq .gap,.sp-sent .gap{display:inline-block;min-width:90px;border-bottom:4px solid var(--lav-d);color:var(--lav-d)}
/* story */
.story{display:grid;grid-template-columns:1fr 1.3fr;gap:22px;align-items:start}
.story.long{grid-template-columns:.55fr 1.45fr}
.story .pic{border-radius:20px;height:230px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:72px;letter-spacing:6px;overflow:hidden;position:relative}
.story .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.story.long .pic{height:190px;position:sticky;top:96px}
.story .txt{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:18px 20px;font-size:17px;line-height:1.75}
.q{margin-top:16px}
.q b{display:block;margin-bottom:6px}
.fb{min-height:28px;text-align:center;font-weight:800;margin-top:12px;font-size:17px}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)}
.done-box{text-align:center;padding:10px 20px 20px}
.done-box .big{font-size:76px;line-height:1.1}
.done-box h2{font-size:32px;margin-top:6px}
.done-box .rating{font-size:30px;letter-spacing:4px;margin:6px 0}
.progress{height:10px;background:var(--soft);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:6px 0 20px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--lav-d));border-radius:999px;transition:width .4s}

/* ── PLACEMENT TEST ── */
.test-hero{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}
.test-hero .ph{height:280px;border-radius:22px;overflow:hidden;background:var(--tint)}
.test-hero .ph img{width:100%;height:100%;object-fit:cover}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}
.steps div{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px}
.blocktag{display:inline-block;font-weight:900;font-size:13px;padding:4px 12px;border-radius:999px;margin-bottom:8px}
.tq{font-size:26px;font-weight:900;text-align:center;margin:6px 0}
.tshow{font-size:84px;text-align:center}
.reading{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:16px 20px;font-size:17px;max-width:640px;margin:0 auto}
.result{border-radius:24px;padding:30px;text-align:center;border:1px solid var(--line)}
.result .tr-res{width:130px;height:160px;margin:0 auto 6px}
.result h1{font-size:46px}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:640px;margin:22px auto}
.bars div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}

.inp{border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px;font-family:inherit;width:100%;max-width:260px;outline:none}

/* ── SPEAK UP! + SPEAKING STATION ── */
.sp-card{background:var(--soft);border:1px solid var(--line);border-radius:22px;padding:18px;text-align:center;max-width:680px;margin:0 auto}

.sp-pic{font-size:88px;line-height:1.15}
.sp-word{font-size:42px;font-weight:900;color:var(--lav-d);line-height:1.2}
.sp-sent{font-size:28px;font-weight:800;line-height:1.3;margin:8px 0}
.sp-mid{text-align:center;margin-top:16px}
.mic{width:104px;height:104px;border-radius:50%;background:var(--pink-d);color:#fff;font-size:46px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(196,63,109,.3)}
.mic:active{transform:scale(.96)}
.mic.rec{background:#c0392b;animation:micpulse 1.2s infinite}
@keyframes micpulse{0%{box-shadow:0 0 0 0 rgba(209,76,76,.5)}70%{box-shadow:0 0 0 18px rgba(209,76,76,0)}100%{box-shadow:0 0 0 0 rgba(209,76,76,0)}}
.sp-live{margin-top:10px;font-weight:800;color:var(--no);display:flex;align-items:center;justify-content:center;gap:10px}

.sp-wait{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;color:var(--gray);padding:30px 0}

.sp-stars{text-align:center;font-size:42px;letter-spacing:6px;margin-top:14px;line-height:1.2}
.sp-stars .dim{opacity:.3}
.sp-msg{text-align:center;font-weight:800;font-size:19px;margin-top:4px}
.sp-heard{text-align:center;color:var(--gray);font-size:14px;margin-top:4px}
.sp-say{text-align:center;font-weight:800;font-size:20px;margin-top:16px;color:var(--lav-d)}

.mbar{height:6px;background:rgba(0,0,0,.08);border-radius:3px;overflow:hidden;margin-top:6px}
.mbar i{display:block;height:100%;background:var(--orange);width:0;transition:width .3s}
.sp-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 4px}
.sp-chips span{background:var(--peach);color:#7a3a12;font-weight:800;font-size:18px;padding:8px 14px;border-radius:12px}
.sp-answer{font-size:24px;font-weight:800;color:var(--ok);margin-top:8px}
.sp-tip{font-size:14px;color:var(--gray);font-weight:700;margin-top:6px}
.sp-opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.sp-opts span{background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px 14px;font-weight:800;font-size:17px;color:var(--lav-d)}
.sp-opts span.right{border-color:var(--ok);background:var(--mint);color:var(--ok)}
.sp-opts span.said{border-color:var(--no);background:var(--pink);color:var(--no);text-decoration:line-through}
.station{margin-top:22px;background:linear-gradient(110deg,var(--pink),#fff 55%,var(--lav));border:1px solid #ffd3e2;border-radius:22px;padding:20px 22px}
.st-head{display:flex;gap:14px;align-items:center}
.st-ic{width:56px;height:56px;border-radius:16px;background:var(--pink-d);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}

.st-head p{color:var(--gray);font-weight:500;font-size:14px}
.st-pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0 12px}
.st-pick span{font-weight:800;font-size:13px;color:var(--gray);margin-right:4px}
.pchip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-weight:800;font-size:13px;color:var(--ink)}
.pchip:hover{border-color:var(--blue)}
.pchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.stiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stile{position:relative;border-radius:18px;padding:16px;text-align:left;cursor:pointer;transition:.18s;border:1px solid rgba(17,24,39,.06)}
.stile:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(17,24,39,.08)}
.stile .ic{font-size:30px;line-height:1.2}
.stile b{display:block;font-size:19px;font-weight:900;line-height:1.1;margin-top:4px}
.stile small{display:block;font-weight:800;color:var(--gray);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.stile span{display:block;font-size:13px;margin-top:4px;color:var(--gray)}
.stile .rate{position:absolute;top:10px;right:12px;font-size:12px}
.sp-gate{text-align:center;max-width:620px;margin:0 auto;padding:6px}
.sp-gate .big{font-size:60px;line-height:1.2}
.sp-gate h3{font-size:26px;margin:4px 0 8px}
.sp-gate p{margin-bottom:8px}

/* ── WELCOME (who / age / level) ── */
.welcome{max-width:980px;margin:0 auto}
.wl-top{display:flex;align-items:flex-end;gap:16px;margin-bottom:8px}
.wl-top .trony{width:120px;height:150px}
.wl-top h1{font-size:clamp(30px,4vw,44px)}
.wl-top p{color:var(--gray);font-size:16px}
.wstep{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px 22px;margin-top:16px}
.wstep h2{font-size:20px;display:flex;align-items:center;gap:10px}
.wstep h2 .n{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.wstep h2 small{font-weight:600;color:var(--gray-2);font-size:14px}
.wopts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.wopts.two{grid-template-columns:repeat(2,1fr)}
.wopts.lv{grid-template-columns:repeat(3,1fr)}
.wopt{border:2px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;background:#fff;transition:.15s;display:flex;flex-direction:column;gap:2px}

.wopt.on{border-color:var(--blue);background:var(--tint);box-shadow:0 0 0 3px rgba(0,102,204,.12)}
.wopt b{font-size:18px;font-weight:900}
.wopt span{font-size:13px;color:var(--gray)}
.wopt .ic{font-size:28px}
.wopt.lvo{border-top:4px solid var(--c)}
.wopt.lvo i{font-style:normal;font-size:11px;font-weight:900;color:var(--c);letter-spacing:.08em;text-transform:uppercase}
.wsave{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}

/* ── BADGES ── */
.badges{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.bdg{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.bdg .ic{font-size:30px;filter:grayscale(1);opacity:.35}
.bdg.got{border-color:#f3d38a;background:var(--orange-soft)}
.bdg.got .ic{filter:none;opacity:1}
.bdg b{font-size:15px;font-weight:900;display:block}
.bdg small{color:var(--gray);font-size:12.5px}

/* ── TEACHER ── */
.tbar{position:fixed;right:16px;bottom:16px;z-index:70;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px rgba(17,24,39,.18);padding:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:calc(100vw - 32px)}
.tbar .ttl{display:flex;align-items:center;gap:6px;font-weight:900;font-size:13px;color:var(--gray);padding-right:6px;border-right:1px solid var(--line)}

.tbar button{font-weight:800;font-size:13px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:#fff}
.tbar button:hover{border-color:var(--blue);color:var(--blue)}
.tbar button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.tbar .clk{font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;min-width:58px;text-align:center}
.tbar .clk.run{color:var(--blue)} .tbar .clk.end{color:var(--no)}
.tbar.min > :not(.ttl):not(.tmin){display:none}
.plan{margin-top:22px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#fff}
.plan > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 20px;background:linear-gradient(110deg,var(--sky),#fff)}
.plan > summary::-webkit-details-marker{display:none}
.plan > summary .pic{font-size:34px;line-height:1}

.plan > summary span{color:var(--gray);font-size:14px;display:block}
.plan .pb{padding:18px 20px;display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
.plan h4{font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--orange-d);margin-bottom:8px}
.flow{display:flex;flex-direction:column;gap:6px}
.flow div{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.flow div:hover{border-color:var(--blue)}
.flow div i{font-style:normal;font-weight:900;color:var(--blue);min-width:44px;font-size:13px}
.flow div b{font-weight:800;font-size:14px}
.flow div span{font-size:12.5px;color:var(--gray);margin-left:auto}
.vlist{display:flex;flex-wrap:wrap;gap:6px}
.vlist span{border:1px solid var(--line);border-radius:10px;padding:4px 9px;font-size:13px;font-weight:700;background:var(--soft)}
.slist{margin:4px 0 0 18px;font-size:14px}
.slist li{margin:3px 0}
body.classview{--fs:19px}

body.classview .gq{font-size:36px}

.soonpage{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;background:linear-gradient(110deg,var(--lav),#fff 60%);border:1px solid var(--line);border-radius:26px;padding:30px}

.soonpage .sph img{width:100%;height:100%;object-fit:cover}
.soonpage h1{font-size:40px}
.soonpage p{color:var(--gray);max-width:620px;margin-top:8px}

/* toast + burst */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:14px;font-weight:800;box-shadow:0 10px 28px rgba(0,0,0,.2);transition:.35s;z-index:99}

}

const IMG={hero:px(5212687),test:px(5621938)};

    text:[
      "When Diego arrived in Bulgaria for a three-month school exchange, he wasn't worried about communication. He had been given a small phrasebook, and most of his classmates spoke good English. On his first day, however, a simple question caused a big misunderstanding.",

/* ---- speech (English for the words, Spanish for Tronny's instructions) ---- */
function canSpeak(){return typeof window!=="undefined"&&"speechSynthesis" in window;}
function voiceFor(lang){
  let vs=[];try{vs=speechSynthesis.getVoices()||[];}catch(e){}
  if(lang==="es")return vs.find(v=>/^es[-_](CL|419|US|MX)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null;
  return vs.find(v=>/^en[-_]US/i.test(v.lang)&&/Google|Samantha|Aria|Jenny|Natural/i.test(v.name))||vs.find(v=>/^en[-_](US|GB)/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
}
function speak(t,lang,rate){
  if(!canSpeak())return false;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t),v=voiceFor(lang||"en");
    u.lang=lang==="es"?(v?v.lang:"es-ES"):"en-US";u.rate=rate||(lang==="es"?1:.85);
    if(v)u.voice=v;
    speechSynthesis.speak(u);return true;
  }catch(e){return false;}
}
function speakWhenFree(t){let n=0;const tryIt=()=>{if(canSpeak()&&speechSynthesis.speaking&&n++<40)return setTimeout(tryIt,200);speak(t);};tryIt();}
function stopSpeech(){spCancel();SPK=null;if(canSpeak())try{speechSynthesis.cancel();}catch(e){}}
if(canSpeak()){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}catch(e){}}
function sayInstr(act){const I=INSTR[act];if(voiceFor("es"))speak(I.es,"es");else speak(I.en,"en");}
const HEARD={};
function autoInstr(act){if(!HEARD[act]){HEARD[act]=1;setTimeout(()=>sayInstr(act),300);}}

/* Mission picture: the mission emoji with three pictures of its topic orbiting around it */
function orbitHtml(m){
  let sats=m.pics;
  if(!sats){const es=[...new Set(m.vocab.filter(v=>v.e).map(v=>v.e))].filter(e=>e!==m.emoji),n=es.length;sats=n>=3?[es[0],es[Math.floor(n/2)],es[n-1]]:es;}
  return '<div class="orbit"><div class="core">'+m.emoji+'</div>'+sats.map((e,i)=>'<span class="sat s'+(i+1)+'">'+e+'</span>').join("")+'</div>';
}

let CUR={view:"home",lv:null,mi:null,act:null};
function L(id){return LEVELS.find(l=>l.id===id);}
function M(){return L(CUR.lv).missions.find(m=>m.n===CUR.mi);}
function key(act,item){return CUR.lv+"|"+CUR.mi+"|"+act+(item!==undefined?"|"+item:"");}
function hasContent(m){return !!(m&&m.vocab);}
function rating(score,total){const p=total?score/total:1;return p>=.9?3:p>=.6?2:1;}
function setBest(act,r){const k=key(act);if(!BEST[k]||r>BEST[k]){BEST[k]=r;save("twk2_best",BEST);}}
function missionStars(lv,n){return ACTS.reduce((s,a)=>s+(BEST[lv+"|"+n+"|"+a.id]||0),0);}
function starsTxt(r){return r?"⭐".repeat(r)+"☆".repeat(3-r):"";}

function go(v){
  stopSpeech();
  CUR={view:v,lv:null,mi:null,act:null};setNav(v);
  if(v==="home"||v==="levels"){renderHome();if(v==="levels")setTimeout(()=>{const s=$("lvsec");if(s)s.scrollIntoView({behavior:"smooth"});},60);else scrollTop();return;}
  if(v==="test")renderTestIntro();
  else if(v==="stars")renderStars();
  scrollTop();
}
function goLevel(id){stopSpeech();CUR={view:"level",lv:id,mi:null,act:null};setNav("levels");renderLevel();scrollTop();}
function goMission(id,n){
  const m=L(id).missions.find(x=>x.n===n);
  if(!hasContent(m)){toast("🚧 Coming soon! · ¡Muy pronto!");return;}
  stopSpeech();CUR={view:"mission",lv:id,mi:n,act:null};setNav("levels");renderMission();scrollTop();
}
function goAct(act){stopSpeech();CUR.view="act";CUR.act=act;renderAct(act);scrollTop();}

/* ---------- 1. FLASHCARDS ---------- */
let FL=null;
function actFlash(){
  const V=M().vocab,pic=picMode();FL={seen:new Set(),n:V.length,done:false};
  let h='<div class="fgrid">';
  V.forEach((v,i)=>{
    const front=pic?v.e:(v.e?'<div class="fe">'+v.e+'</div>':'')+'<div>'+esc(v.d)+'</div>';
    h+='<div class="fc" onclick="flipCard(this,'+i+')"><div class="in"><div class="f'+(pic?'':' def')+'" style="background:'+COLS[i%6]+'">'+front+'</div><div class="b" style="background:#fff;border:3px solid #efe6d8">'+esc(v.w)+(v.es?'<small>'+esc(v.es)+'</small>':'')+'</div></div></div>';
  });
  h+='</div><div class="fb" id="ffb"></div>';
  $("app").innerHTML=shell("flash",h,"0 / "+V.length);
}
function flipCard(el,i){
  el.classList.toggle("flip");
  if(!el.classList.contains("flip"))return;
  speak(M().vocab[i].w);FL.seen.add(i);$("cnt").textContent=FL.seen.size+" / "+FL.n;
  if(FL.seen.size===FL.n&&!FL.done){
    FL.done=true;setBest("flash",3);award(key("flash","all"),2);
    $("ffb").className="fb ok";$("ffb").innerHTML='🎉 You saw all the cards!<br><button class="btn sm" style="margin-top:10px" onclick="nextAct(\'flash\')">Next activity →</button>';
  }
}

let MEM=null;
function actMemory(){
  const V=M().vocab,pic=picMode(),np=Math.min(6,V.length),pairs=shuffle(V).slice(0,np);
  const cards=shuffle(pairs.flatMap((p,i)=>[{k:i,t:pic?p.e:p.d,emo:true,w:p.w},{k:i,t:p.w,emo:false,w:p.w}]));
  MEM={cards:cards,open:[],done:0,moves:0,lock:false,np:np};
  let h='<div class="mgrid">';
  cards.forEach((c,i)=>{h+='<div class="mc '+(c.emo?(pic?'emoji':'def'):'')+'" id="mc'+i+'" onclick="memClick('+i+')">'+esc(c.t)+'</div>';});
  h+='</div><div class="fb" id="mfb">Moves: 0</div>';
  $("app").innerHTML=shell("memory",h,"0 / "+np+" pairs");
}
function memClick(i){
  const G=MEM,el=$("mc"+i);
  if(G.lock||el.classList.contains("open")||el.classList.contains("done"))return;
  el.classList.add("open");G.open.push(i);
  if(!G.cards[i].emo)speak(G.cards[i].t);
  if(G.open.length===2){
    G.moves++;$("mfb").textContent="Moves: "+G.moves;
    const [a,b]=G.open;
    if(G.cards[a].k===G.cards[b].k){
      $("mc"+a).classList.add("done");$("mc"+b).classList.add("done");G.open=[];G.done++;
      $("cnt").textContent=G.done+" / "+G.np+" pairs";award(key("memory",G.cards[a].w),1);
      if(G.done===G.np){const r=G.moves<=G.np+3?3:G.moves<=G.np+7?2:1;setTimeout(()=>{$("stage").innerHTML=doneBox("memory",G.np,G.np,r,"All pairs found in "+G.moves+" moves!");},700);}

      G.lock=true;
      setTimeout(()=>{$("mc"+a).classList.remove("open");$("mc"+b).classList.remove("open");G.open=[];G.lock=false;},850);
    }

}

let SP=null;
function actSpell(){
  const P=spellPool();
  SP={rounds:shuffle(P).slice(0,Math.min(6,P.length)),i:0,score:0};
  $("app").innerHTML=shell("spell","","1 / "+SP.rounds.length);

function spellRound(){
  const S=SP;
  if(S.i>=S.rounds.length){$("stage").innerHTML=doneBox("spell",S.score,S.rounds.length,rating(S.score,S.rounds.length));return;}
  const t=S.rounds[S.i];
  S.word=t.w.toLowerCase();S.letters=shuffle(S.word.split(""));
  if(S.letters.join("")===S.word&&S.word.length>1)S.letters.reverse();
  S.slots=[];S.miss=false;
  $("cnt").textContent=(S.i+1)+" / "+S.rounds.length;
  $("stage").innerHTML='<div class="progress"><i style="width:'+(S.i/S.rounds.length*100)+'%"></i></div>'+
    clueHtml(t)+
    '<div class="slots" id="slots"></div><div class="tiles" id="tiles"></div>'+
    '<div class="row"><button class="btn sm alt" onclick="speak(SP.word)">🔊 Hear it</button><button class="btn sm alt" onclick="spellClear()">↺ Clear</button><button class="btn sm alt" onclick="spellSkip()">Skip →</button></div><div class="fb" id="sfb"></div>';
  spellDraw();
}
function spellDraw(){
  const S=SP;
  let sh="";for(let k=0;k<S.word.length;k++){const f=S.slots[k];sh+='<div class="slot '+(f!==undefined?'full':'')+'" onclick="spellBack('+k+')">'+(f!==undefined?S.letters[f]:'')+'</div>';}
  $("slots").innerHTML=sh;
  $("tiles").innerHTML=S.letters.map((l,k)=>'<button class="tile '+(S.slots.includes(k)?'used':'')+'" onclick="spellPick('+k+')">'+l+'</button>').join('');
}
function spellPick(k){
  const S=SP;if(S.slots.includes(k)||S.slots.length>=S.word.length)return;
  S.slots.push(k);spellDraw();
  if(S.slots.length===S.word.length){
    const built=S.slots.map(x=>S.letters[x]).join("");
    if(built===S.word){if(!S.miss)S.score++;award(key("spell",S.word),1);$("sfb").className="fb ok";$("sfb").textContent="✓ "+S.word.toUpperCase()+"!";speak(S.word);S.i++;setTimeout(spellRound,1200);}
    else{S.miss=true;$("sfb").className="fb no";$("sfb").textContent="✗ Try again!";setTimeout(()=>{S.slots=[];spellDraw();$("sfb").textContent="";},900);}
  }
}
function spellBack(k){const S=SP;if(k<S.slots.length){S.slots=S.slots.slice(0,k);spellDraw();}}
function spellClear(){SP.slots=[];spellDraw();$("sfb").textContent="";}
function spellSkip(){const S=SP;$("sfb").className="fb no";$("sfb").textContent="The word was: "+S.word.toUpperCase();S.i++;setTimeout(spellRound,1400);}

function balloonKey(c){
  const B=BL;if(!B||B.over||B.guess.includes(c)||!$("k_"+c))return;
  B.guess.push(c);
  const k=$("k_"+c);
  if(B.word.includes(c)){k.classList.add("ok");}else{k.classList.add("no");B.lives--;}
  const win=B.word.split("").every(ch=>!/[a-z]/.test(ch)||B.guess.includes(ch));
  if(win){B.over=true;B.won++;award(key("balloon",B.word),2);$("cnt").textContent=B.won+" won";$("bfb").className="fb ok";$("bfb").innerHTML="✓ "+B.word.toUpperCase()+'!<br><button class="btn sm mint" style="margin-top:10px" onclick="BL.i++;balloonRound()">Next word →</button>';speak(B.word);}
  else if(B.lives<=0){B.over=true;$("bfb").className="fb no";$("bfb").innerHTML="Oh no! The word was "+B.word.toUpperCase()+'<br><button class="btn sm peach" style="margin-top:10px" onclick="BL.i++;balloonRound()">Next word →</button>';}
  balloonDraw();
}

/* =========================================================
   10. SPEAK UP! · listen, record, compare, self-rate.
   Voice recognition (Whisper tiny) runs on the device; it only decides the stars,
   generously, because children's voices are hard to recognise. Recordings are never saved.
   ========================================================= */
const ASR_MODEL="Xenova/whisper-tiny.en";
const TRANSFORMERS_URL="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2";
const ASR={status:"idle",pct:0},ASR_FILES={};let asrP=null;
function loadASR(){
  if(asrP)return asrP;
  ASR.status="loading";ASR.pct=0;paintASR();
  asrP=(async()=>{
    const T=await import(TRANSFORMERS_URL);
    T.env.allowLocalModels=false;T.env.useBrowserCache=true;
    const p=await T.pipeline("automatic-speech-recognition",ASR_MODEL,{quantized:true,progress_callback:d=>{
      if(d&&d.status==="progress"&&d.file&&d.total){
        ASR_FILES[d.file]={l:d.loaded||0,t:d.total};let l=0,t=0;
        Object.values(ASR_FILES).forEach(f=>{l+=f.l;t+=f.t;});
        const pct=Math.min(99,Math.floor(l/t*100));if(pct!==ASR.pct){ASR.pct=pct;paintASR();}
      }
    }});
    ASR.status="ready";ASR.pct=100;paintASR();return p;
  })();
  asrP.catch(()=>{ASR.status="error";asrP=null;paintASR();});
  return asrP;
}
function paintASR(){
  const b=$("asrNote");if(!b)return;
  b.className="asr-note"+(ASR.status==="error"?" err":"");
  b.innerHTML=ASR.status==="loading"?'⏳ Getting ready to listen… '+ASR.pct+'% · Preparando el reconocimiento de voz (solo la primera vez).<div class="mbar"><i style="width:'+ASR.pct+'%"></i></div>'
    :ASR.status==="error"?"⚠️ No se pudo cargar el reconocimiento de voz. Igual puedes practicar: graba tu voz y compárala con el modelo."
    :"";
}

/* ---- generous matching: contractions, numbers and homophones count as the same ---- */
const CONTR={"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is","it's":"it is","that's":"that is","there's":"there is",
  "what's":"what is","where's":"where is","who's":"who is","let's":"let us","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","don't":"do not",
  "doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","couldn't":"could not","won't":"will not","wouldn't":"would not","shouldn't":"should not",
  "mustn't":"must not","haven't":"have not","hasn't":"has not","hadn't":"had not","i've":"i have","you've":"you have","we've":"we have","they've":"they have",
  "i'll":"i will","you'll":"you will","he'll":"he will","she'll":"she will","we'll":"we will","they'll":"they will","i'd":"i would","you'd":"you would",
  "he'd":"he would","she'd":"she would","we'd":"we would","they'd":"they would","gonna":"going to","wanna":"want to"};
const HOMO={two:"to",too:"to",four:"for",their:"there",hear:"here",write:"right",buy:"by",bye:"by",know:"no",won:"one",knew:"new",meat:"meet",weak:"week",hour:"our",ate:"eight",then:"than",sea:"see",wood:"would"};
const ONES=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function numWords(s){const n=parseInt(s,10);if(isNaN(n))return "";if(n<20)return ONES[n];if(n<100)return TENS[Math.floor(n/10)]+(n%10?" "+ONES[n%10]:"");
  if(n<1000)return ONES[Math.floor(n/100)]+" hundred"+(n%100?" "+numWords(n%100):"");if(n<1000000)return numWords(Math.floor(n/1000))+" thousand"+(n%1000?" "+numWords(n%1000):"");return String(s);}
function stoks(text){
  let t=" "+String(text||"").toLowerCase()+" ";
  t=t.replace(/[’‘`´]/g,"'").replace(/\[[^\]]*\]|\([^)]*\)|\*[^*]*\*/g," ");
  t=t.replace(/(\d+)\s*%/g,"$1 percent ").replace(/@/g," at ").replace(/(\d),(\d{3})/g,"$1$2").replace(/\d+/g,m=>" "+numWords(m)+" ");
  t=t.replace(/[-–—_/]/g," ").replace(/[^a-z' ]+/g," ");
  const out=[];
  t.split(/\s+/).forEach(w=>{w=w.replace(/^'+|'+$/g,"");if(!w)return;if(CONTR[w])out.push(...CONTR[w].split(" "));else out.push(w.replace(/'/g,""));});
  return out;
}
function lev(a,b){
  if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;
  let prev=[];for(let j=0;j<=b.length;j++)prev[j]=j;
  for(let i=1;i<=a.length;i++){const row=[i];for(let j=1;j<=b.length;j++)row[j]=Math.min(prev[j]+1,row[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=row;}
  return prev[b.length];
}
function wsim(a,b){if(a===b||(HOMO[a]||a)===(HOMO[b]||b))return 1;return 1-lev(a,b)/Math.max(a.length,b.length);}
/* Share of the target words that were heard (close words count fully, similar ones half) */
function speakScore(target,heard){
  const T=stoks(target),H=stoks(heard),used=new Set();if(!T.length)return 0;let c=0;
  T.forEach(t=>{let best=0,bj=-1;H.forEach((h,j)=>{if(used.has(j))return;const s=wsim(t,h);if(s>best){best=s;bj=j;}});
    if(best>=.75){c+=1;used.add(bj);}else if(best>=.5){c+=.5;used.add(bj);}});
  return c/T.length;
}
function speakStars(r){return r>=.8?3:r>=.5?2:1;}

/* ---- microphone ---- */
const NO_SPEECH="🎤 We didn't hear you. Speak a little louder, close to the microphone! · No se escuchó tu voz: habla un poco más fuerte y cerca del micrófono.";
const IN_FRAME=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
function micPrecheck(){
  if(!window.isSecureContext)return "🔒 El micrófono solo funciona si el sitio se abre con https://.";
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return "🔒 Este navegador no permite usar el micrófono aquí."+(IN_FRAME?" Abre el sitio en una pestaña nueva.":"");
  if(typeof MediaRecorder==="undefined")return "Este navegador no puede grabar audio. Usa Chrome, Edge o Safari actualizados.";
  return null;
}
function micErrorMsg(e){
  const n=e&&e.name||"";
  if(n==="NotAllowedError"||n==="SecurityError"||n==="PermissionDeniedError")
    return IN_FRAME?"🔒 El micrófono está bloqueado dentro de esta página. Abre el sitio en una pestaña nueva."
      :"🔒 No hay permiso para usar el micrófono. Pide a un adulto que haga clic en el candado 🔒 junto a la dirección web y elija <b>Permitir</b> micrófono.";
  if(n==="NotFoundError"||n==="DevicesNotFoundError")return "🎤 No encontramos un micrófono. Conecta uno (o usa audífonos con micrófono) e inténtalo de nuevo.";
  if(n==="NotReadableError"||n==="TrackStartError")return "🎤 Otra aplicación está usando el micrófono (Zoom, Teams, Meet…). Ciérrala e inténtalo de nuevo.";
  return "No se pudo usar el micrófono: "+esc(e&&e.message||n);
}
function resample(input,from,to){
  if(from===to)return input;
  const ratio=from/to,len=Math.round(input.length/ratio),out=new Float32Array(len);
  for(let i=0;i<len;i++){const x=i*ratio,lo=Math.floor(x),hi=Math.min(lo+1,input.length-1),f=x-lo;out[i]=input[lo]*(1-f)+input[hi]*f;}
  return out;
}
async function decode16k(blob){
  const buf=await blob.arrayBuffer(),AC=window.AudioContext||window.webkitAudioContext;
  let ctx;try{ctx=new AC({sampleRate:16000});}catch(e){ctx=new AC();}
  const ab=await new Promise((res,rej)=>{const p=ctx.decodeAudioData(buf,res,rej);if(p&&p.then)p.then(res,rej);});
  let d=ab.getChannelData(0);if(ab.sampleRate!==16000)d=resample(d,ab.sampleRate,16000);
  try{ctx.close();}catch(e){}
  return d;
}

function spPlay(){const it=SPK&&SPK.items[SPK.i];if(it&&it.url){if(canSpeak())try{speechSynthesis.cancel();}catch(e){}new Audio(it.url).play().catch(()=>{});}}
async function spRecord(){
  if(SREC){spStop();return;}

  const pre=micPrecheck();if(pre)return spShowErr(pre);

  catch(e){return spShowErr(micErrorMsg(e));}

  if(canSpeak())try{speechSynthesis.cancel();}catch(e){}
  const AC=window.AudioContext||window.webkitAudioContext,ctx=new AC();try{await ctx.resume();}catch(e){}
  const an=ctx.createAnalyser();an.fftSize=512;ctx.createMediaStreamSource(stream).connect(an);
  const mr=new MediaRecorder(stream);
  const r={sess:S,stream,ctx,an,mr,chunks:[],t0:Date.now(),speech:false,sp0:0,sil:null,floor:.01,raf:0,max:S.items[S.i].kind==="word"?9000:15000};

/* stops by itself after a short silence, like the adult Speaking Practice */
function spVad(r){
  const buf=new Uint8Array(r.an.fftSize);
  const loop=()=>{
    if(SREC!==r)return;
    r.an.getByteTimeDomainData(buf);
    let s=0;for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;s+=v*v;}
    const rms=Math.sqrt(s/buf.length),el=Date.now()-r.t0;
    if(el<300)r.floor=Math.max(r.floor,rms);
    if(rms>Math.max(r.floor*2.5,.015)){if(!r.speech){r.speech=true;r.sp0=Date.now();}r.sil=null;}
    else if(r.speech){if(r.sil===null)r.sil=Date.now();if(Date.now()-r.sil>1600&&Date.now()-r.sp0>400)return spStop();}
    if(el>r.max)return spStop();
    if(!r.speech&&el>7000){r.noSpeech=true;return spStop();}
    const lv=$("spMeter");if(lv)lv.style.width=Math.min(100,rms*400)+"%";
    r.raf=requestAnimationFrame(loop);
  };
  r.raf=requestAnimationFrame(loop);
}
function spStop(){
  const r=SREC;if(!r)return;SREC=null;
  cancelAnimationFrame(r.raf);
  try{if(r.mr.state!=="inactive")r.mr.stop();else spFinish(r);}catch(e){spFinish(r);}
  r.stream.getTracks().forEach(t=>t.stop());
  try{r.ctx.close();}catch(e){}
  if(!r.cancel&&SPK===r.sess){SPK.busy=true;spDraw("proc");}
}
function spCancel(){if(SREC){SREC.cancel=true;spStop();}}

/* ---- scoring for each kind of item (always generous, never a percentage) ---- */
function lcsRatio(T,H){
  const n=T.length,m=H.length;if(!n)return 0;
  let prev=new Array(m+1).fill(0);
  for(let i=1;i<=n;i++){const row=[0];for(let j=1;j<=m;j++)row[j]=wsim(T[i-1],H[j-1])>=.75?prev[j-1]+1:Math.max(prev[j],row[j-1]);prev=row;}
  return prev[m]/n;
}
function orderResult(target,heard){
  const seq=lcsRatio(stoks(target),stoks(heard)),cov=speakScore(target,heard);
  /* right words in the wrong order: one star and a hint, never a pass */
  if(seq<.85&&cov>=.75&&cov-seq>=.15)return {stars:1,msg:"↕ The words are right — check the order! · Las palabras están bien: revisa el orden."};
  return {stars:seq>=.85?3:seq>=.65?2:1,msg:null};
}
function seqCount(hay,nd){if(!nd.length)return 0;let c=0;for(let i=0;i+nd.length<=hay.length;i++)if(nd.every((w,k)=>wsim(w,hay[i+k])===1))c++;return c;}
function gapResult(it,heard){
  const H=stoks(heard),out=stoks(it.q.replace("___"," ")),right=it.o[it.a];
  const said=o=>{const t=stoks(o);return seqCount(H,t)>seqCount(out,t);};
  if(said(right))return {chosen:"ok",stars:Math.max(2,speakStars(speakScore(it.text,heard))),msg:null};
  const wrong=it.o.find((o,i)=>i!==it.a&&said(o));
  if(wrong)return {chosen:wrong,stars:1,msg:"✗ You said “"+esc(wrong)+"”. Try another word! · Prueba otra palabra."};
  if(speakScore(it.text,heard)>=.85)return {chosen:"ok",stars:3,msg:null};
  return {chosen:null,stars:1,msg:"We couldn't hear the missing word. Say the whole sentence! · No escuchamos la palabra que falta: di la frase completa."};
}
async function spFinish(r){
  if(r.done)return;r.done=true;
  const S=r.sess;if(r.cancel||!S||S!==SPK){if(S)S.busy=false;return;}
  const it=S.items[S.i];
  try{
    const blob=new Blob(r.chunks,{type:r.mr.mimeType||"audio/webm"});
    if(it.url)URL.revokeObjectURL(it.url);
    it.url=URL.createObjectURL(blob);
    if(r.noSpeech)throw {user:NO_SPEECH};
    const audio=await decode16k(blob);
    let peak=0;for(let i=0;i<audio.length;i++){const v=Math.abs(audio[i]);if(v>peak)peak=v;}
    if(audio.length<16000*.3||peak<.02)throw {user:NO_SPEECH};
    let heard=null;
    try{
      if(ASR.status!=="ready")spDraw("wait");
      const asr=await loadASR();
      spDraw("proc");await new Promise(res=>setTimeout(res,40));
      const out=await asr(audio);
      heard=String(out&&out.text||"").replace(/\[[^\]]*\]|\([^)]*\)/g," ").replace(/\s+/g," ").trim();
    }catch(e){heard=null;}  /* no voice recognition: the child still compares by ear */
    if(S!==SPK)return;
    if(heard!==null){
      const low=heard.toLowerCase().replace(/[.!?,]/g,"").trim();
      if(!stoks(heard).length||(["you","thank you","thanks for watching","bye"].includes(low)&&!stoks(it.text).join(" ").includes(low)))throw {user:NO_SPEECH};
    }
    let stars=0,msg=null,chosen=null;
    if(heard!==null){
      if(it.kind==="order"){const o=orderResult(it.text,heard);stars=o.stars;msg=o.msg;}
      else if(it.kind==="gap"){const g=gapResult(it,heard);stars=g.stars;msg=g.msg;chosen=g.chosen;}
      else stars=speakStars(speakScore(it.text,heard));
    }
    it.att=(it.att||0)+1;it.heard=heard;it.last=stars;it.msg=msg;it.chosen=chosen;it.stars=Math.max(it.stars||0,stars);
    if(stars>=2){it.done=true;award(S.station?CUR.lv+"|station|"+S.mode+"|"+it.text:key("speak",it.text),1);}
    S.err=null;S.busy=false;spDraw("result");
  }catch(e){
    if(S!==SPK)return;
    S.busy=false;S.err=e&&e.user?e.user:"⚠️ No se pudo procesar el audio. Inténtalo otra vez.";spDraw("idle");
  }
}
function spNext(self){
  const S=SPK;if(!S)return;spCancel();
  if(self)S.self.push(self);

function spDone(){

function startTest(){

  TS={b:0,q:0,scores:TEST.map(()=>0),played:TEST.map(()=>false)};

}
function testQuestion(){
  const T=TS,Q=TEST[T.b][T.q],Lv=LEVELS[T.b];
  T.played[T.b]=true;T.cur=mixOpts(Q.o,Q.a);
  let body="";
  if(Q.type==="pic")body='<div class="tshow">'+Q.show+'</div><p class="tq">'+esc(Q.prompt)+'</p>';
  else if(Q.type==="listen")body='<p class="tq">'+esc(Q.prompt)+'</p><div class="center"><button class="speaker" onclick="speak(TEST[TS.b][TS.q].say)" aria-label="Listen">🔊</button>'+(canSpeak()?'':'<div class="fallback">'+esc(Q.say)+'</div>')+'</div>';
  else if(Q.type==="read")body='<div class="reading">📖 '+esc(Q.text)+'</div><p class="tq" style="font-size:24px;margin-top:14px">'+gapHtml(Q.prompt)+'</p>';
  else body='<p class="tq">'+gapHtml(Q.prompt)+'</p>';
  const n=TEST[T.b].length;
  $("app").innerHTML='<div class="stage">'+
    '<span class="blocktag" style="background:'+Lv.bg+';color:'+Lv.deep+'">Part '+(T.b+1)+' of '+TEST.length+' · '+Lv.emoji+' '+Lv.name+'</span>'+

  if(Q.type==="listen")setTimeout(()=>speak(Q.say),400);
}
function testAns(btn,j){
  const T=TS;
  document.querySelectorAll(".stage .op").forEach(b=>b.classList.add("dis"));
  btn.style.borderColor="var(--lav-d)";btn.style.background="var(--lav)";
  if(j===T.cur.a)T.scores[T.b]++;
  setTimeout(()=>{
    T.q++;
    if(T.q<TEST[T.b].length)return testQuestion();
    const pass=T.scores[T.b]>=3;
    if(!pass||T.b===TEST.length-1)return testResult(T.b);
    T.b++;T.q=0;testBreak();
  },450);
}
function testBreak(){
  const Lv=LEVELS[TS.b],prev=LEVELS[TS.b-1];

    '<p style="margin:10px 0 18px"><span class="blocktag" style="background:'+Lv.bg+';color:'+Lv.deep+';font-size:15px">Next: Part '+(TS.b+1)+' · '+Lv.emoji+' '+Lv.name+'</span></p>'+
    '<div class="row"><button class="btn" onclick="testQuestion()">Continue →</button><button class="btn alt" onclick="testResult(TS.b)">Finish here</button></div></div>';
}
function testResult(idx){
  const T=TS,Lv=LEVELS[idx];
  MYLEVEL=Lv.id;save("twk2_level",Lv.id);
  const bars=TEST.map((_,k)=>{const P=LEVELS[k];return '<div><span>'+P.emoji+' '+P.name+'</span><b>'+(T.played[k]?T.scores[k]+' / '+TEST[k].length:'—')+'</b><small class="hint">'+(T.played[k]?("⭐".repeat(T.scores[k])||"·"):"not needed")+'</small></div>';}).join("");

  $("app").innerHTML='<div class="result" style="background:'+Lv.bg+'"><div class="rscene" style="background:'+Lv.sky+'">'+scene(Lv.id)+'</div>'+
    '<p style="font-weight:800;color:'+Lv.deep+'">'+(KIDNAME?esc(KIDNAME)+', your':'Your')+' level is</p><h1>'+Lv.name+'</h1>'+
    '<p style="font-weight:800">'+Lv.cefr+'</p><p style="max-width:520px;margin:10px auto 0">'+RESULT_MSG[Lv.id]+'</p>'+soon+
    '<div class="bars">'+bars+'</div>'+
    '<div class="row"><button class="btn" onclick="goLevel(\''+Lv.id+'\')">Go to '+Lv.name+' →</button>'+(Lv.ready?'':'<button class="btn mint" onclick="goLevel(\'moon\')">🌙 Moon Walkers</button>')+'<button class="btn alt" onclick="go(\'test\')">🔄 Take it again</button></div>'+
    '<p class="hint" style="margin-top:14px">This is a practice result. Your teacher will confirm your level in class.</p></div>';
  award("test|done",3);
}

at to catch up with my classmates, and there's good news: now we have science on Tuesdays and Thursdays! There's also a new boy in our class. His name is Nico, and he comes from Antofagasta. He didn't know anyone, so I introduced him to Benja and Martina at break time. He's making friends fast, and now the four of us play football together every day.","Right now I'm sitting in the school library, and Benja is reading a comic next to me. My goals for this term? First, I'm going to join the science club. Second, I want to improve my English, so I'm going to read a short book every week. I think it will be difficult, but I'm sure it will be fun too.","What are your goals for this year? Write them in the comments!"],"qs":[{"q":"Why was Leo a bit nervous on Monday?","o":["He had a new classroom and a new timetable","He didn't want to see his friends","He lost his school bag"],"a":0},{"q":"What did Leo do for Nico at break time?","o":["He lent him a comic","He introduced him to Benja and Martina","He showed him the library"],"a":1},{"q":"How is Leo going to improve his English?","o":["By watching cartoons","By joining the science club","By reading a short book every week"],"a":2},{"q":"What does Leo think about his goals?","o":["They will be difficult but fun","They will be very easy","They will be boring"],"a":0}]},"sentences":["Where did you go during the summer holidays?","I spent two weeks with my grandma by the sea.","Our new classmate is sitting next to Benja today.","Are you going to join the science club this term?","My main goal is to improve my reading.","I think this year will be really exciting."],"grammar":[{"q":"Leo usually ___ football after school.","o":["is playing","plays","play"],"a":1},{"q":"Look! Our new teacher ___ into the classroom now.","o":["is coming","comes","came"],"a":0},{"q":"We ___ to the beach last February.","o":["go","went","are going"],"a":1},{"q":"What ___ you do at the weekend? — I visited my aunt.","o":["do","did","were"],"a":1},{"q" omework. Ms Rojas was not happy!","Then Mum looked at my screen time: three hours a day! She said I was becoming a bit addicted to the game. I didn't like hearing that, but she was right.","So we decided to try something new. Now I keep the charger in the kitchen, and I always log off at seven o'clock. After that, I play with Pipo in the garden or read a comic with Sofi.","Right now I'm not using my tablet at all — I'm writing this story with a pencil! I still enjoy playing games, but I've learnt to stop when it's time. I hope to beat Kai at our football game this weekend, though!"],"qs":[{"q":"What did Leo have to do before downloading new apps?","o":["Charge the tablet","Ask Mum and Dad","Call Kai"],"a":1},{"q":"Why was Ms Rojas not happy?","o":["Leo forgot to do his homework","Leo was playing games in class","Leo lost his tablet"],"a":0},{"q":"Where does Leo keep the charger now?","o":["In his bedroom","In his school bag","In the kitchen"],"a":2},{"q":"What is Leo doing right now?","o":["Playing a football game","Writing a story with a pencil","Chatting online with Kai"],"a":1}]},"sentences":["I'm trying to spend less time on my tablet.","Benja can't stand waiting for his game to download.","Why are you playing games during dinner?","Leo has decided to keep his charger in the kitchen.","Never share your password with people you don't know.","Grandma is chatting online with Kai right now."],"grammar":[{"q":"I really enjoy ___ music while I study.","o":["to listen to","listening to","listen to"],"a":1},{"q":"We've decided ___ a no-phone day every Sunday.","o":["to have","having","have"],"a":0},{"q":"Try to avoid ___ your phone just before bed.","o":["use","to use","using"],"a":2},{"q":"Kai wants ___ how to build a website.","o":["learning","to learn","learn"],"a":1},{"q":"Shh! Leo ___ an online test right now.","o":["is doing","does","do"],"a":0},{"q":"Mum ___ her messages every morning before work.","o":["is checking","check","checks"],"a":2},{"q":"Don't forget to ,"fog"],"a":1}]},"teen":{"story":{"title":"Lost in the Fog","pic":"🌫️🥾📸☀️","text":["Last summer, my friend Sam and I went hiking in the hills near Valparaíso. It was the middle of a heatwave, so we left really early. The forecast said it was going to be hot and sunny all day.","For the first two hours, everything was perfect. Sam was taking photos of the sea while I was checking the map on my phone. Then, at about ten o'clock, a thick fog came in from the Pacific. Ten minutes later, we couldn't see the path, and my phone had no signal.","Sam wanted to keep walking, but I said, 'Why don't we wait here until the fog clears?' So we sat on a rock and shared our sandwiches. Suddenly it was freezing, and the air was so wet that our T-shirts were soaked.","After an hour, the sun came out again and we found the path easily. When we were walking back down, we met a park ranger. He looked at our T-shirts and asked, 'Why didn't you bring jackets? The fog comes in very fast here.' We felt a bit silly.","Now I always pack a jacket, even in a heatwave — and Sam has the best fog photos in our whole school."],"qs":[{"q":"Why did they leave really early?","o":["Because there was a heatwave","Because the fog was coming","Because Sam wanted photos of the sunrise"],"a":0},{"q":"What was the writer doing while Sam was taking photos?","o":["Eating a sandwich","Checking the map","Talking to a park ranger"],"a":1},{"q":"What did they do while they were waiting for the fog to clear?","o":["They kept walking","They phoned the park ranger","They sat on a rock and shared their sandwiches"],"a":2},{"q":"What did the park ranger criticise?","o":["They didn't bring jackets","They walked too slowly","They took too many photos"],"a":0}]},"sentences":["We were hiking in the hills when the fog came in.","The forecast said it was going to be hot and sunny.","Our T-shirts were soaked because we didn't bring jackets.","What were you doing when the thunderstorm started?","Why didn't you check the weather one o'clock, and forty teachers and parents have already booked a table.","Jose is our head chef. She has loved cooking since she was ten, and she has tested every recipe at least twice. The menu is short: a fresh salad as a starter, vegetarian empanadas or fried fish with rice, and lemon cake for dessert. I designed the menu, and Sam has just taken some amazing photos of the food for our class social media page.","Tomás and I are the waiters. We've practised carrying three plates at once, and we haven't broken anything yet! We've also printed the bills. Lunch costs 3,000 pesos, and all the money is for new library books.","Not everything is ready, though. We haven't bought the fish yet, and Jose is still worried about the cake. 'It isn't sweet enough,' she said this morning. And Sam keeps adding chilli to the sauce. We'll see what the customers think!","Wish us luck. I'll post the photos tomorrow night."],"qs":[{"q":"How long has the class worked on the project?","o":["Since this morning","For one day","Since March"],"a":2},{"q":"Who has just taken photos of the food?","o":["Sam","Vale","Jose"],"a":0},{"q":"What will the money from the lunch pay for?","o":["A class trip","New library books","A new school kitchen"],"a":1},{"q":"What is one thing the class hasn't done yet?","o":["Printed the bills","Bought the fish","Designed the menu"],"a":1}]},"sentences":["Sam has just posted a photo of our lunch.","Have you booked a table for tomorrow yet?","Jose has already tested every recipe twice.","We've worked on this project since March.","Could I have the vegetarian empanadas, please?","Excuse me, is the sauce very spicy?"],"grammar":[{"q":"Hurry up! The pizza has ___ come out of the oven. It's still hot!","o":["yet","just","since"],"a":1},{"q":"I haven't tried the lemon pie ___.","o":["already","just","yet"],"a":2},{"q":"No, thanks. I've ___ eaten three sandwiches!","o":["already","yet","since"],"a":0},{"q":"Have you ordered ___? — No, we're still looking at the menu."," ter. 'If we had more money, we would buy some.'","On Monday, Sofi told Ms Rojas about the problem. 'If every family donated one old blanket, the dogs would be warm all winter!' Ms Rojas loved the idea, and soon the whole school was helping. Leo and his best friend Benja made posters, and Martina, who is very generous, brought five blankets and a big bag of dog food.","But there was a problem. Leo and Benja argued about the colours of the posters and fell out for a whole day. 'If I were you, I'd say sorry,' Sofi told her brother. He did, and soon the two boys were laughing again.","Two weeks later, the children took more than a hundred blankets to the shelter. 'The best part wasn't the blankets,' said Sofi. 'It was working together.'"],"qs":[{"q":"Why did Sofi start the blanket collection?","o":["The dogs at the shelter were cold","Ms Rojas asked her to","Her school needed new blankets"],"a":0},{"q":"Who made the posters?","o":["Martina and Grandma Ana","Leo and Benja","Sofi and Mrs Vera"],"a":1},{"q":"According to Sofi, what was the best part?","o":["The blankets","The posters","Working together"],"a":2},{"q":"What is the main message of the story?","o":["Friends should never argue","When people work together, they can help a lot","Dogs don't like cold weather"],"a":1}]},"sentences":["If I had more free time, I would help at the animal shelter.","What would you do if you found a lost puppy?","A volunteer is someone who helps others without getting paid.","I would lend him my coloured pencils if he asked me.","Martina is the girl who brought five blankets to school.","Grandma Ana is the kind of person you can always trust."],"grammar":[{"q":"If I ___ a million pesos, I would give some to charity.","o":["have","had","would have"],"a":1},{"q":"My grandmother is very ___ — she never gets angry when I make mistakes.","o":["patient","generous","strict"],"a":0},{"q":"If I ___ you, I'd say sorry to her.","o":["am","will be","were"],"a":2},{"q":"What ___ you do if you saw so outh of Chile. They slept in a tent next to a lake, and every morning Leo went fishing with Dad. One evening, while they were cooking dinner, Pipo ran into the forest. Everyone looked for him for an hour, and in the end Sofi found him asleep under a tree!","At school, Leo meets his classmates again. He hasn't seen Benja since December, so they have lots of news to catch up on. Leo gives Benja a souvenir from the trip: a little wooden fish. Then Ms Rojas shows the class the new timetable. 'This term we're having swimming lessons on Fridays,' she says. 'And we're going to plant a school garden!'","Leo has already got a goal for this year: he's going to join the school football team. 'I think it will be the best year ever,' he tells Benja. After school, Sofi runs out to meet him with a big smile. 'I love my new teacher!' she shouts. 'Told you!' laughs Leo."],"qs":[{"q":"Why is Sofi nervous?","o":["She has a new teacher this year","She has lost her school bag","She doesn't like swimming"],"a":0},{"q":"What happened while the family was cooking dinner?","o":["Leo caught a big fish","Pipo ran into the forest","It started to rain"],"a":1},{"q":"What does Leo give Benja?","o":["A photo of the lake","A new football","A little wooden fish"],"a":2},{"q":"What is Leo's goal for this year?","o":["To plant a school garden","To join the school football team","To learn to fish"],"a":1}]},"sentences":["What did you do during the summer holidays?","My cousin and I learnt to swim last summer.","While we were camping by the lake, our dog ran into the forest.","I haven't seen my best friend since last December.","Have you heard that we're having swimming lessons this term?","My biggest goal is to join the school football team."],"grammar":[{"q":"Last summer we ___ camping by a lake in the south.","o":["have gone","went","go"],"a":1},{"q":"Look! Our teacher ___ the new timetable on the wall right now.","o":["is putting","puts","has put"],"a":0},{"q":"While we ___ dinner, Pipo ran into the forest.","o":["are cooking","have cooked","were cooking"],"a":2},{"q":"___ you ever been to Easter Island?","o":["Have","Did","Were"],"a":0},{"q":"I think this year ___ the best year ever!","o":["is being","will be","be"],"a":1},{"q":"My sister usually ___ to school with Mum.","o":["walks","is walking","walk"],"a":0},{"q":"Let's meet at break and ___ on all our news!","o":["get used","look forward","catch up"],"a":2},{"q":"I'm really looking forward ___ my friends again.","o":["to see","to seeing","for seeing"],"a":1}]},"teen":{"story":{"title":"Café Summer, Camera Goals","pic":"☕🛹🎥🏫","text":["Hey, it's Tomás! The new term started on Monday, so it's time to catch up. I didn't go on holiday this summer. Instead, I worked at my aunt's café by the sea, half an hour from Concepción, three mornings a week.","The job wasn't easy at first. On my second day, while I was carrying a tray of juices, I tripped over a customer's dog and dropped everything! Luckily, my aunt just laughed. By February I was making the best sandwiches on the coast, and I saved enough money for a new camera. In the afternoons I hung out at the skate park with my friends and filmed our tricks.","Now I'm back at school, and I'm still getting used to the new timetable. We have maths first thing on Monday mornings — not my favourite way to start the week! We've also got a new classmate, Sam, who has just arrived from Sydney. He's really into photography, so we're already planning a project together.","My goal for this term is to make a five-minute film for the school film festival in June. I've never made a real film before, so I'm a bit nervous, but I think it will be a great experience. I'm really looking forward to showing it to everyone. What are you looking forward to this term? Tell me in the comments!"],"qs":[{"q":"What is the blog post mainly about?","o":["Tomás's holiday in the south","Tomás's summer job and the start of the new term","A film festival in Concepción"],"a":1},{"q":"What happened ball after school.","o":["is playing","plays","play"],"a":1},{"q":"Please be quiet — Leo ___ for his spelling test right now.","o":["studies","studied","is studying"],"a":2},{"q":"What ___ you doing when the lights went out?","o":["were","did","are"],"a":0},{"q":"Benja ___ his glasses while he was playing football yesterday.","o":["was breaking","broke","breaks"],"a":1},{"q":"If I ___ you, I'd write down what went wrong.","o":["am","would be","were"],"a":2},{"q":"You ___ give up now — you're so close to the finish!","o":["shouldn't","should","don't should"],"a":0},{"q":"After a bad start, the team ___ and won the next three matches.","o":["gave up","bounced back","set back"],"a":1},{"q":"Sofi put a lot of ___ into her painting, and it won first prize.","o":["effort","pressure","setback"],"a":0}]},"teen":{"story":{"title":"The Night I Forgot the Words","pic":"🎤😰🎶👏","text":["My name is Vale, and this post is about the worst — and best — moment of my year. Last term I signed up for the school talent show. I've been singing in my bedroom since I was six, and my friends kept telling me I would win. I was so confident that I only practised my song twice.","On the night, the hall was packed. While I was waiting behind the curtain, my hands started shaking. I walked on stage, the music began… and my mind went completely blank. I forgot the words of the second verse and just stood there in silence. A few people laughed, and I ran off stage before the song ended.","The next day I told Mr Díaz I was going to give up singing for good. He didn't argue. He just asked, 'What would you say to a friend in your situation?' I thought about it, and I realised I'd tell them not to let one setback stop them.","So these days I'm practising differently. I rehearse every song until I know it perfectly, and every Sunday I perform for my family in the living room, even when my little cousins are making noise. Before I start, I breathe slowly and focus on the first line. It really helps me deal with the pressure.","Last week I sang at the end-of-term concert. I was still nervous, but I remembered every word, and the applause felt like the best reward in the world. My advice? If you fail, don't hide. Mistakes are part of the process — what matters is how you bounce back."],"qs":[{"q":"What is the main message of the blog post?","o":["Talent is more important than practice","You can bounce back from failure if you learn from it","It's better not to perform in public"],"a":1},{"q":"Why did Vale forget the words at the talent show?","o":["She was too confident and hadn't practised enough","The music was too loud","Someone laughed at her before she started"],"a":0},{"q":"What does Vale do now to deal with the pressure?","o":["She sings with her cousins","She only sings in her bedroom","She breathes slowly and focuses on the first line"],"a":2},{"q":"How did Vale probably feel after the end-of-term concert?","o":["Embarrassed","Proud","Angry"],"a":1}]},"sentences":["Vale is practising hard because the talent show is next week.","While I was waiting behind the curtain, my hands started shaking.","You should talk to your music teacher before the next concert.","Why don't you perform for your family first?","We lost the volleyball final, but we didn't give up.","Making mistakes is an important part of learning anything new."],"grammar":[{"q":"Jose usually ___ volleyball after school.","o":["is playing","plays","play"],"a":1},{"q":"Please be quiet — Tomás ___ for his history test right now.","o":["studies","studied","is studying"],"a":2},{"q":"What ___ you doing when the lights went out?","o":["were","did","are"],"a":0},{"q":"She ___ her arm while she was skiing last winter.","o":["was breaking","broke","breaks"],"a":1},{"q":"If I ___ you, I'd ask the coach for help.","o":["am","would be","were"],"a":2},{"q":"You ___ give up now — you're so close to the finish!","o":["shouldn't","should","don't should"],"a":0},{"q":"After a bad start, the team ___ and won the next
